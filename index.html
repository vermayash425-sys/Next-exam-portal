async function renderExamEngine(app){
  const sec = S.activeSection;
  if(!sec){ S.studentPage='dashboard'; return renderStudentShell(app); }
  const remaining = Math.max(0,(new Date(sec.serverEndAt).getTime()-Date.now())/1000);
  if(remaining<=0){ await handleSectionSubmit(true, 'auto_timeout'); return; }

  const q = sec.questions[sec.currentIndex];
  const resp = sec.responses[q.question_id];
  resp.visited = true;
  const timerClass = remaining<120? 'crit' : remaining<300? 'warn' : '';

  const opts = ['a','b','c','d'].filter(k=>q['option_'+k]);

  app.innerHTML = `
  <div class="exam-shell">
    <div class="exam-header">
      <div class="exam-title">${esc(sec.sectionName)}<small>Question ${sec.currentIndex+1} of ${sec.questions.length}</small></div>
      <div class="timer-box ${timerClass}" id="timerBox"><div class="tval" id="timerVal">${fmtClock(remaining)}</div><div class="tlbl">Time Left</div></div>
      <div class="save-status" id="saveStatus" style="font-size:12px;padding:4px 10px;border-radius:6px;"></div>
      <div class="net-status" id="netStatus" style="font-size:12px;padding:4px 10px;border-radius:6px;"></div>
      <div class="stu-chip"><b>${esc(S.currentUser.name)}</b>${S.currentUser.studentId}</div>
    </div>
    ${(S.pendingSaves && S.pendingSaves.size>0)? `<div id="pendingSaveBanner" style="background:#FEF3C7;color:#92400E;padding:8px 16px;font-size:13px;text-align:center;">⚠ ${S.pendingSaves.size} answer(s) not yet saved to server — retrying automatically in the background. Please don't close this tab.</div>` : ''}
    <div class="exam-body">
      <div class="exam-main">
        <div class="qbox">
          <div class="qnum">Question ${sec.currentIndex+1}</div>
          <div class="qtext">${esc(q.text)}</div>
          ${q.image_url? `<img class="qimg" src="${esc(q.image_url)}" onclick="openImageZoom('${esc(q.image_url)}')" loading="eager">`:''}
          <div id="optionsWrap">
            ${opts.map(k=>`
              <div class="option-btn ${resp.selected===k.toUpperCase()?'selected':''}" data-k="${k.toUpperCase()}">
                <div class="option-letter">${k.toUpperCase()}</div><div class="option-text">${esc(q['option_'+k])}</div>
              </div>`).join('')}
          </div>
        </div>
      </div>
      <div class="palette-panel scrollbar-thin" id="palettePanel">
        ${renderExamPaletteHTML(sec)}
      </div>
    </div>
    <div class="exam-toolbar">
      <div style="display:flex;gap:8px;">
        <button class="btn btn-outline btn-sm" id="prevBtn" ${sec.currentIndex===0?'disabled':''}>Previous</button>
        <button class="btn btn-ghost btn-sm" id="clearBtn">Clear Response</button>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-accent btn-sm" id="markBtn">${resp.marked?'Unmark':'Mark for Review'}</button>
        ${sec.currentIndex<sec.questions.length-1? `<button class="btn btn-primary" id="saveNextBtn">Save & Next</button>` : `<button class="btn btn-primary" id="saveNextBtn">Save</button>`}
        <button class="btn btn-navy" id="submitSectionBtn">Submit Section</button>
      </div>
    </div>
    <button class="fab-palette-btn" id="fabPalette">🗂 Palette</button>
  </div>`;

  $$('.option-btn').forEach(b=>b.onclick=async()=>{
    const k = b.dataset.k;
    resp.selected = resp.selected===k? null : k;
    // Lightweight update only — no full re-render, so the page doesn't
    // jump back to the top / the question image on every click.
    $$('.option-btn').forEach(el=>el.classList.toggle('selected', el.dataset.k===resp.selected));
    const legendPanel = $('#palettePanel');
    if(legendPanel){
      legendPanel.innerHTML = renderExamPaletteHTML(sec);
      $$('.pnode').forEach(n=>n.onclick=async()=>{
        if(S.navBusy) return; S.navBusy=true;
        await saveCurrentResponse(false);
        sec.currentIndex=parseInt(n.dataset.idx); sec.questionShownAt=Date.now();
        S.navBusy=false;
        renderExamEngine(app);
      });
    }
    await saveCurrentResponse(resp.selected===null);
  });
  $('#clearBtn').onclick=async()=>{
    if(S.navBusy) return; S.navBusy=true;
    resp.selected=null; await saveCurrentResponse(true); S.navBusy=false; renderExamEngine(app);
  };
  $('#markBtn').onclick=async()=>{
    if(S.navBusy) return; S.navBusy=true;
    resp.marked=!resp.marked; await saveCurrentResponse(false); S.navBusy=false; renderExamEngine(app);
  };
  $('#saveNextBtn').onclick=async()=>{
    if(S.navBusy) return; S.navBusy=true;
    await saveCurrentResponse(false);
    sec.currentIndex = Math.min(sec.questions.length-1, sec.currentIndex+1);
    sec.questionShownAt = Date.now();
    S.navBusy=false;
    renderExamEngine(app);
  };
  $('#prevBtn').onclick=async()=>{
    if(S.navBusy) return;
    if(sec.currentIndex>0){ S.navBusy=true; await saveCurrentResponse(false); sec.currentIndex--; sec.questionShownAt=Date.now(); S.navBusy=false; renderExamEngine(app); }
  };
  $('#submitSectionBtn').onclick=async()=>{
    const unanswered = sec.questions.filter(q=>!sec.responses[q.question_id].selected).length;
    confirmModal(
      unanswered? `You still have ${unanswered} unanswered question(s) in this section. Submit anyway? You will not be able to change answers in it afterwards.`
                 : 'Submit this section now? You will not be able to change answers in it afterwards.',
      ()=>handleSectionSubmit(false),
      {title:'Submit Section?', okLabel:'Yes, Submit'}
    );
  };
  $$('.pnode').forEach(n=>n.onclick=async()=>{
    if(S.navBusy) return; S.navBusy=true;
    await saveCurrentResponse(false);
    sec.currentIndex=parseInt(n.dataset.idx); sec.questionShownAt=Date.now();
    S.navBusy=false;
    renderExamEngine(app);
  });
  const fab = $('#fabPalette');
  if(fab) fab.onclick=()=>{ S.paletteOpen=!S.paletteOpen; $('#palettePanel').classList.toggle('open', S.paletteOpen); };

  startExamTicker(app);
  attachExamSecurity();
  requestFullscreenIfNeeded();
}
function setSaveStatus(mode, extra=''){
  const el = document.getElementById('saveStatus');
  if(!el) return;
  const map = {
    saving: ['#EFF6FF','#1D4ED8','● Saving…'],
    saved: ['#ECFDF5','#047857','✓ Saved'],
    retrying: ['#FEF3C7','#92400E','⚠ Retrying to save…'],
    failed: ['#FEF2F2','#B91C1C','⚠ Save failed — will retry'],
  };
  const [bg,color,label] = map[mode]||['','',''];
  el.style.background = bg; el.style.color = color;
  el.textContent = label + (extra? ' '+extra : '');
}
async function attemptSaveOnce(payload){
  try{
    const { error } = await sb.rpc('student_save_response', payload);
    return !error;
  }catch(e){
    return false;
  }
}
async function saveCurrentResponse(clear){
  const sec = S.activeSection;
  const q = sec.questions[sec.currentIndex];
  const resp = sec.responses[q.question_id];
  const timeSpent = (Date.now()-sec.questionShownAt)/1000;
  sec.questionShownAt = Date.now();

  // Sequence guard: if the student changes this same question again before
  // this save finishes (e.g. taps a different option quickly), this older
  // call must NEVER be allowed to write its now-stale answer over the
  // newer one. We always re-read the LIVE response state right before
  // actually sending, and only the most-recent call is allowed to proceed
  // past each checkpoint. This client-side guard avoids wasted requests /
  // confusing status flicker, but the REAL protection against network
  // reordering is the client_seq timestamp sent to the server below —
  // captured ONCE, right now, synchronously (not re-captured on retries),
  // so it always reflects exactly when this click happened, in order.
  resp.saveSeq = (resp.saveSeq || 0) + 1;
  const mySeq = resp.saveSeq;
  const myClientSeq = Date.now();
  const buildPayload = ()=>({
    p_token: S.studentToken, p_attempt_id: sec.attemptId, p_question_id: q.question_id,
    p_selected_option: clear? null : resp.selected, p_clear: !!clear,
    p_is_marked: resp.marked, p_time_spent_sec: timeSpent, p_client_seq: myClientSeq,
  });

  setSaveStatus('saving');
  const delays = [0, 1000, 3000];
  for(let i=0;i<delays.length;i++){
    if(resp.saveSeq !== mySeq) return; // superseded — the newer call owns this save now
    if(delays[i]) await new Promise(r=>setTimeout(r, delays[i]));
    if(resp.saveSeq !== mySeq) return;
    if(i>0) setSaveStatus('retrying', `(${i}/${delays.length-1})`);
    const ok = await attemptSaveOnce(buildPayload());
    if(resp.saveSeq !== mySeq) return; // a newer change arrived while this was in flight
    if(ok){
      setSaveStatus('saved');
      if(S.pendingSaves) S.pendingSaves.delete(q.question_id);
      return;
    }
  }
  if(resp.saveSeq !== mySeq) return;
  // All quick retries failed — hand off to a background queue that keeps
  // trying every few seconds so the student's answer is never silently lost.
  setSaveStatus('failed');
  if(!S.pendingSaves) S.pendingSaves = new Map();
  S.pendingSaves.set(q.question_id, buildPayload());
  startPendingSaveLoop();
}
function startPendingSaveLoop(){
  if(S.pendingSaveTimer) return;
  S.pendingSaveTimer = setInterval(async()=>{
    if(!S.pendingSaves || S.pendingSaves.size===0 || S.studentPage!=='exam'){
      clearInterval(S.pendingSaveTimer); S.pendingSaveTimer=null; return;
    }
    for(const [qid, payload] of Array.from(S.pendingSaves.entries())){
      const ok = await attemptSaveOnce(payload);
      if(ok) S.pendingSaves.delete(qid);
    }
    const banner = document.getElementById('pendingSaveBanner');
    if(banner){
      if(S.pendingSaves.size===0) banner.remove();
      else banner.textContent = `⚠ ${S.pendingSaves.size} answer(s) not yet saved to server — retrying automatically in the background. Please don't close this tab.`;
    }
    if(S.pendingSaves.size===0){ clearInterval(S.pendingSaveTimer); S.pendingSaveTimer=null; setSaveStatus('saved'); }
  }, 6000);
}
async function flushPendingSaves(){
  if(!S.pendingSaves || S.pendingSaves.size===0) return true;
  for(const [qid, payload] of Array.from(S.pendingSaves.entries())){
    const ok = await attemptSaveOnce(payload);
    if(ok) S.pendingSaves.delete(qid);
  }
  return S.pendingSaves.size===0;
}
function renderExamPaletteHTML(sec){
  const counts = {answered:0,notanswered:0,marked:0,notvisited:0};
  const nodes = sec.questions.map((q,i)=>{
    const r = sec.responses[q.question_id];
    let cls='notvisited';
    if(r.marked) cls='marked';
    else if(r.selected) cls='answered';
    else if(r.visited) cls='notanswered';
    counts[cls]++;
    return `<div class="pnode ${cls} ${i===sec.currentIndex?'current':''}" data-idx="${i}">${i+1}</div>`;
  }).join('');
  return `
    <h4>Question Palette</h4>
    <div class="palette-grid">${nodes}</div>
    <div class="legend-row"><div class="legend-dot" style="background:var(--success)"></div> Answered (${counts.answered})</div>
    <div class="legend-row"><div class="legend-dot" style="background:var(--error-bg);border:1px solid #F9CAC4"></div> Not answered (${counts.notanswered})</div>
    <div class="legend-row"><div class="legend-dot" style="background:var(--accent)"></div> Marked for review (${counts.marked})</div>
    <div class="legend-row"><div class="legend-dot" style="background:#fff;border:1px solid var(--border)"></div> Not visited (${counts.notvisited})</div>
  `;
}
function startExamTicker(app){
  if(S.examTimerHandle) clearInterval(S.examTimerHandle);
  S.examTimerHandle = setInterval(()=>{
    const sec = S.activeSection;
    if(!sec || S.studentPage!=='exam'){ clearInterval(S.examTimerHandle); return; }
    const remaining = Math.max(0,(new Date(sec.serverEndAt).getTime()-Date.now())/1000);
    const tv = $('#timerVal'), tb=$('#timerBox');
    if(tv){
      tv.textContent = fmtClock(remaining);
      tb.classList.toggle('warn', remaining<300 && remaining>=120);
      tb.classList.toggle('crit', remaining<120);
      if(Math.floor(remaining)===300) toast('5 minutes remaining in this section','');
      if(Math.floor(remaining)===60) toast('1 minute remaining!','err');
    }
    if(remaining<=0){
      clearInterval(S.examTimerHandle);
      toast('Time up — submitting this section','err');
      handleSectionSubmit(true, 'auto_timeout');
    }
  },1000);
}
async function handleSectionSubmit(auto, reason='manual'){
  if(S.submittingSection) return; // guard: timer-timeout and a manual click can otherwise both fire this within the same instant
  S.submittingSection = true;
  try{
    const sec = S.activeSection;
    if(!auto) await saveCurrentResponse(false);
    if(S.pendingSaves && S.pendingSaves.size>0){
      toast('Finishing saving your last few answers before submitting…','ok');
      for(let i=0;i<3 && S.pendingSaves.size>0;i++) await flushPendingSaves();
    }
    if(S.examTimerHandle) clearInterval(S.examTimerHandle);
    if(S.pendingSaveTimer){ clearInterval(S.pendingSaveTimer); S.pendingSaveTimer=null; }
    detachExamSecurity();
    const { data, error } = await sb.rpc('student_submit_section', {p_token:S.studentToken, p_attempt_section_id: sec.attemptSectionId, p_reason: reason});
    S.activeSection = null;
    if(error){ toast('Could not submit: '+error.message,'err'); S.studentPage='dashboard'; render(); return; }
    if(data.testFinished){
      toast('All sections complete — your exam has been submitted!','ok');
      S.viewingResultAttemptId = null; // dashboard will show "View Result" using student_get_dashboard's attempt_id
    } else {
      toast('Section submitted','ok');
    }
    S.studentPage='dashboard';
    render();
  } finally {
    // No matter how this ends (success, error, or an early return above),
    // always release the guard so the student is never stuck unable to
    // retry submitting after a transient failure.
    S.submittingSection = false;
  }
}
window.openImageZoom = (src)=>{
  let overlay = document.getElementById('imgZoomOverlay');
  if(!overlay){
    overlay = document.createElement('div');
    overlay.id = 'imgZoomOverlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:9999;display:flex;align-items:center;justify-content:center;cursor:zoom-out;padding:20px;';
    overlay.onclick = ()=>overlay.remove();
    document.body.appendChild(overlay);
  }
  overlay.innerHTML = `<img src="${src}" style="max-width:95%;max-height:95%;object-fit:contain;border-radius:8px;">`;
};
function playAlertBeep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const gain = ctx.createGain();
    gain.gain.value = 1; // full volume
    gain.connect(ctx.destination);
    [0, 220].forEach(delay=>{
      setTimeout(()=>{
        const osc = ctx.createOscillator();
        osc.type = 'square';
        osc.frequency.value = 880;
        osc.connect(gain);
        osc.start();
        osc.stop(ctx.currentTime + 0.18);
      }, delay);
    });
  }catch(e){ /* audio not available, ignore */ }
}
function requestFullscreenIfNeeded(){
  const sec = S.activeSection;
  if(sec && sec.fullscreenRequired && !document.fullscreenElement){
    document.documentElement.requestFullscreen?.().catch(()=>{});
  }
}
function updateNetStatus(){
  const el = document.getElementById('netStatus');
  if(!el) return;
  if(navigator.onLine){ el.style.background='#ECFDF5'; el.style.color='#047857'; el.textContent='🟢 Online'; }
  else { el.style.background='#FEF2F2'; el.style.color='#B91C1C'; el.textContent='🔴 Offline'; }
}
function attachExamSecurity(){
  const sec = S.activeSection;
  if(!sec) return;
  updateNetStatus();
  window.ononline = ()=>{ updateNetStatus(); toast('Back online — saving any pending answers…','ok'); flushPendingSaves(); };
  window.onoffline = ()=>{ updateNetStatus(); toast('You appear to be offline — your answers will keep retrying automatically once you reconnect.','err'); };
  window.onbeforeunload = (e)=>{
    if(S.pendingSaves && S.pendingSaves.size>0){
      e.preventDefault(); e.returnValue = 'Some of your answers have not finished saving yet. Are you sure you want to leave?';
      return e.returnValue;
    }
  };
  document.onvisibilitychange = async ()=>{
    if(document.hidden && S.studentPage==='exam' && S.activeSection){
      const { data } = await sb.rpc('student_log_activity', {p_token:S.studentToken, p_attempt_id:S.activeSection.attemptId, p_event_type:'tab_switch'});
      const count = data ?? (++S.activeSection.tabSwitchCount);
      S.activeSection.tabSwitchCount = count;
      const limit = S.activeSection.tabSwitchLimit || 3;
      playAlertBeep();
      if(count >= limit){
        toast(`Too many tab switches (${count}/${limit}) — this section is being auto-submitted`,'err');
        handleSectionSubmit(true, 'auto_tab_switch');
      } else {
        toast(`Warning ${count}/${limit}: switching tabs/windows during the exam is recorded`,'err');
      }
    }
  };
  document.onfullscreenchange = async ()=>{
    if(sec.fullscreenRequired && !document.fullscreenElement && S.studentPage==='exam' && S.activeSection){
      await sb.rpc('student_log_activity', {p_token:S.studentToken, p_attempt_id:S.activeSection.attemptId, p_event_type:'fullscreen_exit'});
      playAlertBeep();
      toast('Please stay in full-screen mode during the exam','err');
    }
  };
  if(sec.disableCopyPaste){
    document.oncontextmenu = ()=> S.studentPage==='exam'? false : true;
    document.oncopy = ()=> S.studentPage==='exam'? false : true;
    document.onpaste = ()=> S.studentPage==='exam'? false : true;
  }
}
function detachExamSecurity(){
  window.onbeforeunload = null;
  window.ononline = null;
  window.onoffline = null;
  document.onvisibilitychange = null;
  document.onfullscreenchange = null;
  document.oncontextmenu = null;
  document.oncopy = null;
  document.onpaste = null;
  if(document.fullscreenElement) document.exitFullscreen?.().catch(()=>{});
}

// ---------- STUDENT: Result ----------
async function studentResult(root){
  const attemptId = S.viewingResultAttemptId;
  if(!attemptId){ S.studentPage='dashboard'; return renderStudentPage(root); }
  root.innerHTML = `<div class="empty-state">Loading your result…</div>`;
  const { data, error } = await sb.rpc('student_get_result', {p_token:S.studentToken, p_attempt_id: attemptId});
  if(error){ root.innerHTML = `<div class="empty-state">Could not load result: ${esc(error.message)}</div>`; return; }
  if(!data.resultsVisible){
    root.innerHTML = `<div class="empty-state" style="padding:60px 20px;"><div class="icon">⏳</div><p style="font-weight:700;color:var(--navy);">Your result has been recorded.</p>
    <p style="margin-top:6px;">The administrator hasn't released results for this test yet. Check back soon.</p>
    <button class="btn btn-ghost btn-sm" style="margin-top:16px;" onclick="S.studentPage='dashboard';render();">← Back to Dashboard</button></div>`;
    return;
  }
  const totalQ = data.correct + data.incorrect + data.unattempted;

  const subjAgg = {};
  (data.detail||[]).forEach(d=>{
    if(!subjAgg[d.subject]) subjAgg[d.subject] = {correct:0,total:0};
    subjAgg[d.subject].total++;
    if(d.correct && d.selected===d.correct) subjAgg[d.subject].correct++;
  });
  const subjRows = Object.entries(subjAgg).map(([s,v])=>({subject:s, pct: v.total? Math.round(v.correct/v.total*100):0, total:v.total}));
  subjRows.sort((a,b)=>a.pct-b.pct);
  const weakest = subjRows.slice(0,2).filter(s=>s.pct<70);

  const timedQs = (data.detail||[]).filter(d=>d.time_spent_sec>0);
  const avgTime = timedQs.length? Math.round(timedQs.reduce((a,d)=>a+d.time_spent_sec,0)/timedQs.length) : 0;
  const slowWrong = timedQs.filter(d=>d.time_spent_sec>90 && d.correct && d.selected!==d.correct).length;

  root.innerHTML = `
    <div style="text-align:center;margin-bottom:22px;"><span class="badge badge-success" style="font-size:12px;padding:6px 14px;">EXAM COMPLETED</span></div>
    <div class="card pad" style="text-align:center;padding:34px;">
      <div class="result-score">${Number(data.score).toFixed(2)} <span style="font-size:22px;color:var(--text2);font-weight:600;">/ ${totalQ}</span></div>
      <div class="row" style="justify-content:center;margin-top:16px;">
        <span class="pattern-chip">Accuracy ${data.accuracy}%</span>
        ${data.rankingEnabled && data.rank? `<span class="pattern-chip">All India Rank #${data.rank}</span><span class="pattern-chip">Percentile ${data.percentile}</span>`:''}
        ${avgTime? `<span class="pattern-chip">Avg ${avgTime}s / question</span>`:''}
      </div>
    </div>
    <div class="grid-cards" style="margin-top:20px;grid-template-columns:repeat(3,1fr);">
      <div class="stat-card" style="text-align:center;"><div class="lbl">Correct</div><div class="val" style="color:var(--success)">${data.correct}</div></div>
      <div class="stat-card" style="text-align:center;"><div class="lbl">Incorrect</div><div class="val" style="color:var(--error)">${data.incorrect}</div></div>
      <div class="stat-card" style="text-align:center;"><div class="lbl">Unattempted</div><div class="val" style="color:var(--text2)">${data.unattempted}</div></div>
    </div>
    ${subjRows.length? `<div class="card pad" style="margin-top:20px;">
      <h4 style="font-size:15px;margin-bottom:14px;">Subject performance</h4>
      ${subjRows.map(v=>`<div class="mini-bar"><div class="lbl">${esc(v.subject)}</div><div class="track"><div class="fill" style="width:${v.pct}%;background:${v.pct>=70?'#12B76A':v.pct>=50?'#FFB000':'#F04438'}"></div></div><div class="pct">${v.pct}%</div></div>`).join('')}
    </div>`:''}
    <div class="welcome-band" style="margin-top:20px;">
      <h3 style="color:#fff;font-size:16px;">What went wrong, and what to do next</h3>
      ${data.unattempted>0? `<p>You left <b>${data.unattempted} question(s)</b> unattempted — even an educated guess is usually better than leaving a question blank (check your test's negative marking before assuming this always applies).</p>`:''}
      ${weakest.length? `<p>Your weakest area${weakest.length>1?'s were':' was'} <b>${weakest.map(w=>`${esc(w.subject)} (${w.pct}%)`).join(' and ')}</b> in this test. Prioritize revising ${weakest.length>1?'these subjects':'this subject'} before your next attempt.</p>` : `<p>Your subject-wise performance was fairly even this time — good consistency. Keep practicing to push every subject higher.</p>`}
      ${slowWrong>0? `<p>You spent over 90 seconds on <b>${slowWrong} question(s)</b> and still got them wrong — in a timed exam, it's often better to mark these for review and move on rather than getting stuck.</p>`:''}
      <p>📊 Check <button class="btn btn-outline btn-sm" style="background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.3);" onclick="S.studentPage='analytics';render();">My Analytics</button> to see how this compares with your overall trend across all tests.</p>
    </div>
    ${data.allowReview && data.detail? `<div style="margin-top:20px;text-align:center;"><button class="btn btn-navy" id="reviewBtn">Review Question-wise Result</button></div>`:''}
    <div style="margin-top:16px;text-align:center;"><button class="btn btn-ghost btn-sm" id="backToDashBtn">← Back to Dashboard</button></div>
  `;
  const reviewBtn = $('#reviewBtn');
  if(reviewBtn) reviewBtn.onclick=()=>{ S.reviewDetail = data.detail; S.reviewTestName = data.test_name||''; S.studentPage='review'; render(); };
  $('#backToDashBtn').onclick=()=>{ S.studentPage='dashboard'; render(); };
}
async function studentReview(root){
  const detail = S.reviewDetail || [];
  root.innerHTML = `
    <div class="no-print" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;">
      <button class="btn btn-ghost btn-sm" onclick="S.studentPage='result';render();">← Back to Result</button>
      <button class="btn btn-outline btn-sm" onclick="window.print()">🖨 Print / Save as PDF</button>
    </div>
    <div class="print-header" style="display:none;">
      <h2>${esc(S.currentUser?.name||'Student')} — Question-wise Review</h2>
      <p>${esc(S.reviewTestName||'')} · Printed on ${new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}</p>
      <hr>
    </div>
    <h3 style="font-size:17px;margin-bottom:14px;">Question-wise review</h3>
    ${detail.map((d,i)=>{
      const result = !d.correct? 'unattempted-hidden' : (!d.selected? 'unattempted' : d.selected===d.correct? 'correct':'incorrect');
      const icon = result==='correct'?'✅':result==='incorrect'?'❌':'—';
      return `<div class="qcard">
        <div class="qmeta"><span class="badge badge-grey">Q${i+1}</span><span class="badge badge-blue">${esc(d.subject)}</span>
          ${d.correct? `<span class="badge ${result==='correct'?'badge-success':result==='incorrect'?'badge-error':'badge-grey'}">${icon} ${result}</span>`:''}</div>
        <p style="font-size:14px;margin-bottom:10px;">${esc(d.text)}</p>
        ${d.image_url?`<img class="qimg" src="${esc(d.image_url)}" style="max-width:280px;">`:''}
        ${['a','b','c','d'].filter(k=>d['option_'+k]).map(k=>{
          const K = k.toUpperCase();
          const isCorrect = d.correct===K;
          const isSelected = d.selected===K;
          return `<div class="opt-row ${isCorrect?'correct':''}" style="${isSelected && !isCorrect?'color:var(--error);font-weight:700;':''}">
            ${isCorrect?'✅':isSelected?'❌':'○'} <b>${K}.</b> ${esc(d['option_'+k])}
          </div>`;
        }).join('')}
        ${d.explanation? `<div style="margin-top:8px;padding:10px;background:#F9FAFB;border-radius:8px;font-size:13px;"><b>Explanation:</b> ${esc(d.explanation)}</div>`:''}
      </div>`;
    }).join('')}
  `;
}
