/* =========================================================================
   NEW STUDENT DASHBOARD — clean premium light design (reference-matched).
   Scoped under .gld-page so it only affects the logged-in student area,
   never the login screen or the admin panel.
   ========================================================================= */
.gld-page, .gld-page *{
  box-sizing:border-box;
  font-family:'Plus Jakarta Sans', sans-serif;
  -webkit-font-smoothing:antialiased;
}
.gld-page{
  --gld-bg:#f5f8ff;
  --gld-card-bg:rgba(255,255,255,.88);
  --gld-card-solid:#ffffff;
  --gld-surface-tint:#f8fafc;
  --gld-surface-tint2:#f1f5f9;
  --gld-primary:#155eef;
  --gld-primary-hover:#004ecc;
  --gld-primary-light:#eef4ff;
  --gld-accent:#f59e0b;
  --gld-accent-light:#fffbeb;
  --gld-success:#10b981;
  --gld-success-light:#ecfdf5;
  --gld-danger:#ef4444;
  --gld-danger-light:#fef2f2;
  --gld-text:#0f172a;
  --gld-text-sub:#475569;
  --gld-text-muted:#94a3b8;
  --gld-border:#e2e8f0;
  --gld-border-focus:#bfdbfe;
  --gld-shadow-soft:0 10px 25px -5px rgba(21,94,239,.05), 0 8px 10px -6px rgba(0,0,0,.02);
  --gld-shadow-hover:0 20px 35px -8px rgba(21,94,239,.12), 0 0 0 1.5px rgba(21,94,239,.2);
  --gld-radius-lg:24px; --gld-radius-md:16px; --gld-radius-sm:10px;
  --gld-transition:all .3s cubic-bezier(.16,1,.3,1);
  min-height:100vh; position:relative; overflow-x:hidden;
  background:radial-gradient(circle at 12% 10%, #e8f0fe 0%, #f5f8ff 50%, #fafcff 100%);
  color:var(--gld-text);
}
/* Dark-mode override — reuses the same 🌙 toggle already wired up in
   renderStudentShell()'s header (data-theme-toggle + toggleTheme()); no JS
   change needed here, the dashboard/analytics/result pages already read
   these --gld-* vars everywhere, so redefining them is enough to make the
   whole student area follow the same theme as the login screen. */
html[data-theme="dark"] .gld-page{
  --gld-bg:#0b111f;
  --gld-card-bg:rgba(19,27,46,.88);
  --gld-card-solid:#131b2e;
  --gld-surface-tint:#101a30;
  --gld-surface-tint2:#0d1626;
  --gld-primary:#3b82f6;
  --gld-primary-hover:#60a5fa;
  --gld-primary-light:rgba(59,130,246,.14);
  --gld-accent:#f5a623;
  --gld-accent-light:rgba(245,166,35,.14);
  --gld-success:#3ecf8e;
  --gld-success-light:rgba(62,207,142,.12);
  --gld-danger:#f87171;
  --gld-danger-light:rgba(248,113,113,.12);
  --gld-text:#edf1f9;
  --gld-text-sub:#93a1c0;
  --gld-text-muted:#647092;
  --gld-border:#242e48;
  --gld-border-focus:#3b82f6;
  --gld-shadow-soft:0 10px 25px -5px rgba(0,0,0,.35), 0 8px 10px -6px rgba(0,0,0,.3);
  --gld-shadow-hover:0 20px 35px -8px rgba(0,0,0,.5), 0 0 0 1.5px rgba(59,130,246,.3);
  background:radial-gradient(circle at 12% 10%, #0f1a30 0%, #0b111f 50%, #080d18 100%);
}
html[data-theme="dark"] .gld-header{ background:rgba(11,17,31,.85); border-bottom-color:rgba(36,46,72,.8); }
html[data-theme="dark"] .gld-user-badge{ background:var(--gld-card-solid); border-color:var(--gld-border); }
html[data-theme="dark"] .gld-icon-btn{ background:var(--gld-card-solid); border-color:var(--gld-border); }
html[data-theme="dark"] .gld-test-box{ background:var(--gld-card-solid); }
html[data-theme="dark"] .gld-predictor-banner{ background:linear-gradient(135deg, rgba(59,130,246,.1) 0%, rgba(245,166,35,.08) 100%), var(--gld-card-solid); }
html[data-theme="dark"] .gld-badge-navy{ background:rgba(148,163,184,.12); color:#cbd5e1; border-color:rgba(148,163,184,.2); }
html[data-theme="dark"] .gld-btn-light-outline{ background:var(--gld-card-solid); }
/* My Analytics page: every hardcoded white/light-grey surface below pairs
   with the theme-aware --gld-text* colors, so without this override dark
   mode renders near-invisible light text on a still-white card. */
html[data-theme="dark"] .gla-exam-tabs{ background:var(--gld-card-solid); }
html[data-theme="dark"] .gla-select{ background:var(--gld-card-solid); }
html[data-theme="dark"] .gla-legend-row{ background:var(--gld-card-solid); }
html[data-theme="dark"] .gla-filter-pills{ background:rgba(255,255,255,.05); }
html[data-theme="dark"] .gla-pill-btn.active{ background:var(--gld-card-solid); }
html[data-theme="dark"] .gla-search-box input{ background:var(--gld-card-solid); }
html[data-theme="dark"] .gla-subject-row{ background:var(--gld-card-solid); }
html[data-theme="dark"] .gla-chip-u{ background:var(--gld-surface-tint2); }
html[data-theme="dark"] .gla-chip-acc{ background:var(--gld-surface-tint); }
html[data-theme="dark"] .gla-score-track{ background:var(--gld-surface-tint2); }
html[data-theme="dark"] .gla-insight-item{ background:var(--gld-surface-tint); border-color:var(--gld-border); }
html[data-theme="dark"] .gla-insight-item:hover{ background:var(--gld-card-solid); }
html[data-theme="dark"] .gla-item-icon{ background:var(--gld-card-solid); }
html[data-theme="dark"] .gla-glow-track{ background:var(--gld-surface-tint2); }
/* View Result page: same fix — hardcoded white/grey surfaces under the
   Subject Mastery Matrix, part/section capsules and the results table. */
html[data-theme="dark"] .glr-view-mode-tabs, html[data-theme="dark"] .glr-category-pills-bar{ background:var(--gld-surface-tint2); }
html[data-theme="dark"] .glr-view-btn.active, html[data-theme="dark"] .glr-pill-btn.active{ background:var(--gld-card-solid); }
html[data-theme="dark"] .glr-sort-select{ background:var(--gld-card-solid); }
html[data-theme="dark"] .glr-search-wrap input{ background:var(--gld-card-solid); }
html[data-theme="dark"] .glr-vial-row{ background:var(--gld-card-solid); }
html[data-theme="dark"] .glr-tube-shell{ background:var(--gld-surface-tint2); border-color:var(--gld-border); }
html[data-theme="dark"] .glr-vial-score-pill{ background:var(--gld-surface-tint2); }
html[data-theme="dark"] .glr-table-wrap{ background:var(--gld-card-solid); }
html[data-theme="dark"] .glr-table-wrap thead th{ background:var(--gld-surface-tint); }
html[data-theme="dark"] .glr-table-wrap tbody tr{ border-bottom-color:var(--gld-border); }
html[data-theme="dark"] .glr-table-wrap tbody tr:hover{ background:var(--gld-surface-tint); }
html[data-theme="dark"] .glr-part-capsule{ background:var(--gld-card-solid); }
html[data-theme="dark"] .glr-sec-tile{ background:var(--gld-surface-tint); }
html[data-theme="dark"] .glr-sec-tile:hover{ background:var(--gld-card-solid); }
html[data-theme="dark"] .glr-medmind-card{ background:linear-gradient(180deg, rgba(168,85,247,.08) 0%, var(--gld-card-solid) 70px); border-color:rgba(168,85,247,.25); }
.gld-bg-canvas{ position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }

.gld-header{
  position:sticky; top:0; z-index:40; background:rgba(255,255,255,.85);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(226,232,240,.8); padding:14px 36px;
  display:flex; justify-content:space-between; align-items:center;
  box-shadow:0 2px 12px rgba(15,23,42,.02);
}
.gld-brand{ display:flex; align-items:center; gap:12px; }
.gld-brand-logo{
  width:40px; height:40px; border-radius:12px;
  background:linear-gradient(135deg, var(--gld-primary) 0%, #3b82f6 100%);
  display:flex; align-items:center; justify-content:center; font-size:20px; color:#fff;
  box-shadow:0 8px 16px -4px rgba(21,94,239,.4); flex-shrink:0;
}
.gld-brand-name h1{ font-family:'Outfit', sans-serif; font-size:17px; font-weight:800; letter-spacing:.5px; color:var(--gld-text); }
.gld-brand-name span{ font-size:11px; letter-spacing:1.4px; font-weight:800; color:var(--gld-accent); text-transform:uppercase; }
.gld-user-badge{
  display:flex; align-items:center; gap:12px; background:#fff; padding:5px 16px 5px 6px;

}
.gld-avatar{

}
.gld-user-details b{ font-size:13.5px; display:block; line-height:1.2; color:var(--gld-text); }
.gld-user-details span{ font-size:11px; color:var(--gld-text-muted); font-weight:600; }
.gld-icon-btn{
  width:34px; height:34px; border-radius:50%; background:#fff; border:1px solid var(--gld-border);
  display:flex; align-items:center; justify-content:center; font-size:15px; cursor:pointer;
  transition:var(--gld-transition); flex-shrink:0;
}
.gld-icon-btn:hover{ border-color:var(--gld-primary); transform:translateY(-2px); box-shadow:0 4px 12px rgba(21,94,239,.15); }

.gld-container{ max-width:1140px; margin:0 auto; padding:30px 20px 60px; position:relative; z-index:10; }

.gld-hero-banner{
  background:linear-gradient(135deg, #0f1f3d 0%, #15386f 60%, #1e4fa8 100%);
  border-radius:var(--gld-radius-lg); padding:38px 44px; color:#fff; margin-bottom:24px;
  position:relative; overflow:hidden; box-shadow:0 20px 40px -10px rgba(15,31,61,.25);
  animation:gldFadeInUp .6s var(--gld-ease,cubic-bezier(.16,1,.3,1)) both;
}
.gld-hero-banner::after{

}
.gld-badge-pill{
  display:inline-flex; align-items:center; gap:7px; padding:5px 14px; border-radius:999px;
  background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25);
  font-size:11.5px; font-weight:800; letter-spacing:.8px; text-transform:uppercase; color:#bfdbfe; margin-bottom:12px;
}
.gld-status-pulse{ width:7px; height:7px; border-radius:50%; background:#38bdf8; box-shadow:0 0 10px #38bdf8; animation:gldPulseRadar 1.6s infinite; }
@keyframes gldPulseRadar{ 0%,100%{ transform:scale(1); opacity:1; } 50%{ transform:scale(1.5); opacity:.4; } }
.gld-hero-banner h2{ font-family:'Outfit', sans-serif; font-size:32px; font-weight:800; letter-spacing:-.5px; margin-bottom:8px; color:#fff; }
.gld-hero-banner p{ color:#cbd5e1; font-size:15px; max-width:580px; line-height:1.6; }

.gld-stats-container{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px; }
.gld-stat-card{
  background:var(--gld-card-bg); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border:1.5px solid var(--gld-border); border-radius:20px; padding:22px 20px; box-shadow:var(--gld-shadow-soft);
  display:flex; align-items:center; gap:16px; transition:var(--gld-transition); cursor:default; position:relative; overflow:hidden;
  animation:gldFadeInUp .6s var(--gld-ease,cubic-bezier(.16,1,.3,1)) both;
}
.gld-stat-card:hover{ transform:translateY(-4px); border-color:var(--gld-primary); box-shadow:var(--gld-shadow-hover); }
.gld-stat-icon-wrapper{ width:48px; height:48px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; transition:transform .3s ease; }
.gld-stat-card:hover .gld-stat-icon-wrapper{ transform:scale(1.12) rotate(4deg); }
.gld-stat-info .gld-stat-number{ font-family:'Outfit', sans-serif; font-size:28px; font-weight:800; color:var(--gld-text); line-height:1.1; }
.gld-stat-info .gld-stat-desc{ font-size:13px; font-weight:600; color:var(--gld-text-muted); margin-top:3px; }

.gld-predictor-banner{
  background:linear-gradient(135deg, rgba(238,244,255,.9) 0%, rgba(254,243,199,.45) 100%), #fff;
  border:1.5px solid rgba(21,94,239,.25); border-radius:20px; padding:20px 28px;
  display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:28px;
  box-shadow:var(--gld-shadow-soft); cursor:pointer; transition:var(--gld-transition);
  animation:gldFadeInUp .6s var(--gld-ease,cubic-bezier(.16,1,.3,1)) both;
}
.gld-predictor-banner:hover{ transform:translateY(-2px); border-color:var(--gld-primary); box-shadow:var(--gld-shadow-hover); }
.gld-predictor-left{ display:flex; align-items:center; gap:16px; }
.gld-target-icon{
  width:46px; height:46px; border-radius:14px; background:linear-gradient(135deg, #fef3c7, #fde68a);
  display:flex; align-items:center; justify-content:center; font-size:22px; box-shadow:0 4px 12px rgba(245,158,11,.25); flex-shrink:0;
}
.gld-predictor-meta h4{ font-family:'Outfit', sans-serif; font-size:17px; font-weight:800; color:var(--gld-text); display:flex; align-items:center; gap:8px; }
.gld-predictor-meta p{ font-size:13px; color:var(--gld-text-muted); margin-top:2px; }
.gld-live-dot-glow{ width:8px; height:8px; border-radius:50%; background:var(--gld-success); box-shadow:0 0 10px var(--gld-success); display:inline-block; animation:gldPulseRadar 1.5s infinite; }

.gld-section-title-row{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:18px; }
.gld-eyebrow{ font-size:12px; font-weight:800; letter-spacing:1px; color:var(--gld-primary); text-transform:uppercase; margin-bottom:4px; display:block; }
.gld-section-title-row h3{ font-family:'Outfit', sans-serif; font-size:23px; font-weight:800; }

.gld-btn{ display:inline-flex; align-items:center; gap:8px; padding:9px 18px; border-radius:var(--gld-radius-sm); font-size:13.5px; font-weight:700; cursor:pointer; border:none; transition:var(--gld-transition); text-decoration:none; }
.gld-btn-light-outline{ background:#fff; border:1.5px solid var(--gld-border); color:var(--gld-text); box-shadow:0 2px 6px rgba(0,0,0,.03); }
.gld-btn-light-outline:hover{ border-color:var(--gld-primary); color:var(--gld-primary); transform:translateY(-2px); box-shadow:0 4px 14px rgba(21,94,239,.15); }
.gld-btn-primary-gradient{ background:linear-gradient(135deg, var(--gld-primary) 0%, #2563eb 100%); color:#fff; box-shadow:0 4px 14px rgba(21,94,239,.25); }
.gld-btn-primary-gradient:hover{ transform:translateY(-2px); filter:brightness(1.08); box-shadow:0 8px 20px rgba(21,94,239,.35); }

.gld-test-box{
  background:var(--gld-card-solid); border:1.5px solid var(--gld-border); border-radius:var(--gld-radius-md);
  margin-bottom:20px; overflow:hidden; box-shadow:var(--gld-shadow-soft); transition:var(--gld-transition); position:relative;
  animation:gldFadeInUp .5s var(--gld-ease,cubic-bezier(.16,1,.3,1)) both;
}
.gld-test-box:hover{ transform:translateY(-3px); border-color:var(--gld-border-focus); box-shadow:var(--gld-shadow-hover); }
.gld-test-strip-accent{ position:absolute; top:0; bottom:0; left:0; width:5px; background:linear-gradient(180deg, var(--gld-primary), #38bdf8); }
.gld-test-content-inner{ padding:24px 28px; }
.gld-badge-chip{ display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px; font-size:11.5px; font-weight:800; letter-spacing:.3px; }
.gld-badge-blue{ background:var(--gld-primary-light); color:var(--gld-primary); border:1px solid rgba(21,94,239,.15); }
.gld-badge-green{ background:var(--gld-success-light); color:var(--gld-success); border:1px solid rgba(16,185,129,.2); }
.gld-badge-navy{ background:#eef2f7; color:#334155; border:1px solid rgba(51,65,85,.15); }
.gld-test-name{ font-family:'Outfit', sans-serif; font-size:20px; font-weight:800; color:var(--gld-text); margin:8px 0 3px; }
.gld-test-desc{ font-size:13.5px; color:var(--gld-text-muted); }
.gld-alert-banner{ background:#fffbeb; border:1px solid #fef3c7; border-radius:12px; padding:12px 18px; color:#92400e; font-size:13px; font-weight:600; margin:16px 0; display:flex; align-items:center; gap:8px; }
.gld-test-bottom-bar{ border-top:1px solid var(--gld-border); padding-top:14px; margin-top:14px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; }
.gld-submission-state{ display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:700; color:var(--gld-text); }
.gld-test-progress-track{ height:7px; background:var(--gld-border); border-radius:6px; overflow:hidden; margin-top:14px; }
.gld-test-progress-fill{ height:100%; background:linear-gradient(90deg, var(--gld-primary), #38bdf8); border-radius:6px; transition:width .5s var(--gld-transition); }
.gld-test-meta-row{ display:flex; gap:14px; margin-top:10px; font-size:12.5px; color:var(--gld-text-muted); flex-wrap:wrap; }

@keyframes gldFadeInUp{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:translateY(0); } }

@media (max-width:900px){
  .gld-stats-container{ grid-template-columns:repeat(2,1fr); }
  .gld-hero-banner{ padding:30px 24px; }
  .gld-hero-banner h2{ font-size:26px; }
  .gld-header{ padding:12px 18px; }
}
@media (max-width:560px){
  .gld-stats-container{ grid-template-columns:1fr; }
  .gld-predictor-banner{ flex-direction:column; align-items:flex-start; }
}

/* =========================================================================
   NEW "MY ANALYTICS" (student) — reference-matched. Reuses the .gld-page
   background/canvas/font already set up for the student area; these rules
   are scoped with a gla- prefix so they only touch the analytics page's

.gla-page-head{ margin-bottom:26px; display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:16px; }
.gla-eyebrow{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:800; letter-spacing:1.2px; color:var(--gld-primary); text-transform:uppercase; margin-bottom:4px; }
.gla-title{ font-family:'Outfit', sans-serif; font-size:34px; font-weight:800; letter-spacing:-.5px; color:var(--gld-text); }

.gla-exam-tabs{ display:inline-flex; background:#fff; border:1.5px solid var(--gld-border); border-radius:999px; padding:4px; box-shadow:0 4px 14px rgba(15,23,42,.03); }
.gla-exam-tab-btn{ padding:8px 22px; border-radius:999px; border:none; background:none; font-size:13.5px; font-weight:700; color:var(--gld-text-muted); cursor:pointer; transition:all .25s var(--gld-transition); }
.gla-exam-tab-btn.active{ background:var(--gld-primary); color:#fff; box-shadow:0 4px 14px rgba(21,94,239,.22); }

.gla-kpi-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:26px; }
.gla-kpi-card{
  background:var(--gld-card-bg); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border:1.5px solid var(--gld-border); border-radius:18px; padding:22px 20px; box-shadow:var(--gld-shadow-soft);
  display:flex; align-items:center; gap:16px; transition:var(--gld-transition); cursor:default;
  animation:gldFadeInUp .6s cubic-bezier(.16,1,.3,1) both;
}
.gla-kpi-card:hover{ transform:translateY(-4px); border-color:var(--gld-primary); box-shadow:var(--gld-shadow-hover); }
.gla-kpi-icon{ width:48px; height:48px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; transition:transform .3s ease; }
.gla-kpi-card:hover .gla-kpi-icon{ transform:scale(1.12) rotate(4deg); }
.gla-kpi-val{ font-family:'Outfit', sans-serif; font-size:28px; font-weight:800; line-height:1.1; color:var(--gld-text); }
.gla-kpi-lbl{ font-size:13px; font-weight:600; color:var(--gld-text-muted); margin-top:3px; }

.gla-breakdown-card{ background:var(--gld-card-bg); border:1.5px solid var(--gld-border); border-radius:var(--gld-radius-lg); padding:28px 32px; box-shadow:var(--gld-shadow-soft); margin-bottom:26px; }
.gla-test-picker{ max-width:340px; margin-bottom:20px; }
.gla-test-picker label{ display:block; font-size:11.5px; font-weight:800; color:var(--gld-text-muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:.5px; }
.gla-select{ width:100%; height:44px; padding:0 16px; border-radius:12px; border:1.5px solid var(--gld-border); background:#fff; font-size:14px; font-weight:700; color:var(--gld-text); outline:none; cursor:pointer; transition:all .2s; }
.gla-select:focus{ border-color:var(--gld-primary); box-shadow:0 0 0 3px rgba(21,94,239,.18); }
.gla-breakdown-body{ display:flex; align-items:center; gap:40px; flex-wrap:wrap; border-top:1px solid var(--gld-border); padding-top:22px; }

.gla-donut-visual{ position:relative; width:165px; height:165px; flex-shrink:0; }
.gla-donut-visual svg{ width:100%; height:100%; }
.gla-donut-center-info{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; pointer-events:none; }
.gla-donut-center-info b{ font-family:'Outfit', sans-serif; font-size:26px; font-weight:800; color:var(--gld-text); line-height:1; }
.gla-donut-center-info span{ font-size:11.5px; font-weight:600; color:var(--gld-text-muted); margin-top:4px; }

.gla-legend-list{ display:flex; flex-direction:column; gap:12px; flex:1; min-width:220px; }
.gla-legend-row{ display:flex; align-items:center; justify-content:space-between; padding:12px 18px; border-radius:14px; background:#fff; border:1px solid var(--gld-border); box-shadow:0 2px 8px rgba(15,23,42,.02); transition:all .25s var(--gld-transition); }
.gla-legend-row:hover{ transform:translateX(4px); border-color:var(--gld-primary); }
.gla-legend-name{ display:flex; align-items:center; gap:10px; font-size:13.5px; font-weight:700; }
.gla-dot-chip{ width:10px; height:10px; border-radius:3px; flex-shrink:0; }

.gla-subject-section{ background:var(--gld-card-bg); border:1.5px solid var(--gld-border); border-radius:var(--gld-radius-lg); padding:26px 28px; box-shadow:var(--gld-shadow-soft); margin-bottom:26px; }
.gla-toolbar-row{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px; margin-bottom:16px; }
.gla-filter-pills{ display:flex; gap:6px; background:rgba(241,245,249,.85); padding:5px; border-radius:12px; border:1px solid var(--gld-border); }
.gla-pill-btn{ border:none; background:none; padding:8px 18px; border-radius:9px; font-size:12.5px; font-weight:700; color:var(--gld-text-sub); cursor:pointer; transition:all .2s; }
.gla-pill-btn.active{ background:#fff; color:var(--gld-primary); box-shadow:0 2px 8px rgba(0,0,0,.05); }
.gla-search-box{ position:relative; }
.gla-search-box input{ height:42px; padding:0 14px 0 38px; border-radius:12px; border:1.5px solid var(--gld-border); font-size:13px; outline:none; background:#fff; transition:all .25s var(--gld-transition); width:220px; }
.gla-search-box input:focus{ border-color:var(--gld-primary); width:260px; box-shadow:0 0 0 3px rgba(21,94,239,.18); }
.gla-search-icon{ position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:13px; color:var(--gld-text-muted); }

.gla-subject-list{ display:flex; flex-direction:column; gap:12px; }
.gla-subject-row{
  background:#fff; border:1.5px solid var(--gld-border); border-radius:16px; padding:16px 22px;
  display:grid; grid-template-columns:2.2fr 3fr 1.8fr; align-items:center; gap:20px;
  transition:all .28s var(--gld-transition); position:relative; overflow:hidden;
  animation:gldFadeInUp .5s cubic-bezier(.16,1,.3,1) both;
}
.gla-subject-row:hover{ transform:translateY(-2px) scale(1.005); border-color:var(--gld-primary); box-shadow:0 8px 24px -4px rgba(21,94,239,.08); }
.gla-subject-row::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--gla-ind, #e2e8f0); }
.gla-subj-main{ display:flex; align-items:center; gap:14px; }
.gla-subj-avatar{ width:40px; height:40px; border-radius:12px; background:var(--gla-abg,#eff6ff); color:var(--gla-acolor,#155eef); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
.gla-subj-name h4{ font-size:15px; font-weight:800; color:var(--gld-text); margin-bottom:2px; }
.gla-subj-name span{ font-size:12px; color:var(--gld-text-muted); font-weight:600; }
.gla-metrics-cluster{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.gla-stat-chip{ padding:5px 12px; border-radius:8px; font-size:12px; font-weight:700; display:inline-flex; align-items:center; gap:5px; }
.gla-chip-c{ background:var(--gld-success-light); color:var(--gld-success); }
.gla-chip-w{ background:var(--gld-danger-light); color:var(--gld-danger); }
.gla-chip-u{ background:#f1f5f9; color:var(--gld-text-sub); }
.gla-chip-acc{ background:#f8fafc; border:1px solid var(--gld-border); color:var(--gld-text); }
.gla-score-box{ display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
.gla-score-label-row{ display:flex; align-items:baseline; gap:6px; }
.gla-score-pct{ font-family:'Outfit', sans-serif; font-size:18px; font-weight:800; color:var(--gla-ind); }
.gla-score-track{ width:100%; height:8px; background:#f1f5f9; border-radius:999px; overflow:hidden; }
.gla-score-fill{ height:100%; border-radius:999px; background:var(--gla-ind); transition:width 1s var(--gld-transition); }

.gla-insights-grid{ display:grid; grid-template-columns:1fr 1fr; gap:22px; margin-top:24px; }
.gla-insight-card{ background:var(--gld-card-solid); border-radius:var(--gld-radius-lg); padding:30px 28px; box-shadow:var(--gld-shadow-soft); position:relative; overflow:hidden; transition:all .32s var(--gld-transition); }
.gla-insight-card:hover{ transform:translateY(-5px); }
.gla-card-focus{ border:1.5px solid rgba(239,68,68,.45); box-shadow:0 16px 36px -8px rgba(239,68,68,.15), 0 0 0 1px rgba(239,68,68,.1); }
.gla-card-focus::after{ content:''; position:absolute; top:-30px; right:-30px; width:160px; height:160px; background:radial-gradient(circle, rgba(239,68,68,.18) 0%, transparent 70%); pointer-events:none; }
.gla-card-strong{ border:1.5px solid rgba(16,185,129,.45); box-shadow:0 16px 36px -8px rgba(16,185,129,.15), 0 0 0 1px rgba(16,185,129,.1); }
.gla-card-strong::after{ content:''; position:absolute; top:-30px; right:-30px; width:160px; height:160px; background:radial-gradient(circle, rgba(16,185,129,.18) 0%, transparent 70%); pointer-events:none; }
.gla-insight-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
.gla-insight-title{ display:flex; align-items:center; gap:10px; font-size:17px; font-weight:800; letter-spacing:-.2px; }
.gla-insight-title.focus{ color:#dc2626; }
.gla-insight-title.strong{ color:#059669; }
.gla-micro-badge{ font-size:11px; font-weight:800; padding:5px 12px; border-radius:999px; letter-spacing:.4px; text-transform:uppercase; }
.gla-badge-revision{ background:#fef2f2; color:#ef4444; border:1px solid rgba(239,68,68,.2); }
.gla-badge-mastery{ background:#ecfdf5; color:#10b981; border:1px solid rgba(16,185,129,.2); }
.gla-insight-items{ display:flex; flex-direction:column; gap:16px; }
.gla-insight-item{ display:flex; flex-direction:column; gap:10px; padding:14px 18px; border-radius:18px; background:#f8fafc; border:1.5px solid rgba(226,232,240,.8); transition:all .25s var(--gld-transition); }
.gla-insight-item:hover{ background:#fff; transform:translateX(4px); box-shadow:0 6px 18px rgba(15,23,42,.05); border-color:var(--gld-primary); }
.gla-item-top-row{ display:flex; justify-content:space-between; align-items:center; }
.gla-item-name{ display:flex; align-items:center; gap:10px; font-size:14.5px; font-weight:800; color:var(--gld-text); }
.gla-item-icon{ width:32px; height:32px; border-radius:var(--gld-radius-sm); display:flex; align-items:center; justify-content:center; font-size:16px; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.04); border:1px solid var(--gld-border); flex-shrink:0; }
.gla-item-pct{ font-family:'Outfit', sans-serif; font-size:17px; font-weight:800; }
.gla-pct-danger{ color:#dc2626; }
.gla-pct-success{ color:#059669; }
.gla-glow-track{ width:100%; height:8px; background:#e2e8f0; border-radius:999px; overflow:hidden; position:relative; }
.gla-glow-fill{ height:100%; border-radius:999px; width:0%; transition:width 1.3s var(--gld-transition); position:relative; }
.gla-glow-fill::after{ content:''; position:absolute; top:0; bottom:0; right:0; width:14px; background:rgba(255,255,255,.85); border-radius:999px; box-shadow:0 0 10px rgba(255,255,255,.95); }
.gla-fill-danger{ background:linear-gradient(90deg, #f87171, #ef4444); box-shadow:0 0 12px rgba(239,68,68,.45); }
.gla-fill-success{ background:linear-gradient(90deg, #34d399, #10b981); box-shadow:0 0 12px rgba(16,185,129,.45); }

@media (max-width:960px){
  .gla-subject-row{ grid-template-columns:1fr; gap:14px; }
  .gla-score-box{ align-items:flex-start; }
  .gla-kpi-grid{ grid-template-columns:repeat(2,1fr); }
  .gla-insights-grid{ grid-template-columns:1fr; }
}
@media (max-width:580px){
  .gla-kpi-grid{ grid-template-columns:1fr; }
  .gla-breakdown-body{ gap:20px; }
}

/* =========================================================================
   NEW "VIEW RESULT" page (student) — reference-matched. Reuses .gld-page's
   font/background/canvas, and .gld-hero-banner/.gld-stat-card for the score
   banner and KPI cards (same design language as the dashboard). glr- is
   this page's own prefix for its unique components (mastery matrix,
   part/section capsules, advice band, MedMind card, bottom actions).
   ========================================================================= */
.glr-score-headline{ font-family:'Outfit', sans-serif; font-size:54px; font-weight:900; line-height:1.05; letter-spacing:-1.2px; margin-bottom:4px; display:flex; align-items:baseline; justify-content:center; gap:6px; }
.glr-score-num{ background:linear-gradient(135deg,#ffffff 40%,#93c5fd 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.glr-score-total{ font-size:22px; color:#94a3b8; font-weight:700; }
.glr-test-subtitle{ font-size:13.5px; color:#cbd5e1; font-weight:600; }

.glr-mastery-card{ background:var(--gld-card-bg); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1.5px solid var(--gld-border); border-radius:var(--gld-radius-lg); padding:22px 26px 24px; box-shadow:0 12px 32px -8px rgba(15,23,42,.05); margin-bottom:24px; }
.glr-mastery-header{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px; padding-bottom:14px; border-bottom:1px solid var(--gld-border); margin-bottom:16px; }
.glr-mastery-header h3{ font-family:'Outfit', sans-serif; font-size:20px; font-weight:800; display:flex; align-items:center; gap:8px; color:var(--gld-text); }
.glr-mastery-header p{ font-size:12.5px; color:var(--gld-text-muted); margin-top:2px; }
.glr-controls-cluster{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.glr-view-mode-tabs, .glr-category-pills-bar{ display:inline-flex; background:#f1f5f9; border:1px solid var(--gld-border); border-radius:999px; padding:3px; gap:2px; }
.glr-view-btn, .glr-pill-btn{ border:none; background:none; padding:5px 14px; border-radius:999px; font-size:11.5px; font-weight:700; color:var(--gld-text-muted); cursor:pointer; transition:var(--gld-transition); white-space:nowrap; }
.glr-view-btn.active, .glr-pill-btn.active{ background:#ffffff; color:var(--gld-primary); box-shadow:0 2px 6px rgba(0,0,0,.06); }
.glr-sort-select{ height:34px; padding:0 12px; border-radius:999px; border:1px solid var(--gld-border); background:#ffffff; font-size:11.5px; font-weight:700; color:var(--gld-text-sub); outline:none; cursor:pointer; transition:all .2s; }
.glr-sort-select:focus{ border-color:var(--gld-primary); box-shadow:0 0 0 3px var(--gld-primary-light); }
.glr-search-wrap{ position:relative; }
.glr-search-wrap input{ height:34px; padding:0 12px 0 32px; border-radius:999px; border:1px solid var(--gld-border); font-size:11.5px; font-weight:600; outline:none; background:#ffffff; width:140px; transition:width .25s var(--gld-transition), border-color .2s; }
.glr-search-wrap input:focus{ width:180px; border-color:var(--gld-primary); }
.glr-search-icon{ position:absolute; left:11px; top:50%; transform:translateY(-50%); font-size:12px; color:var(--gld-text-muted); pointer-events:none; }

.glr-matrix-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
.glr-vial-row{ background:#ffffff; border:1.5px solid var(--gld-border); border-radius:var(--gld-radius-sm); padding:10px 14px; display:flex; align-items:center; gap:12px; box-shadow:0 2px 6px rgba(15,23,42,.02); transition:transform .22s var(--gld-transition), box-shadow .22s var(--gld-transition), border-color .22s; }
.glr-vial-row:hover{ transform:translateY(-2px); border-color:var(--gld-primary); box-shadow:var(--gld-shadow-hover); }
.glr-vial-ico{ font-size:18px; width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.glr-vial-details{ flex:1.35; min-width:0; }
.glr-vial-title{ font-size:12px; font-weight:800; color:var(--gld-text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.glr-vial-sub{ font-size:10.5px; color:var(--gld-text-muted); font-weight:600; }
.glr-tube-shell{ flex:1.3; height:14px; background:#f1f5f9; border-radius:999px; border:1.5px solid #cbd5e1; position:relative; overflow:hidden; box-shadow:inset 0 2px 4px rgba(0,0,0,.06); }
.glr-tube-shell::before{ content:''; position:absolute; top:1.5px; left:4px; right:4px; height:2px; background:rgba(255,255,255,.9); border-radius:999px; z-index:4; pointer-events:none; }
.glr-liquid-fill{ height:100%; width:0%; border-radius:999px; position:relative; transition:width 1.3s cubic-bezier(.34,1.25,.64,1); }
.glr-fill-danger{ background:linear-gradient(90deg,#f87171,#ef4444); box-shadow:0 0 10px rgba(239,68,68,.45); }
.glr-fill-success{ background:linear-gradient(90deg,#34d399,#10b981); box-shadow:0 0 10px rgba(16,185,129,.45); }
.glr-wave-crest{ position:absolute; top:0; bottom:0; right:0; width:10px; background:rgba(255,255,255,.6); border-radius:999px; filter:blur(1px); animation:glrPulseWave 1.4s infinite alternate; }
@keyframes glrPulseWave{ from{ opacity:.3; } to{ opacity:.95; } }
.glr-vial-metrics{ display:flex; flex-direction:column; align-items:flex-end; gap:1px; flex-shrink:0; min-width:52px; }
.glr-vial-score-pill{ font-size:10px; font-weight:800; color:var(--gld-text-sub); background:#f1f5f9; padding:1.5px 6px; border-radius:4px; border:1px solid var(--gld-border); line-height:1.1; }
.glr-vial-pct{ font-family:'Outfit', sans-serif; font-size:13.5px; font-weight:800; line-height:1.1; }

.glr-table-wrap{ display:none; overflow-x:auto; border-radius:var(--gld-radius-sm); border:1.5px solid var(--gld-border); background:#ffffff; }
.glr-table-wrap table{ width:100%; border-collapse:collapse; font-size:13px; text-align:left; }
.glr-table-wrap thead th{ background:#f8fafc; color:var(--gld-text-muted); font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; padding:12px 16px; border-bottom:1.5px solid var(--gld-border); }
.glr-table-wrap tbody tr{ border-bottom:1px solid #f1f5f9; transition:background .15s; }
.glr-table-wrap tbody tr:last-child{ border-bottom:none; }
.glr-table-wrap tbody tr:hover{ background:#f8fbff; }
.glr-table-wrap tbody td{ padding:12px 16px; font-weight:600; color:var(--gld-text-sub); }
.glr-table-wrap tbody td b{ color:var(--gld-text); }

.glr-parts-card{ background:var(--gld-card-bg); border:1.5px solid var(--gld-border); border-radius:var(--gld-radius-lg); padding:22px 24px; box-shadow:var(--gld-shadow-soft); margin-bottom:24px; }
.glr-parts-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.glr-part-capsule{ background:#ffffff; border:1.5px solid var(--gld-border); border-radius:var(--gld-radius-md); padding:18px; box-shadow:0 4px 12px rgba(15,23,42,.02); transition:var(--gld-transition); }
.glr-part-capsule:hover{ border-color:var(--gld-primary); transform:translateY(-2px); }
.glr-part-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; padding-bottom:10px; border-bottom:1.5px solid var(--gld-border); }
.glr-part-head b{ font-size:15px; font-weight:800; }
.glr-part-badge{ font-size:11px; font-weight:800; padding:3px 10px; border-radius:999px; background:var(--gld-primary-light); color:var(--gld-primary); border:1px solid rgba(21,94,239,.15); }
.glr-sec-list{ display:flex; flex-direction:column; gap:8px; }
.glr-sec-tile{ background:#f8fafc; border:1px solid var(--gld-border); border-radius:var(--gld-radius-sm); padding:10px 14px; display:flex; justify-content:space-between; align-items:center; transition:all .2s; }
.glr-sec-tile:hover{ background:#ffffff; border-color:var(--gld-primary); }
.glr-sec-tile-title b{ font-size:13px; display:block; }
.glr-sec-tile-title span{ font-size:10.5px; color:var(--gld-text-muted); }
.glr-sec-counts{ display:flex; gap:6px; font-size:11.5px; font-weight:700; }

.glr-advice-band{ position:relative; background:linear-gradient(135deg,#091326 0%,#0f244c 100%); border-radius:var(--gld-radius-lg); padding:26px 28px; color:#ffffff; margin-bottom:24px; box-shadow:0 16px 36px -8px rgba(15,36,76,.3); overflow:hidden; }
.glr-advice-band h4{ font-family:'Outfit', sans-serif; font-size:18px; font-weight:800; margin-bottom:10px; display:flex; align-items:center; gap:8px; }
.glr-advice-band p{ font-size:13.5px; line-height:1.6; color:#cbd5e1; margin-bottom:6px; }
.glr-advice-band p:last-child{ margin-bottom:0; }
.glr-advice-band b{ color:#fff; }
.glr-analytics-link{ display:inline-flex; align-items:center; gap:4px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25); color:#fff; font-size:12px; font-weight:700; padding:3px 10px; border-radius:6px; text-decoration:none; cursor:pointer; transition:all .2s; }
.glr-analytics-link:hover{ background:rgba(255,255,255,.2); }

.glr-medmind-card{ background:linear-gradient(180deg,#fdf4ff 0%,#ffffff 70px); border:1.5px solid #f3e8ff; border-radius:var(--gld-radius-lg); padding:24px 26px; box-shadow:var(--gld-shadow-soft); margin-bottom:24px; }
.glr-medmind-head{ display:flex; align-items:center; gap:12px; margin-bottom:12px; }
.glr-medmind-head h4{ font-size:16px; font-weight:800; color:var(--gld-text); }

// =========================================================================
// GOOGLE reCAPTCHA (v2 checkbox) — login/signup bot protection
// -------------------------------------------------------------------------
// Loaded in "explicit render" mode (see the script tag in index.html)
// because this is a single-page app: the login form's HTML is injected
// long after the recaptcha script's own page-load pass already ran, so
// the widget must be rendered by hand each time the login screen redraws.
// RECAPTCHA_SITE_KEY is defined earlier in index.html's config block —
// it's the PUBLIC key and is safe to ship in frontend code. The matching
// Secret Key is deliberately never referenced here: it belongs only in a
// future server-side verification step (e.g. a Supabase Edge Function),
// never in a file that ships to every visitor's browser.
// =========================================================================
window._captchaReady = false;
window.onRecaptchaApiLoad = function(){ window._captchaReady = true; };
const captchaWidgets = {};
// Admin-controlled on/off switch (Settings → CAPTCHA Verification). Defaults
// to ON (matches the original always-on behavior) so nothing changes for
// anyone until the admin explicitly turns it off from the panel.
function captchaEnabled(){
  return S.appSettings?.captcha_enabled !== false;
}
function mountCaptcha(containerId){
  if(!captchaEnabled()) return; // admin has switched CAPTCHA off — never render the widget
  const el = document.getElementById(containerId);
  if(!el || !RECAPTCHA_SITE_KEY) return;
  // Capture the actual DOM node (not just its id string) so a slow-loading
  // poll loop from an EARLIER renderLogin() pass can tell it's obsolete —
  // if the login screen re-rendered while grecaptcha.js was still loading,
  // the id would still resolve to a fresh node, and the old loop would
  // otherwise render onto (or race with) that new node instead of quietly
  // giving up.
  const myNode = el;
  let attempts = 0;
  const tryRender = ()=>{
    const current = document.getElementById(containerId);
    if(!current || current!==myNode) return; // node gone, or replaced by a newer render — abandon this loop
    if(!(window._captchaReady && window.grecaptcha && grecaptcha.render)){
      if(++attempts > 40) return; // ~12s — give up quietly (fails open, see captchaSolved)
      setTimeout(tryRender, 300);
      return;
    }
    try{
      captchaWidgets[containerId] = grecaptcha.render(containerId, { sitekey: RECAPTCHA_SITE_KEY });
    }catch(e){ /* container already rendered once, or a transient API hiccup — ignore */ }
  };
  tryRender();
}
function captchaSolved(containerId){
  if(!captchaEnabled()) return true; // admin has switched CAPTCHA off
  // Fails OPEN (does not block login) if the widget never managed to load
  // at all — an ad-blocker, a Google outage, or a slow connection — so
  // that can never lock every student/admin out of the portal. Once it HAS
  // loaded, a real tick is required.
  if(!(window._captchaReady && window.grecaptcha)) return true;
  const id = captchaWidgets[containerId];
  if(id===undefined) return true;
  try{ return !!grecaptcha.getResponse(id); }catch(e){ return true; }
}
function captchaReset(containerId){
  const id = captchaWidgets[containerId];
  if(id!==undefined && window.grecaptcha){ try{ grecaptcha.reset(id); }catch(e){} }
}
// ---------- server-side CAPTCHA verification ----------
// captchaSolved() above only proves the checkbox was ticked — that check
// runs entirely in THIS browser, so anyone could skip the widget and call
// student_login/student_signup directly from the console. This closes
// that loophole: it sends the widget's one-time token to a Supabase Edge
// Function ("verify-recaptcha"), which holds the Secret Key server-side
// and asks Google's own siteverify API whether that token is real.
// Deliberately fails OPEN (returns true) whenever the Edge Function itself
// isn't reachable — not deployed yet, a deploy hiccup, or a network blip —
// so a problem on OUR side can never lock every real student/admin out of
// the portal; it only ever fails CLOSED when Google itself says the token
// is invalid/expired, which is the actual bot-blocking case.
async function verifyCaptchaOnServer(containerId){
  if(!captchaEnabled()) return true; // admin has switched CAPTCHA off
  if(!(window._captchaReady && window.grecaptcha)) return true; // widget never loaded — captchaSolved() already handled this
  const id = captchaWidgets[containerId];
  if(id===undefined) return true;
  let token = '';
  try{ token = grecaptcha.getResponse(id); }catch(e){}
  if(!token) return false; // shouldn't happen — captchaSolved() already caught an empty response
  try{
    const { data, error } = await sb.functions.invoke('verify-recaptcha', { body: { token } });
    if(error) return true; // Edge Function not deployed / unreachable — fail open
    return !!(data && data.success);
  }catch(e){
    return true; // our own network hiccup calling the function — fail open
  }
}

function parseCSV(text){
  // Proper RFC4180-style parser: scans character-by-character so that
  // newlines and commas INSIDE a quoted field (e.g. a multi-paragraph
  // explanation) do not get mistaken for a new row/column.
  const rows = [];
  let row = [];
  let cur = '';
  let inQ = false;
  const src = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  for(let i=0;i<src.length;i++){
    const c = src[i];
    if(inQ){
      if(c === '"'){
        if(src[i+1] === '"'){ cur += '"'; i++; }
        else { inQ = false; }
      } else {
        cur += c;
      }
    } else {
      if(c === '"'){ inQ = true; }
      else if(c === ','){ row.push(cur); cur=''; }
      else if(c === '\n'){ row.push(cur); cur=''; rows.push(row); row=[]; }
      else { cur += c; }
    }
  }
  if(cur.length || row.length){ row.push(cur); rows.push(row); }
  const nonEmpty = rows.filter(r => r.some(cell => cell.trim().length));
  if(!nonEmpty.length) return {headers:[],rows:[]};
  const headers = nonEmpty[0].map(h=>h.trim().toLowerCase().replace(/\s+/g,'_'));
  const dataRows = nonEmpty.slice(1).map(cells=>{
    const obj={};
    headers.forEach((h,i)=>obj[h]=(cells[i]??'').trim());
    return obj;
  });
  return {headers, rows: dataRows};
}

// ---------- persistent storage-backed "DB" ----------
const DB = {
  cache:{},
  async get(key, fallback, shared=true){
    if(this.cache[key]!==undefined) return this.cache[key];
    try{
      const r = await window.storage.get(key, shared);
      const v = r ? JSON.parse(r.value) : fallback;
      this.cache[key]=v;
      return v;
    }catch(e){
      this.cache[key]=fallback;
      return fallback;
    }
  },
  async set(key, value, shared=true){
    this.cache[key]=value;
    try{ await window.storage.set(key, JSON.stringify(value), shared); }catch(e){ console.warn('storage set failed',key,e); }
    return value;
  }
};

  return [];
}
function randNormal(mean,sd){
  let u=0,v=0; while(u===0)u=Math.random(); while(v===0)v=Math.random();
  return mean + sd*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
}
function buildFakeAttempts(test, questions, count=64){
  // Generate plausible national-level fake attempts so ranking/analytics have real substance.
  const names = ["Priya Sharma","Aman Verma","Sneha Iyer","Karan Malhotra","Divya Nair","Rohit Kapoor","Isha Bansal","Vikram Singh","Neha Gupta","Arjun Reddy","Simran Kaur","Yash Patel","Ritu Chawla","Aditya Joshi","Meera Pillai","Sahil Khanna","Tanvi Desai","Nikhil Rao","Pooja Menon","Harsh Agarwal"];
  const totalQ = test.sections.reduce((a,s)=>a+s.questionIds.length,0);
  const out=[];
  for(let i=0;i<count;i++){
    const name = names[i%names.length]+(i>=names.length? ' '+(Math.floor(i/names.length)+1):'');
    const skill = Math.min(0.97,Math.max(0.15, randNormal(0.62,0.16)));
    let correct=0, incorrect=0, unattempted=0;
    const subjPerf={}; SUBJECTS.forEach(s=>subjPerf[s]={correct:0,total:0});
    questions.forEach(q=>{
      subjPerf[q.subject].total++;
      const roll = Math.random();
      if(roll < 0.06){ unattempted++; }
      else if(roll < 0.06+skill*0.94){ correct++; subjPerf[q.subject].correct++; }
      else { incorrect++; }
    });
    const score = +(correct*test.sections.length ? (correct*1 - incorrect*0.25) : 0).toFixed(2);
    const accuracy = (correct+incorrect)>0? +((correct/(correct+incorrect))*100).toFixed(1) : 0;
    const timeUsed = Math.round((totalQ*50 + randNormal(0,300)));
    out.push({
      id:uid('ATT'), testId:test.id, studentName:name, studentId:'FMGS-'+(20000+i),
      score, accuracy, correct, incorrect, unattempted, timeUsed,
      subjPerf, submittedAt: Date.now()-Math.floor(Math.random()*1000*60*60*40),
      fake:true,
    });
  }
  return out;
}

async function boot(){
  const seeded = await DB.get('seeded_v1', false, true);
  if(!seeded){
    const questions = buildSeedQuestions();
    const test = buildSeedTest(questions);
    const users = buildSeedUsers();
    const fakeAttempts = buildFakeAttempts(test, questions);
    await DB.set('questions', questions, true);
    await DB.set('tests', [test], true);
    await DB.set('users', users, true);
    await DB.set('attempts', fakeAttempts, true); // real attempts appended here on submit
    await DB.set('auditLog', [], true);
    await DB.set('settings', {
      demoSpeed: 20, // speeds section timers up 20x for demo/testing; set 1 for real 50-minute sections
      globalShuffle:false,
      tabSwitchLimit:3,
      fullscreenRequired:true,
      disableCopyPaste:true,
    }, true);
    await DB.set('seeded_v1', true, true);
  }

  // ---- Restore an existing session on page load/refresh, so a student
  // (or admin) is never unexpectedly dumped back to the login screen. ----
  try{
    const info = loadStudentSession();
    if(info){
      const { data, error } = await sb.rpc('student_get_dashboard', {p_token: info.token});
      if(!error && data){
        S.role = 'student';
        S.studentToken = info.token;
        S.currentUser = { id: info.id, studentId: info.studentId, name: info.name, status:'Active', examTarget: info.examTarget||'FMGE' };
        S.view = 'student'; S.studentPage = 'dashboard';
      } else if(error && isSessionInvalidError(error)){
        // This is a genuine "the token itself is no longer valid" signal
        // (e.g. the student logged in on another device, which invalidates
        // this one) — safe and correct to clear it and show the login page.
        clearStudentSession();
      } else if(error){
        // Any OTHER error here (network hiccup, temporary Supabase outage,
        // DNS blip on page load, etc.) is NOT treated as an invalid session —
        // we deliberately do NOT clear localStorage in that case, so the very
        // next page load/refresh (once connectivity returns) can still log
        // the student back in automatically instead of forcing a manual
        // re-login for what was only ever a temporary network issue.
        // Only the login screen's messaging changes, so a student mid-exam
        // who lost signal and got reloaded (common on mobile — screen lock,
        // switching apps) understands why they're seeing a login screen at
        // all: their exam attempt itself is untouched server-side, and
        // logging back in drops them straight back into "Continue Exam"
        // exactly where they left off, instead of looking like data loss.
        S.sessionRestoreNetworkIssue = true;
      }
    }
  }catch(e){
    // A thrown exception here almost always means the request never even
    // reached the server (offline, DNS failure, etc.) — a pure
    // connectivity problem, not an invalid session. Leave the saved
    // session alone so the next attempt can still succeed.
    if(loadStudentSession()) S.sessionRestoreNetworkIssue = true;
  }

  if(!S.role){
    try{
      const { data: { session } } = await sb.auth.getSession();
      if(session?.user && (session.user.email||'').toLowerCase() === ADMIN_EMAIL.toLowerCase()){
        S.role = 'admin';
        S.currentUser = { id:session.user.id, name:'System Administrator', email:session.user.email, status:'Active' };
        S.view='admin'; S.adminSection='dashboard';
      }
    }catch(e){ /* no valid admin session — fine, show login */ }
  }

  // Support/helpline number shown on the login screen — admin-editable
  // from Settings. Falls back to the original hardcoded number if the
  // app_settings table/RPC doesn't exist yet (e.g. this SQL hasn't been
  // run yet), so nothing breaks on an older database.
  S.appSettings = { support_phone: '+91 98182 79059', support_label: 'Need help? Contact support —', rank_predictor_live: true, signup_live: true, captcha_enabled: true };
  try{
    const { data: appCfg, error: appCfgErr } = await sb.rpc('app_get_settings');
    // app_get_settings() is declared "returns table(...)", which PostgREST
    // always sends back as an ARRAY of rows (even for one row) — reading
    // appCfg.support_phone directly on an array is undefined, which was
    // silently falling back to the hardcoded default every time. Unwrap
    // the first row whichever shape comes back, so this works either way.
    const row = Array.isArray(appCfg) ? appCfg[0] : appCfg;
    if(!appCfgErr && row){
      S.appSettings.support_phone = row.support_phone || S.appSettings.support_phone;
      S.appSettings.support_label = row.support_label || S.appSettings.support_label;
      if(typeof row.rank_predictor_live === 'boolean') S.appSettings.rank_predictor_live = row.rank_predictor_live;
      if(typeof row.signup_live === 'boolean') S.appSettings.signup_live = row.signup_live;
      if(typeof row.captcha_enabled === 'boolean') S.appSettings.captcha_enabled = row.captcha_enabled;
      S.appSettings.sheet_webhook_url = row.sheet_webhook_url || null;
    }
  }catch(e){ /* app_settings not set up yet — keep the fallback above */ }

  S.booted = true;
}

// ---------- AUTH ----------
// "Keep me logged in" — checked (default) uses localStorage, which survives
// closing the browser entirely; unchecked uses sessionStorage, which still
// survives an ordinary page REFRESH (sessionStorage is per-tab, not
// per-request) but is cleared once that tab/window is closed. Either way,
// a refresh never logs the student out — that was the actual complaint;
// the checkbox only controls how long "logged in" lasts beyond that.
function saveStudentSession(payload, remember){
  const json = JSON.stringify(payload);
  if(remember){ localStorage.setItem('fmge_student_session', json); sessionStorage.removeItem('fmge_student_session'); }
  else { sessionStorage.setItem('fmge_student_session', json); localStorage.removeItem('fmge_student_session'); }
}
function loadStudentSession(){
  const raw = localStorage.getItem('fmge_student_session') || sessionStorage.getItem('fmge_student_session');
  if(!raw) return null;
  try{ return JSON.parse(raw); }catch(e){ return null; }
}
function clearStudentSession(){
  localStorage.removeItem('fmge_student_session');
  sessionStorage.removeItem('fmge_student_session');
}
async function doLogin(role, username, password, remember=true){
  if(role==='admin'){
    // Real Supabase Auth login. Only the one admin account created in
    // Supabase (Authentication -> Users) can ever succeed here.
    const { data, error } = await sb.auth.signInWithPassword({ email: username.trim(), password });
    if(error || !data?.user){ toast('Invalid admin email or password','err'); return false; }
    if((data.user.email||'').toLowerCase() !== ADMIN_EMAIL.toLowerCase()){
      await sb.auth.signOut();
      toast('This account is not authorized as admin','err'); return false;
    }
    S.role = 'admin';
    S.currentUser = { id:data.user.id, name:'System Administrator', email:data.user.email, status:'Active' };
    await logAudit('Login','Admin logged in');
    S.view='admin'; S.adminSection='dashboard';
    render();
    return true;
  } else {
    // Student login goes through our secure database function
    // (student_login) — it checks the password hash server-side and never
    // exposes any password. It also hands back a session token used for
    // future secure actions (exam start/save/submit) in later steps.
    const { data, error } = await sb.rpc('student_login', { p_student_id: username.trim(), p_password: password });
    const row = Array.isArray(data) ? data[0] : data;
    if(error || !row){ toast('Invalid Student ID or password','err'); return false; }
    S.role = 'student';
    S.studentToken = row.token;
    S.sessionKickHandled = false; // fresh session — allow a future kick-out to fire again if this one is later replaced
    S.sessionRestoreNetworkIssue = false; // logged in successfully — the earlier "connection issue" banner no longer applies
    S.currentUser = { id: row.id, studentId: row.student_id, name: row.name, status:'Active', examTarget: row.exam_target||'FMGE' };
    saveStudentSession({ token: row.token, id: row.id, studentId: row.student_id, name: row.name, examTarget: row.exam_target||'FMGE' }, remember);
    S.view='student'; S.studentPage='dashboard';
    render();
    return true;
  }
}
async function doLogout(){
  if(S.examTimerHandle) clearInterval(S.examTimerHandle);
  if(S.role==='admin'){ await sb.auth.signOut(); }
  clearStudentSession();
  S.role=null; S.currentUser=null; S.studentToken=null; S.view='login'; S.activeAttempt=null;
  render();
}
// ---------- ONE ACTIVE LOGIN PER STUDENT ----------
// student_login hands back a fresh session token on every login, and the
// same regex below (matched at boot() too) is how we recognize that the
// server has rejected a p_token because it's no longer the current one —
// almost always because this account logged in again elsewhere, which
// server-side rotates the token and silently strands any other open tab
// still using the old one. Without this check, that stranded session would
// just see the SAME generic "Could not save"/"Could not submit" error
// forever with no idea why, and could sit there retrying indefinitely.
function isSessionInvalidError(error){
  // Deliberately NARROW: only phrases that actually mean "this session/
  // token was invalidated" (e.g. server-side rotated by a login elsewhere),
  // never a bare "invalid" — that word alone shows up in all sorts of
  // unrelated Postgres errors (invalid input syntax for type uuid, invalid
  // input value for enum, a missing/renamed RPC's schema-cache error, etc.),
  // and matching on it alone was wrongly treating those as a session kick —
  // clearing the saved session and logging the student out on an ordinary
  // page refresh for a completely unrelated, often transient error.
  const msg = (error && error.message) || '';
  return /session\s*(has\s*)?expired|invalid\s*session|session\s*(is\s*)?invalid|attempt not found/i.test(msg);
}
async function handleSessionKickedOut(){
  if(S.sessionKickHandled) return; // avoid firing this more than once if several in-flight calls fail at the same moment
  S.sessionKickHandled = true;
  if(S.examTimerHandle) clearInterval(S.examTimerHandle);
  stopHeartbeat();
  if(S.pendingSaveTimer){ clearInterval(S.pendingSaveTimer); S.pendingSaveTimer=null; }
  try{ detachExamSecurity(); }catch(e){}
  clearStudentSession();
  S.role=null; S.currentUser=null; S.studentToken=null; S.view='login'; S.activeAttempt=null; S.activeSection=null;
  render();
  toast('You were signed out here because this account logged in on another device.','err');
}

// ---------- animated mesh-network background canvas ----------
// Self-terminating: the loop checks canvas.isConnected each frame and
// simply stops once the login screen (and its canvas) has been replaced
// by another view, so it's always safe to call this again on re-render
// without ever stacking up multiple loops.
let _glCanvasResizeBound = false;
function glLoginStartCanvas(){
  const canvas = document.getElementById('glParticleCanvas');
  if(!canvas) return;
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  const nodes = [];
  for(let i=0;i<50;i++){
    nodes.push({
      x: Math.random()*canvas.width, y: Math.random()*canvas.height,
      vx: (Math.random()-0.5)*0.45, vy: (Math.random()-0.5)*0.45,
      r: Math.random()*1.8+1,
    });
  }
  function tick(){
    if(!canvas.isConnected) return; // login screen left — stop for good
    // Read the live theme every frame (cheap) so toggling updates the
    // particle/line colors immediately, without needing a page reload —
    // blue-ish tones for light mode, the original lighter/whiter tones
    // for dark mode (mirrors the reference's CosmicStar.draw() pattern).
    const isDark = document.documentElement.dataset.theme === 'dark';
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(let i=0;i<nodes.length;i++){
      for(let j=i+1;j<nodes.length;j++){
        const dx=nodes[i].x-nodes[j].x, dy=nodes[i].y-nodes[j].y;
        const dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<115){
          ctx.beginPath();
          ctx.moveTo(nodes[i].x,nodes[i].y);
          ctx.lineTo(nodes[j].x,nodes[j].y);
          ctx.strokeStyle = isDark
            ? `rgba(96,165,250,${0.16*(1-dist/115)})`
            : `rgba(37,99,235,${0.14*(1-dist/115)})`;
          ctx.lineWidth = 0.8;
          ctx.stroke();
        }
      }
    }
    nodes.forEach(n=>{
      n.x+=n.vx; n.y+=n.vy;
      if(n.x<0||n.x>canvas.width) n.vx*=-1;
      if(n.y<0||n.y>canvas.height) n.vy*=-1;
      ctx.beginPath();
      ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
      ctx.fillStyle = isDark ? 'rgba(96,165,250,0.45)' : 'rgba(37,99,235,0.4)';
      ctx.fill();
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  if(!_glCanvasResizeBound){
    window.addEventListener('resize', ()=>{
      const c = document.getElementById('glParticleCanvas');
      if(c){ c.width = window.innerWidth; c.height = window.innerHeight; }
    });
    _glCanvasResizeBound = true;
  }
}

  glLoginStartCanvas();
  mountCaptcha('loginRecaptcha');
  mountCaptcha('signupRecaptcha');

  $('[data-theme-toggle]').onclick = ()=>{
    toggleTheme();
    const btn = $('.gl-theme-toggle-btn');
    const nowDark = document.documentElement.dataset.theme === 'dark';
    if(btn){
      $('.gl-theme-toggle-icon', btn).textContent = nowDark? '☀️' : '🌙';
      $('.gl-theme-toggle-label', btn).textContent = nowDark? 'Light' : 'Dark';
    }
  };

  // ---------- Sign In / Create Account view switch: direct DOM update,
  // no full re-render — keeps the mesh-canvas animation and any in-progress
  // typing running uninterrupted (same pattern as glSwitchRole() below). ----------
  function showView(viewName){
    const signin = $('#signinView'), signup = $('#signupView');
    const title = $('#glHeroTitle'), subtitle = $('#glHeroSubtitle');
    if(viewName==='signup'){
      signin.classList.remove('active'); signup.classList.add('active');
      title.innerHTML = `Create your account.<br>Start preparing<br><span class="gl-gold-text">today.</span>`;
      subtitle.textContent = 'Fill in your details below — it only takes a minute.';
    } else {
      signup.classList.remove('active'); signin.classList.add('active');
      title.innerHTML = `Your exam.<br>Your preparation.<br><span class="gl-gold-text">Your performance.</span>`;
      subtitle.textContent = 'Train in the same rhythm as the real exam, see where you stand nationally, and turn every mistake into momentum.';
    }
  }

  // ---------- role switch: direct DOM update, no full re-render ----------
  // (keeps the mesh-canvas animation running uninterrupted, matches the
  // reference's sliding-tab interaction feel)
  function glSwitchRole(newRole){
    S.loginRole = newRole;
    const admin = newRole==='admin';
    $('#glRoleSlider').style.transform = admin? 'translateX(100%)' : 'translateX(0%)';
    $('#glTabStudent').classList.toggle('active', !admin);
    $('#glTabAdmin').classList.toggle('active', admin);
    $('#glUserIdLabel').textContent = admin? 'Admin Email Address' : 'Student ID / Roll No';
    $('#glUserFieldIcon').textContent = admin? '⚡' : '👤';
    const userInput = $('#loginUser');
    userInput.type = admin? 'email' : 'text';
    userInput.placeholder = admin? 'Enter admin email' : 'Enter your Student ID';
    userInput.value = '';
    $('#glSubmitLabel').textContent = admin? 'Login to Admin Panel' : 'Login & Start Test';
    const fpLink = $('#forgotPwLink'); fpLink.style.visibility = admin? 'hidden' : 'visible';
    $('#glSignupRow').style.display = (!admin && signupOpen)? '' : 'none';
  }
  $('#glTabStudent').onclick = ()=> glSwitchRole('student');
  $('#glTabAdmin').onclick = ()=> glSwitchRole('admin');

  $('#loginForm').onsubmit=async(e)=>{
    e.preventDefault();
    const btn = $('#loginSubmitBtn');
    if(btn.disabled) return; // guard against double-submit while already processing
    const userField = $('#glUserField'), passField = $('#glPassField');
    const userInput = $('#loginUser'), passInput = $('#loginPass');
    userField.classList.remove('gl-shake-field'); passField.classList.remove('gl-shake-field');
    let hasError = false;
    if(!userInput.value.trim()){ userField.classList.add('gl-shake-field'); hasError = true; }
    if(!passInput.value.trim()){ passField.classList.add('gl-shake-field'); hasError = true; }
    if(hasError) return;
    if(!captchaSolved('loginRecaptcha')){ toast('Please complete the CAPTCHA','err'); return; }
    const originalLabel = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = `<span class="gl-spinner"></span> Verifying CAPTCHA…`;
    if(!(await verifyCaptchaOnServer('loginRecaptcha'))){
      toast('CAPTCHA verification failed — please try again','err');
      captchaReset('loginRecaptcha');
      btn.disabled = false; btn.innerHTML = originalLabel;
      return;
    }
    btn.innerHTML = `<span class="gl-spinner"></span> Verifying credentials…`;
    const rememberChk = $('#glRememberMe');
    const ok = await doLogin(S.loginRole||'student', userInput.value, passInput.value, rememberChk? rememberChk.checked : true);
    if(!ok){
      // On success, doLogin() already re-renders the whole page (dashboard),
      // so this reset only matters for the failure path where the login
      // form remains on screen and needs its normal state back.
      captchaReset('loginRecaptcha');
      btn.disabled = false;
      btn.innerHTML = originalLabel;
    }
  };
  $('#forgotPwLink').onclick=(e)=>{ e.preventDefault(); toast('Please contact your administrator to reset your password.',''); };
  $('#loginPwToggle').onclick=()=>{
    const inp=$('#loginPass'); const btn=$('#loginPwToggle');
    const showing = inp.type==='password';
    inp.type = showing? 'text':'password';
    btn.textContent = showing? '🙈':'👁️';
    btn.title = showing? 'Hide password':'Show password';
  };
  const goSignup = $('#goSignupLink'); if(goSignup) goSignup.onclick=(e)=>{ e.preventDefault(); showView('signup'); };
  const goSignin = $('#goSigninLink'); if(goSignin) goSignin.onclick=(e)=>{ e.preventDefault(); showView('signin'); };

  // =========================================================================
  // CREATE ACCOUNT pane — real student_signup RPC, identical validation and
  // params to the original renderSignup(), only the markup/styling changed.
  // =========================================================================
  $('#su_pwToggle').onclick=()=>{
    const inp=$('#su_password'); const btn=$('#su_pwToggle');
    const showing = inp.type==='password';
    inp.type = showing? 'text':'password';
    btn.textContent = showing? '🙈':'👁️';
    btn.title = showing? 'Hide password':'Show password';
  };
  $('#su_examtarget').onchange=(e)=>{
    $('#su_examother_wrap').style.display = e.target.value==='Other' ? '' : 'none';
  };
  // Clear a field's red error state as soon as the user starts fixing it.
  ['su_name','su_mobile','su_countrycode','su_email','su_country','su_admyear','su_examtarget','su_password'].forEach(id=>{
    const el = $('#'+id); if(!el) return;
    el.addEventListener('input', ()=> suClearFieldError(id==='su_countrycode'?'su_mobile':id));
    el.addEventListener('change', ()=> suClearFieldError(id==='su_countrycode'?'su_mobile':id));
  });
  // Custom searchable college dropdown (same approach as the original
  // renderSignup — a plain filtered list we draw/style ourselves, styled
  // here with .gl-autocomplete-list/.gl-autocomplete-item).
  let currentCollegeList = [];
  const collegeInput = $('#su_college');
  const collegeDropdown = $('#su_college_dropdown');
  const closeCollegeDropdown = ()=>{ collegeDropdown.style.display='none'; collegeDropdown.innerHTML=''; };
  const showCollegeMatches = (query)=>{
    const q = (query||'').toLowerCase().trim();
    const matches = (q? currentCollegeList.filter(c=>c.toLowerCase().includes(q)) : currentCollegeList).slice(0,60);
    if(!matches.length){ closeCollegeDropdown(); return; }
    collegeDropdown.innerHTML = matches.map(c=>`<div class="gl-autocomplete-item" data-val="${esc(c)}">${esc(c)}</div>`).join('');
    collegeDropdown.style.display='block';
    // Flip the list above the field instead of below when there isn't enough
    // room underneath inside the form's own scroll container (a fixed
    // max-height:210px list would otherwise get visually cut off by that
    // ancestor's own overflow:auto near the bottom of a long signup form) —
    // an absolutely-positioned child is always clipped by a scrolling
    // ancestor regardless of z-index, so this has to be decided in JS.
    const scrollAncestor = collegeInput.closest('.gl-signup-scroll');
    if(scrollAncestor){
      const inputRect = collegeInput.getBoundingClientRect();
      const ancestorRect = scrollAncestor.getBoundingClientRect();
      const spaceBelow = ancestorRect.bottom - inputRect.bottom;
      const flip = spaceBelow < 220; // roughly the list's own max-height + gap
      collegeDropdown.style.top = flip? 'auto' : 'calc(100% + 4px)';
      collegeDropdown.style.bottom = flip? 'calc(100% + 4px)' : 'auto';
    }
    $$('.gl-autocomplete-item', collegeDropdown).forEach(el=>{
      el.onmousedown = (ev)=>{ ev.preventDefault(); collegeInput.value = el.dataset.val; closeCollegeDropdown(); };
    });
  };
  const refreshCollegeList = ()=>{
    const country = $('#su_country').value;
    currentCollegeList = COLLEGE_DATA[country] || [];
    collegeInput.value = '';
    collegeInput.placeholder = currentCollegeList.length? 'Start typing to search…' : 'Type your college name';
    closeCollegeDropdown();
  };
  refreshCollegeList();
  $('#su_country').onchange = refreshCollegeList;
  collegeInput.oninput = ()=>{ if(currentCollegeList.length) showCollegeMatches(collegeInput.value); };
  collegeInput.onfocus = ()=>{ if(currentCollegeList.length) showCollegeMatches(collegeInput.value); };
  collegeInput.onblur = ()=> setTimeout(closeCollegeDropdown, 120);

  // ---------- field-level error helpers: highlight the wrapper in red and
  // scroll it into view inside the scrollable signup pane, matching the
  // request that a bad field be pointed out directly instead of a toast only. ----------
  function suClearFieldError(id){ const w=$('#'+id+'_wrap'); if(w) w.classList.remove('gl-field-invalid'); }
  function suSetFieldError(id, msg){
    const w=$('#'+id+'_wrap'); if(!w) return;
    w.classList.add('gl-field-invalid');
    const errBox = $('#'+id+'_err');
    if(errBox && msg){ errBox.textContent = msg; errBox.classList.add('show'); }
  }
  function suFocusFirstInvalid(){
    const firstBad = $('.gl-field-invalid', $('#glSignupForm'));
    if(firstBad){
      firstBad.scrollIntoView({behavior:'smooth', block:'center'});
      const el = firstBad.querySelector('input, select'); if(el) el.focus();
    }
  }

  $('#glSignupForm').onsubmit=async(e)=>{
    e.preventDefault();
    const name = $('#su_name').value.trim();
    const cc = $('#su_countrycode').value;
    const mobileRaw = $('#su_mobile').value.trim();
    const email = $('#su_email').value.trim();
    const country = $('#su_country').value;
    const college = $('#su_college').value.trim();
    const admYear = $('#su_admyear').value;
    const examSel = $('#su_examtarget').value;
    const examOther = $('#su_examother').value.trim();
    const password = $('#su_password').value;

    ['su_name','su_mobile','su_email','su_country','su_admyear','su_college','su_examtarget','su_password'].forEach(suClearFieldError);
    $('#su_mobile_err').classList.remove('show'); $('#su_email_err').classList.remove('show');

    let ok = true;
    if(!name){ suSetFieldError('su_name'); ok=false; }
    if(!cc || !validMobile(mobileRaw)){ suSetFieldError('su_mobile','Please select a country code and enter a valid mobile number.'); ok=false; }
    if(!validEmail(email)){ suSetFieldError('su_email','Please enter a valid email address.'); ok=false; }
    if(!country){ suSetFieldError('su_country'); ok=false; }
    if(!college){ suSetFieldError('su_college'); ok=false; }
    if(!admYear){ suSetFieldError('su_admyear'); ok=false; }
    if(!examSel){ suSetFieldError('su_examtarget'); ok=false; }
    if(examSel==='Other' && !examOther){ toast('Please specify which exam you are targeting','err'); ok=false; }
    if(!password || password.length<6){ suSetFieldError('su_password'); toast('Password must be at least 6 characters','err'); ok=false; }
    if(!ok){ suFocusFirstInvalid(); return; }
    if(!captchaSolved('signupRecaptcha')){ toast('Please complete the CAPTCHA','err'); return; }

    const examTarget = examSel==='Other' ? examOther : examSel;
    const fullMobile = `${cc} ${mobileRaw}`;

    const btn = $('#glSignupSubmitBtn');
    const originalLabel = btn.innerHTML;
    btn.disabled = true; btn.innerHTML = `<span class="gl-spinner"></span> Verifying CAPTCHA…`;
    if(!(await verifyCaptchaOnServer('signupRecaptcha'))){
      toast('CAPTCHA verification failed — please try again','err');
      captchaReset('signupRecaptcha');
      btn.disabled = false; btn.innerHTML = originalLabel;
      return;
    }
    btn.innerHTML = `<span class="gl-spinner"></span> Creating account…`;
    const { data, error } = await sb.rpc('student_signup', {
      p_name: name, p_mobile: fullMobile, p_email: email, p_college_name: college,
      p_country: country, p_admission_year: admYear, p_exam_target: examTarget, p_password: password,
    });
    if(error){
      // Real backend error — map it to the field it most likely refers to
      // (e.g. Postgres unique-constraint text on mobile/email) so the user
      // is taken straight to the problem field instead of just a toast.
      toast('Could not create account: '+error.message,'err');
      const msg = (error.message||'').toLowerCase();
      if(msg.includes('mobile') || msg.includes('phone')) suSetFieldError('su_mobile', error.message);
      else if(msg.includes('email')) suSetFieldError('su_email', error.message);
      else if(msg.includes('exam')) suSetFieldError('su_examtarget');
      else if(msg.includes('college')) suSetFieldError('su_college');
      else if(msg.includes('password')) suSetFieldError('su_password');
      else if(msg.includes('name')) suSetFieldError('su_name');
      else suSetFieldError('su_mobile'); // best-effort fallback so something is still highlighted
      suFocusFirstInvalid();
      captchaReset('signupRecaptcha');
      btn.disabled=false; btn.innerHTML=originalLabel;
      return;
    }
    const newStudentId = (Array.isArray(data)? data[0]?.student_id : data?.student_id) || '';

    // Fire-and-forget push to the admin's Google Sheet, if configured —
    // never blocks or fails the sign-up itself if the webhook is slow/unset.
    if(S.appSettings?.sheet_webhook_url){
      try{
        fetch(S.appSettings.sheet_webhook_url, {
          method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'},
          body: JSON.stringify({name, mobile: fullMobile, email, college_name: college, country, admission_year: admYear, exam_target: examTarget, student_id: newStudentId, password, signup_at: new Date().toISOString()}),
        });
      }catch(err){ /* never block sign-up on this */ }
    }

    S.signupResult = { studentId: newStudentId, password, name, examTarget };
    btn.disabled=false; btn.innerHTML=originalLabel;

    // Real celebration modal (real student_id/password/exam — no fake
    // "Dr. {name}" placeholder), matching the reference's party-modal +
    // confetti burst, then back to Sign In with the new ID pre-filled.
    $('#glPartyName').textContent = name || 'Aspirant';
    $('#glPartyId').textContent = newStudentId;
    $('#glPartyPass').textContent = password;
    $('#glPartyExam').textContent = examTarget;
    $('#glPartyModal').classList.add('active');
    if(typeof confetti==='function'){
      // canvas-confetti draws its own canvas at z-index:100 by default, which
      // would sit BEHIND the celebration modal's blurred backdrop (z-index
      // 9999+) and look like the confetti is "stuck behind glass" — force
      // it above the modal so it bursts clearly on top of everything.
      const end = Date.now() + 1400;
      const colors = ['#155eef','#10b981','#f59e0b','#ec4899','#ffffff'];
      (function frame(){
        confetti({ particleCount:5, angle:60, spread:65, origin:{x:0}, colors, zIndex:10050 });
        confetti({ particleCount:5, angle:120, spread:65, origin:{x:1}, colors, zIndex:10050 });
        if(Date.now() < end) requestAnimationFrame(frame);
      })();
    }
  };
  $('#glPartyCloseBtn').onclick = ()=>{
    $('#glPartyModal').classList.remove('active');
    showView('signin');
    glSwitchRole('student');
    const r = S.signupResult || {};
    $('#loginUser').value = r.studentId || '';
  };
}

function validMobile(fullDigits){
  // Reject obviously-fake numbers (all same digit, sequential runs like
  // 12345780, or anything shorter than 7 / longer than 12 digits).
  const d = (fullDigits||'').replace(/\D/g,'');
  if(d.length < 7 || d.length > 12) return false;
  if(/^(\d)\1+$/.test(d)) return false;
  const seq = '01234567890123456789';
  if(seq.includes(d) || seq.includes(d.split('').reverse().join(''))) return false;
  return true;
}
function validEmail(email){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((email||'').trim());
}

// Live IST clock in the admin topbar — started once (guarded), keeps
// ticking across re-renders without stacking intervals.
let _admClockStarted = false;
function admStartLiveClock(){
  if(_admClockStarted) return;
  _admClockStarted = true;
  const tick = ()=>{
    const el = $('#admLiveClock');
    if(!el) return; // shell not mounted right now — timer just skips the DOM write
    const formatted = new Intl.DateTimeFormat('en-IN', {timeZone:'Asia/Kolkata', hour:'2-digit', minute:'2-digit', second:'2-digit', day:'numeric', month:'short'}).format(new Date());
    el.textContent = `${formatted} IST`;
  };
  tick();
  setInterval(tick, 1000);
}
