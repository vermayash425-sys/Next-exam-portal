// ---------- ADMIN: Analytics (real Supabase-backed) ----------
async function adminAnalytics(root){
  root.innerHTML = `<div class="empty-state">Loading…</div>`;
  const { data: tests, error: testsErr } = await sb.rpc('admin_list_tests');
  if(testsErr){ root.innerHTML = `<div class="empty-state">Could not load tests: ${esc(testsErr.message)}</div>`; return; }
  if(!S.resultsTestFilter && tests.length) S.resultsTestFilter = tests[0].id;
  const sel = S.resultsTestFilter;
  const [{ data: results }, { data: qstats, error: qErr }, { data: allStudentsForBatch }] = await Promise.all([
    sel? sb.rpc('admin_list_results', {p_test_id: sel}) : {data:[]},
    sel? sb.rpc('admin_question_analytics', {p_test_id: sel}) : {data:[]},
    sb.rpc('admin_list_students'),
  ]);

  // ---- Per-batch comparison — built entirely from the two existing,
  // already-working admin_list_results / admin_list_students RPCs (join
  // done here in the browser), so no new backend function was needed. ----
  const batchByStudentId = new Map();
  (allStudentsForBatch||[]).forEach(s=>{ batchByStudentId.set(s.student_id, s.batch_name || 'Unassigned'); });
  const batchAgg = {};
  (results||[]).forEach(r=>{
    const bName = batchByStudentId.get(r.student_id) || 'Unassigned';
    if(!batchAgg[bName]) batchAgg[bName] = { attempts:0, scoreSum:0, accSum:0 };
    batchAgg[bName].attempts++;
    batchAgg[bName].scoreSum += Number(r.score||0);
    batchAgg[bName].accSum += Number(r.accuracy||0);
  });
  const batchRows = Object.entries(batchAgg).map(([name,v])=>({
    name, attempts:v.attempts,
    avgScore: +(v.scoreSum/v.attempts).toFixed(2),
    avgAccuracy: +(v.accSum/v.attempts).toFixed(1),
  })).sort((a,b)=>b.avgScore-a.avgScore);

  // ---- Item (difficulty) analysis — reuses the same per-question
  // admin_question_analytics rows already fetched for the subject-wise
  // chart above; just presented per-question instead of aggregated by
  // subject, with a difficulty% and a plain-language flag. (A true
  // top-vs-bottom-scorer discrimination index would need a further new
  // backend aggregation — flagged as a possible future addition — since
  // it needs per-student-per-question correctness, which isn't in this
  // aggregate; what's below is accurate difficulty/skip analysis.) ----
  const itemRows = (qstats||[]).map((q,i)=>{
    const difficulty = q.attempted>0? Math.round((q.correct/q.attempted)*100) : null;
    let flag = '';
    if(difficulty!=null){
      if(difficulty<20) flag = '⚠️ Very hard — check for a possible error';
      else if(difficulty>95 && q.attempted>=5) flag = 'Too easy — not discriminating';
    }
    if(q.skipped > (q.attempted*0.3) && q.attempted>=5) flag = flag? flag+' · High skip rate' : 'High skip rate';
    // Accuracy tier — same idea as a real item-analysis audit: a question
    // almost nobody gets right is usually either genuinely hard or has a
    // wrong/ambiguous answer key, and is worth a human review either way.
    const tier = difficulty==null? null : difficulty<=15? 'critical' : difficulty<=30? 'hard' : 'ok';
    return {
      idx:i+1, subject:q.subject||'General', text:q.text||q.question_text||null,
      attempted:q.attempted, correct:q.correct, skipped:q.skipped,
      avgTime:q.avg_time_sec, difficulty, flag, tier,
    };
  }).sort((a,b)=>(a.difficulty??101)-(b.difficulty??101));
  const iaSubjects = [...new Set(itemRows.map(r=>r.subject))].sort();
  const iaFlaggedCount = itemRows.filter(r=>r.tier==='critical'||r.tier==='hard').length;
  const iaLowestPass = itemRows.length? Math.min(...itemRows.filter(r=>r.difficulty!=null).map(r=>r.difficulty)) : null;

  const scores = (results||[]).map(a=>Number(a.score));
  const avg = scores.length? (scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(2):'0';
  const high = scores.length? Math.max(...scores).toFixed(2):'0';
  const low = scores.length? Math.min(...scores).toFixed(2):'0';

  const subjAgg = {};
  (qstats||[]).forEach(q=>{
    if(!subjAgg[q.subject]) subjAgg[q.subject] = {correct:0,attempted:0};
    subjAgg[q.subject].correct += q.correct;
    subjAgg[q.subject].attempted += q.attempted;
  });
  const subjData = Object.entries(subjAgg).map(([s,v])=>({label:s, value: v.attempted? Math.round(v.correct/v.attempted*100):0, category: subjectCategory(s)})).sort((a,b)=>a.value-b.value);
  const catCounts = { All: subjData.length, Clinical:0, 'Para-Clinical':0, 'Pre-Clinical':0 };
  subjData.forEach(d=>{ catCounts[d.category] = (catCounts[d.category]||0)+1; });

  const list = qstats||[];
  const withAttempts = list.filter(q=>q.attempted>0);
  const mostWrong = [...withAttempts].sort((a,b)=>(a.correct/Math.max(a.attempted,1))-(b.correct/Math.max(b.attempted,1))).slice(0,10);
  const mostSkipped = [...list].sort((a,b)=>b.skipped-a.skipped).slice(0,10);

  root.innerHTML = `
    <div class="table-toolbar">
      <select id="anaTestSel" style="max-width:320px;">${tests.map(x=>`<option value="${x.id}" ${sel===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
    </div>
    <div class="grid-cards">
      <div class="stat-card"><div class="lbl">Total Attempts</div><div class="val">${scores.length}</div></div>
      <div class="stat-card"><div class="lbl">Average Score</div><div class="val">${avg}</div></div>
      <div class="stat-card"><div class="lbl">Highest Score</div><div class="val" style="color:var(--success)">${high}</div></div>
      <div class="stat-card"><div class="lbl">Lowest Score</div><div class="val" style="color:var(--error)">${low}</div></div>
    </div>
    ${subjData.length? `<div class="card pad" style="margin-bottom:16px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;margin-bottom:16px;">
        <div style="display:flex;gap:12px;align-items:flex-start;">
          <div class="dash-stat-icon" style="background:#EFF6FF;">📊</div>
          <div>
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
              <h4 style="font-size:16px;margin:0;">Subject-wise Performance</h4>
              <span class="badge badge-blue" style="font-size:9.5px;letter-spacing:.4px;">LANDSCAPE ORIENTATION</span>
            </div>
            <p style="font-size:12px;color:var(--text2);margin:4px 0 0;">Wide-angle horizontal axis with complete unobstructed subject names and 0–100% vertical scale</p>
          </div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <div class="tabbar" style="margin:0;">
            <button class="tabbtn" id="anaTypeBtnBars">📊 Column Bars</button>
            <button class="tabbtn" id="anaTypeBtnArea">📈 Area Curve</button>
          </div>
          <button class="btn btn-outline btn-sm" id="anaExportPngBtn">⬇ Export PNG</button>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <span style="font-size:12.5px;color:var(--text2);font-weight:600;">Category:</span>
          <div class="subj-filter-tabs" id="anaCatTabs">
            ${['All','Clinical','Para-Clinical','Pre-Clinical'].map(c=>`<button class="subj-filter-tab" data-cat="${c}">${c} (${catCounts[c]||0})</button>`).join('')}
          </div>
        </div>
        <div style="display:flex;gap:8px;">
          <input id="anaChartSearch" placeholder="🔍 Find subject…" style="max-width:180px;">
          <select id="anaChartSort" style="max-width:170px;">
            <option value="score_desc">Score: High → Low</option>
            <option value="score_asc">Score: Low → High</option>
            <option value="alpha">Alphabetical</option>
          </select>
        </div>
      </div>
      <div id="anaChartWrap" class="svg-chart-wrap" style="overflow-x:auto;"></div>
    </div>` : ''}
    <div class="row">
      <div class="card pad" style="flex:1;min-width:320px;">
        <h4 style="font-size:15px;margin-bottom:10px;">🔻 Most incorrectly answered questions</h4>
        <div class="table-wrap"><table><thead><tr><th>Subject</th><th>Accuracy</th><th>Avg time</th></tr></thead>
        <tbody>${mostWrong.length? mostWrong.map(q=>`<tr><td>${esc(q.subject)}</td><td><span class="badge badge-error">${Math.round(q.correct/Math.max(q.attempted,1)*100)}%</span></td><td>${q.avg_time_sec?q.avg_time_sec+'s':'—'}</td></tr>`).join('') : `<tr><td colspan="3"><div class="empty-state">No attempts yet.</div></td></tr>`}</tbody></table></div>
      </div>
      <div class="card pad" style="flex:1;min-width:320px;">
        <h4 style="font-size:15px;margin-bottom:10px;">⏭ Most skipped questions</h4>
        <div class="table-wrap"><table><thead><tr><th>Subject</th><th>Skipped</th></tr></thead>
        <tbody>${mostSkipped.length? mostSkipped.map(q=>`<tr><td>${esc(q.subject)}</td><td>${q.skipped}</td></tr>`).join('') : `<tr><td colspan="2"><div class="empty-state">No attempts yet.</div></td></tr>`}</tbody></table></div>
      </div>
    </div>

    <div class="card pad" style="margin-top:16px;">
      <h4 style="font-size:15px;margin-bottom:4px;">🏫 Batch Comparison</h4>
      <p style="font-size:12px;color:var(--text2);margin-bottom:12px;">Average score/accuracy per batch for this test — spot a weak batch early.</p>
      <div class="table-wrap"><table>
        <thead><tr><th>Batch</th><th>Attempts</th><th>Avg Score</th><th>Avg Accuracy</th></tr></thead>
        <tbody>${batchRows.length? batchRows.map(b=>`<tr><td><b>${esc(b.name)}</b></td><td>${b.attempts}</td><td>${b.avgScore}</td><td>${b.avgAccuracy}%</td></tr>`).join('') : `<tr><td colspan="4"><div class="empty-state">No attempts yet for this test.</div></td></tr>`}</tbody>
      </table></div>
    </div>

    <div class="card ia-head-card" style="margin-top:16px;">
      <div class="ia-head-left">
        <div class="ia-head-icon">🔬</div>
        <div>
          <h4 class="ia-head-title">Item Analysis — Question Difficulty Audit</h4>
          <p class="ia-head-sub">Identify questions with abnormally low student accuracy (≤ 30%) to spot key errors.</p>
        </div>
      </div>
      <div class="ia-head-stats">
        <div class="ia-head-stat"><div class="lbl">Flagged Items</div><div class="val" style="color:var(--error);"><span class="ia-sonar-dot"><span class="ping"></span><span class="dot"></span></span>${iaFlaggedCount} Question${iaFlaggedCount===1?'':'s'}</div></div>
        <div class="ia-head-stat"><div class="lbl">Lowest Pass Rate</div><div class="val" style="color:var(--blue,#155EEF);">${iaLowestPass==null?'—':iaLowestPass+'%'}</div></div>
      </div>
    </div>
    <div class="card pad" style="margin-top:12px;">
      <div class="ia-toolbar">
        <select id="iaExamSel" class="ia-select">${tests.map(x=>`<option value="${x.id}" ${sel===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
        <div class="ia-divider"></div>
        <div class="ia-search-wrap"><span class="ia-search-icon">🔍</span><input id="itemAnaSearch" placeholder="Type question stem or clinical topic…"></div>
        <select id="iaSubjSel" class="ia-select">
          <option value="">All Subjects (${itemRows.length})</option>
          ${iaSubjects.map(s=>`<option value="${esc(s)}">${esc(s)} (${itemRows.filter(r=>r.subject===s).length})</option>`).join('')}
        </select>
        <select id="iaTierSel" class="ia-select">
          <option value="">All Difficulty</option>
          <option value="critical">≤15% (Critical)</option>
          <option value="hard">16%–30% (Hard)</option>
          <option value="ok">&gt;30% (OK)</option>
        </select>
        <div class="ia-divider"></div>
        <div class="ia-view-toggle">
          <button type="button" class="ia-view-btn" id="iaViewCards">▦ Smart Cards</button>
          <button type="button" class="ia-view-btn" id="iaViewTable">☰ Table</button>
        </div>
      </div>
      <div id="iaCardsView" class="ia-cards-grid"></div>
      <div id="iaTableView" class="table-wrap" style="display:none;"><table>
        <thead><tr><th>#</th><th>Subject</th><th>Question</th><th>Attempted</th><th>Correct</th><th>Difficulty</th><th>Flag</th></tr></thead>
        <tbody id="itemAnaBody"></tbody>
      </table></div>
    </div>
  `;
  // Switching exam from EITHER selector (the page-level one here, or the
  // one embedded in the Item Analysis toolbar below) must behave
  // identically — otherwise a subject/tier/search filter left over from
  // the previous exam can silently hide all of a newly-selected exam's
  // questions (they just don't match the stale filter), which looks
  // exactly like "no question data yet" and is very easy to miss.
  const switchAnalyticsExam = (newTestId)=>{
    S.resultsTestFilter = newTestId;
    S.iaSubjFilter=''; S.iaTierFilter=''; S.itemAnaSearch=''; S.iaExpanded=new Set();
    renderAdminSection($('#adminMain'));
  };
  $('#anaTestSel').onchange=(e)=>{ switchAnalyticsExam(e.target.value); };

  if(!S.itemAnaSearch) S.itemAnaSearch = '';
  if(!S.iaSubjFilter) S.iaSubjFilter = '';
  if(!S.iaTierFilter) S.iaTierFilter = '';
  if(!S.iaView) S.iaView = 'cards';
  if(!S.iaExpanded) S.iaExpanded = new Set();

  const getFilteredItemRows = ()=>{
    const q = (S.itemAnaSearch||'').toLowerCase().trim();
    return itemRows.filter(r=>{
      if(S.iaSubjFilter && r.subject!==S.iaSubjFilter) return false;
      if(S.iaTierFilter && r.tier!==S.iaTierFilter) return false;
      if(q && !((r.subject||'').toLowerCase().includes(q) || (r.text||'').toLowerCase().includes(q))) return false;
      return true;
    });
  };

  const renderIaCards = ()=>{
    const wrap = $('#iaCardsView'); if(!wrap) return;
    const rows = getFilteredItemRows();
    wrap.innerHTML = rows.length? rows.map((r,i)=>{
      const expanded = S.iaExpanded.has(r.idx);
      const tierCls = r.tier? `tier-${r.tier}` : 'tier-ok';
      return `<div class="ia-card" style="animation-delay:${Math.min(i*0.04,0.6)}s;">
        <div class="ia-card-top">
          <div><span class="ia-card-subject">${esc(r.subject)}</span><span class="ia-card-idx">#${r.idx}</span></div>
          ${r.difficulty==null? '' : `<span class="ia-pass-badge ${tierCls}">${r.difficulty}% Pass Rate</span>`}
        </div>
        <div class="ia-card-stem ${expanded?'':'clamp'}">${r.text? esc(r.text) : '<span style="color:var(--text3,var(--text2));">No question text available.</span>'}</div>
        ${r.flag? `<div style="font-size:11.5px;color:var(--error);margin-bottom:8px;">${esc(r.flag)}</div>` : ''}
        <div class="ia-card-foot">
          <span>Attempted: <b>${r.attempted}</b> | Correct: <b style="color:var(--success);">${r.correct}</b></span>
          <button type="button" class="ia-review-link" data-ia-review="${r.idx}">${expanded? 'Show Less ↑' : 'Review Key →'}</button>
        </div>
      </div>`;
    }).join('') : `<div class="empty-state ia-empty">No questions match this filter.</div>`;
    $$('[data-ia-review]', wrap).forEach(btn=>btn.onclick=()=>{
      const idx = Number(btn.dataset.iaReview);
      if(S.iaExpanded.has(idx)) S.iaExpanded.delete(idx); else S.iaExpanded.add(idx);
      renderIaCards();
    });
  };

  const renderItemAnaTable = ()=>{
    const body = $('#itemAnaBody'); if(!body) return;
    const rows = getFilteredItemRows();
    body.innerHTML = rows.length? rows.map(r=>`<tr>
      <td>${r.idx}</td>
      <td>${esc(r.subject||'—')}</td>
      <td style="max-width:320px;">${r.text? `<span style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">${esc(r.text)}</span>` : '—'}</td>
      <td>${r.attempted}</td>
      <td>${r.correct}</td>
      <td>${r.difficulty==null? '—' : `<span class="badge ${r.tier==='critical'?'badge-error':r.tier==='hard'?'badge-warning':'badge-success'}">${r.difficulty}%</span>`}</td>
      <td style="font-size:12px;color:var(--text2);">${esc(r.flag||'')}</td>
    </tr>`).join('') : `<tr><td colspan="7"><div class="empty-state">No question data for this test yet.</div></td></tr>`;
  };

  const renderIaAll = ()=>{
    $('#iaCardsView').style.display = S.iaView==='cards'? 'grid' : 'none';
    $('#iaTableView').style.display = S.iaView==='cards'? 'none' : 'block';
    $('#iaViewCards').classList.toggle('active', S.iaView==='cards');
    $('#iaViewTable').classList.toggle('active', S.iaView==='table');
    if(S.iaView==='cards') renderIaCards(); else renderItemAnaTable();
  };
  renderIaAll();
  $('#iaExamSel').onchange=(e)=>{ switchAnalyticsExam(e.target.value); };

  const itemSearchEl = $('#itemAnaSearch');
  if(itemSearchEl){ itemSearchEl.value = S.itemAnaSearch; itemSearchEl.oninput = (e)=>{ S.itemAnaSearch = e.target.value; renderIaAll(); }; }
  $('#iaViewCards').onclick=()=>{ S.iaView='cards'; renderIaAll(); };
  $('#iaViewTable').onclick=()=>{ S.iaView='table'; renderIaAll(); };
  const iaSubjSelEl = $('#iaSubjSel');
  if(iaSubjSelEl){ iaSubjSelEl.value = S.iaSubjFilter; iaSubjSelEl.onchange = (e)=>{ S.iaSubjFilter = e.target.value; renderIaAll(); }; }
  const iaTierSelEl = $('#iaTierSel');
  if(iaTierSelEl){ iaTierSelEl.value = S.iaTierFilter; iaTierSelEl.onchange = (e)=>{ S.iaTierFilter = e.target.value; renderIaAll(); }; }

  if(subjData.length){
    if(!S.anaCatFilter) S.anaCatFilter = 'All';
    if(S.anaChartType!=='area') S.anaChartType = 'bars';
    if(typeof S.anaChartSearch !== 'string') S.anaChartSearch = '';
    if(!S.anaChartSort) S.anaChartSort = 'score_desc';

    const renderAnaChart = ()=>{
      let rows = subjData.filter(d=> S.anaCatFilter==='All' || d.category===S.anaCatFilter);
      if(S.anaChartSearch) rows = rows.filter(d=>d.label.toLowerCase().includes(S.anaChartSearch.toLowerCase()));
      if(S.anaChartSort==='score_desc') rows = [...rows].sort((a,b)=>b.value-a.value);
      else if(S.anaChartSort==='score_asc') rows = [...rows].sort((a,b)=>a.value-b.value);
      else rows = [...rows].sort((a,b)=>a.label.localeCompare(b.label));

      $$('.subj-filter-tab', $('#anaCatTabs')).forEach(b=>b.classList.toggle('active', b.dataset.cat===S.anaCatFilter));
      $('#anaTypeBtnBars').classList.toggle('active', S.anaChartType==='bars');
      $('#anaTypeBtnArea').classList.toggle('active', S.anaChartType==='area');

      const chartWidth = Math.max(700, rows.length*70);
      $('#anaChartWrap').innerHTML = S.anaChartType==='area'
        ? svgAnalyticsAreaChart(rows, {width:chartWidth, height:340, color:'#155EEF'})
        : svgAnalyticsColumnChart(rows, {width:chartWidth, height:340});
    };
    renderAnaChart();

    $$('.subj-filter-tab', $('#anaCatTabs')).forEach(b=>b.onclick=()=>{ S.anaCatFilter=b.dataset.cat; renderAnaChart(); });
    $('#anaTypeBtnBars').onclick=()=>{ S.anaChartType='bars'; renderAnaChart(); };
    $('#anaTypeBtnArea').onclick=()=>{ S.anaChartType='area'; renderAnaChart(); };
    $('#anaChartSearch').oninput=(e)=>{ S.anaChartSearch=e.target.value; renderAnaChart(); };
    $('#anaChartSort').value = S.anaChartSort;
    $('#anaChartSort').onchange=(e)=>{ S.anaChartSort=e.target.value; renderAnaChart(); };
    $('#anaExportPngBtn').onclick=()=>{
      const svgEl = $('#anaChartWrap svg[data-analytics-svg]');
      if(!svgEl){ toast('Nothing to export yet','err'); return; }
      exportSvgAsPng(svgEl, 'subject-wise-performance.png');
      logAudit('Export Analytics Chart','PNG');
    };
  }
}

// ---------- ADMIN: Leaderboard (real Supabase-backed) ----------
async function adminLeaderboard(root){
  root.innerHTML = `<div class="empty-state">Loading…</div>`;
  const { data: tests, error: testsErr } = await sb.rpc('admin_list_tests');
  if(testsErr){ root.innerHTML = `<div class="empty-state">Could not load tests: ${esc(testsErr.message)}</div>`; return; }
  // Own filter (S.leaderboardTestFilter) — this used to share S.resultsTestFilter
  // with the separate Results tab, so switching test in Results silently
  // changed which test Leaderboard was looking at too. That's what made a
  // ranking-enabled test show "Ranking is disabled for this test." — it was
  // actually still showing whatever test the Results tab had last selected.
  if(!S.leaderboardTestFilter && tests.length) S.leaderboardTestFilter = tests[0].id;
  const sel = S.leaderboardTestFilter;
  const t = tests.find(x=>x.id===sel);

  if(t && !t.ranking_enabled){
    root.innerHTML = `<div class="table-toolbar"><select id="lbTestSel" style="max-width:320px;">${tests.map(x=>`<option value="${x.id}" ${sel===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
    <div class="empty-state">Ranking is disabled for this test.</div>`;
    $('#lbTestSel').onchange=(e)=>{S.leaderboardTestFilter=e.target.value; renderAdminSection($('#adminMain'));};
    return;
  }

  const { data: rows, error } = sel? await sb.rpc('admin_leaderboard', {p_test_id: sel}) : {data:[]};
  root.innerHTML = `
    <div class="table-toolbar">
      <select id="lbTestSel" style="max-width:260px;">${tests.map(x=>`<option value="${x.id}" ${sel===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
      <div class="search-box"><input id="lbSearch" placeholder="Search student"></div>
      <button class="btn btn-outline btn-sm" id="exportLbBtn">⬇ Export Leaderboard</button>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Rank</th><th>Student</th><th>Score</th><th>Accuracy</th><th>Correct</th><th>Incorrect</th><th>Time</th><th>Percentile</th></tr></thead>
      <tbody id="lbBody">${error? `<tr><td colspan="8"><div class="empty-state">Could not load: ${esc(error.message)}</div></td></tr>` : leaderboardRows(rows||[])}</tbody>
    </table></div>
  `;
  $('#lbTestSel').onchange=(e)=>{S.leaderboardTestFilter=e.target.value; renderAdminSection($('#adminMain'));};
  $('#lbSearch').oninput=(e)=>{
    const q=e.target.value.toLowerCase();
    const filtered = (rows||[]).filter(r=>r.student_name.toLowerCase().includes(q)||r.student_id.toLowerCase().includes(q));
    $('#lbBody').innerHTML = leaderboardRows(filtered);
  };
  $('#exportLbBtn').onclick=()=>{
    downloadCSV('leaderboard.csv',[['Rank','Student','StudentID','Score','Accuracy','Correct','Incorrect','TimeMin','Percentile'],
      ...(rows||[]).map(r=>[r.rnk,r.student_name,r.student_id,r.score,r.accuracy,r.correct_count,r.incorrect_count,Math.round(r.time_used_sec/60),r.percentile])]);
    logAudit('Export Leaderboard','CSV');
  };
}
function leaderboardRows(rows){
  if(!rows.length) return `<tr><td colspan="8"><div class="empty-state">No submitted attempts for this test yet.</div></td></tr>`;
  return rows.map(r=>`<tr><td><b>#${r.rnk}</b></td><td>${esc(r.student_name)}<br><span style="color:var(--text2);font-size:12px">${esc(r.student_id)}</span></td>
    <td><b>${Number(r.score).toFixed(2)}</b></td><td>${r.accuracy}%</td><td style="color:var(--success)">${r.correct_count}</td><td style="color:var(--error)">${r.incorrect_count}</td>
    <td>${Math.round(r.time_used_sec/60)}m</td><td>${r.percentile}</td></tr>`).join('');
}

// ---------- ADMIN: Sign-Up Students (self-registered) ----------
async function adminSignupStudents(root){
  if(!S.signupSelected) S.signupSelected = new Set();
  root.innerHTML = `<div class="empty-state">Loading…</div>`;
  const { data: rows, error } = await sb.rpc('admin_list_signup_students');
  if(error){ root.innerHTML = `<div class="empty-state">Could not load: ${esc(error.message)} — make sure the Student Sign-Up SQL has been run in Supabase.</div>`; return; }
  const q = (S.signupSearchQ||'').toLowerCase().trim();
  const list = q? (rows||[]).filter(r=>[r.name,r.student_id,r.email,r.mobile,r.college_name].some(v=>(v||'').toLowerCase().includes(q))) : (rows||[]);
  // Row identity for delete calls: prefer a real uuid (id) if the RPC returns one
  // (same shape as admin_list_students), fall back to the human-readable student_id.
  const rowKey = (r)=> r.id || r.student_uuid || r.student_id;
  // Keep selection limited to rows still on screen (e.g. after a search/filter change)
  const visibleKeys = new Set(list.map(rowKey));
  Array.from(S.signupSelected).forEach(k=>{ if(!visibleKeys.has(k)) S.signupSelected.delete(k); });
  const selCount = S.signupSelected.size;

  root.innerHTML = `
    <div class="table-toolbar">
      <div class="search-box" style="max-width:280px;"><input id="signupSearch" placeholder="Search name, ID, email, mobile, college" value="${esc(S.signupSearchQ||'')}"></div>
      <span class="badge badge-blue">${(rows||[]).length} self sign-up${(rows||[]).length===1?'':'s'}</span>
      <button class="btn btn-outline btn-sm" id="exportSignupsBtn">⬇ Export CSV</button>

// Single delete for a self-registered student — reuses the same admin_delete_student
// RPC as the main Students module, so the same safety rule applies: if the student
// has already attempted an exam, the server refuses the delete (use Disable instead),
// keeping exam/result data intact.
window.deleteSignupStudent = async(key, name)=>{
  confirmModal(`Permanently delete "${name}"? This removes the student account entirely — this cannot be undone. If they've already attempted an exam, deletion will be blocked automatically.`, async()=>{
    const { error } = await sb.rpc('admin_delete_student', {p_student_uuid: key});
    if(error){ toast('Could not delete: '+error.message,'err'); return; }
    await logAudit('Delete Sign-Up Student', `${name} (${key})`);
    if(S.signupSelected) S.signupSelected.delete(key);
    toast('Student deleted','ok');
    renderAdminSection($('#adminMain'));
  }, {okLabel:'Delete permanently'});
};
// Approve/Reject for self-registered students — a lighter-weight lever than
// permanent delete. New sign-ups land as Active immediately (there's no
// pending-approval status in the database), so "Reject" here reuses the
// same Active/Inactive status toggle as the main Students module's
// Enable/Disable: an Inactive student cannot log in, but their account and
// any history stays intact — reversible via "Approve" any time, unlike
// Delete. This gives admins a real vet-before-use lever without needing a
// new database status or touching the signup RPC itself.
window.rejectSignupStudent = async(key, name)=>{
  confirmModal(`Reject "${name}"? Their account is disabled and they will not be able to log in, but nothing is deleted — you can Approve them again any time.`, async()=>{
    const { error } = await sb.rpc('admin_update_student', {p_student_uuid: key, p_status:'Inactive'});
    if(error){ toast('Could not reject: '+error.message,'err'); return; }
    await logAudit('Reject Sign-Up Student', `${name} (${key})`);
    toast('Student rejected — account disabled','ok');
    renderAdminSection($('#adminMain'));
  }, {title:'Reject sign-up', okLabel:'Reject'});
};
window.approveSignupStudent = async(key, name)=>{
  const { error } = await sb.rpc('admin_update_student', {p_student_uuid: key, p_status:'Active'});
  if(error){ toast('Could not approve: '+error.message,'err'); return; }
  await logAudit('Approve Sign-Up Student', `${name} (${key})`);
  toast('Student approved — can log in now','ok');
  renderAdminSection($('#adminMain'));
};
async function bulkDeleteSignupStudents(){
  const keys = Array.from(S.signupSelected||[]);
  if(!keys.length) return;
  confirmModal(`Permanently delete ${keys.length} selected student(s)? This cannot be undone. Any student who has already attempted an exam will be skipped automatically.`, async()=>{
    let ok=0, fail=0;
    for(let i=0;i<keys.length;i++){
      const { error } = await sb.rpc('admin_delete_student', {p_student_uuid: keys[i]});
      if(error) fail++; else ok++;
    }
    await logAudit('Bulk Delete Sign-Up Students', `${ok} deleted, ${fail} skipped (had exam attempts or other error)`);
    toast(`${ok} student(s) deleted${fail?`, ${fail} skipped (already have exam attempts)`:''}`, fail? 'err':'ok');
    S.signupSelected.clear();
    renderAdminSection($('#adminMain'));
  }, {okLabel:'Delete permanently'});
}

function openModal(title, bodyHTML, maxWidth=640){
  closeModal();
  const overlay = document.createElement('div');
  overlay.className='modal-overlay'; overlay.id='modalOverlay';
  overlay.innerHTML = `<div class="modal-box" style="max-width:${maxWidth}px;">
    <div class="modal-head"><h3 style="font-size:16px;">${title}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">${bodyHTML}</div>
  </div>`;
  overlay.onclick=(e)=>{ if(e.target===overlay) closeModal(); };
  document.body.appendChild(overlay);
}
window.closeModal = ()=>{ const o=$('#modalOverlay'); if(o) o.remove(); };
window.confirmModal = (message, onConfirm, opts={})=>{
  openModal(opts.title||'Please Confirm', `
    <p style="font-size:14.5px;line-height:1.6;margin-bottom:22px;">${esc(message)}</p>
    <div style="display:flex;gap:10px;justify-content:flex-end;">
      <button class="btn btn-ghost" id="confirmModalCancel">${esc(opts.cancelLabel||'Cancel')}</button>
      <button class="btn ${opts.danger===false?'btn-primary':'btn-danger'}" id="confirmModalOk">${esc(opts.okLabel||'Confirm')}</button>
    </div>
  `, opts.width||460);
  $('#confirmModalCancel').onclick=()=>closeModal();
  $('#confirmModalOk').onclick=async()=>{
    const okBtn = $('#confirmModalOk'), cancelBtn = $('#confirmModalCancel');
    if(okBtn && okBtn.disabled) return; // guard: prevents a second tap firing the action again while it's in flight
    if(okBtn){ okBtn.disabled=true; okBtn.style.opacity='0.6'; okBtn.textContent='Please wait…'; }
    if(cancelBtn) cancelBtn.disabled=true;
    try{
      await onConfirm();
    } finally {
      closeModal();
    }
  };
};
window.S = S; // expose for inline handlers

// =========================================================================
// STUDENT SHELL
// =========================================================================
// ---------- Student area ambient light-particle canvas ----------
// Same self-terminating pattern as the login screen's mesh canvas: the
// loop checks canvas.isConnected each frame and stops on its own once the
// student shell is replaced (e.g. by the exam engine or on logout), so
// it's always safe to call again without ever stacking up extra loops.
let _gldCanvasResizeBound = false;
function gldStartBgCanvas(){
  const canvas = document.getElementById('gldBgCanvas');
  if(!canvas) return;
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  const particles = [];
  for(let i=0;i<40;i++){
    particles.push({
      x: Math.random()*canvas.width, y: Math.random()*canvas.height,
      vx: (Math.random()-0.5)*0.35, vy: (Math.random()-0.5)*0.35,
      r: Math.random()*1.5+0.8,
    });
  }
  function tick(){
    if(!canvas.isConnected) return; // student shell left — stop for good
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(let i=0;i<particles.length;i++){
      for(let j=i+1;j<particles.length;j++){
        const dx=particles[i].x-particles[j].x, dy=particles[i].y-particles[j].y;
        const dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<120){
          ctx.beginPath();
          ctx.moveTo(particles[i].x,particles[i].y);
          ctx.lineTo(particles[j].x,particles[j].y);
          ctx.strokeStyle = `rgba(21,94,239,${0.08*(1-dist/120)})`;
          ctx.lineWidth = 0.8;
          ctx.stroke();
        }
      }
    }
    particles.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0||p.x>canvas.width) p.vx*=-1;
      if(p.y<0||p.y>canvas.height) p.vy*=-1;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle = 'rgba(21,94,239,0.22)';
      ctx.fill();
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  if(!_gldCanvasResizeBound){
    window.addEventListener('resize', ()=>{
      const c = document.getElementById('gldBgCanvas');
      if(c){ c.width = window.innerWidth; c.height = window.innerHeight; }
    });
    _gldCanvasResizeBound = true;
  }
}

// Shared by both the student and admin shells — fetches whatever the admin
// has currently posted (if anything) and drops it into a #announcementSlot
// placeholder already present in that shell's markup. Fails silently if the
// backing table/RPC isn't set up yet, so it's a no-op until that migration
// is applied — never a broken page.
// This runs on effectively every page navigation (both shells call it on
// every render), so the actual RPC result is cached for a short window —
// a student clicking through Dashboard → Analytics → Error Book a few
// times in a row reuses one fetch instead of firing a new request each
// time, while a genuinely new announcement still shows up within ~20s.
let _announcementCache = null; // {ann, at}
async function mountAnnouncementBanner(){
  const slot = $('#announcementSlot');
  if(!slot) return;
  let ann = null;
  const fresh = _announcementCache && (Date.now()-_announcementCache.at < 20000);
  if(fresh){
    ann = _announcementCache.ann;
  } else {
    try{ const { data } = await sb.rpc('app_get_active_announcement'); ann = data||null; }catch(e){ /* not set up yet */ }
    _announcementCache = { ann, at: Date.now() };
  }
  if(!ann || !ann.message || S.announcementDismissedId===ann.id){ slot.innerHTML=''; return; }
  const level = ann.level || 'info';
  const icon = level==='critical'?'🚨':level==='warning'?'⚠️':'📢';
  slot.innerHTML = `<div class="app-announcement-banner level-${esc(level)}">
    <span>${icon}</span><span class="ann-msg">${esc(ann.message)}</span>
    <button type="button" class="ann-close" id="appAnnouncementClose" title="Dismiss">✕</button>
  </div>`;
  $('#appAnnouncementClose').onclick=()=>{ S.announcementDismissedId = ann.id; slot.innerHTML=''; };
}

// A bookmark is a lightweight "revise this later" flag a student can put on
// ANY question while reviewing a result or the Error Book — independent of
// whether they got it right, and independent of the in-exam "Mark for
// Review" flag (which only lives for the duration of that one attempt).
// The bookmark stores a small snapshot of the question itself at the
// moment it's flagged, so this page never needs to re-fetch question
// detail from anywhere else.
window.toggleBookmark = async(q, btnEl)=>{
  if(!S.currentUser?.id) return;
  const alreadyOn = btnEl?.classList.contains('active');
  if(btnEl){ btnEl.disabled = true; }
  const { data, error } = await sb.rpc('student_toggle_bookmark', {
    p_student_id: S.currentUser.id, p_question_id: q.question_id,
    p_question_text: q.text, p_subject: q.subject,
    p_option_a: q.option_a||null, p_option_b: q.option_b||null,
    p_option_c: q.option_c||null, p_option_d: q.option_d||null,
    p_correct_letter: q.correct||null, p_explanation: q.explanation||null,
    p_exam_code: q.exam_code||null,
  });
  if(btnEl) btnEl.disabled = false;
  if(error){
    toast('Could not update Marked for Review — this feature may not be set up on the server yet.','err');
    return;
  }
  if(btnEl){
    btnEl.classList.toggle('active', !!data);
    btnEl.textContent = data? '🚩 Marked' : '🚩 Mark for Review';
  }
  toast(data? 'Marked for review' : 'Removed from Marked for Review', 'ok');
  // On the Marked for Review page itself, removing one should drop it from
  // the visible list right away rather than leaving a stale card.
  if(!data && S.studentPage==='bookmarks'){ studentBookmarks($('#stuContent')); }
};

  // any ONE of their tests in this exam category — never a blend of
  // more than one.
  const testPickerHtml = testsList.length>1? `
    <div class="gla-test-picker">
      <label>Showing Subject-Wise Breakdown For</label>
      <select class="gla-select" id="analyticsTestPicker">
        ${testsList.map(t=>`<option value="${t.id}" ${t.id===S.analyticsTestId?'selected':''}>${esc(t.name)} — ${new Date(t.submitted_at).toLocaleDateString()}</option>`).join('')}
      </select>
    </div>` : '';

  const correctTotal = subj.reduce((a,s)=>a+s.correct,0);
  const wrongTotal = subj.reduce((a,s)=>a+s.wrong,0);
  const dnpTotal = subj.reduce((a,s)=>a+s.dnp,0);
  const weakest = subj.slice(0,3);
  const strongest = [...subj].reverse().slice(0,3);
  // Same red/amber/green scale used across the portal's analytics: <10%
  // critical, <30% needs work, >=30% solid.
  const scoreColor = pct => pct>=30? 'var(--gld-success)' : pct>=10? 'var(--gld-accent)' : 'var(--gld-danger)';

  // "Am I improving?" trend — reuses the same attempts_trend array the
  // backend already sends (previously only checked for emptiness), plotted
  // with the existing svgAnalyticsAreaChart helper. Field names are read
  // defensively since this is the first time this array's item shape is
  // actually consumed anywhere in the app.
  const trendPoints = trend.map((t,i)=>{
    const label = t.test_name || t.name || t.title ||
      (t.submitted_at? new Date(t.submitted_at).toLocaleDateString('en-IN',{day:'2-digit',month:'short'}) : `Test ${i+1}`);
    let value = t.accuracy ?? t.accuracy_pct ?? t.correct_pct;
    if(value==null && t.score!=null && t.total_marks) value = Math.round((t.score/t.total_marks)*100);
    if(value==null && t.score!=null && t.total) value = Math.round((t.score/t.total)*100);
    value = value==null? 0 : Math.max(0, Math.min(100, Math.round(Number(value))));
    return { label, value };
  });

  root.innerHTML = `
    <button class="btn btn-ghost btn-sm" style="margin-bottom:14px;" onclick="S.studentPage='dashboard';render();">← Back to Dashboard</button>
    <div class="gla-page-head">
      <div><div class="gla-eyebrow">📈 PERFORMANCE OVER TIME</div><h1 class="gla-title">My Analytics</h1></div>

    <div class="gla-kpi-grid">

      <div class="gla-kpi-card" style="animation-delay:.09s;"><div class="gla-kpi-icon" style="background:#eff6ff;color:#3b82f6;">📊</div><div><div class="gla-kpi-val">${o.avg_score}</div><div class="gla-kpi-lbl">Average Score</div></div></div>
      <div class="gla-kpi-card" style="animation-delay:.13s;"><div class="gla-kpi-icon" style="background:var(--gld-accent-light);color:var(--gld-accent);">🎯</div><div><div class="gla-kpi-val" style="color:var(--gld-accent);">${o.avg_accuracy}%</div><div class="gla-kpi-lbl">Average Accuracy</div></div></div>
      <div class="gla-kpi-card" style="animation-delay:.17s;"><div class="gla-kpi-icon" style="background:var(--gld-success-light);color:var(--gld-success);">🏆</div><div><div class="gla-kpi-val" style="color:var(--gld-success);">${o.best_score}</div><div class="gla-kpi-lbl">Best Score</div></div></div>
    </div>

    ${trendPoints.length>1? `<div class="gla-breakdown-card" style="margin-bottom:18px;">
      <p style="font-size:11.5px;color:var(--gld-text-muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:6px;">📈 Score Trend — Am I Improving?</p>
      <p style="font-size:12px;color:var(--gld-text-muted);margin-bottom:14px;">Each point is one submitted test, in order — a rising line means you're improving over time.</p>
      ${svgAnalyticsAreaChart(trendPoints, {width:900, height:240, color:'#155EEF'})}
    </div>` : ''}

    <div class="gla-breakdown-card">
      ${testPickerHtml}
      <p style="font-size:11.5px;color:var(--gld-text-muted);margin-bottom:${testPickerHtml?'0':'14px'};">${selectedTest? `Just this test: <b style="color:var(--gld-text);">${esc(selectedTest.name)}</b>` : 'Your most recent test'}</p>
      <div class="gla-breakdown-body">
        ${svgAnalyticsDonut(correctTotal, wrongTotal, dnpTotal, o.avg_accuracy+'%', 'Avg Accuracy')}
        <div class="gla-legend-list">
          <div class="gla-legend-row"><div class="gla-legend-name"><span class="gla-dot-chip" style="background:var(--gld-success);"></span><span>Correct</span></div><b style="color:var(--gld-success);">${correctTotal}</b></div>
          <div class="gla-legend-row"><div class="gla-legend-name"><span class="gla-dot-chip" style="background:var(--gld-danger);"></span><span>Wrong</span></div><b style="color:var(--gld-danger);">${wrongTotal}</b></div>
          <div class="gla-legend-row"><div class="gla-legend-name"><span class="gla-dot-chip" style="background:#94a3b8;"></span><span>Not Attempted</span></div><b style="color:var(--gld-text-sub);">${dnpTotal}</b></div>
        </div>
      </div>
    </div>

    ${subj.length? `<div class="gla-subject-section">
      <div class="gla-toolbar-row">
        <div class="gla-filter-pills">
          <button class="gla-pill-btn active" data-filter="all">All (${subj.length})</button>
          <button class="gla-pill-btn" data-filter="critical">Critical (&lt;10%)</button>
          <button class="gla-pill-btn" data-filter="strongest">Strongest (&gt;30%)</button>
        </div>
        <div class="gla-search-box"><span class="gla-search-icon">🔍</span><input id="subjSearchInput" placeholder="Filter subjects…"></div>
      </div>
      <p style="font-size:12.5px;color:var(--gld-text-muted);margin-bottom:16px;"><b>Correct %</b> is out of every question you've ever seen in that subject across all your tests — not just the ones you attempted.</p>
      <div class="gla-subject-list" id="subjTableWrap"></div>
    </div>

    <div class="gla-insights-grid">
      <div class="gla-insight-card gla-card-focus">
        <div class="gla-insight-head"><div class="gla-insight-title focus"><span>🔻</span><span>Focus on these first</span></div><span class="gla-micro-badge gla-badge-revision">NEEDS REVISION</span></div>
        <div class="gla-insight-items">
          ${weakest.map(s=>{ const m = subjectIconMeta(s.subject); return `
          <div class="gla-insight-item">
            <div class="gla-item-top-row"><div class="gla-item-name"><span class="gla-item-icon">${m.icon}</span><span>${esc(s.subject)}</span></div><span class="gla-item-pct gla-pct-danger">${s.correct_pct}%</span></div>
            <div class="gla-glow-track"><div class="gla-glow-fill gla-fill-danger" data-target="${s.correct_pct}%"></div></div>
          </div>`; }).join('')}
        </div>
      </div>
      <div class="gla-insight-card gla-card-strong">
        <div class="gla-insight-head"><div class="gla-insight-title strong"><span>💪</span><span>Your strongest subjects</span></div><span class="gla-micro-badge gla-badge-mastery">HIGH MASTERY</span></div>
        <div class="gla-insight-items">
          ${strongest.map(s=>{ const m = subjectIconMeta(s.subject); return `
          <div class="gla-insight-item">
            <div class="gla-item-top-row"><div class="gla-item-name"><span class="gla-item-icon">${m.icon}</span><span>${esc(s.subject)}</span></div><span class="gla-item-pct gla-pct-success">${s.correct_pct}%</span></div>
            <div class="gla-glow-track"><div class="gla-glow-fill gla-fill-success" data-target="${s.correct_pct}%"></div></div>
          </div>`; }).join('')}
        </div>
      </div>
    </div>

    <div class="welcome-band" style="margin-top:18px;">
      <h3 style="color:#fff;font-size:16px;">What should I do next?</h3>
      <p>${weakest[0]? `Your weakest subject right now is <b>${esc(weakest[0].subject)}</b> at ${weakest[0].correct_pct}% correct overall. Spend your next revision session focused there before your next test.` : 'Keep taking tests to build a clearer picture of your strengths and weak areas.'}</p>
    </div>` : ''}
  `;
  // Trigger the glowing progress-bar fill-in on the two insight cards,
  // matching the reference's post-render animation.
  setTimeout(()=>{ $$('.gla-glow-fill').forEach(f=>{ f.style.width = f.dataset.target; }); }, 150);

  $$('[data-examtab]').forEach(b=>b.onclick=()=>{ S.analyticsExam=b.dataset.examtab; S.analyticsTestId=null; studentAnalytics(root); });
  const testPicker = $('#analyticsTestPicker');
  if(testPicker) testPicker.onchange = ()=>{ S.analyticsTestId = testPicker.value; studentAnalytics(root); };

  if(subj.length){
    if(!S.subjFilter) S.subjFilter = 'all';
    if(!S.subjSearch) S.subjSearch = '';
    const renderSubjTable = ()=>{
      let rows = subj;
      if(S.subjFilter==='critical') rows = rows.filter(s=>s.correct_pct<10);
      else if(S.subjFilter==='strongest') rows = rows.filter(s=>s.correct_pct>30);
      if(S.subjSearch) rows = rows.filter(s=>s.subject.toLowerCase().includes(S.subjSearch.toLowerCase()));
      const wrap = $('#subjTableWrap');
      if(!wrap) return;
      wrap.innerHTML = rows.length? rows.map(s=>{
        const color = scoreColor(s.correct_pct);
        const m = subjectIconMeta(s.subject);
        return `<div class="gla-subject-row" style="--gla-ind:${color};--gla-abg:${m.bg};--gla-acolor:${m.color};">
          <div class="gla-subj-main">
            <div class="gla-subj-avatar">${m.icon}</div>
            <div class="gla-subj-name"><h4>${esc(s.subject)}</h4><span>${s.total} Questions Seen</span></div>
          </div>
          <div class="gla-metrics-cluster">
            <span class="gla-stat-chip gla-chip-c">✓ ${s.correct} Correct</span>
            <span class="gla-stat-chip gla-chip-w">✕ ${s.wrong} Wrong</span>
            <span class="gla-stat-chip gla-chip-u">${s.dnp} Left</span>
            <span class="gla-stat-chip gla-chip-acc">Acc: ${s.accuracy===null?'N/A':s.accuracy+'%'}</span>
          </div>
          <div class="gla-score-box">
            <div class="gla-score-label-row"><span style="font-size:11px;font-weight:700;color:var(--gld-text-muted);text-transform:uppercase;">Score</span><span class="gla-score-pct">${s.correct_pct}%</span></div>
            <div class="gla-score-track"><div class="gla-score-fill" style="width:${s.correct_pct}%;"></div></div>
          </div>
        </div>`;
      }).join('') : `<div class="empty-state">No subjects match this filter.</div>`;
    };
    renderSubjTable();
    $$('.gla-pill-btn').forEach(btn=>btn.onclick=()=>{
      S.subjFilter = btn.dataset.filter;
      $$('.gla-pill-btn').forEach(b=>b.classList.toggle('active', b===btn));
      renderSubjTable();
    });
    const searchInput = $('#subjSearchInput');
    if(searchInput){ searchInput.value = S.subjSearch; searchInput.oninput = (e)=>{ S.subjSearch = e.target.value; renderSubjTable(); }; }
  }
}

function sectionStartable(sections, idx){
  const sec = sections[idx];
  if(sec.my_status==='completed') return {startable:false, state:'completed'};
  if(sec.my_status==='active') return {startable:true, state:'resume'};
  if(idx===0) return {startable:true, state:'start'};
  return sections[idx-1].my_status==='completed'? {startable:true,state:'start'} : {startable:false, state:'locked'};
}

async function studentDashboard(root){
  root.innerHTML = `<div class="empty-state">Loading your dashboard…</div>`;
  const [{ data, error }, { data: bookmarkIds }] = await Promise.all([
    sb.rpc('student_get_dashboard', {p_token: S.studentToken}),
    sb.rpc('student_list_bookmarked_question_ids', {p_student_id: S.currentUser.id}),
  ]);
  const bookmarkCount = (bookmarkIds||[]).length;
  if(error){
    if(isSessionInvalidError(error)){ handleSessionKickedOut(); return; }
    root.innerHTML = `<div class="empty-state">Could not load dashboard: ${esc(error.message)}<br><button class="btn btn-outline btn-sm" style="margin-top:10px;" onclick="doLogout()">Log in again</button></div>`;
    return;
  }
  mountMedMindFab();
  const tests = (data.tests||[]);
  const firstName = esc(S.currentUser.name.split(' ')[0]);
  const testsCompleted = tests.filter(t=>t.attempt_status==='submitted').length;
  // student_get_analytics is scoped PER EXAM (same as the Analytics page's
  // FMGE / NEET PG tabs) — it always needs p_exam_code, which this call was
  // never sending. That made the RPC fail every time, and the error was
  // never checked, so "Average accuracy" silently showed "—" forever no
  // matter how many tests were completed. Fixed by picking whichever exam
  // the student has the most submitted tests in (falls back to FMGE for a
  // brand-new student with nothing submitted yet), and by actually checking
  // this call's error instead of discarding it.
  const examCodeCounts = {};
  tests.filter(t=>t.attempt_status==='submitted').forEach(t=>{ examCodeCounts[t.exam_code] = (examCodeCounts[t.exam_code]||0) + 1; });
  const primaryExamCode = Object.keys(examCodeCounts).sort((a,b)=>examCodeCounts[b]-examCodeCounts[a])[0] || 'FMGE';
  const { data: analyticsData, error: analyticsErr } = await sb.rpc('student_get_analytics', {p_token: S.studentToken, p_exam_code: primaryExamCode, p_test_id: null});
  if(analyticsErr && isSessionInvalidError(analyticsErr)){ handleSessionKickedOut(); return; }
  const avgAccuracy = analyticsData?.overall?.avg_accuracy;
  const bestRanks = data.best_ranks || [];
  const bestRankFor = code => bestRanks.find(r=>r.exam_code===code)?.rank;
  const hour = new Date().getHours();
  const greeting = hour<12?'Good morning':hour<17?'Good afternoon':'Good evening';
  const nextLive = tests.find(t=>t.status==='live' && t.attempt_status!=='submitted');
  const heroSub = nextLive? `Your ${esc(nextLive.name)} is ready. Keep the momentum going.` : `Check back once your admin publishes your next test.`;
  const bestRankOverall = bestRanks.length? Math.min(...bestRanks.map(r=>r.rank)) : null;

  function renderTestCard(t, idx){
      const finished = t.attempt_status==='submitted';
      const noAttemptsLeft = !t.has_in_progress && t.attempts_used >= t.max_attempts;
      const now = Date.now();
      const startAt = t.start_at? new Date(t.start_at) : null;
      const endAt = t.end_at? new Date(t.end_at) : null;
      const notStartedYet = startAt && now < startAt.getTime();
      const windowClosed = endAt && now > endAt.getTime();
      const totalQAll = (t.parts||[]).reduce((a,p)=>a+(p.sections||[]).reduce((b,s)=>b+s.question_count,0),0);
      const totalMinAll = (t.parts||[]).reduce((a,p)=>a+(p.sections||[]).reduce((b,s)=>b+s.duration_min,0),0);
      const doneQAll = (t.parts||[]).reduce((a,p)=>{
        const states=(p.sections||[]).map((s,i)=>({s,st:sectionStartable(p.sections,i)}));
        return a+states.filter(x=>x.st.state==='completed').reduce((b,x)=>b+x.s.question_count,0);
      },0);
      const overallPct = totalQAll? Math.round(doneQAll/totalQAll*100) : 0;
      // Find the current "next action" part/section across the whole test, for the footer line (e.g. "Section B is ready")
      let currentPart=null, currentNext=null, currentStates=null;
      for(const p of (t.parts||[])){
        const states = (p.sections||[]).map((s,i)=>({s, st: sectionStartable(p.sections, i)}));
        const next = states.find(x=>x.st.state==='start' || x.st.state==='resume');
        if(next && p.status==='live' && !notStartedYet && !windowClosed && !noAttemptsLeft){ currentPart=p; currentNext=next; currentStates=states; break; }
      }
      return `
      <div class="gld-test-box" style="animation-delay:${.18+idx*.05}s;">
        <div class="gld-test-strip-accent" style="background:${t.status==='live'?'linear-gradient(180deg,var(--gld-primary),#38bdf8)':'transparent'};"></div>
        <div class="gld-test-content-inner">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;">
            <div>
              <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
                <span class="gld-badge-chip gld-badge-blue">${t.exam_code}</span>
                ${t.status==='live'?'<span class="gld-badge-chip gld-badge-green"><span class="gld-live-dot-glow"></span> LIVE</span>':finished?'<span class="gld-badge-chip gld-badge-navy">✓ COMPLETED</span>':''}
              </div>
              <h3 class="gld-test-name">${esc(t.name)}</h3>
              <p class="gld-test-desc">${esc(t.description||'')}</p>
            </div>
            <div style="text-align:right;">
              ${finished? (t.ranking_enabled? `<div style="font-size:11px;color:var(--gld-text-muted);font-weight:700;">🏆 National rank</div><div style="font-size:20px;font-weight:800;font-family:'Outfit';">—</div>` : '') :
                `<div style="font-size:11px;color:var(--gld-text-muted);font-weight:700;text-transform:uppercase;letter-spacing:.3px;">Progress</div><div style="font-size:26px;font-weight:800;color:var(--gld-primary);font-family:'Outfit';">${overallPct}%</div>`}
            </div>
          </div>
          ${!finished? `
          <div class="gld-test-progress-track"><div class="gld-test-progress-fill" style="width:${overallPct}%;"></div></div>
          <div class="gld-test-meta-row">
            ${totalQAll?`<span>❓ ${totalQAll} questions</span>`:''}
            ${totalMinAll?`<span>🕐 ${Math.round(totalMinAll/60*10)/10} hours</span>`:''}
            <span>🛡 Proctored</span>
          </div>`:''}
          ${finished && !noAttemptsLeft && !t.has_in_progress? `<div class="gld-alert-banner" style="background:var(--gld-success-light);border-color:#a9e6c4;color:#0b6b39;">✅ You've submitted this test, but you still have ${t.max_attempts - t.attempts_used} attempt(s) left — start again below whenever you're ready.</div>`:''}
          ${noAttemptsLeft? `<div class="gld-alert-banner"><span>⚠️</span> You've used all ${t.max_attempts} attempt(s) for this test.</div>`:''}
          <div class="gld-test-bottom-bar">
            <div>
              ${currentPart? `
                <div class="gld-eyebrow" style="font-size:11px;margin-bottom:0;">${esc(currentPart.name).toUpperCase()}</div>
                <div style="font-size:15px;font-weight:800;margin-top:2px;">${currentNext.st.state==='resume'?'Continue where you left off':esc(currentNext.s.name)+' is ready'}</div>
                <div style="font-size:12px;color:var(--gld-text-muted);margin-top:2px;">${currentStates.filter(x=>x.st.state==='completed').length}/${currentStates.length} sections complete</div>
              ` : finished? `
                <div class="gld-submission-state"><span>✅</span><div><div>Test submitted</div><span style="font-size:12px;color:var(--gld-text-muted);font-weight:500;">${noAttemptsLeft? 'All attempts used' : 'No further section is currently open'}</span></div></div>
              ` : notStartedYet? `<div style="font-size:13px;color:var(--gld-accent);font-weight:700;">Opens ${startAt.toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</div>`
                : windowClosed? `<div style="font-size:13px;color:var(--gld-danger);font-weight:700;">Test window closed</div>`
                : `<div style="font-size:13px;color:var(--gld-text-muted);">${overallPct>=100?'All parts complete':'Not yet open'}</div>`}
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              ${finished? `<button class="gld-btn gld-btn-light-outline" onclick="viewMyResult('${t.attempt_id}','${t.exam_code}')">View result ›</button>`:''}
              ${currentPart? (currentNext.st.state==='resume'?
                  `<button class="gld-btn gld-btn-primary-gradient" onclick="startSection('${currentNext.s.id}', '${t.id}', '${currentPart.id}')">Continue exam ›</button>`
                  : `<button class="gld-btn gld-btn-primary-gradient" onclick='goToSectionInstructions(${JSON.stringify(currentNext.s.id)}, ${JSON.stringify(t.name)}, ${JSON.stringify(t.instructions||'')}, ${JSON.stringify(t.id)}, ${JSON.stringify(currentPart.id)})'>${finished?'Start new attempt':'Start exam'} ›</button>`)
              : ''}
            </div>
          </div>
          ${!currentPart && !finished && (t.parts||[]).length>1? `<div style="margin-top:14px;display:flex;gap:6px;flex-wrap:wrap;">
            ${(t.parts||[]).map(p=>`<span class="gld-badge-chip ${p.status==='live'?'gld-badge-green':'gld-badge-navy'}" style="font-size:11px;">${esc(p.name)}: ${p.status==='live'?'LIVE':p.status==='closed'?'CLOSED':'LOCKED'}</span>`).join('')}
          </div>`:''}
        </div>
      </div>`;
  }

  function renderExamGroup(examCode, label, list){
    if(!list.length) return '';
    return `
      <div class="gld-section-title-row" style="margin-top:20px;">
        <div><span class="gld-badge-chip gld-badge-blue">${label}</span></div>
        ${bestRankFor(examCode)? `<span style="font-size:12px;color:var(--gld-accent);font-weight:700;">🏆 Best rank: #${bestRankFor(examCode)}</span>`:''}
      </div>
      ${list.map((t,idx)=>renderTestCard(t,idx)).join('')}
    `;
  }
  const fmgeTests = tests.filter(t=>t.exam_code==='FMGE');
  const neetTests = tests.filter(t=>t.exam_code==='NEET_PG');
  const otherTests = tests.filter(t=>t.exam_code!=='FMGE' && t.exam_code!=='NEET_PG');

  root.innerHTML = `
    <div class="gld-hero-banner">
      <div class="gld-badge-pill"><span class="gld-status-pulse"></span> Student Dashboard</div>
      <h2>${greeting}, ${firstName}.</h2>
      <p>${heroSub}</p>
    </div>

window.startSection = async(sectionId, testId, partId, declared)=>{
  if(S.startingSection) return; // guard against double-click firing this twice before the first request returns
  S.startingSection = true;
  const { data, error } = await sb.rpc('student_start_section', {p_token: S.studentToken, p_section_id: sectionId});
  S.startingSection = false;
  if(error){
    if(isSessionInvalidError(error)){ handleSessionKickedOut(); return; }
    // A near-simultaneous double-click can occasionally lose a race to the
    // database's own duplicate-prevention constraint; treat that specific
    // case as harmless (the other click already got the student in).
    if(error.message && error.message.includes('duplicate key value')){
      toast('Already starting this section…','');
      return;
    }
    toast(error.message,'err'); render(); return;
  }
  // Remember which test+part this section belongs to, so that when this
  // section ends we can check whether the NEXT section in the same part is
  // ready to go straight away — real exams (FMGE/NEET PG) flow section to
  // section within a part with no dashboard/instructions detour in between.
  if(testId) S.activeTestId = testId;
  if(partId) S.activePartId = partId;
  S.activeSection = {
    attemptId: data.attempt_id, attemptSectionId: data.attempt_section_id,
    sectionName: data.section_name, serverEndAt: data.server_end_at,
    fullscreenRequired: !!data.fullscreen_required, disableCopyPaste: !!data.disable_copy_paste,
    tabSwitchLimit: data.tab_switch_limit || 3, tabSwitchCount: 0, fullscreenExitCount: 0,
    questions: data.questions, currentIndex: 0,
    responses: {}, questionShownAt: Date.now(),
  };
  data.questions.forEach((q,i)=>{
    S.activeSection.responses[q.question_id] = { selected: q.selected_option, marked: !!q.is_marked, visited: i===0 };
  });
  // Fire-and-forget: record the integrity declaration on the same audit
  // trail as tab-switch/fullscreen events, so admins reviewing an attempt
  // can see the student explicitly agreed not to use unfair means. Never
  // blocks starting the exam even if this log call itself fails.
  if(declared){
    logActivityWithRetry({p_token:S.studentToken, p_attempt_id:data.attempt_id, p_event_type:'integrity_declared'}).catch(()=>{});
    logViolationDeviceInfo(data.attempt_id, 'integrity_declared');
  }
  S.pendingSection = null;
  S.navBusy = false;
  S.submittingSection = false;
  S.paletteOpen = false;
  S.studentPage='exam';
  render();
};

// EXAM ENGINE — one Section at a time, server-authoritative timer
// =========================================================================
async function renderExamEngine(app){
  // The MedMind AI fab attaches itself to document.body (not inside `app`),
  // specifically so it survives normal page-to-page re-renders. That means
  // it was NOT being removed when navigating straight from Dashboard/
  // Analytics into a live exam — it visually sat on top of the toolbar
  // buttons, and worse, its chat was still functionally reachable during a
  // timed, proctored attempt. An exam screen must never offer it.
  unmountMedMindFab();
  const sec = S.activeSection;
  if(!sec){ S.studentPage='dashboard'; return renderStudentShell(app); }
  const remaining = Math.max(0,(new Date(sec.serverEndAt).getTime()-Date.now())/1000);
  if(remaining<=0){ await handleSectionSubmit(true, 'auto_timeout'); return; }
  // Baseline for the pacing indicator: time remaining the first moment this
  // section is rendered in this browser session. For a student who starts
  // and stays, that's the true full section duration; for one who resumes
  // after closing the tab, it's "time left in this sitting" — still a fair
  // pacing baseline, just scoped to time actually available from now.
  if(!sec.totalDurationSeconds) sec.totalDurationSeconds = remaining;

  const q = sec.questions[sec.currentIndex];
  const resp = sec.responses[q.question_id];
  resp.visited = true;
  const timerClass = remaining<120? 'crit' : remaining<300? 'warn' : '';
  const pace = computePaceStatus(sec, remaining);

  const opts = ['a','b','c','d'].filter(k=>q['option_'+k]);

  app.innerHTML = `
  <div class="exam-shell">
    <div class="exam-header">
      <div class="exam-title">${esc(sec.sectionName)}<small>Question ${sec.currentIndex+1} of ${sec.questions.length}</small></div>
      <div class="timer-box ${timerClass}" id="timerBox"><div class="tval" id="timerVal">${fmtClock(remaining)}</div><div class="tlbl">Time Left</div></div>
      <div class="pace-chip ${pace.show?'show':''} ${pace.cls}" id="paceChip" title="A rough guide only — based on time used so far in this section, not a rule."><span class="pace-dot"></span><span id="paceLabel">${esc(pace.label)}</span></div>
      <div class="save-status" id="saveStatus" style="font-size:12px;padding:4px 10px;border-radius:6px;"></div>
      <div class="net-status" id="netStatus" style="font-size:12px;padding:4px 10px;border-radius:6px;"></div>
      <div class="stu-chip"><b>${esc(S.currentUser.name)}</b>${S.currentUser.studentId}</div>
    </div>
    ${(S.pendingSaves && S.pendingSaves.size>0)? `<div id="pendingSaveBanner" style="background:#FEF3C7;color:#92400E;padding:8px 16px;font-size:13px;text-align:center;">⚠ ${S.pendingSaves.size} answer(s) not yet saved to server — retrying automatically in the background. Please don't close this tab.</div>` : ''}
    <div class="exam-body">
      <div class="exam-main">
        <div class="qbox">
          <div class="qnum">Question ${sec.currentIndex+1}</div>

// Live Participant Monitor fix: a lightweight "I'm still here" ping,
// separate from the per-second on-screen timer (which stays a pure
// client-side countdown, zero server calls). This one fires every ~10s
// while the student is actually on the exam screen, so the admin's Live
// Monitor can tell a student who closed the tab / lost connection apart
// from one who is genuinely still attempting — a stale student stops
// heartbeating immediately, instead of showing "live" until their
// section timer fully runs out.
function startHeartbeat(attemptSectionId){
  stopHeartbeat();
  const ping = ()=>{
    if(!S.activeSection || S.activeSection.attemptSectionId!==attemptSectionId || S.studentPage!=='exam'){ stopHeartbeat(); return; }
    // Diagnostic: the previous version discarded any error the server sent
    // back (a resolved {error:...} response is NOT a promise rejection, so
    // .catch() alone never saw it) — that's why a real server-side failure
    // here was 100% invisible even in DevTools. Now it's logged so it can
    // actually be found instead of guessed at.
    sb.rpc('student_heartbeat', {p_attempt_section_id: attemptSectionId})
      .then(({error})=>{ if(error) console.error('[heartbeat] failed:', error.message, {attemptSectionId}); })
      .catch((e)=>{ console.error('[heartbeat] network error:', e); });
  };
  ping();
  S.heartbeatTimer = setInterval(ping, 10000);
}
function stopHeartbeat(){
  if(S.heartbeatTimer){ clearInterval(S.heartbeatTimer); S.heartbeatTimer = null; }
}
function setSaveStatus(mode, extra=''){
  const el = document.getElementById('saveStatus');
  if(!el) return;
  const map = {
    saving: ['#EFF6FF','#1D4ED8','● Saving…'],
    saved: ['#ECFDF5','#047857','✓ Saved'],
    retrying: ['#FEF3C7','#92400E','⚠ Retrying to save…'],
    failed: ['#FEF2F2','#B91C1C','⚠ Save failed — will retry'],
  };
  const [bg,color,label] = map[mode]||['','',''];
  el.style.background = bg; el.style.color = color;
  el.textContent = label + (extra? ' '+extra : '');
}
async function attemptSaveOnce(payload){
  try{
    const { error } = await sb.rpc('student_save_response', payload);
    if(error && isSessionInvalidError(error)){ handleSessionKickedOut(); return false; }
    return !error;
  }catch(e){
    return false;
  }
}
async function saveCurrentResponse(clear){
  const sec = S.activeSection;
  const q = sec.questions[sec.currentIndex];
  const resp = sec.responses[q.question_id];
  const timeSpent = (Date.now()-sec.questionShownAt)/1000;
  sec.questionShownAt = Date.now();

  // Sequence guard: if the student changes this same question again before
  // this save finishes (e.g. taps a different option quickly), this older
  // call must NEVER be allowed to write its now-stale answer over the
  // newer one. We always re-read the LIVE response state right before
  // actually sending, and only the most-recent call is allowed to proceed
  // past each checkpoint. This client-side guard avoids wasted requests /
  // confusing status flicker, but the REAL protection against network
  // reordering is the client_seq timestamp sent to the server below —
  // captured ONCE, right now, synchronously (not re-captured on retries),
  // so it always reflects exactly when this click happened, in order.
  resp.saveSeq = (resp.saveSeq || 0) + 1;
  const mySeq = resp.saveSeq;
  const myClientSeq = Date.now();
  const buildPayload = ()=>({
    p_token: S.studentToken, p_attempt_id: sec.attemptId, p_question_id: q.question_id,
    p_selected_option: clear? null : resp.selected, p_clear: !!clear,
    p_is_marked: resp.marked, p_time_spent_sec: timeSpent, p_client_seq: myClientSeq,
  });

  setSaveStatus('saving');
  const delays = [0, 1000, 3000];
  for(let i=0;i<delays.length;i++){
    if(resp.saveSeq !== mySeq) return; // superseded — the newer call owns this save now
    if(delays[i]) await new Promise(r=>setTimeout(r, delays[i]));
    if(resp.saveSeq !== mySeq) return;
    if(i>0) setSaveStatus('retrying', `(${i}/${delays.length-1})`);
    const ok = await attemptSaveOnce(buildPayload());
    if(resp.saveSeq !== mySeq) return; // a newer change arrived while this was in flight
    if(ok){
      setSaveStatus('saved');
      if(S.pendingSaves) S.pendingSaves.delete(q.question_id);
      return;
    }
  }
  if(resp.saveSeq !== mySeq) return;
  // All quick retries failed — hand off to a background queue that keeps
  // trying every few seconds so the student's answer is never silently lost.
  setSaveStatus('failed');
  if(!S.pendingSaves) S.pendingSaves = new Map();
  S.pendingSaves.set(q.question_id, buildPayload());
  startPendingSaveLoop();
}
function startPendingSaveLoop(){
  if(S.pendingSaveTimer) return;
  S.pendingSaveTimer = setInterval(async()=>{
    if(!S.pendingSaves || S.pendingSaves.size===0 || S.studentPage!=='exam'){
      clearInterval(S.pendingSaveTimer); S.pendingSaveTimer=null; return;
    }
    for(const [qid, payload] of Array.from(S.pendingSaves.entries())){
      const ok = await attemptSaveOnce(payload);
      if(ok) S.pendingSaves.delete(qid);
    }
    const banner = document.getElementById('pendingSaveBanner');
    if(banner){
      if(S.pendingSaves.size===0) banner.remove();
      else banner.textContent = `⚠ ${S.pendingSaves.size} answer(s) not yet saved to server — retrying automatically in the background. Please don't close this tab.`;
    }
    if(S.pendingSaves.size===0){ clearInterval(S.pendingSaveTimer); S.pendingSaveTimer=null; setSaveStatus('saved'); }
  }, 6000);
}
async function flushPendingSaves(){
  if(!S.pendingSaves || S.pendingSaves.size===0) return true;
  for(const [qid, payload] of Array.from(S.pendingSaves.entries())){
    const ok = await attemptSaveOnce(payload);
    if(ok) S.pendingSaves.delete(qid);
  }
  return S.pendingSaves.size===0;
}
function wireQuestionNavNodes(app, sec){
  const goTo = async(idx)=>{
    if(S.navBusy) return; S.navBusy=true;
    await saveCurrentResponse(false);
    sec.currentIndex = idx; sec.questionShownAt = Date.now();
    S.navBusy=false;
    S.paletteOpen=false; // jumping to a question — whether from the grid or the marked-for-review list — should take the student straight there, not leave the palette covering the screen
    renderExamEngine(app);
  };
  $$('.pnode').forEach(n=>n.onclick=()=>goTo(parseInt(n.dataset.idx)));
  $$('.marked-jump-chip').forEach(n=>n.onclick=()=>goTo(parseInt(n.dataset.idx)));
}

// Floating MedMind chat widget — a small circular launcher fixed to the
// corner of the screen (like Intercom/Drift-style chat buttons). Clicking
// it opens a compact chat panel. This is a GENERAL doubt-chat (not tied to
// any one test's score), so it stays available regardless of any

function mountMedMindFab(){
  if(document.getElementById('medmindFab')) return; // already mounted
  if(!S.medmindFabHistory) S.medmindFabHistory = [];
  const wrap = document.createElement('div');
  wrap.innerHTML = `

    <div class="medmind-fab-label">✨ Ask MedMind — AI Study Buddy</div>

  setTimeout(()=>{
    const lbl = document.querySelector('.medmind-fab-label');
    if(lbl){ lbl.classList.add('fading'); setTimeout(()=>lbl.remove(), 350); }
  }, 3000);

  function renderLog(){
    const log = document.getElementById('medmindPanelLog');
    if(!log) return;
    log.innerHTML = S.medmindFabHistory.length? S.medmindFabHistory.map(m=>{
      if(m.role==='assistant') return `<div style="display:flex;align-items:flex-start;gap:6px;margin-bottom:10px;">${medmindAvatar(22)}<span style="background:linear-gradient(135deg,#C084FC,#F472B6);color:#fff;padding:8px 12px;border-radius:12px;border-bottom-left-radius:3px;font-size:12.5px;max-width:80%;white-space:pre-line;">${esc(m.content)}</span></div>`;
      return `<div style="display:flex;justify-content:flex-end;margin-bottom:10px;"><span style="background:#fff;border:1px solid var(--border);padding:8px 12px;border-radius:12px;border-bottom-right-radius:3px;font-size:12.5px;max-width:80%;white-space:pre-line;">${esc(m.content)}</span></div>`;
    }).join('') : `<div style="text-align:center;color:var(--text2);font-size:12.5px;padding:20px 10px;">👋 Hi! I'm MedMind. Ask me anything about your prep, exam strategy, or a doubt you have.</div>`;
    log.scrollTop = log.scrollHeight;
  }
  renderLog();

  const send = async()=>{
    const input = document.getElementById('medmindPanelInput');
    if(!input) return;
    const q = input.value.trim();
    if(!q) return;
    input.value=''; input.disabled=true;
    S.medmindFabHistory.push({role:'user', content:q});
    renderLog();
    try{
      const res = await fetch('/.netlify/functions/ask-ai', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({mode:'doubt', question:q, history: S.medmindFabHistory.slice(0,-1), examTarget: S.currentUser?.examTarget||'FMGE'}),
      });
      const j = await res.json();
      if(!res.ok) throw new Error(j.error||'Could not get an answer');
      S.medmindFabHistory.push({role:'assistant', content:j.text});
    }catch(e){
      S.medmindFabHistory.push({role:'assistant', content:'Sorry, I could not answer that right now — please try again in a moment.'});
    }
    renderLog();
    const input2 = document.getElementById('medmindPanelInput');
    if(input2){ input2.disabled=false; input2.focus(); }
  };

  // Event delegation on document, instead of binding directly to the
  // just-created elements. This is deliberately more defensive: it keeps
  // working correctly even if this panel's DOM gets re-created or
  // temporarily detached for any reason, since the listener lives on
  // document and simply checks what was actually clicked/typed into.
  // IMPORTANT: mountMedMindFab() can be called many times over one page
  // session (every dashboard/analytics render) while unmountMedMindFab()
  // only removes the DOM, not these document-level listeners — so this
  // binding must only ever happen ONCE per page load, guarded by a flag,
  // otherwise every remount stacks another click/keydown listener and a
  // single tap eventually fires send() multiple times (duplicate messages,
  // duplicate API calls). The listeners below always look elements up
  // fresh by id, so a single early binding keeps working correctly against
  // whatever DOM the most recent mount created.
  if(!S._medmindListenersBound){
    S._medmindListenersBound = true;
    document.addEventListener('click', function(e){
      if(e.target.closest('#medmindFab')){
        const panel = document.getElementById('medmindPanel');

        document.querySelector('.medmind-fab-label')?.remove();

      } else if(e.target.closest('#medmindPanelClose')){
        const panel = document.getElementById('medmindPanel'); if(panel) panel.style.display='none';
      } else if(e.target.closest('#medmindPanelSend')){
        document.getElementById('medmindPanelSend')?._send?.();
      }
    });
    document.addEventListener('keydown', function(e){
      if(e.target && e.target.id==='medmindPanelInput' && e.key==='Enter') document.getElementById('medmindPanelSend')?._send?.();
    });
  }
  // Stash the CURRENT mount's send() on the button itself so the
  // once-only listeners above always call the live closure (with the
  // live S.medmindFabHistory/renderLog) rather than a stale one from
  // the very first mount.
  const sendBtn = document.getElementById('medmindPanelSend');
  if(sendBtn) sendBtn._send = send;
}

  document.getElementById('medmindPanel')?.remove();
  document.querySelector('.medmind-fab-label')?.remove();

function startExamTicker(app){
  if(S.examTimerHandle) clearInterval(S.examTimerHandle);
  S.examTimerHandle = setInterval(()=>{
    const sec = S.activeSection;
    if(!sec || S.studentPage!=='exam'){ clearInterval(S.examTimerHandle); return; }

    const remaining = Math.max(0,(new Date(sec.serverEndAt).getTime()-Date.now())/1000);
    const tv = $('#timerVal'), tb=$('#timerBox');
    if(tv){
      tv.textContent = fmtClock(remaining);
      tb.classList.toggle('warn', remaining<300 && remaining>=120);
      tb.classList.toggle('crit', remaining<120);
      if(Math.floor(remaining)===300) toast('5 minutes remaining in this section','');
      if(Math.floor(remaining)===60) toast('1 minute remaining!','err');
    }
    // Pacing indicator — cheap to recompute every tick, no re-render needed.
    const paceChip = $('#paceChip');
    if(paceChip){
      const pace = computePaceStatus(sec, remaining);
      paceChip.classList.toggle('show', pace.show);
      paceChip.classList.remove('pace-good','pace-warn','pace-bad');
      if(pace.cls) paceChip.classList.add(pace.cls);
      const lbl = $('#paceLabel'); if(lbl) lbl.textContent = pace.label;
    }
    if(remaining<=0){
      clearInterval(S.examTimerHandle);
      toast('Time up — submitting this section','err');
      handleSectionSubmit(true, 'auto_timeout');
    }
  },1000);
}
// Rough, non-alarming pacing hint: compares how far into the section's time
// budget the student is against how far into the question list they are.
// Deliberately conservative — hidden for the first 5% of the section (avoids
// noise on question 1) and never blocks/warns the student, just informs.
function computePaceStatus(sec, remaining){
  const total = sec.totalDurationSeconds || remaining || 1;
  const elapsedFrac = Math.min(1, Math.max(0, 1 - (remaining/total)));
  if(elapsedFrac < 0.05 || sec.questions.length<2) return { show:false, label:'', cls:'' };
  const idealIdx = Math.floor(elapsedFrac * sec.questions.length);
  const diff = sec.currentIndex - idealIdx; // + = ahead of pace, - = behind
  if(diff >= 0) return { show:true, cls:'pace-good', label:`On pace (Q${idealIdx+1} expected)` };
  if(diff >= -3) return { show:true, cls:'pace-warn', label:`Slightly behind — aim for Q${idealIdx+1}` };
  return { show:true, cls:'pace-bad', label:`Behind pace — aim for Q${idealIdx+1}` };
}
async function handleSectionSubmit(auto, reason='manual'){
  if(S.submittingSection) return; // guard: timer-timeout and a manual click can otherwise both fire this within the same instant
  S.submittingSection = true;
  try{
    const sec = S.activeSection;
    if(!auto) await saveCurrentResponse(false);
    if(S.pendingSaves && S.pendingSaves.size>0){
      toast('Finishing saving your last few answers before submitting…','ok');
      for(let i=0;i<3 && S.pendingSaves.size>0;i++) await flushPendingSaves();
    }
    if(S.examTimerHandle) clearInterval(S.examTimerHandle);
    stopHeartbeat();
    if(S.pendingSaveTimer){ clearInterval(S.pendingSaveTimer); S.pendingSaveTimer=null; }
    detachExamSecurity();
    const submitPayload = {p_token:S.studentToken, p_attempt_section_id: sec.attemptSectionId, p_reason: reason};
    let { data, error } = await sb.rpc('student_submit_section', submitPayload);
    // A network blip right at submission is the worst possible moment for a
    // silent dead end — retry a couple of times (short backoff) before
    // giving up and asking the student to retry manually, same spirit as
    // the answer-save retry queue.
    for(let attempt=0; error && !isSessionInvalidError(error) && attempt<2; attempt++){
      await new Promise(r=>setTimeout(r, 1500));
      ({ data, error } = await sb.rpc('student_submit_section', submitPayload));
    }
    S.activeSection = null;
    if(error){
      if(isSessionInvalidError(error)){ handleSessionKickedOut(); return; }
      toast('Could not submit after retrying: '+error.message+' — please use Continue Exam from your dashboard to try again.','err'); S.studentPage='dashboard'; render(); return;
    }
    if(data.testFinished){
      toast('All sections complete — your exam has been submitted!','ok');
      S.viewingResultAttemptId = null; // dashboard will show "View Result" using student_get_dashboard's attempt_id
      S.studentPage='dashboard';
      render();
      return;
    }

    // Real FMGE/NEET PG exams flow straight from one section into the next
    // section OF THE SAME PART with no detour back to a dashboard/instructions
    // screen — only a genuine part boundary (e.g. FMGE's break between Part A
    // and Part B) should ever drop the student back to the dashboard. So
    // before doing that, check whether the next section in this same part is
    // immediately ready, and if so, jump straight into it.
    if(S.activeTestId && S.activePartId){
      const { data: freshDash } = await sb.rpc('student_get_dashboard', {p_token: S.studentToken});
      const freshTest = (freshDash?.tests||[]).find(t=>t.id===S.activeTestId);
      const freshPart = freshTest?.parts?.find(p=>p.id===S.activePartId);
      if(freshPart && freshPart.status==='live'){
        const secs = freshPart.sections||[];
        const idx = secs.findIndex((s2, i)=> sectionStartable(secs, i).state==='start');
        if(idx !== -1){
          toast('Section submitted — moving to the next section…','ok');
          await startSection(secs[idx].id, S.activeTestId, S.activePartId);
          return;
        }
      }
    }

    toast('Section submitted','ok');
    S.studentPage='dashboard';
    render();
  } finally {
    // No matter how this ends (success, error, or an early return above),
    // always release the guard so the student is never stuck unable to
    // retry submitting after a transient failure.
    S.submittingSection = false;
  }
}
