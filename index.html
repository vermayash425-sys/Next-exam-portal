          <div id="qsSectionRows">${w.qsSections.map((s,i)=>`
            <div class="row" style="align-items:flex-end;">
              <div class="field" style="flex:2"><label>Section Name</label><input value="${esc(s.name)}" onchange="S.wizard.qsSections[${i}].name=this.value"></div>
              <div class="field"><label># Questions</label><input type="number" min="1" value="${s.questionCount}" onchange="S.wizard.qsSections[${i}].questionCount=parseInt(this.value)||1; renderWizardStep();"></div>
              <div class="field"><label>Duration (min)</label><input type="number" min="1" value="${s.durationMin}" onchange="S.wizard.qsSections[${i}].durationMin=parseInt(this.value)||1;"></div>
              <div class="field"><button class="btn btn-danger btn-sm" onclick="S.wizard.qsSections.splice(${i},1); renderWizardStep();">Remove</button></div>
            </div>`).join('')}</div>
          <div style="display:flex;gap:8px;align-items:center;margin:10px 0;flex-wrap:wrap;">
            <button class="btn btn-outline btn-sm" id="qsAddSectionBtn">+ Add Section</button>
            <label style="display:flex;align-items:center;gap:6px;font-size:13px;"><input type="checkbox" id="qsRandomize" style="width:auto;" ${w.qsRandomize?'checked':''}> Shuffle question order</label>
          </div>
          <p class="kbd-note" style="margin-bottom:10px;">Sections total: <b style="color:${setInfo && qsTotal===Number(setInfo.total_count)?'var(--success)':'var(--error)'}">${qsTotal}</b>${setInfo? ` — must equal the set's ${setInfo.total_count} questions` : ' — pick a set above first'}</p>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-primary btn-sm" id="qsDistributeBtn">Auto-Distribute Now</button>
            <button class="btn btn-ghost btn-sm" id="qsCancelBtn">Cancel</button>
          </div>
        </div>`;
    }

    $('#assignWrap').innerHTML = `
      <div class="tabbar">${w.parts.map((p,i)=>`<button class="tabbtn ${i===w.activePartIdx?'active':''}" data-idx="${i}">${esc(p.name)} (${p.sections?.length? p.sections.reduce((b,s)=>b+s.selectedIds.size,0) : p.selectedIds.size}/${p.questionCount})</button>`).join('')}</div>
      ${!w.showQuickSetup? `<button class="btn btn-outline btn-sm" style="margin-bottom:14px;" id="openQuickSetupBtn">⚡ Quick Setup: Auto-fill from a Question Set</button>` : ''}
      ${quickSetupHTML}
      ${sectionsEditorHTML}
      ${!w.editingSections && !w.showQuickSetup? `<div style="margin-bottom:12px;display:flex;gap:8px;">
        <button class="btn btn-outline btn-sm" id="editSectionsBtn">${hasSections? 'Edit Sections':'+ Break this Part into Sections'}</button>
      </div>`:''}
      ${!w.editingSections && !w.showQuickSetup && hasSections? renderSectionTabsAndList(part) : ''}
      ${!w.editingSections && !w.showQuickSetup && !hasSections? renderDirectPartList(part) : ''}
    `;

    if(!w.showQuickSetup){
      const openBtn = $('#openQuickSetupBtn');
      if(openBtn) openBtn.onclick=async()=>{
        if(!w.qbSets){
          const { data, error: setsErr } = await sb.rpc('admin_get_question_sets', {p_exam_code: w.examCode});
          if(setsErr){ toast('Could not load question sets: '+setsErr.message,'err'); return; }
          w.qbSets = data||[];
          if(!w.qbSets.length){ toast('No question sets found for '+w.examCode+' — make sure questions were uploaded with a Set Name','err'); }
        }
        w.showQuickSetup = true; renderAssignInner();
      };
    }
    if(w.showQuickSetup){
      $('#qsSetSelect').onchange=(e)=>{ w.qsSelectedSet = e.target.value; renderAssignInner(); };
      $('#qsAddSectionBtn').onclick=()=>{ w.qsSections.push({name:'Section '+(w.qsSections.length+1), questionCount:50, durationMin:50}); renderAssignInner(); };
      $('#qsRandomize').onchange=(e)=>{ w.qsRandomize = e.target.checked; };
      $('#qsCancelBtn').onclick=()=>{ w.showQuickSetup=false; renderAssignInner(); };
      $('#qsDistributeBtn').onclick=async()=>{
        if(!w.qsSelectedSet){ toast('Choose a Question Set first','err'); return; }
        const setInfo = (w.qbSets||[]).find(s=>s.question_set===w.qsSelectedSet);
        const qsTotal = w.qsSections.reduce((a,s)=>a+(s.questionCount||0),0);
        if(!setInfo || qsTotal !== Number(setInfo.total_count)){ toast(`Section distribution must equal total question count: ${setInfo?setInfo.total_count:'?'}`,'err'); return; }
        if(!confirm(`This will replace any existing sections/questions in "${part.name}" with ${qsTotal} questions from "${w.qsSelectedSet}". Continue?`)) return;
        const btn = $('#qsDistributeBtn'); btn.disabled=true; btn.textContent='Distributing…';
        const payload = w.qsSections.map((s,i)=>({name:s.name, question_count:s.questionCount, duration_min:s.durationMin, order_index:i}));
        const { error } = await sb.rpc('admin_auto_distribute_set', {p_test_part_id: part.id, p_question_set: w.qsSelectedSet, p_sections: payload, p_randomize: !!w.qsRandomize});
        if(error){ toast('Could not distribute: '+error.message,'err'); btn.disabled=false; btn.textContent='Auto-Distribute Now'; return; }
        await logAudit('Auto-Distribute Question Set', `part=${part.name} set=${w.qsSelectedSet} sections=${w.qsSections.length}`);
        const { data: test } = await sb.rpc('admin_get_test', {p_test_id:w.testId});
        const freshPart = test.parts.find(p=>p.id===part.id);
        part.sections = (freshPart.sections||[]).map(s=>({ id:s.id, name:s.name, questionCount:s.question_count, durationMin:s.duration_min, selectedIds:new Set(Array.from({length:s.question_count}, (_,idx)=>'auto-'+idx)) }));
        w.showQuickSetup = false; w.qsSections = null; w.qsSelectedSet = null;
        toast('Questions auto-distributed successfully!','ok');
        renderAssignInner();
      };
      return;
    }

    $$('.tabbtn').forEach(btn=>btn.onclick=()=>{ w.activePartIdx=parseInt(btn.dataset.idx); w.editingSections=false; w.showQuickSetup=false; renderAssignInner(); });

    if(w.editingSections){
      if(!w.tempSections) w.tempSections = hasSections? part.sections.map(s=>({...s})) : [];
      renderSectionRows();
      $('#addSectionBtn').onclick=()=>{ w.tempSections.push({name:'Section '+String.fromCharCode(65+w.tempSections.length), questionCount:50, durationMin:50}); renderSectionRows(); };
      $('#cancelSectionsBtn').onclick=()=>{ w.editingSections=false; w.tempSections=null; renderAssignInner(); };
      $('#saveSectionsBtn').onclick=async()=>{
        const payload = w.tempSections.map(s=>({name:s.name, questionCount:s.questionCount, durationMin:s.durationMin}));
        const { error } = await sb.rpc('admin_define_part_sections', {p_test_part_id: part.id, p_sections: payload});
        if(error){ toast('Could not save sections: '+error.message,'err'); return; }
        const { data: test } = await sb.rpc('admin_get_test', {p_test_id:w.testId});
        const freshPart = test.parts.find(p=>p.id===part.id);
        part.sections = (freshPart.sections||[]).map(s=>({ id:s.id, name:s.name, questionCount:s.question_count, durationMin:s.duration_min, selectedIds:new Set() }));
        part.selectedIds = new Set();
        w.editingSections=false; w.tempSections=null;
        toast('Sections saved','ok');
        renderAssignInner();
      };
      return;
    }

    if(hasSections){
      if(w.activeSectionIdx==null || w.activeSectionIdx>=part.sections.length) w.activeSectionIdx=0;
      $$('.sectiontab').forEach(btn=>btn.onclick=()=>{ w.activeSectionIdx=parseInt(btn.dataset.idx); renderAssignInner(); });
      const sec = part.sections[w.activeSectionIdx];
      await bindQuestionListEvents(sec, ()=>renderAssignInner(), w.examCode);
      const saveBtn = $('#aq_save'); if(saveBtn) saveBtn.onclick=async()=>{
        if(sec.selectedIds.size !== sec.questionCount){ toast(`Select exactly ${sec.questionCount} questions before saving (currently ${sec.selectedIds.size})`,'err'); return; }
        const { error } = await sb.rpc('admin_assign_section_questions', {p_section_id: sec.id, p_question_ids: [...sec.selectedIds]});
        if(error){ toast('Could not save: '+error.message,'err'); return; }
        toast(`${sec.name} saved`,'ok');
      };
    } else {
      await bindQuestionListEvents(part, ()=>renderAssignInner(), w.examCode);
      const saveBtn = $('#aq_save'); if(saveBtn) saveBtn.onclick=async()=>{
        if(part.selectedIds.size !== part.questionCount){ toast(`Select exactly ${part.questionCount} questions before saving (currently ${part.selectedIds.size})`,'err'); return; }
        const { error } = await sb.rpc('admin_assign_part_questions', {p_test_part_id: part.id, p_question_ids: [...part.selectedIds]});
        if(error){ toast('Could not save: '+error.message,'err'); return; }
        toast(`${part.name} saved`,'ok');
      };
    }

    const editBtn = $('#editSectionsBtn'); if(editBtn) editBtn.onclick=()=>{ w.editingSections=true; w.tempSections=null; renderAssignInner(); };

    function renderSectionRows(){
      const wrap = $('#sectionRows'); if(!wrap) return;
      wrap.innerHTML = w.tempSections.map((s,i)=>`
        <div class="row" style="align-items:flex-end;">
          <div class="field" style="flex:2"><label>Section Name</label><input value="${esc(s.name)}" onchange="S.wizard.tempSections[${i}].name=this.value"></div>
          <div class="field"><label># Questions</label><input type="number" min="1" value="${s.questionCount}" onchange="S.wizard.tempSections[${i}].questionCount=parseInt(this.value)||1; renderWizardStep();"></div>
          <div class="field"><label>Duration (min)</label><input type="number" min="1" value="${s.durationMin}" onchange="S.wizard.tempSections[${i}].durationMin=parseInt(this.value)||50;"></div>
          <div class="field"><button class="btn btn-danger btn-sm" onclick="S.wizard.tempSections.splice(${i},1); renderWizardStep();">Remove</button></div>
        </div>`).join('');
    }
  }
}
function renderSectionTabsAndList(part){
  return `<div class="tabbar" style="margin-bottom:10px;">${part.sections.map((s,i)=>`<button class="tabbtn sectiontab ${i===(S.wizard.activeSectionIdx||0)?'active':''}" data-idx="${i}">${esc(s.name)} (${s.selectedIds.size}/${s.questionCount})</button>`).join('')}</div><div id="qlistWrap"></div>`;
}
function renderDirectPartList(part){
  return `<div id="qlistWrap"></div>`;
}
async function bindQuestionListEvents(target, onChange, examCode){
  if(!target.qFilters) target.qFilters = {q:'',subject:'',difficulty:''};
  const f = target.qFilters;
  const { data: list } = await sb.rpc('admin_list_questions', {
    p_exam_code: examCode, p_subject: f.subject||null, p_difficulty: f.difficulty||null, p_search: f.q||null,
    p_limit: 100, p_offset: 0,
  });
  const full = target.selectedIds.size >= target.questionCount;
  const wrap = $('#qlistWrap');
  if(!wrap) return;
  wrap.innerHTML = `
    <div class="qsel-toolbar">
      <div class="qsel-counter ${full?'full':''}">Selected: ${target.selectedIds.size} / ${target.questionCount}</div>
      <input id="aq_search" placeholder="Search question text" style="max-width:200px;" value="${esc(f.q)}">
      <input id="aq_subject" placeholder="Subject" style="max-width:130px;" value="${esc(f.subject)}">
      <select id="aq_diff"><option value="">All Difficulty</option>${['Easy','Medium','Hard'].map(d=>`<option ${f.difficulty===d?'selected':''}>${d}</option>`).join('')}</select>
      <button class="btn btn-outline btn-sm" id="aq_selectAll">Select All Below</button>
      <button class="btn btn-ghost btn-sm" id="aq_clearAll">Clear Selection</button>
      <button class="btn btn-primary btn-sm" id="aq_save">Save These Questions</button>
    </div>
    <div class="qsel-list">
      ${list.length? list.map(q=>`
        <div class="qsel-row ${target.selectedIds.has(q.id)?'picked':''}" data-qid="${q.id}">
          <input type="checkbox" ${target.selectedIds.has(q.id)?'checked':''} style="width:auto;flex-shrink:0;">
          <span class="qsel-text">${esc(q.text)}</span>
          <span class="badge badge-blue" style="flex-shrink:0;">${esc(q.subject)}</span>
          ${diffBadge(q.difficulty)}
        </div>`).join('') : `<div class="empty-state">No questions match — add more to the Question Bank first.</div>`}
    </div>
    <p style="font-size:11.5px;color:var(--text2);margin-top:6px;">Showing up to 100 matches for this exam — narrow filters if you have more.</p>
  `;
  $('#aq_search').oninput=(e)=>{f.q=e.target.value; onChange();};
  $('#aq_subject').oninput=(e)=>{f.subject=e.target.value; onChange();};
  $('#aq_diff').onchange=(e)=>{f.difficulty=e.target.value; onChange();};
  $('#aq_selectAll').onclick=()=>{
    let added=0, skippedDup=0;
    for(const q of list){
      if(target.selectedIds.size>=target.questionCount) break;
      if(target.selectedIds.has(q.id)){ skippedDup++; continue; }
      target.selectedIds.add(q.id); added++;
    }
    if(target.selectedIds.size>=target.questionCount && (added+skippedDup)<list.length){
      toast(`Added ${added} — section is now full (${target.questionCount}/${target.questionCount}), some matches below were not needed`,'ok');
    } else {
      toast(`Added ${added} question(s) from this filtered list`,'ok');
    }
    onChange();
  };
  $('#aq_clearAll').onclick=()=>{
    if(!confirm('Clear all selected questions for this section/part?')) return;
    target.selectedIds.clear(); onChange();
  };
  $$('.qsel-row').forEach(row=>row.onclick=()=>{
    const qid = row.dataset.qid;
    if(target.selectedIds.has(qid)) target.selectedIds.delete(qid);
    else {
      if(target.selectedIds.size>=target.questionCount){ toast(`Already has its full ${target.questionCount} questions — remove one before adding another`,'err'); return; }
      target.selectedIds.add(qid);
    }
    onChange();
  });
}


// ---------- ADMIN: Live Exams (real Supabase-backed, no fake data) ----------
async function adminLive(root){
  root.innerHTML = `<div class="empty-state">Loading…</div>`;
  const { data: tests, error } = await sb.rpc('admin_list_tests');
  if(error){ root.innerHTML = `<div class="empty-state">Could not load tests: ${esc(error.message)}</div>`; return; }
  const liveTests = tests.filter(t=>t.status==='live');
  if(!S.liveTestSel && liveTests.length) S.liveTestSel = liveTests[0].id;

  if(!liveTests.length){
    root.innerHTML = `<div class="empty-state" style="width:100%;">No tests are currently live. Set a test's status to "live" from the Tests tab.</div>`;
    return;
  }

  root.innerHTML = `
    <div class="table-toolbar">
      <select id="liveTestSel" style="max-width:320px;">${liveTests.map(t=>`<option value="${t.id}" ${S.liveTestSel===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select>
      <span class="badge badge-success">● LIVE</span>
      <span id="liveRefreshIndicator" style="font-size:11.5px;color:var(--text2);">Auto-updates every 5s</span>
    </div>
    <div class="card pad">
      <h4 style="font-size:15px;margin-bottom:12px;">Live participant monitor</h4>
      <p style="font-size:12px;color:var(--text2);margin-bottom:12px;">Shows students who currently have an active (in-progress) section timer running for this test — refreshes automatically, no need to reload the page.</p>
      <div class="table-wrap"><table>
        <thead><tr><th>Student</th><th>Part / Section</th><th>Progress</th><th>Time Remaining</th><th>Status</th></tr></thead>
        <tbody id="liveMonitorBody"><tr><td colspan="5"><div class="empty-state">Loading…</div></td></tr></tbody>
      </table></div>
    </div>
  `;
  $('#liveTestSel').onchange=(e)=>{ S.liveTestSel=e.target.value; renderAdminSection($('#adminMain')); };

  await refreshLiveMonitorTable();
  // Self-terminating auto-refresh: keeps polling every 5s only while the
  // admin is actually still looking at this Live Exams tab. As soon as
  // they switch to a different admin section, this loop notices and stops
  // itself — no manual refresh needed while it's open, no wasted requests
  // once they leave.
  if(S.liveMonitorTimer) clearInterval(S.liveMonitorTimer);
  S.liveMonitorTimer = setInterval(async()=>{
    if(S.adminSection !== 'live' || !document.getElementById('liveMonitorBody')){
      clearInterval(S.liveMonitorTimer); S.liveMonitorTimer = null; return;
    }
    await refreshLiveMonitorTable();
  }, 5000);
}
async function refreshLiveMonitorTable(){
  const tbody = $('#liveMonitorBody');
  if(!tbody) return;
  const { data: rows, error: monErr } = await sb.rpc('admin_get_live_monitor', {p_test_id: S.liveTestSel});
  tbody.innerHTML = monErr? `<tr><td colspan="5"><div class="empty-state">Could not load: ${esc(monErr.message)}</div></td></tr>` :
    (rows&&rows.length)? rows.map(r=>`<tr><td><b>${esc(r.student_name)}</b><br><span style="font-size:12px;color:var(--text2)">${esc(r.student_id)}</span></td>
      <td>${esc(r.part_name)} — ${esc(r.section_name)}</td>
      <td><div class="progress-bar" style="width:120px;"><div style="width:${Math.round(r.answered/Math.max(r.total,1)*100)}%"></div></div> ${r.answered}/${r.total}</td>
      <td>${fmtClock(r.time_remaining_sec)}</td>
      <td><span class="badge badge-success">Active</span></td></tr>`).join('')
    : `<tr><td colspan="5"><div class="empty-state">No students are currently in an active section for this test.</div></td></tr>`;
}

async function adminAnalytics(root){
  root.innerHTML = `<div class="empty-state">Loading…</div>`;
  const { data: tests, error: testsErr } = await sb.rpc('admin_list_tests');
  if(testsErr){ root.innerHTML = `<div class="empty-state">Could not load tests: ${esc(testsErr.message)}</div>`; return; }
  if(!S.resultsTestFilter && tests.length) S.resultsTestFilter = tests[0].id;
  const sel = S.resultsTestFilter;
  const [{ data: results }, { data: qstats, error: qErr }] = await Promise.all([
    sel? sb.rpc('admin_list_results', {p_test_id: sel}) : {data:[]},
    sel? sb.rpc('admin_question_analytics', {p_test_id: sel}) : {data:[]},
  ]);

  const scores = (results||[]).map(a=>Number(a.score));
  const avg = scores.length? (scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(2):'0';
  const high = scores.length? Math.max(...scores).toFixed(2):'0';
  const low = scores.length? Math.min(...scores).toFixed(2):'0';

  const subjAgg = {};
  (qstats||[]).forEach(q=>{
    if(!subjAgg[q.subject]) subjAgg[q.subject] = {correct:0,attempted:0};
    subjAgg[q.subject].correct += q.correct;
    subjAgg[q.subject].attempted += q.attempted;
  });
  const subjData = Object.entries(subjAgg).map(([s,v])=>({label:s, value: v.attempted? Math.round(v.correct/v.attempted*100):0})).sort((a,b)=>a.value-b.value);

  const list = qstats||[];
  const withAttempts = list.filter(q=>q.attempted>0);
  const mostWrong = [...withAttempts].sort((a,b)=>(a.correct/Math.max(a.attempted,1))-(b.correct/Math.max(b.attempted,1))).slice(0,10);
  const mostSkipped = [...list].sort((a,b)=>b.skipped-a.skipped).slice(0,10);

async function adminLeaderboard(root){
  root.innerHTML = `<div class="empty-state">Loading…</div>`;
  const { data: tests, error: testsErr } = await sb.rpc('admin_list_tests');
  if(testsErr){ root.innerHTML = `<div class="empty-state">Could not load tests: ${esc(testsErr.message)}</div>`; return; }
  if(!S.resultsTestFilter && tests.length) S.resultsTestFilter = tests[0].id;
  const sel = S.resultsTestFilter;
  const t = tests.find(x=>x.id===sel);

  if(t && !t.ranking_enabled){
    root.innerHTML = `<div class="table-toolbar"><select id="lbTestSel" style="max-width:320px;">${tests.map(x=>`<option value="${x.id}" ${sel===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
    <div class="empty-state">Ranking is disabled for this test.</div>`;
    $('#lbTestSel').onchange=(e)=>{S.resultsTestFilter=e.target.value; renderAdminSection($('#adminMain'));};
    return;
  }

  const { data: rows, error } = sel? await sb.rpc('admin_leaderboard', {p_test_id: sel}) : {data:[]};
  root.innerHTML = `
    <div class="table-toolbar">
      <select id="lbTestSel" style="max-width:260px;">${tests.map(x=>`<option value="${x.id}" ${sel===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
      <div class="search-box"><input id="lbSearch" placeholder="Search student"></div>
      <button class="btn btn-outline btn-sm" id="exportLbBtn">⬇ Export Leaderboard</button>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Rank</th><th>Student</th><th>Score</th><th>Accuracy</th><th>Correct</th><th>Incorrect</th><th>Time</th><th>Percentile</th></tr></thead>
      <tbody id="lbBody">${error? `<tr><td colspan="8"><div class="empty-state">Could not load: ${esc(error.message)}</div></td></tr>` : leaderboardRows(rows||[])}</tbody>
    </table></div>
  `;
  $('#lbTestSel').onchange=(e)=>{S.resultsTestFilter=e.target.value; renderAdminSection($('#adminMain'));};
  $('#lbSearch').oninput=(e)=>{
    const q=e.target.value.toLowerCase();
    const filtered = (rows||[]).filter(r=>r.student_name.toLowerCase().includes(q)||r.student_id.toLowerCase().includes(q));
    $('#lbBody').innerHTML = leaderboardRows(filtered);
  };
  $('#exportLbBtn').onclick=()=>{
    downloadCSV('leaderboard.csv',[['Rank','Student','StudentID','Score','Accuracy','Correct','Incorrect','TimeMin','Percentile'],
      ...(rows||[]).map(r=>[r.rnk,r.student_name,r.student_id,r.score,r.accuracy,r.correct_count,r.incorrect_count,Math.round(r.time_used_sec/60),r.percentile])]);
    logAudit('Export Leaderboard','CSV');
  };
}
function leaderboardRows(rows){
  if(!rows.length) return `<tr><td colspan="8"><div class="empty-state">No submitted attempts for this test yet.</div></td></tr>`;
  return rows.map(r=>`<tr><td><b>#${r.rnk}</b></td><td>${esc(r.student_name)}<br><span style="color:var(--text2);font-size:12px">${esc(r.student_id)}</span></td>
    <td><b>${Number(r.score).toFixed(2)}</b></td><td>${r.accuracy}%</td><td style="color:var(--success)">${r.correct_count}</td><td style="color:var(--error)">${r.incorrect_count}</td>
    <td>${Math.round(r.time_used_sec/60)}m</td><td>${r.percentile}</td></tr>`).join('');
}

function openModal(title, bodyHTML, maxWidth=640){
  closeModal();
  const overlay = document.createElement('div');
  overlay.className='modal-overlay'; overlay.id='modalOverlay';
  overlay.innerHTML = `<div class="modal-box" style="max-width:${maxWidth}px;">
    <div class="modal-head"><h3 style="font-size:16px;">${title}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">${bodyHTML}</div>
  </div>`;
  overlay.onclick=(e)=>{ if(e.target===overlay) closeModal(); };
  document.body.appendChild(overlay);
}
window.closeModal = ()=>{ const o=$('#modalOverlay'); if(o) o.remove(); };
window.confirmModal = (message, onConfirm, opts={})=>{
  openModal(opts.title||'Please Confirm', `
    <p style="font-size:14.5px;line-height:1.6;margin-bottom:22px;">${esc(message)}</p>
    <div style="display:flex;gap:10px;justify-content:flex-end;">
      <button class="btn btn-ghost" id="confirmModalCancel">${esc(opts.cancelLabel||'Cancel')}</button>
      <button class="btn ${opts.danger===false?'btn-primary':'btn-danger'}" id="confirmModalOk">${esc(opts.okLabel||'Confirm')}</button>
    </div>
  `, opts.width||460);
  $('#confirmModalCancel').onclick=()=>closeModal();
  $('#confirmModalOk').onclick=()=>{ closeModal(); onConfirm(); };
};

async function rpAdminDataTab(root){

    p_year: filters.year||null, p_source: filters.source||null,

  const selCount = S.rpDataSelected.size;
  root.innerHTML = `
    <div class="table-toolbar">
      <input id="rpFilterYear" placeholder="Filter by year" style="max-width:120px;" value="${filters.year||''}">
      <input id="rpFilterSource" placeholder="Filter by source" style="max-width:180px;" value="${filters.source||''}">

        <option value="">All statuses</option>

      </select>

    ${selCount? `<div class="lock-banner" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
      <span>${selCount} row(s) selected</span>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-primary btn-sm" id="rpBulkVerifyBtn">✓ Verify selected</button>
        <button class="btn btn-primary btn-sm" id="rpBulkActivateBtn">▶ Verify + Activate selected</button>
        <button class="btn btn-danger btn-sm" id="rpBulkDeleteBtn">🗑 Delete selected</button>
        <button class="btn btn-ghost btn-sm" id="rpClearSelBtn">Clear selection</button>
      </div>
    </div>` : ''}
    <div class="table-wrap"><table>
      <thead><tr><th style="width:36px;"><input type="checkbox" id="rpSelAll" ${list.length && list.every(d=>S.rpDataSelected.has(d.id))?'checked':''}></th><th>Year</th><th>Score Range</th><th>Normalized</th><th>Rank Range</th><th>Candidates</th><th>Source</th><th>Confidence</th><th>Status</th><th>Active</th><th></th></tr></thead>
      <tbody>
        ${list.length? list.map(d=>`
          <tr>
            <td><input type="checkbox" class="rpRowChk" data-id="${d.id}" ${S.rpDataSelected.has(d.id)?'checked':''}></td>
            <td><b>${d.year}</b></td>
            <td>${d.original_score_min}–${d.original_score_max} / ${d.original_max_score}</td>
            <td>${d.normalized_score_min}–${d.normalized_score_max}</td>

            <td><span class="badge ${String(d.confidence).toLowerCase()==='high'?'badge-success':String(d.confidence).toLowerCase()==='low'?'badge-danger':'badge-grey'}">${esc(d.confidence)}</span></td>
            <td><span class="badge ${d.verification_status==='verified'?'badge-success':d.verification_status==='rejected'?'badge-danger':'badge-grey'}">${esc(d.verification_status)}</span></td>
            <td>${d.is_active? '<span class="badge badge-blue">Active</span>' : '<span style="color:var(--text2);font-size:12px;">—</span>'}</td>
            <td><div style="display:flex;gap:6px;flex-wrap:wrap;">

  async function bulkAction(ids, {verify, activate}, label){
    const ids2 = Array.from(ids);
    toast(`${label} ${ids2.length} row(s)…`,'');
    let done=0, failed=0;
    for(const id of ids2){
      if(verify){
        const { error } = await sb.rpc('admin_neetpg_verify_dataset_row', {p_id:id, p_approved:true});
        if(error){ failed++; continue; }
      }
      if(activate){
        const { error } = await sb.rpc('admin_neetpg_set_dataset_row_active', {p_id:id, p_active:true});
        if(error){ failed++; continue; }
      }
      done++;
    }
    S.rpDataSelected.clear();
    toast(`${done} row(s) updated${failed?`, ${failed} failed`:''}`, failed? 'err':'ok');
    rpAdminDataTab(root);
  }
  const bulkVerifyBtn = $('#rpBulkVerifyBtn');
  if(bulkVerifyBtn) bulkVerifyBtn.onclick=()=>{

  const bulkActivateBtn = $('#rpBulkActivateBtn');

      bulkAction(S.rpDataSelected, {verify:true, activate:true}, 'Activating');

  };

  if(bulkDeleteBtn) bulkDeleteBtn.onclick=()=>{
    confirmModal(`Permanently delete ${S.rpDataSelected.size} selected row(s)? This cannot be undone.`, async()=>{
      const ids2 = Array.from(S.rpDataSelected);
      toast(`Deleting ${ids2.length} row(s)…`,'');
      let done=0, failed=0;

async function studentErrorBook(root){
  root.innerHTML = `<div class="empty-state">Loading your error book…</div>`;
  const { data, error } = await sb.rpc('student_get_error_book', {p_token: S.studentToken});
  if(error){ root.innerHTML = `<div class="empty-state">Could not load error book: ${esc(error.message)}</div>`; return; }
  const all = data.questions || [];
  const subjects = [...new Set(all.map(q=>q.subject))].sort();
  const activeSubj = S.errorBookSubject || '';
  const list = activeSubj? all.filter(q=>q.subject===activeSubj) : all;
  if(!S.errorBookRevealed) S.errorBookRevealed = new Set();

  root.innerHTML = `
    <button class="btn btn-ghost btn-sm" style="margin-bottom:14px;" onclick="S.studentPage='dashboard';render();">← Back to Dashboard</button>
    <div class="dash-section-head fade-in-up">
      <div><span class="dash-eyebrow">LEARN FROM MISSES</span><h3>Error Book</h3><p style="font-size:13px;color:var(--text2);margin-top:4px;">Every question you've gotten wrong across all your tests, in one place — practice these until they're second nature.</p></div>
      ${all.length? `<span class="badge badge-error" style="font-size:12.5px;padding:6px 12px;">${all.length} to review</span>`:''}
    </div>
    ${all.length? `
    <div class="table-toolbar" style="margin-bottom:14px;">
      <select id="ebSubjFilter">
        <option value="">All Subjects (${all.length})</option>
        ${subjects.map(s=>`<option value="${esc(s)}" ${activeSubj===s?'selected':''}>${esc(s)} (${all.filter(q=>q.subject===s).length})</option>`).join('')}
      </select>
    </div>
    ${list.map(q=>{
      const revealed = S.errorBookRevealed.has(q.question_id);
      return `<div class="qcard">
        <div class="qmeta"><span class="badge badge-blue">${esc(q.subject)}</span>${q.times_wrong>1?`<span class="badge badge-error">Wrong ${q.times_wrong}x</span>`:''}</div>
        <p style="font-size:14px;margin-bottom:10px;">${esc(q.text)}</p>
        ${q.image_url?`<img class="qimg" src="${esc(q.image_url)}" style="max-width:280px;" onclick="openImageZoom('${esc(q.image_url)}')">`:''}
        ${['a','b','c','d'].filter(k=>q['option_'+k]).map(k=>{
          const K = k.toUpperCase();
          const isCorrect = q.correct===K;
          const isSelected = q.selected===K;
          const showState = revealed;
          return `<div class="opt-row ${showState && isCorrect?'correct':''}" style="${showState && isSelected && !isCorrect?'color:var(--error);font-weight:700;':''}">
            ${showState? (isCorrect?'✅':isSelected?'❌':'○') : '○'} <b>${K}.</b> ${esc(q['option_'+k])}
          </div>`;
        }).join('')}
        ${revealed? (q.explanation? `<div style="margin-top:8px;padding:10px;background:#F9FAFB;border-radius:8px;font-size:13px;"><b>Explanation:</b> ${esc(q.explanation)}</div>`:'')

      </div>`;
    }).join('')}
    ` : `<div class="empty-state">No incorrect questions yet — either you haven't submitted a test, or you're getting everything right! 🎉</div>`}

}

function sectionStartable(sections, idx){
  const sec = sections[idx];
  if(sec.my_status==='completed') return {startable:false, state:'completed'};
  if(sec.my_status==='active') return {startable:true, state:'resume'};
  if(idx===0) return {startable:true, state:'start'};
  return sections[idx-1].my_status==='completed'? {startable:true,state:'start'} : {startable:false, state:'locked'};
}

async function studentDashboard(root){
  root.innerHTML = `<div class="empty-state">Loading your dashboard…</div>`;
  const [{ data, error }, { data: analyticsData }] = await Promise.all([
    sb.rpc('student_get_dashboard', {p_token: S.studentToken}),
    sb.rpc('student_get_analytics', {p_token: S.studentToken}),
  ]);
  if(error){
    root.innerHTML = `<div class="empty-state">Could not load dashboard: ${esc(error.message)}<br><button class="btn btn-outline btn-sm" style="margin-top:10px;" onclick="doLogout()">Log in again</button></div>`;
    return;
  }
  mountMedMindFab();
  const tests = (data.tests||[]);
  const firstName = esc(S.currentUser.name.split(' ')[0]);
  const testsCompleted = tests.filter(t=>t.attempt_status==='submitted').length;
  const avgAccuracy = analyticsData?.overall?.avg_accuracy;
  const bestRanks = data.best_ranks || [];
  const bestRankFor = code => bestRanks.find(r=>r.exam_code===code)?.rank;
  const hour = new Date().getHours();
  const greeting = hour<12?'Good morning':hour<17?'Good afternoon':'Good evening';
  const nextLive = tests.find(t=>t.status==='live' && t.attempt_status!=='submitted');
  const heroSub = nextLive? `Your ${esc(nextLive.name)} is ready. Keep the momentum going.` : `Check back once your admin publishes your next test.`;
  const bestRankOverall = bestRanks.length? Math.min(...bestRanks.map(r=>r.rank)) : null;

  function renderTestCard(t, idx){
      const finished = t.attempt_status==='submitted';
      const noAttemptsLeft = !t.has_in_progress && t.attempts_used >= t.max_attempts;
      const now = Date.now();
      const startAt = t.start_at? new Date(t.start_at) : null;
      const endAt = t.end_at? new Date(t.end_at) : null;
      const notStartedYet = startAt && now < startAt.getTime();
      const windowClosed = endAt && now > endAt.getTime();
      const totalQAll = (t.parts||[]).reduce((a,p)=>a+(p.sections||[]).reduce((b,s)=>b+s.question_count,0),0);
      const totalMinAll = (t.parts||[]).reduce((a,p)=>a+(p.sections||[]).reduce((b,s)=>b+s.duration_min,0),0);
      const doneQAll = (t.parts||[]).reduce((a,p)=>{
        const states=(p.sections||[]).map((s,i)=>({s,st:sectionStartable(p.sections,i)}));
        return a+states.filter(x=>x.st.state==='completed').reduce((b,x)=>b+x.s.question_count,0);
      },0);
      const overallPct = totalQAll? Math.round(doneQAll/totalQAll*100) : 0;
      // Find the current "next action" part/section across the whole test, for the footer line (e.g. "Section B is ready")
      let currentPart=null, currentNext=null, currentStates=null;
      for(const p of (t.parts||[])){
        const states = (p.sections||[]).map((s,i)=>({s, st: sectionStartable(p.sections, i)}));
        const next = states.find(x=>x.st.state==='start' || x.st.state==='resume');
        if(next && p.status==='live' && !notStartedYet && !windowClosed && !noAttemptsLeft){ currentPart=p; currentNext=next; currentStates=states; break; }
      }
      return `
      <div class="test-card fade-in-up" style="animation-delay:${.18+idx*.05}s;">
        <div class="test-card-accent" style="background:${t.status==='live'?'linear-gradient(180deg,var(--blue),var(--blue-bright))':'transparent'};"></div>
        <div class="test-card-body">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;">
            <div>

                ${t.status==='live'?'<span class="badge badge-success">● LIVE</span>':finished?'<span class="badge badge-navy">✓ COMPLETED</span>':''}
              </div>
              <h3 style="font-size:19px;margin:10px 0 4px;">${esc(t.name)}</h3>
              <p style="font-size:13.5px;color:var(--text2);">${esc(t.description||'')}</p>
            </div>
            <div style="text-align:right;">
              ${finished? (t.ranking_enabled? `<div style="font-size:11px;color:var(--text2);font-weight:700;">🏆 National rank</div><div style="font-size:20px;font-weight:800;font-family:'Manrope';">—</div>` : '') :
                `<div style="font-size:11px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.3px;">Progress</div><div style="font-size:26px;font-weight:800;color:var(--blue);font-family:'Manrope';">${overallPct}%</div>`}
            </div>
          </div>
          ${!finished? `
          <div class="test-progress-track"><div class="test-progress-fill" style="width:${overallPct}%;"></div></div>
          <div class="test-meta-row">
            ${totalQAll?`<span>❓ ${totalQAll} questions</span>`:''}
            ${totalMinAll?`<span>🕐 ${Math.round(totalMinAll/60*10)/10} hours</span>`:''}
            <span>🛡 Proctored</span>
          </div>`:''}
          ${finished && !noAttemptsLeft && !t.has_in_progress? `<div class="lock-banner" style="margin-top:14px;background:var(--success-bg,#ECFDF5);border-color:#A9E6C4;color:#0B6B39;">You've submitted this test, but you still have ${t.max_attempts - t.attempts_used} attempt(s) left — start again below whenever you're ready.</div>`:''}
          ${noAttemptsLeft? `<div class="lock-banner" style="margin-top:14px;">You've used all ${t.max_attempts} attempt(s) for this test.</div>`:''}
          <div style="border-top:1px solid var(--border);margin-top:16px;padding-top:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
            <div>
              ${currentPart? `
                <div class="dash-eyebrow" style="font-size:11px;">${esc(currentPart.name).toUpperCase()}</div>
                <div style="font-size:15px;font-weight:800;margin-top:2px;">${currentNext.st.state==='resume'?'Continue where you left off':esc(currentNext.s.name)+' is ready'}</div>
                <div style="font-size:12px;color:var(--text2);margin-top:2px;">${currentStates.filter(x=>x.st.state==='completed').length}/${currentStates.length} sections complete</div>
              ` : finished? `
                <div style="font-size:15px;font-weight:800;">✓ Test submitted</div>
                <div style="font-size:12.5px;color:var(--text2);margin-top:2px;">${noAttemptsLeft? 'All attempts used' : 'No further section is currently open'}</div>
              ` : notStartedYet? `<div style="font-size:13px;color:var(--warning);font-weight:700;">Opens ${startAt.toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</div>`
                : windowClosed? `<div style="font-size:13px;color:var(--error);font-weight:700;">Test window closed</div>`
                : `<div style="font-size:13px;color:var(--text2);">${overallPct>=100?'All parts complete':'Not yet open'}</div>`}
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              ${finished? `<button class="btn btn-outline btn-sm" onclick="viewMyResult('${t.attempt_id}')">View result <span style="margin-left:2px;">›</span></button>`:''}
              ${currentPart? (currentNext.st.state==='resume'?
                  `<button class="btn btn-primary" onclick="startSection('${currentNext.s.id}', '${t.id}', '${currentPart.id}')">Continue exam <span style="margin-left:2px;">›</span></button>`
                  : `<button class="btn btn-primary" onclick='goToSectionInstructions(${JSON.stringify(currentNext.s.id)}, ${JSON.stringify(t.name)}, ${JSON.stringify(t.instructions||'')}, ${JSON.stringify(t.id)}, ${JSON.stringify(currentPart.id)})'>${finished?'Start new attempt':'Start exam'} <span style="margin-left:2px;">›</span></button>`)
              : ''}
          </div>
          ${!currentPart && !finished && (t.parts||[]).length>1? `<div style="margin-top:14px;display:flex;gap:6px;flex-wrap:wrap;">

          </div>`:''}
          </div>
        </div>
      </div>`;
  }

  function renderExamGroup(examCode, label, list){
    if(!list.length) return '';
    return `
      <div class="dash-section-head fade-in-up" style="margin-top:20px;">
        <div><span class="badge badge-blue">${label}</span></div>
        ${bestRankFor(examCode)? `<span style="font-size:12px;color:var(--text2);">🏆 Best rank: #${bestRankFor(examCode)}</span>`:''}
      </div>
      ${list.map((t,idx)=>renderTestCard(t,idx)).join('')}
    `;
  }
  const fmgeTests = tests.filter(t=>t.exam_code==='FMGE');
  const neetTests = tests.filter(t=>t.exam_code==='NEET_PG');
  const otherTests = tests.filter(t=>t.exam_code!=='FMGE' && t.exam_code!=='NEET_PG');

  root.innerHTML = `

      `}

      ${categories.length? `
        <label class="rp-label" style="margin-top:16px;">Your category</label>
        <div id="rpCategoryPills" class="rp-pillrow">
          ${['General',...categories.filter(c=>c!=='General')].map(c=>`
            <button type="button" class="btn btn-sm rp-cat-pill rp-pill ${((S.rpCategory||'General')===c)?'btn-primary':'btn-ghost'}" data-cat="${esc(c)}">${esc(c)}</button>
          `).join('')}
        </div>
      `:''}

      <button class="btn btn-primary rp-predict-btn" id="rpPredictBtn" disabled>Predict My Rank</button>
      <div id="rpResultArea"></div>
    </div>
  `;

  $('#rpTabScore').onclick=()=>{ S.rpMode='score'; renderStudentPage($('#stuContent')); };
  $('#rpTabSections').onclick=()=>{ S.rpMode='sections'; renderStudentPage($('#stuContent')); };
  $$('.rp-cat-pill').forEach(b=>b.onclick=()=>{ S.rpCategory=b.dataset.cat==='General'?'':b.dataset.cat; renderStudentPage($('#stuContent')); });

  const scoreInput = $('#rpScoreInput');
  const predictBtn = $('#rpPredictBtn');

  function currentScore(){
    if(S.rpMode==='score'){
      if(!scoreInput || scoreInput.value===''){ return null; }
      const v = parseFloat(scoreInput.value);
      return Number.isFinite(v)? v : null;
    } else {
      const c = parseInt($('#rpCorrect')?.value)||0, i = parseInt($('#rpIncorrect')?.value)||0, u = parseInt($('#rpUnattempted')?.value)||0;
      if(c+i+u > cfg.total_questions) return null;
      return Math.max(0, c*cfg.marks_per_correct - i*cfg.negative_marks);
    }
  }
  function updateBtnState(){
    const s = currentScore();
    predictBtn.disabled = !(s!=null && s>=0 && s<=cfg.maximum_score);
    if(S.rpMode==='sections'){
      const c = parseInt($('#rpCorrect')?.value)||0, i = parseInt($('#rpIncorrect')?.value)||0, u = parseInt($('#rpUnattempted')?.value)||0;
      const line = $('#rpCalcLine');
      if(line) line.textContent = (c+i+u<=cfg.total_questions)? `Calculated Score: ${s} / ${cfg.maximum_score}` : `Correct + Incorrect + Unattempted cannot exceed ${cfg.total_questions}.`;
    }
  }
  if(S.rpMode==='score' && scoreInput) scoreInput.oninput = updateBtnState;
  if(S.rpMode==='sections'){ ['rpCorrect','rpIncorrect','rpUnattempted'].forEach(id=>{ const el=$('#'+id); if(el) el.oninput = updateBtnState; }); }
  updateBtnState();

  predictBtn.onclick = async ()=>{
    const s = currentScore();
    if(s==null) return;
    if(S.rpMode==='score') S.rpScore = s;
    else {
      S.rpCorrect = parseInt($('#rpCorrect').value)||0;
      S.rpIncorrect = parseInt($('#rpIncorrect').value)||0;
      S.rpUnattempted = parseInt($('#rpUnattempted').value)||0;
    }
    predictBtn.disabled = true;
    const originalLabel = predictBtn.textContent;
    predictBtn.innerHTML = `<span class="spinner-white"></span> Calculating your estimated rank…`;
    const resultArea = $('#rpResultArea');
    resultArea.innerHTML = '';
    try{
      const { data: pred, error: predErr } = await sb.rpc('neetpg_predict_rank', { p_score: s, p_category: S.rpCategory||null, p_student_id: S.currentUser.id });
      if(predErr || !pred?.success){
        resultArea.innerHTML = `<div class="empty-state">Something went wrong while calculating your prediction. Please try again.<br><button class="btn btn-outline btn-sm" style="margin-top:10px;" id="rpRetry">Retry</button></div>`;
        $('#rpRetry').onclick = ()=>renderStudentPage($('#stuContent'));
      } else {
        await renderRankPredictorResult(resultArea, pred.data, cfg, S.rpCategory||'General');
      }
    }catch(e){
      resultArea.innerHTML = `<div class="empty-state">Something went wrong while calculating your prediction. Please try again.</div>`;
    } finally {
      predictBtn.disabled = false; predictBtn.textContent = originalLabel;
    }
  };
}

window.startSection = async(sectionId, testId, partId)=>{
  if(S.startingSection) return; // guard against double-click firing this twice before the first request returns
  S.startingSection = true;
  const { data, error } = await sb.rpc('student_start_section', {p_token: S.studentToken, p_section_id: sectionId});
  S.startingSection = false;
  if(error){
    // A near-simultaneous double-click can occasionally lose a race to the
    // database's own duplicate-prevention constraint; treat that specific
    // case as harmless (the other click already got the student in).
    if(error.message && error.message.includes('duplicate key value')){
      toast('Already starting this section…','');
      return;
    }
    toast(error.message,'err'); render(); return;
  }
  // Remember which test+part this section belongs to, so that when this
  // section ends we can check whether the NEXT section in the same part is
  // ready to go straight away — real exams (FMGE/NEET PG) flow section to
  // section within a part with no dashboard/instructions detour in between.
  if(testId) S.activeTestId = testId;
  if(partId) S.activePartId = partId;
  S.activeSection = {
    attemptId: data.attempt_id, attemptSectionId: data.attempt_section_id,
    sectionName: data.section_name, serverEndAt: data.server_end_at,
    fullscreenRequired: !!data.fullscreen_required, disableCopyPaste: !!data.disable_copy_paste,
    tabSwitchLimit: data.tab_switch_limit || 3, tabSwitchCount: 0,
    questions: data.questions, currentIndex: 0,
    responses: {}, questionShownAt: Date.now(),
  };
  data.questions.forEach((q,i)=>{
    S.activeSection.responses[q.question_id] = { selected: q.selected_option, marked: !!q.is_marked, visited: i===0 };
  });
  S.pendingSection = null;
  S.navBusy = false;
  S.submittingSection = false;
  S.paletteOpen = false;
  S.studentPage='exam';
  render();
};

  if(remaining<=0){ await handleSectionSubmit(true, 'auto_timeout'); return; }

  const q = sec.questions[sec.currentIndex];

    <div class="exam-body">

  wireQuestionNavNodes(app, sec);

  if(fab) fab.onclick=()=>setPaletteOpen(!S.paletteOpen);
  const paletteCloseBtn = $('#paletteCloseBtn'); if(paletteCloseBtn) paletteCloseBtn.onclick=()=>setPaletteOpen(false);
  const paletteBackdrop = $('#paletteBackdrop'); if(paletteBackdrop) paletteBackdrop.onclick=()=>setPaletteOpen(false);

  startExamTicker(app);
  attachExamSecurity();
  requestFullscreenIfNeeded();
  preloadNextQuestionImage(sec);
}
function setSaveStatus(mode, extra=''){
  const el = document.getElementById('saveStatus');
  if(!el) return;
  const map = {
    saving: ['#EFF6FF','#1D4ED8','● Saving…'],
    saved: ['#ECFDF5','#047857','✓ Saved'],
    retrying: ['#FEF3C7','#92400E','⚠ Retrying to save…'],
    failed: ['#FEF2F2','#B91C1C','⚠ Save failed — will retry'],
  };
  const [bg,color,label] = map[mode]||['','',''];
  el.style.background = bg; el.style.color = color;
  el.textContent = label + (extra? ' '+extra : '');
}
async function attemptSaveOnce(payload){
  try{
    const { error } = await sb.rpc('student_save_response', payload);
    return !error;
  }catch(e){
    return false;
  }
}
async function saveCurrentResponse(clear){
  const sec = S.activeSection;
  const q = sec.questions[sec.currentIndex];
  const resp = sec.responses[q.question_id];
  const timeSpent = (Date.now()-sec.questionShownAt)/1000;
  sec.questionShownAt = Date.now();

  // Sequence guard: if the student changes this same question again before
  // this save finishes (e.g. taps a different option quickly), this older
  // call must NEVER be allowed to write its now-stale answer over the
  // newer one. We always re-read the LIVE response state right before
  // actually sending, and only the most-recent call is allowed to proceed
  // past each checkpoint. This client-side guard avoids wasted requests /
  // confusing status flicker, but the REAL protection against network
  // reordering is the client_seq timestamp sent to the server below —
  // captured ONCE, right now, synchronously (not re-captured on retries),
  // so it always reflects exactly when this click happened, in order.
  resp.saveSeq = (resp.saveSeq || 0) + 1;
  const mySeq = resp.saveSeq;
  const myClientSeq = Date.now();
  const buildPayload = ()=>({
    p_token: S.studentToken, p_attempt_id: sec.attemptId, p_question_id: q.question_id,
    p_selected_option: clear? null : resp.selected, p_clear: !!clear,
    p_is_marked: resp.marked, p_time_spent_sec: timeSpent, p_client_seq: myClientSeq,
  });

  setSaveStatus('saving');
  const delays = [0, 1000, 3000];
  for(let i=0;i<delays.length;i++){
    if(resp.saveSeq !== mySeq) return; // superseded — the newer call owns this save now
    if(delays[i]) await new Promise(r=>setTimeout(r, delays[i]));
    if(resp.saveSeq !== mySeq) return;
    if(i>0) setSaveStatus('retrying', `(${i}/${delays.length-1})`);
    const ok = await attemptSaveOnce(buildPayload());
    if(resp.saveSeq !== mySeq) return; // a newer change arrived while this was in flight
    if(ok){
      setSaveStatus('saved');
      if(S.pendingSaves) S.pendingSaves.delete(q.question_id);
      return;
    }
  }
  if(resp.saveSeq !== mySeq) return;
  // All quick retries failed — hand off to a background queue that keeps
  // trying every few seconds so the student's answer is never silently lost.
  setSaveStatus('failed');
  if(!S.pendingSaves) S.pendingSaves = new Map();
  S.pendingSaves.set(q.question_id, buildPayload());
  startPendingSaveLoop();
}
function startPendingSaveLoop(){
  if(S.pendingSaveTimer) return;
  S.pendingSaveTimer = setInterval(async()=>{
    if(!S.pendingSaves || S.pendingSaves.size===0 || S.studentPage!=='exam'){
      clearInterval(S.pendingSaveTimer); S.pendingSaveTimer=null; return;
    }
    for(const [qid, payload] of Array.from(S.pendingSaves.entries())){
      const ok = await attemptSaveOnce(payload);
      if(ok) S.pendingSaves.delete(qid);
    }
    const banner = document.getElementById('pendingSaveBanner');
    if(banner){
      if(S.pendingSaves.size===0) banner.remove();
      else banner.textContent = `⚠ ${S.pendingSaves.size} answer(s) not yet saved to server — retrying automatically in the background. Please don't close this tab.`;
    }
    if(S.pendingSaves.size===0){ clearInterval(S.pendingSaveTimer); S.pendingSaveTimer=null; setSaveStatus('saved'); }
  }, 6000);
}
async function flushPendingSaves(){
  if(!S.pendingSaves || S.pendingSaves.size===0) return true;
  for(const [qid, payload] of Array.from(S.pendingSaves.entries())){
    const ok = await attemptSaveOnce(payload);
    if(ok) S.pendingSaves.delete(qid);
  }
  return S.pendingSaves.size===0;
}

function mountMedMindFab(){
  if(document.getElementById('medmindFab')) return; // already mounted
  if(!S.medmindFabHistory) S.medmindFabHistory = [];
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <button id="medmindFab" class="medmind-fab" title="Ask MedMind">${medmindAvatar(30)}</button>
    <div class="medmind-fab-label">✨ Ask MedMind — AI Study Buddy</div>
    <div id="medmindPanel" class="medmind-panel" style="display:none;">
      <div class="medmind-panel-header">
        ${medmindAvatar(34)}
        <div style="flex:1;"><b style="color:#fff;font-size:14px;">MedMind</b><div style="font-size:11px;color:#CBD8F0;">Your AI study buddy</div></div>
        <button id="medmindPanelClose" style="background:none;border:none;color:#fff;font-size:18px;cursor:pointer;line-height:1;">✕</button>
      </div>
      <div id="medmindPanelLog" class="medmind-panel-log"></div>
      <div class="medmind-panel-input-row">
        <input id="medmindPanelInput" placeholder="Ask MedMind anything…">
        <button id="medmindPanelSend" class="btn btn-primary btn-sm">➤</button>
      </div>
      <div class="medmind-panel-footer">✨ Powered by AI — responses are auto-generated and may not always be accurate.</div>
    </div>
  `;
  document.body.appendChild(wrap);
  // Auto-dismiss the little label after a few seconds so it never sits
  // in the way of content underneath (e.g. score numbers) indefinitely.
  setTimeout(()=>{
    const lbl = document.querySelector('.medmind-fab-label');
    if(lbl){ lbl.classList.add('fading'); setTimeout(()=>lbl.remove(), 350); }
  }, 3000);

  function renderLog(){
    const log = document.getElementById('medmindPanelLog');
    if(!log) return;
    log.innerHTML = S.medmindFabHistory.length? S.medmindFabHistory.map(m=>{
      if(m.role==='assistant') return `<div style="display:flex;align-items:flex-start;gap:6px;margin-bottom:10px;">${medmindAvatar(22)}<span style="background:linear-gradient(135deg,#C084FC,#F472B6);color:#fff;padding:8px 12px;border-radius:12px;border-bottom-left-radius:3px;font-size:12.5px;max-width:80%;white-space:pre-line;">${esc(m.content)}</span></div>`;
      return `<div style="display:flex;justify-content:flex-end;margin-bottom:10px;"><span style="background:#fff;border:1px solid var(--border);padding:8px 12px;border-radius:12px;border-bottom-right-radius:3px;font-size:12.5px;max-width:80%;white-space:pre-line;">${esc(m.content)}</span></div>`;
    }).join('') : `<div style="text-align:center;color:var(--text2);font-size:12.5px;padding:20px 10px;">👋 Hi! I'm MedMind. Ask me anything about your prep, exam strategy, or a doubt you have.</div>`;
    log.scrollTop = log.scrollHeight;
  }
  renderLog();

  const send = async()=>{
    const input = document.getElementById('medmindPanelInput');
    if(!input) return;
    const q = input.value.trim();
    if(!q) return;
    input.value=''; input.disabled=true;
    S.medmindFabHistory.push({role:'user', content:q});
    renderLog();
    try{
      const res = await fetch('/.netlify/functions/ask-ai', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({mode:'doubt', question:q, history: S.medmindFabHistory.slice(0,-1), examTarget: S.currentUser?.examTarget||'FMGE'}),
      });
      const j = await res.json();
      if(!res.ok) throw new Error(j.error||'Could not get an answer');
      S.medmindFabHistory.push({role:'assistant', content:j.text});
    }catch(e){
      S.medmindFabHistory.push({role:'assistant', content:'Sorry, I could not answer that right now — please try again in a moment.'});
    }
    renderLog();
    const input2 = document.getElementById('medmindPanelInput');
    if(input2){ input2.disabled=false; input2.focus(); }
  };

  // Event delegation on document, instead of binding directly to the
  // just-created elements. This is deliberately more defensive: it keeps
  // working correctly even if this panel's DOM gets re-created or
  // temporarily detached for any reason, since the listener lives on
  // document and simply checks what was actually clicked/typed into.
  // IMPORTANT: mountMedMindFab() can be called many times over one page
  // session (every dashboard/analytics render) while unmountMedMindFab()
  // only removes the DOM, not these document-level listeners — so this
  // binding must only ever happen ONCE per page load, guarded by a flag,
  // otherwise every remount stacks another click/keydown listener and a
  // single tap eventually fires send() multiple times (duplicate messages,
  // duplicate API calls). The listeners below always look elements up
  // fresh by id, so a single early binding keeps working correctly against
  // whatever DOM the most recent mount created.
  if(!S._medmindListenersBound){
    S._medmindListenersBound = true;
    document.addEventListener('click', function(e){
      if(e.target.closest('#medmindFab')){
        const panel = document.getElementById('medmindPanel');
        if(!panel) return;
        panel.style.display = panel.style.display==='none'?'flex':'none';
        document.querySelector('.medmind-fab-label')?.remove();
        if(panel.style.display==='flex') document.getElementById('medmindPanelInput')?.focus();
      } else if(e.target.closest('#medmindPanelClose')){
        const panel = document.getElementById('medmindPanel'); if(panel) panel.style.display='none';
      } else if(e.target.closest('#medmindPanelSend')){
        document.getElementById('medmindPanelSend')?._send?.();
      }
    });
    document.addEventListener('keydown', function(e){
      if(e.target && e.target.id==='medmindPanelInput' && e.key==='Enter') document.getElementById('medmindPanelSend')?._send?.();
    });
  }
  // Stash the CURRENT mount's send() on the button itself so the
  // once-only listeners above always call the live closure (with the
  // live S.medmindFabHistory/renderLog) rather than a stale one from
  // the very first mount.
  const sendBtn = document.getElementById('medmindPanelSend');
  if(sendBtn) sendBtn._send = send;
}

  document.getElementById('medmindPanel')?.remove();
  document.querySelector('.medmind-fab-label')?.remove();

async function handleSectionSubmit(auto, reason='manual'){
  if(S.submittingSection) return; // guard: timer-timeout and a manual click can otherwise both fire this within the same instant
  S.submittingSection = true;
  try{
    const sec = S.activeSection;
    if(!auto) await saveCurrentResponse(false);
    if(S.pendingSaves && S.pendingSaves.size>0){
      toast('Finishing saving your last few answers before submitting…','ok');
      for(let i=0;i<3 && S.pendingSaves.size>0;i++) await flushPendingSaves();
    }
    if(S.examTimerHandle) clearInterval(S.examTimerHandle);
    if(S.pendingSaveTimer){ clearInterval(S.pendingSaveTimer); S.pendingSaveTimer=null; }
    detachExamSecurity();
    const { data, error } = await sb.rpc('student_submit_section', {p_token:S.studentToken, p_attempt_section_id: sec.attemptSectionId, p_reason: reason});
    S.activeSection = null;
    if(error){ toast('Could not submit: '+error.message,'err'); S.studentPage='dashboard'; render(); return; }
    if(data.testFinished){
      toast('All sections complete — your exam has been submitted!','ok');
      S.viewingResultAttemptId = null; // dashboard will show "View Result" using student_get_dashboard's attempt_id
      S.studentPage='dashboard';
      render();
      return;
    }

    // Real FMGE/NEET PG exams flow straight from one section into the next
    // section OF THE SAME PART with no detour back to a dashboard/instructions
    // screen — only a genuine part boundary (e.g. FMGE's break between Part A
    // and Part B) should ever drop the student back to the dashboard. So
    // before doing that, check whether the next section in this same part is
    // immediately ready, and if so, jump straight into it.
    if(S.activeTestId && S.activePartId){
      const { data: freshDash } = await sb.rpc('student_get_dashboard', {p_token: S.studentToken});
      const freshTest = (freshDash?.tests||[]).find(t=>t.id===S.activeTestId);
      const freshPart = freshTest?.parts?.find(p=>p.id===S.activePartId);
      if(freshPart && freshPart.status==='live'){
        const secs = freshPart.sections||[];
        const idx = secs.findIndex((s2, i)=> sectionStartable(secs, i).state==='start');
        if(idx !== -1){
          toast('Section submitted — moving to the next section…','ok');
          await startSection(secs[idx].id, S.activeTestId, S.activePartId);
          return;
        }
      }
    }

    toast('Section submitted','ok');
    S.studentPage='dashboard';
    render();
  } finally {
    // No matter how this ends (success, error, or an early return above),
    // always release the guard so the student is never stuck unable to
    // retry submitting after a transient failure.
    S.submittingSection = false;
  }
}

function playAlertBeep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const gain = ctx.createGain();
    gain.gain.value = 1; // full volume
    gain.connect(ctx.destination);
    [0, 220].forEach(delay=>{
      setTimeout(()=>{
        const osc = ctx.createOscillator();
        osc.type = 'square';
        osc.frequency.value = 880;
        osc.connect(gain);
        osc.start();
        osc.stop(ctx.currentTime + 0.18);
      }, delay);
    });
  }catch(e){ /* audio not available, ignore */ }
}

function attachExamSecurity(){

  window.onoffline = ()=>{ updateNetStatus(); toast('You appear to be offline — your answers will keep retrying automatically once you reconnect.','err'); };

      return e.returnValue;
    }
  };

      const count = data ?? (++S.activeSection.tabSwitchCount);

      await sb.rpc('student_log_activity', {p_token:S.studentToken, p_attempt_id:S.activeSection.attemptId, p_event_type:'fullscreen_exit'});

  };
  if(sec.disableCopyPaste){
    document.oncontextmenu = ()=> S.studentPage==='exam'? false : true;
    document.oncopy = ()=> S.studentPage==='exam'? false : true;
    document.onpaste = ()=> S.studentPage==='exam'? false : true;
  }
}

async function studentResult(root){
  const attemptId = S.viewingResultAttemptId;
  if(!attemptId){ S.studentPage='dashboard'; return renderStudentPage(root); }
  root.innerHTML = `<div class="empty-state">Loading your result…</div>`;
  const { data, error } = await sb.rpc('student_get_result', {p_token:S.studentToken, p_attempt_id: attemptId});
  if(error){ root.innerHTML = `<div class="empty-state">Could not load result: ${esc(error.message)}</div>`; return; }
  if(!data.resultsVisible){
    root.innerHTML = `<div class="empty-state" style="padding:60px 20px;"><div class="icon">⏳</div><p style="font-weight:700;color:var(--navy);">Your result has been recorded.</p>
    <p style="margin-top:6px;">The administrator hasn't released results for this test yet. Check back soon.</p>
    <button class="btn btn-ghost btn-sm" style="margin-top:16px;" onclick="S.studentPage='dashboard';render();">← Back to Dashboard</button></div>`;
    return;
  }
  const totalQ = data.correct + data.incorrect + data.unattempted;

  const subjAgg = {};
  (data.detail||[]).forEach(d=>{
    if(!subjAgg[d.subject]) subjAgg[d.subject] = {correct:0,wrong:0,total:0};
    subjAgg[d.subject].total++;
    if(d.is_correct === true) subjAgg[d.subject].correct++;
    else if(d.is_correct === false) subjAgg[d.subject].wrong++;
    // if is_correct is null, the question was never attempted (DNP) —
    // it still counts toward `total` above, just not correct/wrong.
  });
  const subjRows = Object.entries(subjAgg).map(([s,v])=>{
    const dnp = v.total - v.correct - v.wrong;
    const attempted = v.correct + v.wrong;
    return {
      subject:s, total:v.total, correct:v.correct, wrong:v.wrong, dnp,
      correctPct: v.total? Math.round(v.correct/v.total*100):0,
      wrongPct: v.total? Math.round(v.wrong/v.total*100):0,
      dnpPct: v.total? Math.round(dnp/v.total*100):0,
      attempted,
      accuracy: attempted>0? Math.round(v.correct/attempted*100) : null,
    };
  });
  subjRows.sort((a,b)=>a.correctPct-b.correctPct);
  const weakest = subjRows.slice(0,2).filter(s=>s.correctPct<70);

  const timedQs = (data.detail||[]).filter(d=>d.time_spent_sec>0);
  const avgTime = timedQs.length? Math.round(timedQs.reduce((a,d)=>a+d.time_spent_sec,0)/timedQs.length) : 0;
  const slowWrong = timedQs.filter(d=>d.time_spent_sec>90 && d.is_correct===false).length;

  root.innerHTML = `
    <div class="dash-hero fade-in-up" style="text-align:center;">
      <div class="dash-hero-top"><span class="dash-hero-tag">✓ EXAM COMPLETED</span></div>
      <div style="position:relative;z-index:1;">
        <div style="font-size:52px;font-weight:800;font-family:'Manrope';color:#fff;">${Number(data.score).toFixed(2)} <span style="font-size:22px;color:#9FB3D6;font-weight:600;">/ ${totalQ}</span></div>
        <p class="dash-hero-sub" style="margin:6px auto 0;">${esc(data.test_name||'')}</p>
      </div>
    </div>
    <div class="dash-stats fade-in-up" style="animation-delay:.08s;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));">
      <div class="dash-stat"><div class="dash-stat-icon" style="background:#ECFDF3;">✅</div><div><b style="color:var(--success)">${data.correct}</b><span>Correct</span></div></div>
      <div class="dash-stat"><div class="dash-stat-icon" style="background:#FEF3F2;">❌</div><div><b style="color:var(--error)">${data.incorrect}</b><span>Incorrect</span></div></div>
      <div class="dash-stat"><div class="dash-stat-icon" style="background:var(--surface-2);">➖</div><div><b style="color:var(--text2)">${data.unattempted}</b><span>Unattempted</span></div></div>
      <div class="dash-stat"><div class="dash-stat-icon" style="background:#EFF6FF;">🎯</div><div><b>${data.accuracy}%</b><span>Accuracy</span></div></div>
      ${data.rankingEnabled && data.rank? `<div class="dash-stat"><div class="dash-stat-icon" style="background:#FFFAEB;">🏆</div><div><b>#${data.rank}</b><span>All India Rank</span></div></div>
      <div class="dash-stat"><div class="dash-stat-icon" style="background:#FFFAEB;">📈</div><div><b>${data.percentile}</b><span>Percentile</span></div></div>`:''}
      ${avgTime? `<div class="dash-stat"><div class="dash-stat-icon" style="background:var(--surface-2);">⏱</div><div><b>${avgTime}s</b><span>Avg / question</span></div></div>`:''}
    </div>
    ${subjRows.length? `<div class="card pad fade-in-up" style="margin-top:20px;overflow-x:auto;animation-delay:.14s;">
      <h4 style="font-size:15px;margin-bottom:4px;">Subject-wise performance</h4>
      <p style="font-size:12px;color:var(--text2);margin-bottom:14px;"><b>Correct %</b> is out of all questions in that subject on this test. <b>Accuracy</b> is only out of the questions you actually attempted — the two are different on purpose.</p>
      <div class="table-wrap" style="max-height:360px;overflow-y:auto;"><table>
        <thead><tr><th>Subject</th><th>Total</th><th>Correct</th><th>Wrong</th><th>Not Attempted</th><th>Correct %</th><th>Wrong %</th><th>Not Attempted %</th><th>Attempted</th><th>Accuracy</th></tr></thead>
        <tbody>
        ${subjRows.map(v=>`<tr>
          <td><b>${esc(v.subject)}</b></td>
          <td>${v.total}</td>
          <td style="color:var(--success)">${v.correct}</td>
          <td style="color:var(--error)">${v.wrong}</td>
          <td style="color:var(--text2)">${v.dnp}</td>
          <td><b style="color:${v.correctPct>=70?'#12B76A':v.correctPct>=50?'#B45309':'#F04438'}">${v.correctPct}%</b></td>
          <td>${v.wrongPct}%</td>
          <td>${v.dnpPct}%</td>
          <td>${v.attempted}</td>
          <td>${v.accuracy===null? '<span style="color:var(--text2)">N/A</span>' : v.accuracy+'%'}</td>
        </tr>`).join('')}
        </tbody>
      </table></div>
    </div>`:''}
    <div class="welcome-band" style="margin-top:20px;">
      <h3 style="color:#fff;font-size:16px;">What went wrong, and what to do next</h3>
      ${data.unattempted>0? `<p>You left <b>${data.unattempted} question(s)</b> unattempted — even an educated guess is usually better than leaving a question blank (check your test's negative marking before assuming this always applies).</p>`:''}
      ${weakest.length? `<p>Your weakest area${weakest.length>1?'s were':' was'} <b>${weakest.map(w=>`${esc(w.subject)} (${w.correctPct}%)`).join(' and ')}</b> in this test. Prioritize revising ${weakest.length>1?'these subjects':'this subject'} before your next attempt.</p>` : `<p>Your subject-wise performance was fairly even this time — good consistency. Keep practicing to push every subject higher.</p>`}
      ${slowWrong>0? `<p>You spent over 90 seconds on <b>${slowWrong} question(s)</b> and still got them wrong — in a timed exam, it's often better to mark these for review and move on rather than getting stuck.</p>`:''}
      <p>📊 Check <button class="btn btn-outline btn-sm" style="background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.3);" onclick="S.studentPage='analytics';render();">My Analytics</button> to see how this compares with your overall trend across all tests.</p>
    </div>
    ${data.aiMentorEnabled!==false? `<div class="card pad" style="margin-top:20px;background:linear-gradient(180deg,#FDF4FF 0%,#ffffff 90px);border:1px solid #F3E8FF;">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px;">
        ${medmindAvatar(44)}
        <div>
          <h4 style="font-size:15.5px;margin:0;">MedMind</h4>
          <p style="font-size:11.5px;color:var(--text2);margin:0;">Your AI study buddy</p>
        </div>
      </div>
      <div id="aiGuidanceBox" style="margin-top:10px;">
        <button class="btn btn-primary btn-sm" id="getAiGuidanceBtn">Get My Personalized Guidance</button>
      </div>
      <div style="margin-top:16px;border-top:1px solid var(--border);padding-top:14px;">
        <div style="font-size:13px;color:var(--text2);margin-bottom:8px;">Have a doubt about this test or your preparation? Ask MedMind:</div>
        <div id="aiChatLog" style="margin-bottom:10px;max-height:340px;overflow-y:auto;"></div>
        <div style="display:flex;gap:8px;">
          <input id="aiDoubtInput" placeholder="Type your doubt or question…" style="flex:1;">
          <button class="btn btn-primary btn-sm" id="aiDoubtSendBtn">Ask</button>
        </div>
      </div>
    </div>`:''}
    ${data.allowReview && data.detail? `<div style="margin-top:20px;text-align:center;"><button class="btn btn-navy" id="reviewBtn">Review Question-wise Result</button></div>`:''}
    <div style="margin-top:16px;text-align:center;"><button class="btn btn-ghost btn-sm" id="backToDashBtn">← Back to Dashboard</button></div>
  `;
  const reviewBtn = $('#reviewBtn');
  if(reviewBtn) reviewBtn.onclick=()=>{ S.reviewDetail = data.detail; S.reviewTestName = data.test_name||''; S.reviewFilter='all'; S.studentPage='review'; render(); };
  $('#backToDashBtn').onclick=()=>{ S.studentPage='dashboard'; render(); };

  if(data.aiMentorEnabled!==false){
  $('#getAiGuidanceBtn').onclick=async()=>{
    const box = $('#aiGuidanceBox');
    box.innerHTML = `<div style="display:flex;gap:8px;align-items:flex-start;">${medmindAvatar(28)}<div style="font-size:13.5px;color:var(--text2);padding-top:4px;"><span class="spinner"></span> MedMind is thinking about your performance…</div></div>`;
    const contextStr = `Score: ${data.score}/${totalQ}, Accuracy: ${data.accuracy}%, Correct: ${data.correct}, Incorrect: ${data.incorrect}, Unattempted: ${data.unattempted}.\nSubject-wise: ${subjRows.map(s=>`${s.subject}: ${s.correct}/${s.total} correct (${s.correctPct}%)`).join('; ')}.`;
    try{
      const res = await fetch('/.netlify/functions/ask-ai', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({mode:'guidance', context: contextStr, examTarget: S.currentUser?.examTarget||'FMGE'}),
      });
      const j = await res.json();
      if(!res.ok) throw new Error(j.error||'Could not get guidance');
      box.innerHTML = `<div style="display:flex;gap:8px;align-items:flex-start;">${medmindAvatar(32)}<div>
        <div style="font-size:13.5px;line-height:1.6;white-space:pre-line;background:linear-gradient(135deg,#C084FC,#F472B6);color:#fff;border-radius:14px;border-bottom-left-radius:4px;padding:12px 14px;">${esc(j.text)}</div>
        <span style="display:inline-block;margin-top:6px;font-size:10.5px;font-weight:700;color:#A855F7;background:#FAF5FF;padding:3px 9px;border-radius:100px;">✨ Answered by MedMind</span>
      </div></div>`;
    }catch(e){
      box.innerHTML = `<div style="font-size:13px;color:var(--error);">Could not load AI guidance: ${esc(e.message)}. <button class="btn btn-ghost btn-sm" id="getAiGuidanceBtn2">Retry</button></div>`;
      const retryBtn = $('#getAiGuidanceBtn2'); if(retryBtn) retryBtn.onclick=()=>$('#getAiGuidanceBtn')?.click();
    }
  };

  if(!S.aiChatHistory) S.aiChatHistory = [];
  function renderAiChatLog(){
    $('#aiChatLog').innerHTML = S.aiChatHistory.map(m=>{
      if(m.role==='assistant'){
        return `<div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:14px;">
          ${medmindAvatar(30)}
          <div>
            <span style="display:inline-block;max-width:78%;padding:10px 14px;border-radius:14px;border-bottom-left-radius:4px;font-size:13px;white-space:pre-line;background:linear-gradient(135deg,#C084FC,#F472B6);color:#fff;">${esc(m.content)}</span>
            <div><span style="display:inline-block;margin-top:5px;font-size:10px;font-weight:700;color:#A855F7;background:#FAF5FF;padding:2px 8px;border-radius:100px;">✨ Answered by MedMind</span></div>
          </div>
        </div>`;
      }
      return `<div style="display:flex;justify-content:flex-end;margin-bottom:14px;">
        <span style="display:inline-block;max-width:78%;padding:10px 14px;border-radius:14px;border-bottom-right-radius:4px;font-size:13px;white-space:pre-line;background:#fff;border:1px solid var(--border);box-shadow:0 1px 2px rgba(16,24,40,.05);color:var(--text);">${esc(m.content)}</span>
      </div>`;
    }).join('');
    const log = $('#aiChatLog'); if(log) log.scrollTop = log.scrollHeight;
  }
  renderAiChatLog();
  const sendDoubt = async()=>{
    const input = $('#aiDoubtInput');
    const q = input.value.trim();
    if(!q) return;
    input.value=''; input.disabled=true; $('#aiDoubtSendBtn').disabled=true;
    S.aiChatHistory.push({role:'user', content:q});
    renderAiChatLog();
    try{
      const res = await fetch('/.netlify/functions/ask-ai', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({mode:'doubt', question:q, history: S.aiChatHistory.slice(0,-1), examTarget: S.currentUser?.examTarget||'FMGE'}),
      });
      const j = await res.json();
      if(!res.ok) throw new Error(j.error||'Could not get an answer');
      S.aiChatHistory.push({role:'assistant', content:j.text});
    }catch(e){
      S.aiChatHistory.push({role:'assistant', content:'Sorry, I could not answer that right now — please try again in a moment.'});
    }
    renderAiChatLog();
    input.disabled=false; $('#aiDoubtSendBtn').disabled=false; input.focus();
  };
  $('#aiDoubtSendBtn').onclick=sendDoubt;
  $('#aiDoubtInput').onkeydown=(e)=>{ if(e.key==='Enter') sendDoubt(); };
  }
}
async function studentReview(root){
  const detail = S.reviewDetail || [];
  const markedQs = detail.map((d,i)=>({d,i})).filter(x=>x.d.is_marked);
  if(!S.reviewFilter) S.reviewFilter = 'all';
  const showList = S.reviewFilter==='marked' ? markedQs.map(x=>x) : detail.map((d,i)=>({d,i}));
  root.innerHTML = `
    <div class="no-print" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;">
      <button class="btn btn-ghost btn-sm" onclick="S.studentPage='result';render();">← Back to Result</button>
      <button class="btn btn-outline btn-sm" onclick="window.print()">🖨 Print / Save as PDF</button>
    </div>
    <div class="print-header" style="display:none;">
      <h2>${esc(S.currentUser?.name||'Student')} — Question-wise Review</h2>
      <p>${esc(S.reviewTestName||'')} · Printed on ${new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}</p>
      <hr>
    </div>
    <h3 style="font-size:17px;margin-bottom:14px;">Question-wise review</h3>
    ${markedQs.length? `<div class="no-print" style="background:#FFF7ED;border:1px solid #FED7AA;border-radius:8px;padding:10px 14px;margin-bottom:16px;">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px;">
        <div style="font-size:12px;font-weight:700;color:#9A3412;text-transform:uppercase;letter-spacing:.3px;">🚩 You marked ${markedQs.length} question(s) for review during the exam</div>
        <button type="button" id="reviewFilterToggle" class="btn btn-sm" style="background:${S.reviewFilter==='marked'?'var(--accent)':'#fff'};color:${S.reviewFilter==='marked'?'#fff':'var(--accent)'};border:1px solid var(--accent);">
          ${S.reviewFilter==='marked' ? '📋 Show All Questions' : '👁 View Only Marked Questions'}
        </button>
      </div>
      ${S.reviewFilter!=='marked'? `<div style="display:flex;flex-wrap:wrap;gap:6px;">${markedQs.map(x=>`<button type="button" class="jump-to-marked-chip" data-idx="${x.i}" style="width:30px;height:30px;border-radius:6px;border:1px solid var(--accent);background:#fff;color:var(--accent);font-size:12.5px;font-weight:700;cursor:pointer;">${x.i+1}</button>`).join('')}</div>`:''}
    </div>`:''}
    ${S.reviewFilter==='marked' && !showList.length? `<div class="empty-state">No questions were marked for review in this attempt.</div>`:''}
    ${showList.map(({d,i})=>{
      const result = d.is_correct === true ? 'correct' : d.is_correct === false ? 'incorrect' : 'unattempted';
      const icon = result==='correct'?'✅':result==='incorrect'?'❌':'—';
      return `<div class="qcard" id="revq-${i}">
        <div class="qmeta"><span class="badge badge-grey">Q${i+1}</span><span class="badge badge-blue">${esc(d.subject)}</span>
          <span class="badge ${result==='correct'?'badge-success':result==='incorrect'?'badge-error':'badge-grey'}">${icon} ${result}</span>
          ${d.is_marked? `<span class="badge badge-warning">🚩 Marked for Review</span>`:''}</div>
        <p style="font-size:14px;margin-bottom:10px;">${esc(d.text)}</p>
        ${d.image_url?`<img class="qimg" src="${esc(d.image_url)}" style="max-width:280px;">`:''}
        ${['a','b','c','d'].filter(k=>d['option_'+k]).map(k=>{
          const K = k.toUpperCase();
          const isCorrect = d.correct===K;
          const isSelected = d.selected===K;
          return `<div class="opt-row ${isCorrect?'correct':''}" style="${isSelected && !isCorrect?'color:var(--error);font-weight:700;':''}">
            ${isCorrect?'✅':isSelected?'❌':'○'} <b>${K}.</b> ${esc(d['option_'+k])}
          </div>`;
        }).join('')}
        ${d.explanation? `<div style="margin-top:8px;padding:10px;background:#F9FAFB;border-radius:8px;font-size:13px;"><b>Explanation:</b> ${esc(d.explanation)}</div>`:''}
      </div>`;
    }).join('')}
  `;
  const filterToggle = $('#reviewFilterToggle');
  if(filterToggle) filterToggle.onclick=()=>{ S.reviewFilter = S.reviewFilter==='marked'? 'all':'marked'; renderStudentPage(root); };
  $$('.jump-to-marked-chip').forEach(btn=>btn.onclick=()=>{
    document.getElementById('revq-'+btn.dataset.idx)?.scrollIntoView({behavior:'smooth',block:'center'});
  });
}


// =========================================================================
// BOOT
// =========================================================================
(async function init(){
  render();
  await boot();
  render();
})();
</script>
</body>
</html>
