// One shared AudioContext, created lazily and reused — browsers create a
// new AudioContext in a "suspended" state until it's explicitly resumed,
// which (without this fix) silently swallowed every beep with no error:
// a fresh context was created on every call and never resumed, so nothing
// was ever audible even though the code "ran fine". Reusing one context
// and calling resume() before every beep fixes that for good.
let _alertAudioCtx = null;
function playAlertBeep(){
  try{
    if(!_alertAudioCtx) _alertAudioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const ctx = _alertAudioCtx;
    const fire = ()=>{
      const gain = ctx.createGain();
      gain.gain.value = 1; // full volume
      gain.connect(ctx.destination);
      [0, 220].forEach(delay=>{
        setTimeout(()=>{
          const osc = ctx.createOscillator();
          osc.type = 'square';
          osc.frequency.value = 880;
          osc.connect(gain);
          osc.start();
          osc.stop(ctx.currentTime + 0.18);
        }, delay);
      });
    };
    if(ctx.state === 'suspended'){ ctx.resume().then(fire).catch(()=>{}); }
    else { fire(); }
  }catch(e){ /* audio not available, ignore */ }
}
function requestFullscreenIfNeeded(){
  const sec = S.activeSection;
  if(sec && sec.fullscreenRequired && !document.fullscreenElement){
    document.documentElement.requestFullscreen?.().catch(()=>{});
  }
}
function updateNetStatus(){
  const el = document.getElementById('netStatus');
  if(!el) return;
  if(navigator.onLine){ el.style.background='#ECFDF5'; el.style.color='#047857'; el.textContent='🟢 Online'; }
  else { el.style.background='#FEF2F2'; el.style.color='#B91C1C'; el.textContent='🔴 Offline'; }
}
// One retry (after a short delay) before falling back to a local increment —
// reduces how often a single network blip makes the on-screen violation
// count briefly drift from the server's real count (it always self-corrects
// on the next successful log call either way, this just shrinks that window).
async function logActivityWithRetry(payload){
  let res = await sb.rpc('student_log_activity', payload);
  if(res.error && !isSessionInvalidError(res.error)){
    await new Promise(r=>setTimeout(r, 800));
    res = await sb.rpc('student_log_activity', payload);
  }
  return res;
}
// Best-effort, fire-and-forget device/IP capture for a violation event —
// a completely SEPARATE call from logActivityWithRetry() above, writing to
// its own new table via a new RPC, so the existing student_log_activity
// signature (which the Live Monitor already depends on) is never touched.
// The real IP is read server-side from the request headers (can't be
// spoofed from here the way a client-supplied value could); the device/
// browser string is read client-side since there's no other way to get it.
// Never awaited by callers, and any error here (e.g. this feature isn't
// set up on the server yet) is silently swallowed — it must never affect
// the exam flow or the existing violation-count logic.
function logViolationDeviceInfo(attemptId, eventType){
  try{
    sb.rpc('student_log_violation_device', {
      p_token: S.studentToken, p_attempt_id: attemptId, p_event_type: eventType,
      p_user_agent: navigator.userAgent || null,
    }).then(({error})=>{ if(error) console.error('[device-log] failed:', error.message, {attemptId, eventType}); })
      .catch((e)=>{ console.error('[device-log] network error:', e); });
  }catch(e){ /* ignore */ }
}
// Shared logic for BOTH the visibilitychange and window-blur triggers (see
// attachExamSecurity below for why there are two). S._tabAwayGuard makes
// sure a single "student left the exam tab/window" episode is only ever
// counted once, even when both events fire for it.
//
// LOCAL-FIRST: the beep + on-screen warning fire IMMEDIATELY, synchronously,
// using a locally-tracked count — they never wait on a network round trip.
// The previous version awaited the server log call FIRST and only then
// played the sound/showed the toast; if that call was slow (or failed and
// went through its own 800ms retry) while the tab was already backgrounded,
// the warning could end up firing late, or its logic could throw and skip
// the warning entirely on a network hiccup. The deterrent itself must never
// depend on the network being fast or even up — only the audit-trail LOG
// of it does, and that still happens right after, in the background.
function recordTabAwayViolation(){
  if(S._tabAwayGuard) return;
  if(!(S.studentPage==='exam' && S.activeSection)) return;
  S._tabAwayGuard = true;
  const sec = S.activeSection;
  const count = ++sec.tabSwitchCount;
  const limit = sec.tabSwitchLimit || 3;
  playAlertBeep();
  if(count >= limit){
    toast(`Too many tab switches (${count}/${limit}) — this section is being auto-submitted`,'err');
    handleSectionSubmit(true, 'auto_tab_switch');
  } else {
    toast(`Warning ${count}/${limit}: switching tabs/windows during the exam is recorded`,'err');
  }
  // Server log + device/IP capture happen AFTER the warning already fired —
  // best-effort, never blocking or gating the deterrent above. If the
  // server's own count ever disagrees with the local one (e.g. this same
  // attempt is also open in another tab), it corrects silently next time.
  (async()=>{
    try{
      const { data, error } = await logActivityWithRetry({p_token:S.studentToken, p_attempt_id:sec.attemptId, p_event_type:'tab_switch'});
      if(error && isSessionInvalidError(error)){ handleSessionKickedOut(); return; }
      if(typeof data === 'number') sec.tabSwitchCount = data;
      logViolationDeviceInfo(sec.attemptId, 'tab_switch');
    }catch(e){ /* purely a logging failure — the warning itself already happened */ }
  })();
}
function attachExamSecurity(){
  const sec = S.activeSection;
  if(!sec) return;
  updateNetStatus();
  window.ononline = ()=>{ updateNetStatus(); toast('Back online — saving any pending answers…','ok'); flushPendingSaves(); };
  window.onoffline = ()=>{ updateNetStatus(); toast('You appear to be offline — your answers will keep retrying automatically once you reconnect.','err'); };
  window.onbeforeunload = (e)=>{
    if(S.pendingSaves && S.pendingSaves.size>0){
      e.preventDefault(); e.returnValue = 'Some of your answers have not finished saving yet. Are you sure you want to leave?';
      return e.returnValue;
    }
  };
  // Tab-switch detection previously relied ONLY on visibilitychange/
  // document.hidden — which, on several OS/browser combinations, does NOT
  // fire when the student Alt-Tabs to a different application while the
  // browser window itself stays open (not minimized, not covered): the tab
  // is still technically "visible" even though the student is looking at
  // another app. window.blur fires reliably in that exact case (any loss
  // of window focus, same-browser tab switch or a different application),
  // so it's now also wired in as a second, more reliable trigger for the
  // same violation — with a guard so switching away only counts ONCE per
  // "episode" even though both events can fire together for an in-browser
  // tab switch.
  window.onblur = ()=>{ recordTabAwayViolation(); };
  window.onfocus = ()=>{ S._tabAwayGuard = false; };
  document.onvisibilitychange = async ()=>{
    if(document.hidden){ recordTabAwayViolation(); }
    else { S._tabAwayGuard = false; }
  };
  document.onfullscreenchange = ()=>{
    if(sec.fullscreenRequired && !document.fullscreenElement && S.studentPage==='exam' && S.activeSection){
      // Same local-first fix as recordTabAwayViolation() above — the beep/
      // toast fire immediately, the server log happens right after in the
      // background, never gating the deterrent on a network round trip.
      const activeSec = S.activeSection;
      const count = ++activeSec.fullscreenExitCount;
      const limit = activeSec.tabSwitchLimit || 3;
      playAlertBeep();
      if(count >= limit){
        toast(`Too many fullscreen exits (${count}/${limit}) — this section is being auto-submitted`,'err');
        handleSectionSubmit(true, 'auto_fullscreen_exit');
      } else {
        toast(`Warning ${count}/${limit}: leaving full-screen mode during the exam is recorded — please stay in full-screen`,'err');
      }
      (async()=>{
        try{
          const { data, error } = await logActivityWithRetry({p_token:S.studentToken, p_attempt_id:activeSec.attemptId, p_event_type:'fullscreen_exit'});
          if(error && isSessionInvalidError(error)){ handleSessionKickedOut(); return; }
          if(typeof data === 'number') activeSec.fullscreenExitCount = data;
          logViolationDeviceInfo(activeSec.attemptId, 'fullscreen_exit');
        }catch(e){ /* purely a logging failure — the warning itself already happened */ }
      })();
    }
  };
  if(sec.disableCopyPaste){
    document.oncontextmenu = ()=> S.studentPage==='exam'? false : true;
    document.oncopy = ()=> S.studentPage==='exam'? false : true;
    document.onpaste = ()=> S.studentPage==='exam'? false : true;
  }
}
function detachExamSecurity(){
  window.onbeforeunload = null;
  window.ononline = null;
  window.onoffline = null;
  window.onblur = null;
  window.onfocus = null;
  document.onvisibilitychange = null;
  document.onfullscreenchange = null;
  document.oncontextmenu = null;
  document.oncopy = null;
  document.onpaste = null;
  if(document.fullscreenElement) document.exitFullscreen?.().catch(()=>{});
}

  if(!data.resultsVisible){
    root.innerHTML = `<div class="empty-state" style="padding:60px 20px;"><div class="icon">⏳</div><p style="font-weight:700;color:var(--navy);">Your result has been recorded.</p>

    <button class="btn btn-ghost btn-sm" style="margin-top:16px;" onclick="S.studentPage='dashboard';render();">← Back to Dashboard</button></div>`;
    return;
  }
  const totalQ = data.correct + data.incorrect + data.unattempted;
  // "You vs Class Average" — a brand-new, additive RPC (does not touch
  // student_get_result at all). Fails silently to "no comparison shown" if
  // the SQL hasn't been run yet, or if there's only one submitted attempt
  // (comparing yourself to yourself isn't useful).
  let classAvg = null;
  try{
    const { data: avgData, error: avgErr } = await sb.rpc('student_get_class_average', {p_token:S.studentToken, p_attempt_id: attemptId});
    if(!avgErr && avgData && Number(avgData.total_attempts)>1) classAvg = avgData;
  }catch(e){ /* feature not set up yet — just don't show the comparison */ }

  const subjAgg = {};
  (data.detail||[]).forEach(d=>{
    if(!subjAgg[d.subject]) subjAgg[d.subject] = {correct:0,wrong:0,total:0};
    subjAgg[d.subject].total++;
    if(d.is_correct === true) subjAgg[d.subject].correct++;
    else if(d.is_correct === false) subjAgg[d.subject].wrong++;
    // if is_correct is null, the question was never attempted (DNP) —
    // it still counts toward `total` above, just not correct/wrong.
  });
  const subjRows = Object.entries(subjAgg).map(([s,v])=>{
    const dnp = v.total - v.correct - v.wrong;
    const attempted = v.correct + v.wrong;

      subject:s, total:v.total, correct:v.correct, wrong:v.wrong, dnp,
      correctPct: v.total? Math.round(v.correct/v.total*100):0,
      wrongPct: v.total? Math.round(v.wrong/v.total*100):0,

      <p class="glr-test-subtitle">${esc(data.test_name||'')}</p>
    </div>
    <div class="gld-stats-container fade-in-up" style="animation-delay:.08s;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));">
      <div class="gld-stat-card"><div class="gld-stat-icon-wrapper" style="background:var(--gld-success-light);">✅</div><div class="gld-stat-info"><div class="gld-stat-number" style="color:var(--gld-success);">${data.correct}</div><div class="gld-stat-desc">Correct Answers</div></div></div>
      <div class="gld-stat-card"><div class="gld-stat-icon-wrapper" style="background:var(--gld-danger-light);">❌</div><div class="gld-stat-info"><div class="gld-stat-number" style="color:var(--gld-danger);">${data.incorrect}</div><div class="gld-stat-desc">Incorrect Answers</div></div></div>
      <div class="gld-stat-card"><div class="gld-stat-icon-wrapper" style="background:#f1f5f9;">➖</div><div class="gld-stat-info"><div class="gld-stat-number" style="color:var(--gld-text-sub);">${data.unattempted}</div><div class="gld-stat-desc">Unattempted</div></div></div>
      <div class="gld-stat-card"><div class="gld-stat-icon-wrapper" style="background:var(--gld-primary-light);">🎯</div><div class="gld-stat-info"><div class="gld-stat-number" style="color:var(--gld-primary);">${data.accuracy}%</div><div class="gld-stat-desc">Accuracy Rate</div></div></div>
      ${data.rankingEnabled && data.rank? `<div class="gld-stat-card"><div class="gld-stat-icon-wrapper" style="background:var(--gld-accent-light);">🏆</div><div class="gld-stat-info"><div class="gld-stat-number">#${data.rank}</div><div class="gld-stat-desc">All India Rank</div></div></div>
      <div class="gld-stat-card"><div class="gld-stat-icon-wrapper" style="background:var(--gld-accent-light);">📈</div><div class="gld-stat-info"><div class="gld-stat-number">${data.percentile}</div><div class="gld-stat-desc">Percentile</div></div></div>`:''}
      ${avgTime? `<div class="gld-stat-card"><div class="gld-stat-icon-wrapper" style="background:#f1f5f9;">⏱</div><div class="gld-stat-info"><div class="gld-stat-number">${avgTime}s</div><div class="gld-stat-desc">Avg / question</div></div></div>`:''}
    </div>
    ${classAvg? `<div class="glr-parts-card fade-in-up" style="animation-delay:.1s;">
      <h3 style="font-family:'Outfit',sans-serif;font-size:17px;font-weight:800;margin-bottom:12px;">📊 You vs Class Average</h3>
      <div class="gld-stats-container" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));">
        <div class="gld-stat-card">
          <div class="gld-stat-icon-wrapper" style="background:${Number(data.score)>=Number(classAvg.avg_score)?'var(--gld-success-light)':'var(--gld-danger-light)'};">${Number(data.score)>=Number(classAvg.avg_score)?'▲':'▼'}</div>
          <div class="gld-stat-info">
            <div class="gld-stat-number" style="color:${Number(data.score)>=Number(classAvg.avg_score)?'var(--gld-success)':'var(--gld-danger)'};">${Number(data.score).toFixed(2)} <span style="font-size:12px;font-weight:600;color:var(--gld-text-sub);">vs ${Number(classAvg.avg_score).toFixed(2)}</span></div>
            <div class="gld-stat-desc">Your Score vs Class Average</div>
          </div>
        </div>
        <div class="gld-stat-card">
          <div class="gld-stat-icon-wrapper" style="background:${Number(data.accuracy)>=Number(classAvg.avg_accuracy)?'var(--gld-success-light)':'var(--gld-danger-light)'};">${Number(data.accuracy)>=Number(classAvg.avg_accuracy)?'▲':'▼'}</div>
          <div class="gld-stat-info">
            <div class="gld-stat-number" style="color:${Number(data.accuracy)>=Number(classAvg.avg_accuracy)?'var(--gld-success)':'var(--gld-danger)'};">${data.accuracy}% <span style="font-size:12px;font-weight:600;color:var(--gld-text-sub);">vs ${Number(classAvg.avg_accuracy).toFixed(1)}%</span></div>
            <div class="gld-stat-desc">Your Accuracy vs Class Average</div>
          </div>
        </div>
      </div>
      <p style="font-size:11.5px;color:var(--gld-text-sub);margin-top:10px;">Based on ${classAvg.total_attempts} submitted attempt${classAvg.total_attempts===1?'':'s'} for this test, including yours.</p>
    </div>` : ''}
    ${masteryHTML}
    ${partSectionHTML}
    <div class="glr-advice-band fade-in-up" style="animation-delay:.16s;">
      <h4>💡 What went wrong, and what to do next</h4>
      ${data.unattempted>0? `<p>You left <b>${data.unattempted} question(s)</b> unattempted — even an educated guess is usually better than leaving a question blank (check your test's negative marking before assuming this always applies).</p>`:''}
      ${weakest.length? `<p>Your weakest area${weakest.length>1?'s were':' was'} <b>${weakest.map(w=>`${esc(w.subject)} (${w.correctPct}%)`).join(' and ')}</b> in this test. Prioritize revising ${weakest.length>1?'these subjects':'this subject'} before your next attempt.</p>` : `<p>Your subject-wise performance was fairly even this time — good consistency. Keep practicing to push every subject higher.</p>`}
      ${slowWrong>0? `<p>You spent over 90 seconds on <b>${slowWrong} question(s)</b> and still got them wrong — in a timed exam, it's often better to mark these for review and move on rather than getting stuck.</p>`:''}
      <p style="margin-top:8px;">📊 Check <a href="#" class="glr-analytics-link" id="glrAnalyticsLink">My Analytics</a> to see how this compares with your overall trend across all tests.</p>
    </div>
    ${data.aiMentorEnabled!==false? `<div class="glr-medmind-card">
      <div class="glr-medmind-head">
        ${medmindAvatar(44)}
        <div>
          <h4>MedMind</h4>
          <span>Your AI Study Buddy</span>
        </div>
      </div>
      <div id="aiGuidanceBox" style="margin-top:10px;">
        <button class="glr-btn-purple" id="getAiGuidanceBtn">✨ Get My Personalized Guidance</button>
      </div>
      <div style="margin-top:16px;border-top:1px solid #f3e8ff;padding-top:14px;">
        <div style="font-size:12.5px;color:var(--gld-text-muted);font-weight:600;margin-bottom:8px;">Have a doubt about this test or your preparation? Ask MedMind:</div>
        <div id="aiChatLog" class="glr-chat-log"></div>
        <div class="glr-ask-row">
          <input id="aiDoubtInput" class="glr-ask-input" placeholder="Type your doubt or question…">
          <button class="glr-btn-purple" id="aiDoubtSendBtn" style="padding:0 20px;">Ask</button>
        </div>
      </div>
    </div>`:''}
    <div class="glr-bottom-cta">
      ${data.allowReview && data.detail? `<button class="glr-btn-review-main" id="reviewBtn">Review Question-wise Result ›</button>`:''}
      <button class="glr-back-link" id="backToDashBtn">← Back to Dashboard</button>
    </div>
  `;
  const reviewBtn = $('#reviewBtn');
  if(reviewBtn) reviewBtn.onclick=()=>{ S.reviewDetail = data.detail; S.reviewTestName = data.test_name||''; S.reviewExamCode = S.viewingResultExamCode||null; S.reviewFilter='all'; S.studentPage='review'; render(); };
  $('#backToDashBtn').onclick=()=>{ S.studentPage='dashboard'; render(); };
  const glrAnalyticsLink = $('#glrAnalyticsLink');
  if(glrAnalyticsLink) glrAnalyticsLink.onclick=(e)=>{ e.preventDefault(); S.studentPage='analytics'; render(); };

  // Animate the horizontal liquid wave fills in on mount (real correctPct
  // values only — matches the reference's on-load fill animation).
  setTimeout(()=>{ $$('.glr-liquid-fill').forEach(f=>{ f.style.width = f.dataset.fill; }); }, 150);

  // Matrix ↔ Table view switcher.
  $$('.glr-view-btn').forEach(btn=>btn.onclick=()=>{
    $$('.glr-view-btn').forEach(b=>b.classList.toggle('active', b===btn));
    const mode = btn.dataset.view;
    const grid = $('#glrMatrixView'), tbl = $('#glrTableWrap');
    if(grid) grid.style.display = mode==='table'? 'none' : 'grid';
    if(tbl) tbl.style.display = mode==='table'? 'block' : 'none';
  });

  // Category filter + live search — both act together on the real
  // per-subject rows already computed above (matrix cards AND table rows).
  let glrCat = 'all';
  const glrApplyFilter = ()=>{
    const q = ($('#glrSubjectSearch')?.value||'').toLowerCase();
    $$('.glr-vial-row').forEach(row=>{
      const matchCat = glrCat==='all' || row.dataset.cat===glrCat;
      const matchQ = row.dataset.name.toLowerCase().includes(q);
      row.style.display = (matchCat && matchQ)? 'flex' : 'none';
    });
    $$('#glrTableBody tr').forEach(row=>{
      const matchCat = glrCat==='all' || row.dataset.cat===glrCat;
      const matchQ = row.dataset.name.toLowerCase().includes(q);
      row.style.display = (matchCat && matchQ)? '' : 'none';
    });
  };
  $$('.glr-pill-btn').forEach(btn=>btn.onclick=()=>{
    $$('.glr-pill-btn').forEach(b=>b.classList.toggle('active', b===btn));
    glrCat = btn.dataset.cat;
    glrApplyFilter();
  });
  const glrSearchInput = $('#glrSubjectSearch');
  if(glrSearchInput) glrSearchInput.oninput = glrApplyFilter;

  // Live sorting — reorders both the matrix cards and the table rows
  // together, using the same real data-pct/data-q/data-name attributes.
  const glrSortSelect = $('#glrSortSelect');
  if(glrSortSelect) glrSortSelect.onchange = ()=>{
    const val = glrSortSelect.value;
    const cmp = (a,b)=>{
      if(val==='high-low') return parseFloat(b.dataset.pct)-parseFloat(a.dataset.pct);
      if(val==='low-high') return parseFloat(a.dataset.pct)-parseFloat(b.dataset.pct);
      if(val==='alpha') return a.dataset.name.localeCompare(b.dataset.name);
      if(val==='questions') return parseInt(b.dataset.q)-parseInt(a.dataset.q);
      return 0;
    };
    const grid = $('#glrMatrixView');
    if(grid){ Array.from(grid.querySelectorAll('.glr-vial-row')).sort(cmp).forEach(r=>grid.appendChild(r)); }
    const tbody = $('#glrTableBody');
    if(tbody){ Array.from(tbody.querySelectorAll('tr')).sort(cmp).forEach(r=>tbody.appendChild(r)); }
  };

  if(data.aiMentorEnabled!==false){
  $('#getAiGuidanceBtn').onclick=async()=>{
    const box = $('#aiGuidanceBox');
    box.innerHTML = `<div style="display:flex;gap:8px;align-items:flex-start;">${medmindAvatar(28)}<div style="font-size:13.5px;color:var(--text2);padding-top:4px;"><span class="spinner"></span> MedMind is thinking about your performance…</div></div>`;
    const contextStr = `Score: ${data.score}/${totalQ}, Accuracy: ${data.accuracy}%, Correct: ${data.correct}, Incorrect: ${data.incorrect}, Unattempted: ${data.unattempted}.\nSubject-wise: ${subjRows.map(s=>`${s.subject}: ${s.correct}/${s.total} correct (${s.correctPct}%)`).join('; ')}.`;
    try{
      const res = await fetch('/.netlify/functions/ask-ai', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({mode:'guidance', context: contextStr, examTarget: S.currentUser?.examTarget||'FMGE'}),
      });
      const j = await res.json();
      if(!res.ok) throw new Error(j.error||'Could not get guidance');
      box.innerHTML = `<div style="display:flex;gap:8px;align-items:flex-start;">${medmindAvatar(32)}<div>
        <div style="font-size:13.5px;line-height:1.6;white-space:pre-line;background:linear-gradient(135deg,#C084FC,#F472B6);color:#fff;border-radius:14px;border-bottom-left-radius:4px;padding:12px 14px;">${esc(j.text)}</div>
        <span style="display:inline-block;margin-top:6px;font-size:10.5px;font-weight:700;color:#A855F7;background:#FAF5FF;padding:3px 9px;border-radius:100px;">✨ Answered by MedMind</span>
      </div></div>`;
    }catch(e){
      box.innerHTML = `<div style="font-size:13px;color:var(--error);">Could not load AI guidance: ${esc(e.message)}. <button class="btn btn-ghost btn-sm" id="getAiGuidanceBtn2">Retry</button></div>`;
      const retryBtn = $('#getAiGuidanceBtn2'); if(retryBtn) retryBtn.onclick=()=>$('#getAiGuidanceBtn')?.click();
    }
  };

  if(!S.aiChatHistory) S.aiChatHistory = [];
  function renderAiChatLog(){
    $('#aiChatLog').innerHTML = S.aiChatHistory.map(m=>{
      if(m.role==='assistant'){
        return `<div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:14px;">
          ${medmindAvatar(30)}
          <div>
            <span style="display:inline-block;max-width:78%;padding:10px 14px;border-radius:14px;border-bottom-left-radius:4px;font-size:13px;white-space:pre-line;background:linear-gradient(135deg,#C084FC,#F472B6);color:#fff;">${esc(m.content)}</span>
            <div><span style="display:inline-block;margin-top:5px;font-size:10px;font-weight:700;color:#A855F7;background:#FAF5FF;padding:2px 8px;border-radius:100px;">✨ Answered by MedMind</span></div>
          </div>
        </div>`;
      }
      return `<div style="display:flex;justify-content:flex-end;margin-bottom:14px;">
        <span style="display:inline-block;max-width:78%;padding:10px 14px;border-radius:14px;border-bottom-right-radius:4px;font-size:13px;white-space:pre-line;background:#fff;border:1px solid var(--border);box-shadow:0 1px 2px rgba(16,24,40,.05);color:var(--text);">${esc(m.content)}</span>
      </div>`;
    }).join('');
    const log = $('#aiChatLog'); if(log) log.scrollTop = log.scrollHeight;
  }
  renderAiChatLog();
  const sendDoubt = async()=>{
    const input = $('#aiDoubtInput');
    const q = input.value.trim();
    if(!q) return;
    input.value=''; input.disabled=true; $('#aiDoubtSendBtn').disabled=true;
    S.aiChatHistory.push({role:'user', content:q});
    renderAiChatLog();
    try{
      const res = await fetch('/.netlify/functions/ask-ai', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({mode:'doubt', question:q, history: S.aiChatHistory.slice(0,-1), examTarget: S.currentUser?.examTarget||'FMGE'}),
      });
      const j = await res.json();
      if(!res.ok) throw new Error(j.error||'Could not get an answer');
      S.aiChatHistory.push({role:'assistant', content:j.text});
    }catch(e){
      S.aiChatHistory.push({role:'assistant', content:'Sorry, I could not answer that right now — please try again in a moment.'});
    }
    renderAiChatLog();
    input.disabled=false; $('#aiDoubtSendBtn').disabled=false; input.focus();
  };
  $('#aiDoubtSendBtn').onclick=sendDoubt;
  $('#aiDoubtInput').onkeydown=(e)=>{ if(e.key==='Enter') sendDoubt(); };
  }
}
async function studentReview(root){
  const detail = S.reviewDetail || [];
  // Tag every question with the exam this attempt belongs to (captured when
  // "View result" was clicked from the Dashboard) — needed so a question
  // auto-marked or manually bookmarked from this page carries its exam,
  // for the Marked for Review page's exam filter.
  detail.forEach(d=>{ if(d.exam_code===undefined) d.exam_code = S.reviewExamCode||null; });
  const markedQs = detail.map((d,i)=>({d,i})).filter(x=>x.d.is_marked);
  if(!S.reviewFilter) S.reviewFilter = 'all';
  const showList = S.reviewFilter==='marked' ? markedQs.map(x=>x) : detail.map((d,i)=>({d,i}));
  const { data: bookmarkedIds } = await sb.rpc('student_list_bookmarked_question_ids', {p_student_id: S.currentUser.id});
  const bookmarkedSet = new Set(bookmarkedIds||[]);
  // Feature: any question the student marked for review during the exam is
  // automatically carried into "Marked for Review" once they view this
  // question-wise breakdown — this is the earliest point the correct
  // answer/explanation (needed to save a full snapshot) is actually
  // available, since it's deliberately hidden during the exam itself.
  // Only the ones not already there are added, and failures here are
  // silent — this is a background convenience, not a blocking action.
  const toAutoMark = markedQs.map(x=>x.d).filter(d=>d.question_id && !bookmarkedSet.has(d.question_id));
  if(toAutoMark.length){
    await Promise.all(toAutoMark.map(async d=>{
      try{
        const { data, error } = await sb.rpc('student_toggle_bookmark', {
          p_student_id: S.currentUser.id, p_question_id: d.question_id,
          p_question_text: d.text, p_subject: d.subject,
          p_option_a: d.option_a||null, p_option_b: d.option_b||null,
          p_option_c: d.option_c||null, p_option_d: d.option_d||null,
          p_correct_letter: d.correct||null, p_explanation: d.explanation||null,
          p_exam_code: d.exam_code||null,
        });
        if(!error && data) bookmarkedSet.add(d.question_id);
      }catch(e){}
    }));
  }
  root.innerHTML = `
    <div class="no-print" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;">
      <button class="btn btn-ghost btn-sm" onclick="S.studentPage='result';render();">← Back to Result</button>
      <button class="btn btn-outline btn-sm" onclick="window.print()">🖨 Print / Save as PDF</button>
    </div>
    <div class="print-header" style="display:none;">
      <h2>${esc(S.currentUser?.name||'Student')} — Question-wise Review</h2>
      <p>${esc(S.reviewTestName||'')} · Printed on ${new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}</p>
      <hr>
    </div>
    <h3 style="font-size:17px;margin-bottom:14px;">Question-wise review</h3>
    ${markedQs.length? `<div class="no-print" style="background:#FFF7ED;border:1px solid #FED7AA;border-radius:8px;padding:10px 14px;margin-bottom:16px;">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px;">
        <div style="font-size:12px;font-weight:700;color:#9A3412;text-transform:uppercase;letter-spacing:.3px;">🚩 You marked ${markedQs.length} question(s) for review during the exam</div>
        <button type="button" id="reviewFilterToggle" class="btn btn-sm" style="background:${S.reviewFilter==='marked'?'var(--accent)':'#fff'};color:${S.reviewFilter==='marked'?'#fff':'var(--accent)'};border:1px solid var(--accent);">
          ${S.reviewFilter==='marked' ? '📋 Show All Questions' : '👁 View Only Marked Questions'}
        </button>
      </div>
      ${S.reviewFilter!=='marked'? `<div style="display:flex;flex-wrap:wrap;gap:6px;">${markedQs.map(x=>`<button type="button" class="jump-to-marked-chip" data-idx="${x.i}" style="width:30px;height:30px;border-radius:6px;border:1px solid var(--accent);background:#fff;color:var(--accent);font-size:12.5px;font-weight:700;cursor:pointer;">${x.i+1}</button>`).join('')}</div>`:''}
    </div>`:''}
    ${S.reviewFilter==='marked' && !showList.length? `<div class="empty-state">No questions were marked for review in this attempt.</div>`:''}
    ${showList.map(({d,i})=>{
      const result = d.is_correct === true ? 'correct' : d.is_correct === false ? 'incorrect' : 'unattempted';
      const icon = result==='correct'?'✅':result==='incorrect'?'❌':'—';
      return `<div class="qcard" id="revq-${i}">
        <div class="qmeta"><span class="badge badge-grey">Q${i+1}</span>${d.part_name||d.section_name? `<span class="badge badge-grey">${esc([d.part_name,d.section_name].filter(Boolean).join(' — '))}</span>`:''}<span class="badge badge-blue">${esc(d.subject)}</span>
          <span class="badge ${result==='correct'?'badge-success':result==='incorrect'?'badge-error':'badge-grey'}">${icon} ${result}</span>
          ${d.is_marked? `<span class="badge badge-warning">🚩 Marked for Review</span>`:''}</div>
        <p style="font-size:14px;margin-bottom:10px;">${esc(d.text)}</p>
        ${d.image_url?`<img class="qimg" src="${esc(d.image_url)}" style="max-width:280px;">`:''}
        ${['a','b','c','d'].filter(k=>d['option_'+k]).map(k=>{
          const K = k.toUpperCase();
          const isCorrect = d.correct===K;
          const isSelected = d.selected===K;
          return `<div class="opt-row ${isCorrect?'correct':''}" style="${isSelected && !isCorrect?'color:var(--error);font-weight:700;':''}">
            ${isCorrect?'✅':isSelected?'❌':'○'} <b>${K}.</b> ${esc(d['option_'+k])}
          </div>`;
        }).join('')}
        ${d.explanation? `<div style="margin-top:8px;padding:10px;background:#F9FAFB;border-radius:8px;font-size:13px;"><b>Explanation:</b> ${esc(d.explanation)}</div>`:''}
        ${d.question_id? `<div class="no-print" style="margin-top:10px;">${bookmarkButtonHTML(d, bookmarkedSet.has(d.question_id))}${reportButtonHTML(d)}</div>` : ''}
      </div>`;
    }).join('')}
  `;
  const filterToggle = $('#reviewFilterToggle');
  if(filterToggle) filterToggle.onclick=()=>{ S.reviewFilter = S.reviewFilter==='marked'? 'all':'marked'; renderStudentPage(root); };
  $$('.jump-to-marked-chip').forEach(btn=>btn.onclick=()=>{
    document.getElementById('revq-'+btn.dataset.idx)?.scrollIntoView({behavior:'smooth',block:'center'});
  });
  wireBookmarkButtons(Object.fromEntries(detail.filter(d=>d.question_id).map(d=>[d.question_id, d])));
  wireReportButtons(Object.fromEntries(detail.filter(d=>d.question_id).map(d=>[d.question_id, d])));
}


// =========================================================================
// BOOT
// =========================================================================
(async function init(){
  render();
  await boot();
  render();
})();
</script>
</body>
</html>
