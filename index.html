<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>FMGs Never Give Up — FMGE • NEET PG • INI-CET Test Series</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
:root{
  --navy:#0A1628;
  --navy-2:#0F2340;
  --blue:#155EEF;
  --blue-bright:#2563EB;
  --accent:#F5A623;
  --coral:#EF4B5F;
  --bg:#F6F7FB;
  --card:#FFFFFF;
  --surface-2:#F0F2F7;
  --text:#0F1729;
  --text2:#64748B;
  --text3:#94A3B8;
  --success:#12B76A;
  --success-bg:#ECFDF3;
  --error:#F04438;
  --error-bg:#FEF3F2;
  --warning:#F79009;
  --warning-bg:#FFFAEB;
  --border:#E5E8F0;
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 2px 6px rgba(16,24,40,.05);
  --shadow-lg:0 12px 32px rgba(10,22,40,.12);
  --ease:cubic-bezier(.4,0,.2,1);
}
html[data-theme="dark"]{
  --navy:#0A1628;
  --navy-2:#122544;
  --blue:#3B82F6;
  --blue-bright:#60A5FA;
  --accent:#F5A623;
  --coral:#F26B7D;
  --bg:#0B111F;
  --card:#131B2E;
  --surface-2:#1B2438;
  --text:#EDF1F9;
  --text2:#93A1C0;
  --text3:#647092;
  --success:#3ECF8E;
  --success-bg:rgba(62,207,142,.12);
  --error:#F87171;
  --error-bg:rgba(248,113,113,.12);
  --warning:#FBBF24;
  --warning-bg:rgba(251,191,36,.12);
  --border:#242E48;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.24);
  --shadow-lg:0 16px 40px rgba(0,0,0,.45);
}
html[data-theme="dark"] .btn-outline{background:var(--card);color:var(--text);}
html[data-theme="dark"] .role-tab.active{background:var(--surface-2);}
html[data-theme="dark"] .demo-hint{background:rgba(59,130,246,.12);border-color:rgba(59,130,246,.25);}
html[data-theme="dark"] .part-row{background:var(--surface-2);}
html[data-theme="dark"] .medmind-panel-log{background:#0F1626;}
html[data-theme="dark"] .medmind-panel-footer{background:var(--card);}
html[data-theme="dark"] input,html[data-theme="dark"] select,html[data-theme="dark"] textarea{background:var(--card);color:var(--text);border-color:var(--border);}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:background .25s var(--ease), color .25s var(--ease);
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
  /* Safety net: no page-level sideways scroll on ANY screen, no matter how
     narrow — a table that genuinely needs to scroll sideways still can,
     since .table-wrap (and similar) open their own independent
     overflow-x:auto scroller inside this; this rule only stops something
     unaccounted-for from ever widening the whole page. */
  overflow-x:hidden;
}
h1,h2,h3,h4{font-family:'Manrope',sans-serif;font-weight:800;margin:0;color:var(--navy);}
p{margin:0;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:#D6E4FF;}
a{color:var(--blue);text-decoration:none;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border-radius:var(--radius-sm);border:none;font-weight:700;font-size:14px;
  padding:11px 20px;transition:transform .12s var(--ease), box-shadow .15s var(--ease), background .15s var(--ease), opacity .15s var(--ease);
  white-space:nowrap;cursor:pointer;
}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.6;cursor:not-allowed;}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 1px 2px rgba(21,94,239,.25), 0 1px 1px rgba(21,94,239,.15);}
.btn-primary:hover{background:var(--blue-bright);box-shadow:0 4px 12px rgba(21,94,239,.28);transform:translateY(-1px);}
.btn-navy{background:var(--navy);color:#fff;}
.btn-navy:hover{background:var(--navy-2);transform:translateY(-1px);}
.btn-accent{background:var(--accent);color:#3A2400;}
.btn-accent:hover{filter:brightness(1.05);transform:translateY(-1px);}
.btn-outline{background:var(--card);color:var(--navy);border:1.5px solid var(--border);}
.btn-outline:hover{border-color:var(--blue);color:var(--blue);}
.btn-danger{background:var(--error-bg);color:var(--error);}
.btn-danger:hover{background:#ffe1de;}
.btn-ghost{background:transparent;color:var(--text2);}
.btn-ghost:hover{background:var(--surface-2);}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);transition:box-shadow .2s var(--ease), transform .2s var(--ease), border-color .2s var(--ease);}
/* Same premium hover-lift on every admin card everywhere — one shared
   rule, so every admin feature (students/tests/results/analytics/…)
   gets the same lift + glow animation as the dashboard, with no per-page
   markup changes needed. */
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--border-accent,rgba(21,94,239,.25));}
.pad{padding:22px;}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:100px;letter-spacing:.2px;}
.badge-success{background:var(--success-bg);color:var(--success);}
.badge-error{background:var(--error-bg);color:var(--error);}
.badge-warning{background:var(--warning-bg);color:var(--warning);}
.badge-blue{background:#EFF4FF;color:var(--blue);}
.badge-navy{background:#E9EDF5;color:var(--navy);}
.badge-grey{background:var(--surface-2);color:var(--text2);}

input[type=text],input[type=password],input[type=email],input[type=number],input[type=date],input[type=time],select,textarea{
  width:100%;padding:11px 13px;border-radius:10px;border:1.5px solid var(--border);
  font-size:14px;color:var(--text);background:var(--card);outline:none;transition:border-color .15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--blue);}
label{font-size:12.5px;font-weight:600;color:var(--text2);display:block;margin-bottom:6px;}
.field{margin-bottom:16px;}
.row{display:flex;gap:14px;flex-wrap:wrap;}
.row>.field{flex:1;min-width:160px;}

#app{min-height:100vh;}
.hidden{display:none !important;}
.scrollbar-thin::-webkit-scrollbar{width:6px;height:6px;}
.scrollbar-thin::-webkit-scrollbar-thumb{background:#D0D5DD;border-radius:10px;}

/* ===== Toast ===== */
#toastHost{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);animation:slideIn .25s ease;max-width:320px;}
.toast.err{background:var(--error);}
.toast.ok{background:var(--success);}
@keyframes slideIn{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:translateX(0);}}

/* ===== Modal ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(11,31,58,.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-box{background:var(--card);border-radius:16px;max-width:640px;width:100%;max-height:88vh;overflow:auto;box-shadow:var(--shadow-lg);}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);z-index:2;}
.modal-body{padding:22px;}
.modal-close{background:none;border:none;font-size:20px;color:var(--text2);}

/* ===== Login ===== */
.login-wrap{height:100vh;display:flex;overflow:hidden;}
.login-hero{flex:1.15;background:
    linear-gradient(160deg,var(--navy) 0%,var(--navy-2) 55%,var(--blue) 130%);
  color:#fff;display:flex;flex-direction:column;justify-content:center;padding:64px 68px;position:relative;overflow:hidden;}
.login-hero::after{content:'';position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:42px 42px;pointer-events:none;}
.login-hero::before{content:'';position:absolute;width:480px;height:480px;background:radial-gradient(circle,rgba(245,166,35,.16),transparent 70%);top:-120px;right:-120px;}
.login-hero-content{position:relative;z-index:1;}
.login-logo-row{display:flex;align-items:center;gap:12px;margin-bottom:34px;}
.login-logo-icon{width:44px;height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.hero-badge{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#E4C97A;font-size:12px;font-weight:700;letter-spacing:.2px;padding:7px 14px;border-radius:999px;margin-bottom:26px;}
.login-hero .brand{font-size:13px;font-weight:700;letter-spacing:1.5px;color:var(--accent);margin-bottom:22px;}
.login-hero h1{color:#fff;font-size:56px;line-height:1.14;max-width:560px;letter-spacing:-1px;}
.login-hero p.sub{color:#B9C6E0;font-size:16px;margin-top:18px;max-width:440px;line-height:1.65;}
.exam-pill{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#fff;font-weight:700;font-size:13.5px;padding:8px 17px;border-radius:999px;letter-spacing:.3px;transition:background .2s var(--ease), border-color .2s var(--ease);}
.exam-pill:hover{background:rgba(245,166,35,.14);border-color:rgba(245,166,35,.5);}
.hero-fade{opacity:0;transform:translateY(14px);animation:heroFadeIn .6s ease forwards;}
@keyframes heroFadeIn{to{opacity:1;transform:translateY(0);}}
.hero-stats{display:flex;gap:34px;margin-top:46px;}
.hero-stats div b{display:block;font-size:26px;font-family:'Manrope';font-weight:800;color:#fff;}
.hero-stats div span{font-size:12.5px;color:#9FB3D6;}
.hero-footer-note{position:relative;z-index:1;display:flex;gap:28px;margin-top:64px;font-size:12.5px;color:#8CA0C4;}
.hero-footer-note span{display:inline-flex;align-items:center;gap:6px;}
.login-panel{flex:1;display:flex;align-items:safe center;justify-content:center;padding:40px;background:var(--bg);height:100%;overflow-y:auto;}
.login-card{width:100%;max-width:380px;}
.role-tabs{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;margin-bottom:26px;}
.role-tab{flex:1;text-align:center;padding:9px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--text2);cursor:pointer;transition:all .2s var(--ease);}
.role-tab.active{background:var(--card);color:var(--navy);box-shadow:var(--shadow);}
.demo-hint{background:#EFF4FF;border:1px solid #D6E4FF;border-radius:10px;padding:10px 13px;font-size:12px;color:var(--blue);margin-top:14px;line-height:1.6;}

/* ===== App Shell (Admin) — reference-matched "Studio / Dark" control
   center. Reuses the portal's existing global light/dark toggle
   (toggleTheme()/document.documentElement.dataset.theme, already used by
   .card/.btn/table/.badge everywhere in the admin panel), so switching
   here re-themes every admin feature — not just this shell — at once. ===== */
.shell{display:flex;min-height:100vh;background:var(--bg);}
.sidebar{width:264px;background:var(--card);color:var(--text);flex-shrink:0;display:flex;flex-direction:column;justify-content:space-between;position:sticky;top:0;height:100vh;border-right:1px solid var(--border);transition:background-color .2s var(--ease),border-color .2s var(--ease);}
.sidebar-brand{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;}
.sidebar-brand-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;background:linear-gradient(135deg,var(--blue) 0%,var(--blue-bright) 100%);color:#fff;box-shadow:0 6px 14px -4px rgba(21,94,239,.35);}
.sidebar-brand b{font-size:12px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;display:block;color:var(--text);line-height:1.2;}
.sidebar-brand-tag{display:flex;align-items:center;gap:6px;margin-top:5px;}
.sidebar-brand-tag .dot{width:6px;height:6px;border-radius:50%;background:var(--blue);flex-shrink:0;}
.sidebar-brand-tag span{font-size:9.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--blue);}
.nav-list{list-style:none;margin:0;padding:12px;flex:1;overflow-y:auto;font-size:13px;font-weight:700;}
.nav-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:12px;color:var(--text);opacity:.82;cursor:pointer;margin-bottom:2px;transition:all .15s var(--ease);}
.nav-item:hover{opacity:1;background:var(--surface-2);}
.nav-item.active{opacity:1;background:var(--blue);color:#fff;box-shadow:0 4px 12px -3px rgba(21,94,239,.35);}
.nav-item .nav-left{display:flex;align-items:center;gap:11px;min-width:0;}
.nav-icon{width:18px;text-align:center;font-size:15px;flex-shrink:0;}
.nav-item.active .nav-icon{filter:brightness(10);}
.nav-active-ping{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.85);animation:navPing 1.4s infinite;flex-shrink:0;}
@keyframes navPing{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.35;transform:scale(1.7);}}
.nav-badge{font-size:10px;font-weight:800;padding:2px 8px;border-radius:100px;background:var(--surface-2);color:var(--text2);border:1px solid var(--border);flex-shrink:0;}
.nav-item.active .nav-badge{background:rgba(255,255,255,.18);color:#fff;border-color:transparent;}
.nav-badge-ai{background:rgba(168,85,247,.14);color:#a855f7;border-color:rgba(168,85,247,.3);}
.nav-badge-live{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:3px 9px;border-radius:100px;background:rgba(239,68,68,.14);color:#ef4444;border:1px solid rgba(239,68,68,.3);}
.nav-badge-live .dot{width:5px;height:5px;border-radius:50%;background:#ef4444;box-shadow:0 0 6px #ef4444;animation:navPing 1.3s infinite;}
.sidebar-foot{padding:12px;border-top:1px solid var(--border);}
.sidebar-admin-card{display:flex;align-items:center;gap:11px;padding:9px;border-radius:14px;border:1px solid var(--border);background:var(--surface-2);}
.sidebar-admin-avatar{position:relative;width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--blue) 0%,var(--blue-bright) 100%);color:#fff;font-weight:800;font-size:12.5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sidebar-admin-avatar .dot{position:absolute;bottom:-2px;right:-2px;width:10px;height:10px;background:var(--success);border:2px solid var(--card);border-radius:50%;}
.sidebar-admin-name{font-size:12.5px;font-weight:800;color:var(--text);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;}
.sidebar-admin-status{font-size:10.5px;font-weight:700;color:var(--success);}

.topbar{height:64px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:50;gap:16px;}
.topbar h2{font-size:16.5px;font-weight:800;}
.topbar-search{position:relative;}
.topbar-search input{width:260px;padding:8px 12px 8px 32px;border-radius:10px;font-size:12.5px;background:var(--bg);}
.topbar-search::before{content:'🔍';position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:11px;opacity:.55;}
.topbar-clock{display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:10px;border:1px solid var(--border);background:var(--bg);font-size:12px;font-weight:700;color:var(--text2);white-space:nowrap;}
.theme-switcher{display:flex;align-items:center;gap:3px;padding:4px;border-radius:11px;border:1px solid var(--border);background:var(--bg);}
.theme-switcher-btn{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;border:none;background:none;font-size:11.5px;font-weight:800;cursor:pointer;color:var(--text2);opacity:.75;transition:all .18s var(--ease);}
.theme-switcher-btn .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.theme-switcher-btn.active{opacity:1;background:var(--card);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.08);}
.role-pill{display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:10px;border:1px solid var(--border);background:#EFF4FF;color:var(--blue);font-size:12px;font-weight:800;white-space:nowrap;}
html[data-theme="dark"] .role-pill{background:rgba(59,130,246,.14);}
.main{flex:1;padding:24px 28px;max-width:100%;overflow-x:hidden;}
.mobile-toggle{display:none;background:none;border:none;font-size:22px;color:var(--text);}

.grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:24px;}
.stat-card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:18px 20px;box-shadow:var(--shadow);}
.stat-card .lbl{font-size:12.5px;color:var(--text2);font-weight:600;margin-bottom:8px;}
.stat-card .val{font-family:'Manrope';font-weight:800;font-size:26px;color:var(--navy);}
.stat-card .delta{font-size:11.5px;font-weight:700;margin-top:6px;}

/* ---- Admin Dashboard (reference-matched) ---- */
.adm-kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px;}
.adm-kpi-tile{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;transition:transform .22s var(--ease),box-shadow .22s var(--ease),border-color .22s var(--ease);}
.adm-kpi-tile:hover{transform:translateY(-3px);border-color:var(--blue);box-shadow:0 12px 26px -8px rgba(21,94,239,.18);}
.adm-kpi-lbl{font-size:10.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--text3);}
.adm-kpi-val{font-family:'Manrope';font-weight:800;font-size:24px;color:var(--text);font-feature-settings:"tnum";}

.adm-chart-card{padding:18px 20px;margin-bottom:20px;}
.adm-chart-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--border);margin-bottom:6px;}
.adm-chart-title-row{display:flex;align-items:center;gap:12px;}
.adm-chart-icon{width:34px;height:34px;border-radius:9px;background:#EFF4FF;color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
html[data-theme="dark"] .adm-chart-icon{background:rgba(59,130,246,.14);}
.adm-chart-title-row h3{font-size:14px;font-weight:800;color:var(--text);}
.adm-chart-title-row p{font-size:12px;color:var(--text2);margin-top:1px;}
.adm-chart-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.adm-chart-view-tabs{display:flex;align-items:center;padding:3px;border-radius:9px;border:1px solid var(--border);background:var(--bg);gap:2px;}
.adm-chart-view-btn{padding:6px 12px;border-radius:7px;border:none;background:none;font-size:11.5px;font-weight:800;color:var(--text2);opacity:.75;cursor:pointer;transition:all .18s var(--ease);}
.adm-chart-view-btn.active{opacity:1;background:#EFF4FF;color:var(--blue);}
html[data-theme="dark"] .adm-chart-view-btn.active{background:rgba(59,130,246,.16);}
.adm-chart-avg-pill{font-size:11.5px;font-weight:800;padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text2);white-space:nowrap;}
.adm-chart-refresh{padding:7px 9px;border-radius:9px;border:1px solid var(--border);background:var(--bg);cursor:pointer;transition:opacity .18s;}
.adm-chart-refresh:hover{opacity:.7;}

.adm-activity-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border);}
.adm-activity-title-row{display:flex;align-items:center;gap:10px;}
.adm-activity-ping{width:9px;height:9px;border-radius:50%;background:var(--blue);animation:navPing 1.6s infinite;flex-shrink:0;}
.adm-activity-title-row h3{font-size:14px;font-weight:800;color:var(--text);}
.adm-activity-title-row p{font-size:11px;color:var(--text2);margin-top:1px;}
.adm-activity-tabs{display:flex;align-items:center;padding:3px;border-radius:9px;border:1px solid var(--border);background:var(--bg);gap:2px;flex-wrap:wrap;}
.adm-activity-tab{padding:6px 12px;border-radius:7px;border:none;background:none;font-size:11.5px;font-weight:800;color:var(--text2);opacity:.75;cursor:pointer;transition:all .18s var(--ease);white-space:nowrap;}
.adm-activity-tab.active{opacity:1;background:#EFF4FF;color:var(--blue);}
html[data-theme="dark"] .adm-activity-tab.active{background:rgba(59,130,246,.16);}
.adm-activity-row{padding:13px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;font-weight:600;transition:background-color .15s;border-bottom:1px solid var(--border);}
.adm-activity-row:last-child{border-bottom:none;}
.adm-activity-row:hover{background:var(--surface-2);}
.adm-activity-left{display:flex;align-items:center;gap:10px;min-width:0;}
.adm-activity-dot{width:6px;height:6px;border-radius:50%;background:var(--blue);flex-shrink:0;}
.adm-activity-time{font-size:11px;color:var(--text2);white-space:nowrap;flex-shrink:0;font-feature-settings:"tnum";}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;padding:11px 14px;background:var(--surface-2);color:var(--text2);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border);background:var(--card);}
.table-wrap table thead th{position:sticky;top:0;background:var(--surface-2);z-index:2;box-shadow:0 1px 0 var(--border);}
.table-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.search-box{position:relative;min-width:220px;flex:1;max-width:340px;}
.search-box input{padding-left:34px;}
.search-box::before{content:'🔍';position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:12px;opacity:.5;}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;}
.filter-row select{width:auto;min-width:120px;padding:8px 10px;font-size:12.5px;}

.tabbar{display:flex;gap:6px;border-bottom:2px solid var(--border);margin-bottom:20px;overflow-x:auto;}
.tabbtn{padding:11px 4px;margin-right:22px;font-weight:700;font-size:13.5px;color:var(--text2);border:none;background:none;border-bottom:2.5px solid transparent;margin-bottom:-2px;white-space:nowrap;}
.tabbtn.active{color:var(--blue);border-color:var(--blue);}

.progress-bar{height:8px;background:var(--surface-2);border-radius:6px;overflow:hidden;}
.progress-bar > div{height:100%;border-radius:6px;background:var(--blue);transition:width .5s ease;}

/* ===== Wizard ===== */
.wizard-steps{display:flex;gap:0;margin-bottom:26px;overflow-x:auto;}
.wstep{flex:1;min-width:110px;text-align:center;padding:10px 6px;border-bottom:3px solid var(--border);color:var(--text2);font-size:12px;font-weight:700;position:relative;}
.wstep.active{border-color:var(--blue);color:var(--blue);}
.wstep.done{border-color:var(--success);color:var(--success);}

/* ===== Question card ===== */
.qcard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.opt-row{display:flex;align-items:flex-start;gap:8px;padding:6px 0;font-size:13.5px;}
.opt-row.correct{color:var(--success);font-weight:700;}
.bookmark-btn.active{background:#FEF3C7;border-color:#F59E0B;color:#92400E;}
/* Admin/Student announcement banner — shown at the top of both shells,
   dismissible for the rest of this session (reappears on next login, since
   it's meant to be seen again if a live-exam issue is still current). */
.app-announcement-banner{display:flex;align-items:center;gap:10px;padding:10px 18px;font-size:13px;font-weight:600;flex-wrap:wrap;}
.app-announcement-banner.level-info{background:#EFF6FF;color:#1E40AF;border-bottom:1px solid #BFDBFE;}
.app-announcement-banner.level-warning{background:#FFFBEB;color:#92400E;border-bottom:1px solid #FDE68A;}
.app-announcement-banner.level-critical{background:#FEF2F2;color:#991B1B;border-bottom:1px solid #FECACA;}
.app-announcement-banner .ann-msg{flex:1;min-width:0;}
.app-announcement-banner .ann-close{background:none;border:none;cursor:pointer;font-size:16px;line-height:1;opacity:.6;color:inherit;padding:2px 6px;}
.app-announcement-banner .ann-close:hover{opacity:1;}

/* ===== STUDENT PORTAL ===== */
.stu-header{background:var(--navy);color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
.stu-avatar{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}
.stu-logout-btn{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;transition:background .15s var(--ease);flex-shrink:0;}
.stu-logout-btn:hover{background:rgba(255,255,255,.14);}
.stu-header .brand{font-family:'Manrope';font-weight:800;font-size:16px;}
.stu-header .brand span{color:var(--accent);}
.stu-shell{max-width:1180px;margin:0 auto;padding:26px 20px 60px;}
.welcome-band{background:linear-gradient(120deg,var(--navy),#173B6E);color:#fff;border-radius:18px;padding:30px 32px;margin-bottom:24px;position:relative;overflow:hidden;}
.welcome-band::after{content:'';position:absolute;right:-60px;top:-60px;width:220px;height:220px;background:radial-gradient(circle,rgba(255,176,0,.22),transparent 70%);}
.welcome-band h2{color:#fff;font-size:24px;}
.welcome-band p{color:#C6D3EE;margin-top:6px;font-size:14px;}
.test-avail-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;box-shadow:var(--shadow);}
.test-avail-card .pill{background:#EFF4FF;color:var(--blue);font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:100px;}
.pattern-chip{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:9px 13px;font-size:12.5px;font-weight:600;color:var(--text2);}

/* ===== New Dashboard Design System ===== */
@keyframes fadeInUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.fade-in-up{opacity:0;animation:fadeInUp .5s var(--ease) forwards;}
.dash-hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 60%,#173B6E 130%);color:#fff;border-radius:20px;padding:32px 34px;margin-bottom:20px;position:relative;overflow:hidden;}
.dash-hero::after{content:'';position:absolute;right:-70px;top:-90px;width:260px;height:260px;background:radial-gradient(circle,rgba(245,166,35,.20),transparent 70%);}
.dash-hero-top{position:relative;z-index:1;margin-bottom:14px;}
.dash-hero-tag{display:inline-block;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#CBD8F0;font-size:11px;font-weight:700;letter-spacing:.6px;padding:5px 12px;border-radius:100px;}
.dash-hero h2{position:relative;z-index:1;color:#fff;font-size:27px;line-height:1.3;max-width:640px;}
.accent-text{color:var(--accent);}
.dash-hero-sub{position:relative;z-index:1;color:#B9C6E0;margin-top:8px;font-size:14.5px;max-width:560px;line-height:1.6;}
.dash-hero-actions{position:relative;z-index:1;display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;}
.dash-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px;}
.dash-stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);}
.dash-stat-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.dash-stat b{display:block;font-size:20px;font-family:'Manrope';font-weight:800;color:var(--text);line-height:1.2;}
.dash-stat span{font-size:12px;color:var(--text2);}

/* ===== NEET PG Rank Predictor — dedicated, consistent styling ===== */
@keyframes rpAuroraDrift{
  0%{transform:translate(-6%,-4%) scale(1);}
  50%{transform:translate(6%,5%) scale(1.12);}
  100%{transform:translate(-6%,-4%) scale(1);}
}
@keyframes rpAuroraDrift2{
  0%{transform:translate(5%,4%) scale(1.05);}
  50%{transform:translate(-7%,-3%) scale(0.95);}
  100%{transform:translate(5%,4%) scale(1.05);}
}
.rp-hero{
  position:relative;overflow:hidden;background:#F8FAFF;
  border-radius:20px;padding:44px 32px 34px;margin-bottom:22px;text-align:center;
}
.rp-hero::before{
  content:'';position:absolute;width:520px;height:340px;left:50%;top:-30%;transform:translateX(-50%);
  background:radial-gradient(ellipse,rgba(21,94,239,.22),transparent 70%);
  animation:rpAuroraDrift 14s ease-in-out infinite;pointer-events:none;
}
.rp-hero::after{
  content:'';position:absolute;width:420px;height:300px;right:10%;bottom:-40%;
  background:radial-gradient(ellipse,rgba(245,166,35,.14),transparent 70%);
  animation:rpAuroraDrift2 16s ease-in-out infinite;pointer-events:none;
}
.rp-hero-inner{position:relative;z-index:1;}
.rp-hero-tag{display:inline-block;background:rgba(21,94,239,.08);border:1px solid rgba(21,94,239,.18);color:var(--blue);font-size:11px;font-weight:700;letter-spacing:.6px;padding:5px 12px;border-radius:100px;margin-bottom:16px;}
.rp-hero h2{color:var(--navy);font-size:38px;font-weight:800;line-height:1.15;margin-bottom:14px;letter-spacing:-.5px;}
.rp-hero-sub{color:var(--text2);font-size:16px;line-height:1.6;max-width:620px;margin:0 auto;}
.rp-hero-sub b{color:var(--navy);font-weight:700;}
.rp-hero-note{color:var(--text3);font-size:13.5px;margin-top:12px;line-height:1.6;}

.rp-stats{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:22px;}
.rp-stat{background:var(--card);border:1px solid var(--border);border-radius:999px;padding:12px 22px;display:flex;align-items:baseline;gap:7px;box-shadow:var(--shadow);}
.rp-stat-icon{display:none;}
.rp-stat b{font-size:17px;font-family:'Manrope';font-weight:800;color:var(--navy);}
.rp-stat span{font-size:14px;color:var(--text2);}

.rp-disclaimer{background:var(--warning-bg);border:1px solid var(--warning);color:var(--text2);border-radius:14px;padding:16px 22px;font-size:13.5px;line-height:1.7;margin-bottom:22px;font-style:italic;text-align:center;max-width:820px;margin-left:auto;margin-right:auto;}

.rp-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px;max-width:620px;margin:0 auto;}
.rp-modeswitch{display:flex;gap:6px;background:var(--surface-2);padding:5px;border-radius:999px;margin-bottom:22px;}
.rp-modeswitch .btn{flex:1;border-radius:999px !important;}
.rp-label{font-size:12.5px;font-weight:700;color:var(--text2);display:block;margin-bottom:7px;letter-spacing:.1px;}
.rp-input{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font-size:15px;font-family:'Manrope';font-weight:700;}
.rp-input:focus{outline:none;border-color:var(--blue);}
.rp-hint{font-size:12px;color:var(--text2);margin-top:6px;}
.rp-section-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.rp-section-grid .rp-input{font-size:14px;padding:9px 10px;}
.rp-calc-line{margin-top:10px;font-size:13px;color:var(--text2);font-weight:600;}

.rp-pillrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.rp-pill{border-radius:999px !important;padding:8px 16px !important;font-size:13px !important;}

.rp-predict-btn{width:100%;margin-top:22px;padding:14px 20px !important;font-size:15px !important;border-radius:999px !important;}

.rp-result{margin-top:22px;padding-top:22px;border-top:1px solid var(--border);text-align:center;}
.rp-result-eyebrow{font-size:11.5px;font-weight:700;color:var(--text2);letter-spacing:.5px;text-transform:uppercase;}
.rp-result-air{font-size:38px;font-weight:800;font-family:'Manrope';color:var(--navy);margin:8px 0 4px;letter-spacing:-.5px;}
.rp-result-sub{font-size:13px;color:var(--text2);}
.rp-result-pct{margin-top:14px;}
.rp-result-pct b{display:block;font-size:20px;font-family:'Manrope';font-weight:800;color:var(--navy);}
.rp-result-pct span{font-size:11.5px;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;}
.rp-result-note{font-size:12px;color:var(--text2);margin-top:14px;line-height:1.6;}

.rp-specialty{margin-top:24px;text-align:left;}
.rp-specialty-head{font-size:11.5px;font-weight:700;color:var(--text2);letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px;}
.rp-specialty-sub{font-size:12px;color:var(--text2);margin-bottom:14px;line-height:1.5;}

.dash-section-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px;}
.subj-filter-tabs{display:flex;gap:4px;background:var(--surface-2);border-radius:11px;padding:4px;}
.subj-filter-tab{border:none;background:none;padding:8px 14px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--text2);cursor:pointer;transition:all .2s var(--ease);white-space:nowrap;}
.subj-filter-tab.active{background:var(--card);color:var(--navy);box-shadow:var(--shadow);}

/* ---- Item Analysis — Question Difficulty Audit ---- */
@keyframes iaSonarPing{0%{transform:scale(1);opacity:.8;}100%{transform:scale(2.4);opacity:0;}}
@keyframes iaCardEntrance{0%{opacity:0;transform:translateY(10px) scale(.98);}100%{opacity:1;transform:translateY(0) scale(1);}}
.ia-head-card{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;padding:20px 24px;}
.ia-head-left{display:flex;gap:14px;align-items:flex-start;}
.ia-head-icon{width:44px;height:44px;border-radius:12px;background:var(--blue,#155EEF);color:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
.ia-head-title{font-size:17px;font-weight:800;margin:0;color:var(--text);}
.ia-head-sub{font-size:12.5px;color:var(--text2);margin-top:3px;max-width:480px;}
.ia-head-stats{display:flex;gap:26px;}
.ia-head-stat{text-align:right;}
.ia-head-stat .lbl{font-size:10.5px;font-weight:700;letter-spacing:.4px;color:var(--text3,var(--text2));text-transform:uppercase;}
.ia-head-stat .val{font-size:21px;font-weight:800;font-family:'Manrope','Outfit',sans-serif;margin-top:2px;display:inline-flex;align-items:center;gap:7px;}
.ia-sonar-dot{position:relative;display:inline-flex;width:8px;height:8px;flex-shrink:0;}
.ia-sonar-dot .ping{position:absolute;width:100%;height:100%;border-radius:50%;background:var(--error);animation:iaSonarPing 1.8s cubic-bezier(0,.2,.8,1) infinite;}
.ia-sonar-dot .dot{position:relative;width:8px;height:8px;border-radius:50%;background:var(--error);}
/* Single-line unified filter bar — exam + search + subject + tier + view, all in one row */
.ia-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:16px 0;padding:10px;border-radius:14px;border:1px solid var(--border);background:var(--surface-2);}
.ia-toolbar .ia-divider{width:1px;height:24px;background:var(--border);flex-shrink:0;}
.ia-select{padding:9px 12px;border-radius:10px;border:1px solid var(--border);font-size:12.5px;font-weight:700;background:var(--card);color:var(--text);cursor:pointer;flex-shrink:0;max-width:220px;transition:border-color .15s;}
.ia-select:hover{border-color:var(--blue,#155EEF);}
.ia-search-wrap{position:relative;flex:1;min-width:200px;}
.ia-search-wrap input{width:100%;padding:9px 12px 9px 34px;border-radius:10px;border:1px solid var(--border);font-size:13px;background:var(--card);color:var(--text);}
.ia-search-wrap .ia-search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.55;font-size:12.5px;}
.ia-view-toggle{display:flex;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:3px;flex-shrink:0;}
.ia-view-btn{border:none;background:none;padding:7px 13px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--text2);cursor:pointer;white-space:nowrap;transition:all .18s;}
.ia-view-btn.active{background:var(--blue,#155EEF);color:#fff;box-shadow:0 2px 8px -2px rgba(21,94,239,.4);}
.ia-filter-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.ia-filter-row .ia-filter-lbl{font-size:12px;font-weight:700;color:var(--text2);white-space:nowrap;}
.ia-pill{border:1px solid var(--border);background:var(--card);padding:6px 13px;border-radius:999px;font-size:12px;font-weight:700;color:var(--text2);cursor:pointer;white-space:nowrap;transition:all .15s;}
.ia-pill.active{background:var(--blue,#155EEF);border-color:var(--blue,#155EEF);color:#fff;}
.ia-pill.tier-critical.active{background:var(--error);border-color:var(--error);}
.ia-pill.tier-hard.active{background:#B45309;border-color:#B45309;}
.ia-cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
.ia-card{border:1px solid var(--border);border-radius:14px;padding:16px;background:var(--card);transition:transform .25s cubic-bezier(.16,1,.3,1),border-color .25s,box-shadow .25s;animation:iaCardEntrance .3s cubic-bezier(.16,1,.3,1) both;}
.ia-card:hover{transform:translateY(-3px);border-color:var(--blue,#155EEF);box-shadow:0 12px 25px -8px rgba(21,94,239,.18);}
.ia-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;}
.ia-card-subject{font-size:13px;font-weight:800;color:var(--blue,#155EEF);}
.ia-card-idx{font-size:11.5px;color:var(--text3,var(--text2));margin-left:6px;font-weight:600;}
.ia-pass-badge{font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap;}
.ia-pass-badge.tier-critical{background:#FEF2F2;color:var(--error);}
.ia-pass-badge.tier-hard{background:#FFFBEB;color:#B45309;}
.ia-pass-badge.tier-ok{background:#F0FDF4;color:var(--success);}
.ia-card-stem{font-size:13.5px;color:var(--text);margin-bottom:10px;line-height:1.4;}
.ia-card-stem.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.ia-card-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);padding-top:10px;font-size:12px;color:var(--text2);}
.ia-card-foot b{color:var(--text);}
.ia-review-link{background:none;border:none;color:var(--blue,#155EEF);font-weight:700;font-size:12px;cursor:pointer;padding:0;}
.ia-empty{grid-column:1/-1;}
@media (max-width:640px){.ia-select{max-width:none;flex:1 1 45%;}}
/* Item Analysis toolbar on a phone: the vertical dividers only make sense
   in a single line, so hide them once things wrap, and let the exam
   picker + search go full-width (their own rows) while the two filter
   selects share a row and the view toggle gets its own row — clearer than
   6 pieces wrapping wherever they happen to fit. */
@media (max-width:600px){
  .ia-toolbar{gap:8px;}
  .ia-toolbar .ia-divider{display:none;}
  #iaExamSel{flex:1 1 100%; max-width:none;}
  .ia-search-wrap{flex:1 1 100%; min-width:0;}
  .ia-view-toggle{flex:1 1 100%; justify-content:center;}
}
html[data-theme="dark"] .subj-filter-tab.active{color:var(--text);}
.dash-eyebrow{font-size:11.5px;font-weight:700;color:var(--blue);letter-spacing:.5px;}
.dash-section-head h3{font-size:19px;margin-top:4px;}
.test-card{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);margin-bottom:16px;display:flex;overflow:hidden;transition:box-shadow .2s var(--ease), transform .2s var(--ease);}
.test-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);}
.test-card-accent{width:5px;background:linear-gradient(180deg,var(--blue),var(--blue-bright));flex-shrink:0;}
.test-card-body{padding:22px 24px;flex:1;min-width:0;}
.test-meta-row{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--text2);}
.test-progress-track{height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:16px;}
.test-progress-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--blue-bright));border-radius:4px;transition:width .5s var(--ease);}
.part-row{border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:10px;background:var(--bg);}
.part-progress-track{height:5px;border-radius:4px;background:var(--border);overflow:hidden;}
.part-progress-fill{height:100%;background:var(--success);border-radius:4px;transition:width .5s var(--ease);}

/* ===== Instructions ===== */
.instr-list{list-style:none;padding:0;margin:0;}
.instr-list li{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);font-size:14px;color:var(--text);}
.instr-list li:last-child{border:none;}
.instr-num{width:26px;height:26px;border-radius:50%;background:#EFF4FF;color:var(--blue);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* ===== EXAM ENGINE ===== */
.exam-shell{height:100vh;height:100dvh;display:flex;flex-direction:column;background:#EEF1F6;}
.exam-header{background:var(--navy);color:#fff;padding:8px 18px;min-height:60px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:20;}
.exam-header .exam-title{font-size:13px;font-weight:700;line-height:1.3;}
.exam-header .exam-title small{display:block;color:#9FB3D6;font-weight:500;font-size:11px;}
.timer-box{background:rgba(255,255,255,.08);border-radius:10px;padding:7px 16px;text-align:center;min-width:110px;flex-shrink:0;}
.timer-box.warn{background:var(--warning);color:#3A2400;}
.timer-box.crit{background:var(--error);color:#fff;}
.timer-box .tval{font-family:'Manrope';font-weight:800;font-size:18px;letter-spacing:.5px;}
.timer-box .tlbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;opacity:.8;}
/* Pacing indicator — a quiet, non-alarming hint next to the timer showing
   whether the student's current question number is roughly on track for
   the time already used in this section, so falling behind is caught
   early rather than discovered only when the timer runs out. */
.pace-chip{display:none;align-items:center;gap:6px;background:rgba(255,255,255,.08);border-radius:10px;padding:7px 14px;font-size:11.5px;font-weight:600;white-space:nowrap;}
.pace-chip.show{display:flex;}
.pace-chip .pace-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.pace-chip.pace-good .pace-dot{background:#22C55E;}
.pace-chip.pace-warn .pace-dot{background:var(--warning);}
.pace-chip.pace-bad .pace-dot{background:var(--error);}
@media (max-width:760px){ .pace-chip{display:none !important;} }
.stu-chip{text-align:right;font-size:11.5px;color:#C6D3EE;flex-shrink:0;}
.stu-chip b{color:#fff;font-size:13px;display:block;}
/* Small phones (~≤430px): the header's 5-6 items (title, timer, save/net
   status, student chip) no longer fit in one row even with wrapping —
   the title takes its own full-width row first, then the status/identity
   items shrink and drop their least-essential text so the timer (the one
   thing that must never be missed) always has room. Nothing is removed,
   only condensed — the full name is still shown everywhere else (dashboard,
   profile), it just isn't needed a second time on the exam screen itself. */
@media (max-width:640px){
  .exam-header{padding:8px 14px;}
  .exam-header .exam-title{flex:1 1 100%; order:-1;}
  .timer-box{padding:6px 12px;min-width:88px;}
  .timer-box .tval{font-size:16px;}
  .save-status,.net-status{font-size:11px !important;padding:3px 8px !important;}
}
@media (max-width:420px){
  .stu-chip b{display:none;}
  .stu-chip{font-size:11px;}
}

.section-strip{display:flex;background:var(--card);border-bottom:1px solid var(--border);padding:0 14px;overflow-x:auto;flex-shrink:0;}
.sec-pill{padding:10px 16px;font-size:12px;font-weight:700;color:var(--text2);border-bottom:3px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px;}
.sec-pill.locked{color:#B0BAC9;}
.sec-pill.active-sec{color:var(--blue);border-color:var(--blue);background:#F5F8FF;}
.sec-pill.done-sec{color:var(--success);}

.exam-body{flex:1;display:flex;overflow:hidden;}
.exam-main{flex:1;overflow-y:auto;padding:26px 30px 100px;}
.qbox{background:var(--card);border-radius:16px;border:1px solid var(--border);padding:26px;max-width:760px;box-shadow:var(--shadow);}
.qbox .qnum{font-size:12px;font-weight:700;color:var(--blue);letter-spacing:.3px;margin-bottom:10px;}
.qbox .qtext{font-size:16px;line-height:1.65;font-weight:500;margin-bottom:18px;}
.qimg{max-width:100%;border-radius:10px;border:1px solid var(--border);margin-bottom:18px;cursor:zoom-in;}
.option-btn{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border:1.5px solid var(--border);border-radius:12px;margin-bottom:10px;cursor:pointer;transition:all .12s;background:var(--card);}
.option-btn:hover{border-color:#AFC7FA;background:#F8FAFF;}
.option-btn.selected{border-color:var(--blue);background:#EFF4FF;}
.option-letter{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:var(--text2);flex-shrink:0;}
.option-btn.selected .option-letter{background:var(--blue);border-color:var(--blue);color:#fff;}
.option-text{font-size:14.5px;line-height:1.5;padding-top:3px;}

.exam-toolbar{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--border);padding:14px 30px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
.palette-panel{width:270px;border-left:1px solid var(--border);background:var(--card);padding:18px;overflow-y:auto;flex-shrink:0;}
.palette-panel h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--text2);margin-bottom:12px;}
.palette-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px;}
.pnode{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;cursor:pointer;border:1.5px solid var(--border);color:var(--text2);background:var(--card);}
.pnode.answered{background:var(--success);color:#fff;border-color:var(--success);}
.pnode.notanswered{background:var(--error-bg);color:var(--error);border-color:#F9CAC4;}
.pnode.marked{background:var(--accent);color:#3A2400;border-color:var(--accent);}
.pnode.notvisited{background:var(--card);color:var(--text2);}
.pnode.current{outline:2.5px solid var(--navy);outline-offset:1px;}
.legend-row{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text2);margin-bottom:7px;}
.legend-dot{width:12px;height:12px;border-radius:4px;flex-shrink:0;}
.palette-toggle{display:none;}

@media(max-width:900px){
  .sidebar{position:fixed;left:-260px;z-index:200;transition:left .2s;box-shadow:var(--shadow-lg);}
  .sidebar.open{left:0;}
  .mobile-toggle{display:block;}
  .login-hero{display:none;}
  .palette-panel{position:fixed;right:-280px;top:0;bottom:0;z-index:60;transition:right .2s;box-shadow:var(--shadow-lg);}
  .palette-panel.open{right:0;}
  .palette-backdrop{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:59;}
  .palette-backdrop.open{display:block;}
  .exam-main{padding:16px 14px 170px;}
  .qbox{padding:18px;}
  .exam-toolbar{padding:10px 14px calc(10px + env(safe-area-inset-bottom));position:fixed;bottom:0;left:0;right:0;}
  .exam-body{padding-bottom:100px;}
}
/* Short-height / landscape phones during an exam: the fixed header + fixed
   bottom toolbar can otherwise eat most of a ~360-400px-tall viewport,
   squeezing the question area to almost nothing. Compact both chrome
   elements specifically when height (not width) is tight. */
@media (max-height:480px) and (orientation:landscape){
  .exam-header{min-height:44px;padding:6px 14px;}
  .exam-header .pace-chip{display:none;}
  .qbox{padding:12px;}
  .exam-toolbar{padding:6px 14px calc(6px + env(safe-area-inset-bottom));}
  .exam-main{padding-bottom:110px;}
}
@media(max-width:600px){
  .hero-stats{display:none;}
  .grid-cards{grid-template-columns:repeat(2,1fr);}
  .main{padding:16px;}
  .row>.field{min-width:100%;}
}

/* Question Palette toggle on mobile: previously a separate floating button
   pinned above the toolbar by a fixed/measured offset — even measured, it
   could still visually collide with Submit Section on very small screens
   (the toolbar's 5 buttons wrapping to 3 lines, tiny viewport height, etc).
   Now it's simply one of the toolbar's own buttons (a small round icon,
   first in the left group next to Previous), so it flows with the other
   buttons and can never sit on top of Submit Section — no measuring, no
   fixed positioning, no edge case. Hidden on desktop, where the palette is
   already shown permanently as a sidebar (no toggle needed there). */
.palette-icon-btn{display:none;}
@media(max-width:900px){
  .palette-icon-btn{display:inline-flex;width:38px;height:38px;border-radius:10px;background:var(--navy);color:#fff;border:none;align-items:center;justify-content:center;font-size:16px;cursor:pointer;flex-shrink:0;padding:0;}
}
.medmind-fab{position:fixed;bottom:24px;right:24px;width:58px;height:58px;border-radius:50%;background:var(--card);border:none;box-shadow:0 8px 24px rgba(139,47,201,.28);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:200;transition:transform .2s var(--ease);padding:0;}
.medmind-fab:hover{transform:scale(1.08);}
.medmind-fab-label{position:fixed;bottom:38px;right:90px;background:var(--navy);color:#fff;font-size:12px;font-weight:700;padding:8px 14px;border-radius:100px;box-shadow:var(--shadow-lg);z-index:200;white-space:nowrap;pointer-events:none;animation:fadeInUp .5s var(--ease) .3s backwards;transition:opacity .35s var(--ease), transform .35s var(--ease);}
.medmind-fab-label.fading{opacity:0;transform:translateY(8px);}
.medmind-fab-label::after{content:'';position:absolute;right:-5px;top:50%;transform:translateY(-50%);border:6px solid transparent;border-left-color:var(--navy);}
.theme-toggle-btn{width:36px;height:36px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:background .15s var(--ease);flex-shrink:0;}
.theme-toggle-btn:hover{background:var(--border);}
.theme-toggle-btn-dark{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);color:#fff;}
.theme-toggle-btn-dark:hover{background:rgba(255,255,255,.16);}
.medmind-panel{position:fixed;bottom:92px;right:24px;width:340px;max-width:calc(100vw - 32px);height:460px;max-height:calc(100vh - 140px);background:var(--card);border-radius:18px;box-shadow:var(--shadow-lg);z-index:200;flex-direction:column;overflow:hidden;border:1px solid var(--border);}
.medmind-panel-header{display:flex;align-items:center;gap:10px;padding:14px 16px;background:linear-gradient(135deg,var(--navy),var(--navy-2));}
.medmind-panel-log{flex:1;overflow-y:auto;padding:14px;background:#FDFAFF;}
.medmind-panel-input-row{display:flex;gap:8px;padding:10px;border-top:1px solid var(--border);}
.medmind-panel-input-row input{flex:1;}
.medmind-panel-footer{font-size:10.5px;color:var(--text3);text-align:center;padding:6px 12px 10px;background:var(--card);}
@media(max-width:600px){
  .medmind-panel{right:12px;bottom:84px;width:calc(100vw - 24px);}
  .medmind-fab{right:14px;bottom:14px;}
}

.result-score{font-family:'Manrope';font-weight:800;font-size:52px;color:var(--navy);}
.mini-bar{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.mini-bar .lbl{width:120px;font-size:12.5px;font-weight:600;color:var(--text2);flex-shrink:0;}
.mini-bar .track{flex:1;height:9px;background:var(--surface-2);border-radius:6px;overflow:hidden;}
.mini-bar .fill{height:100%;border-radius:6px;}
.mini-bar .pct{width:42px;text-align:right;font-size:12px;font-weight:700;color:var(--text2);}

.svg-chart-wrap{overflow-x:auto;}
.empty-state{text-align:center;padding:50px 20px;color:var(--text2);}
.empty-state .icon{font-size:38px;margin-bottom:10px;}

.kbd-note{font-size:11.5px;color:var(--text2);background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;}
.lock-banner{background:var(--warning-bg);border:1px solid #FEDF89;color:#93610D;border-radius:10px;padding:12px 16px;font-size:13px;font-weight:600;margin-bottom:16px;}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(0,0,0,.15);border-top-color:var(--primary,#155EEF);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px;}
.spinner-white{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg);}}
@media print{
  .no-print, .stu-header, .admin-header, .sidebar, header, nav { display:none !important; }
  .print-header { display:block !important; margin-bottom:16px; }
  .print-header hr { border:none; border-top:2px solid #000; margin-top:10px; }
  body { background:#fff !important; }
  .qcard { break-inside:avoid; page-break-inside:avoid; border:1px solid #ccc !important; margin-bottom:14px; }
  img.qimg { max-width:220px !important; }
}
/* Toggle switch used for On/Off settings (Result & Ranking modal, test
   wizard). Previously this had no CSS at all, so the toggle rendered as
   an invisible/zero-size element — visible text but nothing clickable. */
.toggle-switch{position:relative;display:inline-block;width:44px;height:24px;flex-shrink:0;}
.toggle-switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;}
.toggle-switch .slider{position:absolute;inset:0;background:#CBD5E1;transition:.2s;border-radius:999px;pointer-events:none;}
.toggle-switch .slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;top:3px;background:#fff;transition:.2s;border-radius:50%;box-shadow:0 1px 2px rgba(0,0,0,.25);}
.toggle-switch input:checked + .slider{background:var(--success,#16A34A);}
.toggle-switch input:checked + .slider:before{transform:translateX(20px);}

/* ===== Sign-Up page — visual polish only, no behavior here ===== */
.signup-card{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:0 4px 10px rgba(16,24,40,.05), 0 12px 32px rgba(16,24,40,.07);
  padding:34px 36px; max-width:520px;
}
.signup-section-title{
  font-size:11.5px; font-weight:800; letter-spacing:.6px; color:var(--blue); text-transform:uppercase;
  margin-bottom:14px; padding-bottom:9px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:7px;
}
.signup-section-title:not(:first-child){ margin-top:26px; }
.su-input, select.su-input{
  width:100%; height:46px; padding:0 14px; border-radius:var(--radius-sm);
  border:1.5px solid var(--border); font-size:14px; color:var(--text); background:var(--card);
  outline:none; box-sizing:border-box; line-height:normal;
  transition:border-color .18s var(--ease), box-shadow .18s var(--ease), transform .1s var(--ease);
  -webkit-appearance:none; appearance:none;
}
select.su-input{
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1l6 6 6-6' stroke='%23667085' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat:no-repeat; background-position:right 14px center; padding-right:36px; cursor:pointer;
}
.su-input:focus{ border-color:var(--blue); box-shadow:0 0 0 4px rgba(21,94,239,.10); }
.su-input:hover:not(:focus){ border-color:#AFC7FA; }
.su-field{ margin-bottom:16px; }
.su-field label{ font-size:12.5px; font-weight:600; color:var(--text2); display:block; margin-bottom:6px; }
.su-err{ font-size:12px; color:var(--error); margin-top:5px; display:none; opacity:0; transform:translateY(-4px); transition:opacity .2s var(--ease), transform .2s var(--ease); }
.su-err.show{ display:block; opacity:1; transform:translateY(0); }
.su-mobile-row{ display:flex; gap:8px; }
.su-mobile-row select.su-input{ max-width:118px; flex-shrink:0; }
.su-mobile-row input.su-input{ flex:1; }
.su-pw-row{ display:flex; gap:8px; }
.su-pw-row input.su-input{ flex:1; }
.su-pw-row button{ flex-shrink:0; height:46px; width:46px; padding:0; }

/* Custom searchable dropdown for College Name — full width, no
   truncation (replaces the native <datalist>, which several browsers
   render as a narrow popup we can't style). */
/* Deliberately NOT position:absolute — native <select> elements on some
   browsers/GPUs render in their own compositing layer that ignores
   z-index and shows through absolutely-positioned overlays. Keeping this
   list in normal document flow (it pushes the rest of the form down
   while open) sidesteps that entirely — no overlap is possible. */
.su-autocomplete{
  display:none; margin-top:6px;
  background:var(--card); border:1.5px solid var(--border); border-radius:var(--radius-sm);
  box-shadow:0 4px 14px rgba(16,24,40,.08);
  max-height:220px; overflow-y:auto;
}
.su-autocomplete-item{
  padding:11px 14px; font-size:13.5px; color:var(--text); cursor:pointer;
  background:var(--card); border-bottom:1px solid var(--border); transition:background .12s var(--ease);
}
.su-autocomplete-item:last-child{ border-bottom:none; }
.su-autocomplete-item:hover{ background:var(--surface-2); }

@media (max-width:560px){
  .signup-card{ padding:24px 20px; max-width:100%; }
  .su-mobile-row{ flex-direction:column; }
  .su-mobile-row select.su-input{ max-width:100%; }
}

/* Success screen — premium checkmark + confetti burst, CSS-only */
.su-success-wrap{ text-align:center; }
.su-checkmark-pop{
  width:88px; height:88px; margin:0 auto 16px; position:relative;
  opacity:0; transform:scale(.4);
  animation:suPop .5s cubic-bezier(.34,1.56,.64,1) .05s forwards;
}
.su-checkmark{ width:100%; height:100%; position:relative; }
.su-checkmark-bg{
  position:absolute; inset:0; border-radius:50%; background:var(--success-bg,#ECFDF3);
  transform:scale(0); animation:suBgPop .4s var(--ease) .05s forwards;
}
.su-checkmark svg{ width:100%; height:100%; position:relative; z-index:1; }
.su-checkmark circle{
  fill:none; stroke:var(--success,#16A34A); stroke-width:4; stroke-linecap:round;
  stroke-dasharray:220; stroke-dashoffset:220;
  animation:suCircleDraw .6s var(--ease) .15s forwards;
}
.su-checkmark path{
  fill:none; stroke:var(--success,#16A34A); stroke-width:5; stroke-linecap:round; stroke-linejoin:round;
  stroke-dasharray:40; stroke-dashoffset:40;
  animation:suCheckDraw .35s var(--ease) .65s forwards;
}
@keyframes suPop{ 0%{ opacity:0; transform:scale(.4); } 100%{ opacity:1; transform:scale(1); } }
@keyframes suBgPop{ to{ transform:scale(1); } }
@keyframes suCircleDraw{ to{ stroke-dashoffset:0; } }
@keyframes suCheckDraw{ to{ stroke-dashoffset:0; } }
.su-success-title{ opacity:0; animation:fadeInUp .5s var(--ease) .85s forwards; }
.su-success-body{ opacity:0; animation:fadeInUp .5s var(--ease) 1s forwards; }
.su-confetti{ position:absolute; inset:0; pointer-events:none; overflow:visible; }
.su-confetti span{
  position:absolute; top:50%; left:50%; width:7px; height:7px; border-radius:2px;
  opacity:0; animation:suConfettiBurst .8s var(--ease) .55s forwards;
}
@keyframes suConfettiBurst{
  0%{ opacity:1; transform:translate(-50%,-50%) rotate(var(--ang)) translateY(0) scale(1); }
  100%{ opacity:0; transform:translate(-50%,-50%) rotate(var(--ang)) translateY(-64px) scale(.3); }
}

/* ---------- Chart animations (bar / donut / line — used portal-wide) ---------- */
@keyframes chartBarGrowH{ from{ transform:scaleX(0); } to{ transform:scaleX(1); } }
@keyframes chartBarGrowV{ from{ transform:scaleY(0); } to{ transform:scaleY(1); } }
@keyframes chartFadeUp{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }
@keyframes chartFadeIn{ from{ opacity:0; } to{ opacity:1; } }
@keyframes chartDonutDraw{ from{ stroke-dashoffset:var(--circ); } to{ stroke-dashoffset:var(--offdest); } }
@keyframes chartDonutRingIn{ from{ opacity:0; transform:scale(.85); } to{ opacity:1; transform:scale(1); } }
@keyframes chartLineDraw{ from{ stroke-dashoffset:var(--linelen); } to{ stroke-dashoffset:0; } }
@keyframes chartDotPop{ from{ opacity:0; transform:scale(0); } to{ opacity:1; transform:scale(1); } }
.chart-bar-h{ transform-box:fill-box; transform-origin:left center; animation:chartBarGrowH .7s cubic-bezier(.34,1.2,.4,1) both; }
.chart-bar-v{ transform-box:fill-box; transform-origin:center bottom; animation:chartBarGrowV .7s cubic-bezier(.34,1.2,.4,1) both; }
.chart-val-label{ animation:chartFadeUp .5s ease both; }
.chart-axis-label{ animation:chartFadeIn .6s ease both; }
.chart-donut-arc{ animation:chartDonutDraw 1.1s cubic-bezier(.4,0,.2,1) both; }
.chart-donut-wrap{ animation:chartDonutRingIn .5s cubic-bezier(.34,1.2,.4,1) both; }
.chart-donut-center{ animation:chartFadeIn .8s ease both; animation-delay:.5s; }
.chart-legend-row{ animation:chartFadeUp .45s ease both; }
.chart-line-path{ animation:chartLineDraw 1.2s cubic-bezier(.4,0,.2,1) both; }
.chart-line-dot{ animation:chartDotPop .4s cubic-bezier(.34,1.5,.4,1) both; }

/* ---------- Sidebar "LIVE" badge — only the small dot pulses (like a
   live-recording indicator); the pill/tag itself stays put. ---------- */
@keyframes liveHeartbeatDot{
  0%,100%{ transform:scale(1); box-shadow:0 0 0 0 rgba(255,255,255,.6); }
  50%{ transform:scale(1.25); box-shadow:0 0 0 4px rgba(255,255,255,0); }
}
.live-badge-tag{
  align-items:center; justify-content:center; gap:5px; background:var(--error); color:#fff;
  font-size:10px; font-weight:800; letter-spacing:.4px; padding:3px 9px 3px 7px; border-radius:20px;
}
.live-heartbeat-dot{
  width:6px; height:6px; border-radius:50%; background:#fff; flex-shrink:0;
  animation:liveHeartbeatDot 1.2s ease-in-out infinite;
}

/* =========================================================================
   NEW LOGIN SCREEN — glassmorphic navy/blue/gold design (reference-matched).
   Everything below is scoped under .gl-login-wrap so it only ever affects
   the login screen itself and never leaks into the rest of the portal
   (dashboard, admin panel, sign-up page, etc. keep their existing look).
   ========================================================================= */
.gl-login-wrap, .gl-login-wrap *{
  box-sizing:border-box; margin:0; padding:0;
  font-family:'Plus Jakarta Sans', sans-serif;
  -webkit-font-smoothing:antialiased;
}
.gl-login-wrap{
  --gl-navy:#070d18;
  --gl-navy-card:rgba(13,23,42,.72);
  --gl-navy-surface:#0f1c33;
  --gl-blue:#155eef;
  --gl-blue-bright:#2563eb;
  --gl-blue-glow:rgba(37,99,235,.45);
  --gl-accent:#f5a623;
  --gl-accent-glow:rgba(245,166,35,.4);
  --gl-radius-card:28px;
  --gl-radius-input:14px;
  --gl-ease:cubic-bezier(.16,1,.3,1);
  /* Light-mode (default) palette. applyTheme() boots to 'light' when no
     saved theme exists, so this is the default; html[data-theme="dark"]
     below flips every one of these to the original dark-obsidian values —
     same layout/spacing/radii/shadows/accent, only lightness changes. */
  /* Tokens below are taken verbatim from the reference's own
     :root/[data-theme=light] and [data-theme=dark] variable blocks, so the
     login page reproduces its exact palette in both modes. */
  --gl-text:#0f172a;
  --gl-text-muted:#64748b;
  --gl-text-soft:#64748b;
  --gl-border-glass:#e2e8f0;
  --gl-border-panel:rgba(226,232,240,.95);
  --gl-border-focus:rgba(37,99,235,.6);
  --gl-page-bg-grad:#f1f5f9;
  --gl-card-bg:rgba(255,255,255,.96);
  --gl-card-left-bg:rgba(248,250,252,.94);
  --gl-card-right-bg:rgba(255,255,255,.98);
  --gl-card-shadow:0 25px 60px -15px rgba(37,99,235,.14), 0 0 0 1px rgba(37,99,235,.05);
  --gl-hero-grid-line:rgba(15,23,42,.035);
  --gl-surface-tint:rgba(37,99,235,.08);
  --gl-surface-border:#e2e8f0;
  --gl-auth-bg:var(--gl-card-right-bg);
  --gl-input-bg:#f8fafc;
  --gl-input-border:#cbd5e1;
  --gl-label-color:#0f172a;
  --gl-link:#2563eb;
  --gl-link-strong:#1d4ed8;
  --gl-hover-bg:rgba(37,99,235,.08);
  --gl-hover-text:#0f172a;
  --gl-pill-text:#64748b;
  --gl-hero-accent:#d97706;
  min-height:100vh; width:100%;
  background:var(--gl-page-bg-grad);
  color:var(--gl-text);
  display:flex; flex-direction:column; align-items:stretch; justify-content:space-between;
  position:relative; overflow-x:hidden; padding:16px 20px;
}
html[data-theme="dark"] .gl-login-wrap{
  --gl-text:#f8fafc;
  --gl-text-muted:#94a3b8;
  --gl-text-soft:#94a3b8;
  --gl-border-glass:#1e293b;
  --gl-border-panel:rgba(30,41,59,.85);
  --gl-page-bg-grad:#050811;
  --gl-card-bg:rgba(13,18,31,.94);
  --gl-card-left-bg:rgba(10,14,26,.94);
  --gl-card-right-bg:rgba(15,21,38,.98);
  --gl-card-shadow:0 35px 80px -15px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.05);
  --gl-hero-grid-line:rgba(255,255,255,.02);
  --gl-surface-tint:rgba(255,255,255,.05);
  --gl-surface-border:#1e293b;
  --gl-auth-bg:var(--gl-card-right-bg);
  --gl-input-bg:#080c16;
  --gl-input-border:#1e293b;
  --gl-label-color:#f8fafc;
  --gl-link:#60a5fa;
  --gl-link-strong:#38bdf8;
  --gl-hover-bg:rgba(255,255,255,.08);
  --gl-hover-text:#fff;
  --gl-pill-text:#94a3b8;
  --gl-hero-accent:#fbbf24;
}
#glParticleCanvas{ position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }
.gl-orb{ position:fixed; border-radius:50%; filter:blur(120px); pointer-events:none; z-index:0; animation:glFloatAura 16s infinite alternate ease-in-out; }
.gl-orb-1{ width:500px; height:500px; background:radial-gradient(circle, var(--gl-blue-glow) 0%, transparent 70%); top:-120px; left:-100px; }
.gl-orb-2{ width:440px; height:440px; background:radial-gradient(circle, var(--gl-accent-glow) 0%, transparent 70%); bottom:-100px; right:-80px; animation-delay:-8s; }
@keyframes glFloatAura{ 0%{ transform:translate(0,0) scale(1); } 100%{ transform:translate(45px,50px) scale(1.12); } }

.gl-page-header{
  width:100%; max-width:1140px; margin:0 auto; z-index:6; position:relative;
  display:flex; align-items:center; justify-content:space-between; padding:6px 2px;
}
.gl-page-header-left{ display:flex; align-items:center; gap:8px; font-size:11px; font-weight:600; letter-spacing:.3px; color:var(--gl-text-muted); }
.gl-status-dot{ position:relative; display:inline-flex; width:8px; height:8px; }
.gl-status-dot-ping{ position:absolute; inset:0; border-radius:50%; background:#34d399; opacity:.75; animation:glStatusPing 1.8s cubic-bezier(0,0,.2,1) infinite; }
.gl-status-dot-core{ position:relative; display:inline-flex; width:8px; height:8px; border-radius:50%; background:#10b981; }
@keyframes glStatusPing{ 75%,100%{ transform:scale(2.2); opacity:0; } }
.gl-theme-toggle-btn{
  display:flex; align-items:center; gap:6px; padding:7px 14px; border-radius:12px;
  background:var(--gl-card-bg); border:1px solid var(--gl-border-glass); color:var(--gl-text);
  font-size:12.5px; font-weight:700; cursor:pointer;
  transition:transform .2s var(--gl-ease), box-shadow .2s var(--gl-ease); box-shadow:0 2px 8px rgba(0,0,0,.06);
}
.gl-theme-toggle-btn:hover{ transform:translateY(-1px) scale(1.03); }
.gl-theme-toggle-icon{ font-size:14px; line-height:1; }
.gl-page-footer{ text-align:center; padding:8px 0 2px; font-size:11px; font-weight:500; color:var(--gl-text-muted); position:relative; z-index:2; }

.gl-portal-container{
  position:relative; z-index:1; width:100%; max-width:1140px; margin:auto;
  display:grid; grid-template-columns:1.15fr .95fr;
  background:var(--gl-card-bg); border:1px solid var(--gl-border-panel);
  backdrop-filter:blur(30px); -webkit-backdrop-filter:blur(30px);
  border-radius:var(--gl-radius-card);
  box-shadow:var(--gl-card-shadow);
  overflow:hidden; animation:glZoomInEntrance .75s var(--gl-ease) forwards;
}
@keyframes glZoomInEntrance{ from{ opacity:0; transform:scale(.96) translateY(24px); } to{ opacity:1; transform:scale(1) translateY(0); } }

.gl-hero-showcase{
  padding:64px 54px; display:flex; flex-direction:column; justify-content:space-between;
  position:relative; border-right:1px solid var(--gl-border-glass);
  background:var(--gl-card-left-bg);
  overflow:hidden;
}
.gl-hero-showcase::before{
  content:''; position:absolute; inset:0;
  background-image:linear-gradient(var(--gl-hero-grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--gl-hero-grid-line) 1px, transparent 1px);
  background-size:38px 38px; pointer-events:none;
}
.gl-hero-showcase-inner{ position:relative; z-index:1; }

.gl-brand-top{ display:flex; align-items:center; gap:14px; margin-bottom:36px; animation:glSlideDownFade .6s var(--gl-ease) .1s both; }
.gl-brand-icon{
  width:40px; height:40px; border-radius:12px; background:linear-gradient(135deg, var(--gl-blue) 0%, var(--gl-blue-bright) 100%);
  color:#fff; display:flex; align-items:center; justify-content:center;
  font-size:19px; box-shadow:0 8px 20px -4px rgba(37,99,235,.35); position:relative; overflow:hidden;
}
.gl-brand-titles .gl-title-main{ font-family:'Outfit', sans-serif; font-size:13px; font-weight:800; letter-spacing:1.4px; color:var(--gl-text); text-transform:uppercase; line-height:1.2; }
.gl-brand-titles .gl-title-sub{ font-size:11px; font-weight:700; letter-spacing:1.8px; color:var(--gl-text-muted); text-transform:uppercase; margin-top:2px; }

.gl-hero-pill-badge{
  display:inline-flex; align-items:center; gap:8px; padding:7px 16px; border-radius:999px;
  background:var(--gl-surface-tint); border:1px solid var(--gl-surface-border); color:var(--gl-pill-text);
  font-size:12.5px; font-weight:700; letter-spacing:.3px; margin-bottom:26px;
  box-shadow:0 4px 14px rgba(0,0,0,.06); animation:glSlideDownFade .6s var(--gl-ease) .2s both;
}
.gl-sparkle-icon{ font-size:13px; color:var(--gl-link); animation:glSpinSlow 6s linear infinite; }
@keyframes glSpinSlow{ 0%{ transform:rotate(0deg); } 100%{ transform:rotate(360deg); } }

.gl-hero-heading{ font-family:'Outfit', sans-serif; font-size:56px; line-height:1.08; font-weight:900; letter-spacing:-1.2px; color:var(--gl-text); margin-bottom:22px; animation:glSlideDownFade .6s var(--gl-ease) .3s both; }
.gl-hero-heading .gl-gold-text{ display:block; color:var(--gl-hero-accent); }
.gl-hero-subtext{ font-size:15.5px; line-height:1.68; color:var(--gl-text-soft); max-width:480px; margin-bottom:32px; animation:glSlideDownFade .6s var(--gl-ease) .4s both; }

.gl-exam-pills-row{ display:flex; gap:12px; flex-wrap:wrap; animation:glSlideDownFade .6s var(--gl-ease) .5s both; }
.gl-exam-tag{
  font-size:13.5px; font-weight:700; padding:9px 20px; border-radius:999px;
  background:var(--gl-card-bg); border:1px solid var(--gl-border-glass); color:var(--gl-text);
  letter-spacing:.4px; cursor:default; transition:all .3s var(--gl-ease); position:relative; overflow:hidden;
}
.gl-exam-tag:hover{ border-color:var(--gl-link); transform:translateY(-2px); box-shadow:0 8px 18px -4px rgba(37,99,235,.2); }

.gl-hero-bottom-footer{ display:flex; align-items:center; gap:28px; margin-top:48px; font-size:13px; color:var(--gl-text-soft); animation:glSlideDownFade .6s var(--gl-ease) .6s both; }
.gl-hero-bottom-footer span{ display:inline-flex; align-items:center; gap:8px; }
@keyframes glSlideDownFade{ from{ opacity:0; transform:translateY(18px); } to{ opacity:1; transform:translateY(0); } }

/* The right column is only ever as tall as its own content (header + the
   active pane + footer) — align-self:center then centers that compact
   block within the taller row set by the hero panel's height, so any
   leftover space is split evenly above/below as ordinary letterboxing
   instead of one large dead zone stuck below the form. */
.gl-auth-section{ align-self:center; padding:44px 44px; display:flex; flex-direction:column; background:var(--gl-card-right-bg); position:relative; }
.gl-auth-panes-wrap{ display:flex; flex-direction:column; }
.gl-form-header{ margin-bottom:28px; }
.gl-eyebrow{ font-size:11.5px; font-weight:800; letter-spacing:1.2px; color:var(--gl-link); text-transform:uppercase; margin-bottom:6px; }
.gl-form-header h2{ font-family:'Outfit', sans-serif; font-size:28px; font-weight:800; color:var(--gl-text); margin-bottom:6px; }
.gl-form-header p{ font-size:13.5px; color:var(--gl-text-muted); }

.gl-role-tabs{ position:relative; display:grid; grid-template-columns:1fr 1fr; background:var(--gl-input-bg); border:1px solid var(--gl-border-glass); border-radius:14px; padding:5px; margin-bottom:26px; }
.gl-role-tab-btn{ position:relative; z-index:2; background:none; border:none; color:var(--gl-text-muted); font-weight:700; font-size:13.5px; padding:10px 0; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; transition:color .25s var(--gl-ease); }
.gl-role-tab-btn.active{ color:#fff; }
.gl-role-slider{ position:absolute; top:5px; bottom:5px; left:5px; width:calc(50% - 5px); background:linear-gradient(135deg, var(--gl-blue), var(--gl-blue-bright)); border-radius:10px; box-shadow:0 4px 16px var(--gl-blue-glow); transition:transform .32s cubic-bezier(.34,1.45,.7,1); z-index:1; }

.gl-field{ margin-bottom:20px; position:relative; }
.gl-field label{ display:block; font-size:12.5px; font-weight:700; color:var(--gl-label-color); margin-bottom:8px; letter-spacing:.2px; }
.gl-input-wrapper{ position:relative; display:flex; align-items:center; }
.gl-input-wrapper input{ width:100%; height:50px; padding:0 16px; background:var(--gl-input-bg); border:1.5px solid var(--gl-input-border); border-radius:var(--gl-radius-input); color:var(--gl-text); font-size:14px; outline:none; transition:all .25s var(--gl-ease); }
.gl-input-wrapper.gl-has-icon input{ padding-left:42px; }
.gl-input-wrapper.gl-has-toggle input{ padding-right:44px; }
.gl-input-wrapper input:focus{ border-color:var(--gl-border-focus); background:rgba(21,94,239,.06); box-shadow:0 0 0 4px rgba(21,94,239,.18); }
.gl-field-icon{ position:absolute; left:14px; font-size:16px; color:var(--gl-text-muted); pointer-events:none; transition:color .25s var(--gl-ease); }
.gl-input-wrapper input:focus ~ .gl-field-icon{ color:var(--gl-link); }
/* Suppress Edge's native password-reveal/clear icon so it never overlaps
   our own 👁️ toggle button on the same corner of the field. */
.gl-login-wrap input[type="password"]::-ms-reveal,
.gl-login-wrap input[type="password"]::-ms-clear{ display:none; width:0; height:0; }
.gl-toggle-pass-btn{
  position:absolute; right:10px; background:none; border:none; color:var(--gl-text-muted); cursor:pointer;
  font-size:16px; line-height:1; padding:6px; border-radius:6px; transition:all .2s;
  display:flex; align-items:center; justify-content:center; width:28px; height:28px;
}
.gl-toggle-pass-btn:hover{ color:var(--gl-hover-text); background:var(--gl-hover-bg); }

.gl-shake-field{ animation:glFieldShake .4s cubic-bezier(.36,.07,.19,.97) both; }
@keyframes glFieldShake{ 10%,90%{ transform:translateX(-3px); } 20%,80%{ transform:translateX(4px); } 30%,50%,70%{ transform:translateX(-5px); } 40%,60%{ transform:translateX(5px); } }

.gl-row-actions{ display:flex; justify-content:space-between; align-items:center; font-size:12.5px; margin-bottom:24px; }
.gl-remember-label{ display:flex; align-items:center; gap:8px; color:var(--gl-text-muted); cursor:pointer; }
.gl-remember-label input{ accent-color:var(--gl-blue); cursor:pointer; }
.gl-forgot-link{ color:var(--gl-link); text-decoration:none; font-weight:600; transition:color .2s; }
.gl-forgot-link:hover{ color:var(--gl-link-strong); text-decoration:underline; }

.gl-btn-submit{
  width:100%; height:50px; border-radius:var(--gl-radius-input); border:none;
  background:linear-gradient(135deg, var(--gl-blue) 0%, var(--gl-blue-bright) 100%); color:#fff;
  font-size:15px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px;
  box-shadow:0 8px 24px -4px var(--gl-blue-glow); transition:all .25s var(--gl-ease); position:relative; overflow:hidden;
}
.gl-btn-submit:hover{ transform:translateY(-2px); box-shadow:0 12px 28px -2px var(--gl-blue-glow); filter:brightness(1.08); }
.gl-btn-submit:active{ transform:translateY(0); }
.gl-btn-submit:disabled{ opacity:.65; cursor:not-allowed; }

.gl-signup-link-row{ font-size:12.5px; color:var(--gl-text-muted); text-align:center; margin-top:18px; }
.gl-signup-link-row a{ color:var(--gl-link); font-weight:700; text-decoration:none; }
.gl-signup-link-row a:hover{ text-decoration:underline; }

.gl-footer-helpline{
  margin-top:18px; padding-top:10px; border-top:1px solid var(--gl-border-glass);
  display:flex; align-items:center; justify-content:center; gap:6px; flex-wrap:nowrap;
  font-size:11px; font-weight:500; color:var(--gl-text-muted); text-align:center; white-space:nowrap; overflow:hidden;
}
.gl-footer-helpline .gl-help-icon{ font-size:12px; flex-shrink:0; }
.gl-footer-helpline a{ color:var(--gl-link); font-weight:700; text-decoration:none; transition:color .2s; font-family:monospace; white-space:nowrap; }
.gl-footer-helpline a:hover{ text-decoration:underline; }

.gl-spinner{ width:18px; height:18px; border:2px solid rgba(255,255,255,.3); border-top-color:#fff; border-radius:50%; animation:glSpin .7s linear infinite; display:inline-block; }
@keyframes glSpin{ to{ transform:rotate(360deg); } }

/* ---------- unified Sign-In / Create-Account view panes ----------
   Reused from the reference's own .view-pane pattern, scoped to the
   login screen's auth section only so it never touches any other part
   of the portal. showView() in main.js toggles .active directly on the
   DOM (no full re-render), which keeps the mesh-canvas animation and
   role-tab state running uninterrupted — same pattern as glSwitchRole(). */
.gl-auth-section .view-pane{ display:none; }
.gl-auth-section .view-pane.active{ display:block; animation:paneFade .32s var(--gl-ease) forwards; }
@keyframes paneFade{ from{ opacity:0; transform:scale(.98) translateY(8px); } to{ opacity:1; transform:scale(1) translateY(0); } }

  background-image:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScxNCcgaGVpZ2h0PScxNCcgdmlld0JveD0nMCAwIDI0IDI0JyBmaWxsPSdub25lJyBzdHJva2U9JyM5NGEzYjgnIHN0cm9rZS13aWR0aD0nMi41JyBzdHJva2UtbGluZWNhcD0ncm91bmQnIHN0cm9rZS1saW5lam9pbj0ncm91bmQnPjxwb2x5bGluZSBwb2ludHM9JzYgOSAxMiAxNSAxOCA5Jz48L3BvbHlsaW5lPjwvc3ZnPg==");

.gl-field select:focus{ border-color:var(--gl-border-focus); box-shadow:0 0 0 4px rgba(21,94,239,.18); }

.gl-signup-scroll{ max-height:min(60vh,500px); overflow-y:auto; padding-right:6px; margin-right:-6px; }

.gl-section-tag{ font-size:10.5px; font-weight:800; letter-spacing:1px; color:var(--gl-link); text-transform:uppercase; margin:18px 0 10px; }
.gl-college-field{ position:relative; }
.gl-autocomplete-list{ position:absolute; left:0; right:0; top:calc(100% + 4px); max-height:210px; overflow-y:auto; background:var(--gl-card-bg); border:1px solid var(--gl-border-glass); border-radius:12px; box-shadow:0 12px 30px -6px rgba(0,0,0,.25); z-index:30; display:none; }

.gl-autocomplete-item:hover{ background:var(--gl-hover-bg); }

.gl-back-link-row{ font-size:12.5px; color:var(--gl-text-muted); text-align:center; margin-top:6px; }
.gl-back-link-row a{ color:var(--gl-link); font-weight:700; text-decoration:none; }

/* ---------- celebration modal, shown after a real signup ---------- */
