<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>FMGs Never Give Up — FMGE • NEET PG • INI-CET Test Series</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A1628;
  --navy-2:#0F2340;
  --blue:#155EEF;
  --blue-bright:#2563EB;
  --accent:#F5A623;
  --coral:#EF4B5F;
  --bg:#F6F7FB;
  --card:#FFFFFF;
  --surface-2:#F0F2F7;
  --text:#0F1729;
  --text2:#64748B;
  --text3:#94A3B8;
  --success:#12B76A;
  --success-bg:#ECFDF3;
  --error:#F04438;
  --error-bg:#FEF3F2;
  --warning:#F79009;
  --warning-bg:#FFFAEB;
  --border:#E5E8F0;
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 2px 6px rgba(16,24,40,.05);
  --shadow-lg:0 12px 32px rgba(10,22,40,.12);
  --ease:cubic-bezier(.4,0,.2,1);
}
html[data-theme="dark"]{
  --navy:#0A1628;
  --navy-2:#122544;
  --blue:#3B82F6;
  --blue-bright:#60A5FA;
  --accent:#F5A623;
  --coral:#F26B7D;
  --bg:#0B111F;
  --card:#131B2E;
  --surface-2:#1B2438;
  --text:#EDF1F9;
  --text2:#93A1C0;
  --text3:#647092;
  --success:#3ECF8E;
  --success-bg:rgba(62,207,142,.12);
  --error:#F87171;
  --error-bg:rgba(248,113,113,.12);
  --warning:#FBBF24;
  --warning-bg:rgba(251,191,36,.12);
  --border:#242E48;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.24);
  --shadow-lg:0 16px 40px rgba(0,0,0,.45);
}
html[data-theme="dark"] .btn-outline{background:var(--card);color:var(--text);}
html[data-theme="dark"] .role-tab.active{background:var(--surface-2);}
html[data-theme="dark"] .demo-hint{background:rgba(59,130,246,.12);border-color:rgba(59,130,246,.25);}
html[data-theme="dark"] .part-row{background:var(--surface-2);}
html[data-theme="dark"] .medmind-panel-log{background:#0F1626;}
html[data-theme="dark"] .medmind-panel-footer{background:var(--card);}
html[data-theme="dark"] input,html[data-theme="dark"] select,html[data-theme="dark"] textarea{background:var(--card);color:var(--text);border-color:var(--border);}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:background .25s var(--ease), color .25s var(--ease);
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
h1,h2,h3,h4{font-family:'Manrope',sans-serif;font-weight:800;margin:0;color:var(--navy);}
p{margin:0;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:#D6E4FF;}
a{color:var(--blue);text-decoration:none;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border-radius:var(--radius-sm);border:none;font-weight:700;font-size:14px;
  padding:11px 20px;transition:transform .12s var(--ease), box-shadow .15s var(--ease), background .15s var(--ease), opacity .15s var(--ease);
  white-space:nowrap;cursor:pointer;
}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.6;cursor:not-allowed;}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 1px 2px rgba(21,94,239,.25), 0 1px 1px rgba(21,94,239,.15);}
.btn-primary:hover{background:var(--blue-bright);box-shadow:0 4px 12px rgba(21,94,239,.28);transform:translateY(-1px);}
.btn-navy{background:var(--navy);color:#fff;}
.btn-navy:hover{background:var(--navy-2);transform:translateY(-1px);}
.btn-accent{background:var(--accent);color:#3A2400;}
.btn-accent:hover{filter:brightness(1.05);transform:translateY(-1px);}
.btn-outline{background:var(--card);color:var(--navy);border:1.5px solid var(--border);}
.btn-outline:hover{border-color:var(--blue);color:var(--blue);}
.btn-danger{background:var(--error-bg);color:var(--error);}
.btn-danger:hover{background:#ffe1de;}
.btn-ghost{background:transparent;color:var(--text2);}
.btn-ghost:hover{background:var(--surface-2);}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);transition:box-shadow .2s var(--ease), transform .2s var(--ease);}
.pad{padding:22px;}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:100px;letter-spacing:.2px;}
.badge-success{background:var(--success-bg);color:var(--success);}
.badge-error{background:var(--error-bg);color:var(--error);}
.badge-warning{background:var(--warning-bg);color:var(--warning);}
.badge-blue{background:#EFF4FF;color:var(--blue);}
.badge-navy{background:#E9EDF5;color:var(--navy);}
.badge-grey{background:var(--surface-2);color:var(--text2);}

input[type=text],input[type=password],input[type=email],input[type=number],input[type=date],input[type=time],select,textarea{
  width:100%;padding:11px 13px;border-radius:10px;border:1.5px solid var(--border);
  font-size:14px;color:var(--text);background:var(--card);outline:none;transition:border-color .15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--blue);}
label{font-size:12.5px;font-weight:600;color:var(--text2);display:block;margin-bottom:6px;}
.field{margin-bottom:16px;}
.row{display:flex;gap:14px;flex-wrap:wrap;}
.row>.field{flex:1;min-width:160px;}

#app{min-height:100vh;}
.hidden{display:none !important;}
.scrollbar-thin::-webkit-scrollbar{width:6px;height:6px;}
.scrollbar-thin::-webkit-scrollbar-thumb{background:#D0D5DD;border-radius:10px;}

/* ===== Toast ===== */
#toastHost{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);animation:slideIn .25s ease;max-width:320px;}
.toast.err{background:var(--error);}
.toast.ok{background:var(--success);}
@keyframes slideIn{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:translateX(0);}}

/* ===== Modal ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(11,31,58,.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-box{background:var(--card);border-radius:16px;max-width:640px;width:100%;max-height:88vh;overflow:auto;box-shadow:var(--shadow-lg);}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);z-index:2;}
.modal-body{padding:22px;}
.modal-close{background:none;border:none;font-size:20px;color:var(--text2);}

/* ===== Login ===== */
.login-wrap{min-height:100vh;display:flex;}
.login-hero{flex:1.15;background:
    linear-gradient(160deg,var(--navy) 0%,var(--navy-2) 55%,var(--blue) 130%);
  color:#fff;display:flex;flex-direction:column;justify-content:center;padding:64px 68px;position:relative;overflow:hidden;}
.login-hero::after{content:'';position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:42px 42px;pointer-events:none;}
.login-hero::before{content:'';position:absolute;width:480px;height:480px;background:radial-gradient(circle,rgba(245,166,35,.16),transparent 70%);top:-120px;right:-120px;}
.login-hero-content{position:relative;z-index:1;}
.login-logo-row{display:flex;align-items:center;gap:12px;margin-bottom:34px;}
.login-logo-icon{width:44px;height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.hero-badge{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#E4C97A;font-size:12px;font-weight:700;letter-spacing:.2px;padding:7px 14px;border-radius:999px;margin-bottom:26px;}
.login-hero .brand{font-size:13px;font-weight:700;letter-spacing:1.5px;color:var(--accent);margin-bottom:22px;}
.login-hero h1{color:#fff;font-size:56px;line-height:1.14;max-width:560px;letter-spacing:-1px;}
.login-hero p.sub{color:#B9C6E0;font-size:16px;margin-top:18px;max-width:440px;line-height:1.65;}
.exam-pill{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#fff;font-weight:700;font-size:13.5px;padding:8px 17px;border-radius:999px;letter-spacing:.3px;transition:background .2s var(--ease), border-color .2s var(--ease);}
.exam-pill:hover{background:rgba(245,166,35,.14);border-color:rgba(245,166,35,.5);}
.hero-fade{opacity:0;transform:translateY(14px);animation:heroFadeIn .6s ease forwards;}
@keyframes heroFadeIn{to{opacity:1;transform:translateY(0);}}
.hero-stats{display:flex;gap:34px;margin-top:46px;}
.hero-stats div b{display:block;font-size:26px;font-family:'Manrope';font-weight:800;color:#fff;}
.hero-stats div span{font-size:12.5px;color:#9FB3D6;}
.hero-footer-note{position:relative;z-index:1;display:flex;gap:28px;margin-top:64px;font-size:12.5px;color:#8CA0C4;}
.hero-footer-note span{display:inline-flex;align-items:center;gap:6px;}
.login-panel{flex:1;display:flex;align-items:center;justify-content:center;padding:40px;background:var(--bg);}
.login-card{width:100%;max-width:380px;}
.role-tabs{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;margin-bottom:26px;}
.role-tab{flex:1;text-align:center;padding:9px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--text2);cursor:pointer;transition:all .2s var(--ease);}
.role-tab.active{background:var(--card);color:var(--navy);box-shadow:var(--shadow);}
.demo-hint{background:#EFF4FF;border:1px solid #D6E4FF;border-radius:10px;padding:10px 13px;font-size:12px;color:var(--blue);margin-top:14px;line-height:1.6;}

/* ===== App Shell (Admin) ===== */
.shell{display:flex;min-height:100vh;}
.sidebar{width:246px;background:var(--navy);color:#fff;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
.sidebar-brand{padding:22px 22px 18px;border-bottom:1px solid rgba(255,255,255,.08);}
.sidebar-brand b{font-family:'Manrope';font-weight:800;font-size:16px;display:block;color:#fff;}
.sidebar-brand span{font-size:11px;color:var(--accent);font-weight:700;letter-spacing:.5px;}
.nav-list{list-style:none;margin:0;padding:14px 12px;flex:1;overflow-y:auto;}
.nav-item{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:10px;color:#AEC0E0;font-size:13.8px;font-weight:600;cursor:pointer;margin-bottom:2px;transition:all .12s;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:var(--blue);color:#fff;}
.nav-icon{width:18px;text-align:center;font-size:15px;}
.sidebar-foot{padding:16px 22px;border-top:1px solid rgba(255,255,255,.08);font-size:12.5px;color:#8DA1C4;}
.topbar{height:66px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:50;}
.topbar h2{font-size:19px;}
.main{flex:1;padding:26px;max-width:100%;overflow-x:hidden;}
.mobile-toggle{display:none;background:none;border:none;font-size:22px;color:var(--navy);}

.grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:24px;}
.stat-card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:18px 20px;box-shadow:var(--shadow);}
.stat-card .lbl{font-size:12.5px;color:var(--text2);font-weight:600;margin-bottom:8px;}
.stat-card .val{font-family:'Manrope';font-weight:800;font-size:26px;color:var(--navy);}
.stat-card .delta{font-size:11.5px;font-weight:700;margin-top:6px;}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;padding:11px 14px;background:var(--surface-2);color:var(--text2);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border);background:var(--card);}
.table-wrap table thead th{position:sticky;top:0;background:var(--surface-2);z-index:2;box-shadow:0 1px 0 var(--border);}
.table-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.search-box{position:relative;min-width:220px;flex:1;max-width:340px;}
.search-box input{padding-left:34px;}
.search-box::before{content:'🔍';position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:12px;opacity:.5;}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;}
.filter-row select{width:auto;min-width:120px;padding:8px 10px;font-size:12.5px;}

.tabbar{display:flex;gap:6px;border-bottom:2px solid var(--border);margin-bottom:20px;overflow-x:auto;}
.tabbtn{padding:11px 4px;margin-right:22px;font-weight:700;font-size:13.5px;color:var(--text2);border:none;background:none;border-bottom:2.5px solid transparent;margin-bottom:-2px;white-space:nowrap;}
.tabbtn.active{color:var(--blue);border-color:var(--blue);}

.progress-bar{height:8px;background:var(--surface-2);border-radius:6px;overflow:hidden;}
.progress-bar > div{height:100%;border-radius:6px;background:var(--blue);}

/* ===== Wizard ===== */
.wizard-steps{display:flex;gap:0;margin-bottom:26px;overflow-x:auto;}
.wstep{flex:1;min-width:110px;text-align:center;padding:10px 6px;border-bottom:3px solid var(--border);color:var(--text2);font-size:12px;font-weight:700;position:relative;}
.wstep.active{border-color:var(--blue);color:var(--blue);}
.wstep.done{border-color:var(--success);color:var(--success);}

/* ===== Question card ===== */
.qcard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.opt-row{display:flex;align-items:flex-start;gap:8px;padding:6px 0;font-size:13.5px;}
.opt-row.correct{color:var(--success);font-weight:700;}

/* ===== STUDENT PORTAL ===== */
.stu-header{background:var(--navy);color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
.stu-avatar{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}
.stu-logout-btn{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;transition:background .15s var(--ease);flex-shrink:0;}
.stu-logout-btn:hover{background:rgba(255,255,255,.14);}
.stu-header .brand{font-family:'Manrope';font-weight:800;font-size:16px;}
.stu-header .brand span{color:var(--accent);}
.stu-shell{max-width:1180px;margin:0 auto;padding:26px 20px 60px;}
.welcome-band{background:linear-gradient(120deg,var(--navy),#173B6E);color:#fff;border-radius:18px;padding:30px 32px;margin-bottom:24px;position:relative;overflow:hidden;}
.welcome-band::after{content:'';position:absolute;right:-60px;top:-60px;width:220px;height:220px;background:radial-gradient(circle,rgba(255,176,0,.22),transparent 70%);}
.welcome-band h2{color:#fff;font-size:24px;}
.welcome-band p{color:#C6D3EE;margin-top:6px;font-size:14px;}
.test-avail-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;box-shadow:var(--shadow);}
.test-avail-card .pill{background:#EFF4FF;color:var(--blue);font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:100px;}
.pattern-chip{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:9px 13px;font-size:12.5px;font-weight:600;color:var(--text2);}

/* ===== New Dashboard Design System ===== */
@keyframes fadeInUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.fade-in-up{opacity:0;animation:fadeInUp .5s var(--ease) forwards;}
.dash-hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 60%,#173B6E 130%);color:#fff;border-radius:20px;padding:32px 34px;margin-bottom:20px;position:relative;overflow:hidden;}
.dash-hero::after{content:'';position:absolute;right:-70px;top:-90px;width:260px;height:260px;background:radial-gradient(circle,rgba(245,166,35,.20),transparent 70%);}
.dash-hero-top{position:relative;z-index:1;margin-bottom:14px;}
.dash-hero-tag{display:inline-block;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#CBD8F0;font-size:11px;font-weight:700;letter-spacing:.6px;padding:5px 12px;border-radius:100px;}
.dash-hero h2{position:relative;z-index:1;color:#fff;font-size:27px;line-height:1.3;max-width:640px;}
.accent-text{color:var(--accent);}
.dash-hero-sub{position:relative;z-index:1;color:#B9C6E0;margin-top:8px;font-size:14.5px;max-width:560px;line-height:1.6;}
.dash-hero-actions{position:relative;z-index:1;display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;}
.dash-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px;}
.dash-stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);}
.dash-stat-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.dash-stat b{display:block;font-size:20px;font-family:'Manrope';font-weight:800;color:var(--text);line-height:1.2;}
.dash-stat span{font-size:12px;color:var(--text2);}

/* ===== NEET PG Rank Predictor — dedicated, consistent styling ===== */
@keyframes rpAuroraDrift{
  0%{transform:translate(-6%,-4%) scale(1);}
  50%{transform:translate(6%,5%) scale(1.12);}
  100%{transform:translate(-6%,-4%) scale(1);}
}
@keyframes rpAuroraDrift2{
  0%{transform:translate(5%,4%) scale(1.05);}
  50%{transform:translate(-7%,-3%) scale(0.95);}
  100%{transform:translate(5%,4%) scale(1.05);}
}
.rp-hero{
  position:relative;overflow:hidden;background:#F8FAFF;
  border-radius:20px;padding:44px 32px 34px;margin-bottom:22px;text-align:center;
}
.rp-hero::before{
  content:'';position:absolute;width:520px;height:340px;left:50%;top:-30%;transform:translateX(-50%);
  background:radial-gradient(ellipse,rgba(21,94,239,.22),transparent 70%);
  animation:rpAuroraDrift 14s ease-in-out infinite;pointer-events:none;
}
.rp-hero::after{
  content:'';position:absolute;width:420px;height:300px;right:10%;bottom:-40%;
  background:radial-gradient(ellipse,rgba(245,166,35,.14),transparent 70%);
  animation:rpAuroraDrift2 16s ease-in-out infinite;pointer-events:none;
}
.rp-hero-inner{position:relative;z-index:1;}
.rp-hero-tag{display:inline-block;background:rgba(21,94,239,.08);border:1px solid rgba(21,94,239,.18);color:var(--blue);font-size:11px;font-weight:700;letter-spacing:.6px;padding:5px 12px;border-radius:100px;margin-bottom:16px;}
.rp-hero h2{color:var(--navy);font-size:38px;font-weight:800;line-height:1.15;margin-bottom:14px;letter-spacing:-.5px;}
.rp-hero-sub{color:var(--text2);font-size:16px;line-height:1.6;max-width:620px;margin:0 auto;}
.rp-hero-sub b{color:var(--navy);font-weight:700;}
.rp-hero-note{color:var(--text3);font-size:13.5px;margin-top:12px;line-height:1.6;}

.rp-stats{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:22px;}
.rp-stat{background:var(--card);border:1px solid var(--border);border-radius:999px;padding:12px 22px;display:flex;align-items:baseline;gap:7px;box-shadow:var(--shadow);}
.rp-stat-icon{display:none;}
.rp-stat b{font-size:17px;font-family:'Manrope';font-weight:800;color:var(--navy);}

   FMGs NEVER GIVE UP — National FMGE CBT Exam Portal
   Single-file functional prototype.
   All "server" behaviour (section locking, timers, autosave, scoring,
   ranking) is implemented in a serverAPI layer backed by window.storage,
   so it is timestamp-authoritative rather than trusting the browser clock,
   and survives a real page refresh. Data shapes mirror a relational schema

========================================================================= */

// ---------- tiny helpers ----------
const $ = (sel,root=document)=>root.querySelector(sel);
const $$ = (sel,root=document)=>[...root.querySelectorAll(sel)];
function uid(prefix='id'){return prefix+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);}
function esc(s){return (s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function truthy(v){ return ['true','1','yes','y','unlocked','active','enabled'].includes((v||'').toString().trim().toLowerCase()); }
function fmtClock(sec){
  sec=Math.max(0,Math.round(sec));
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
  return h>0? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function fmtDate(d){ try{ return new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }catch(e){return d;} }
function fmtDateTime(d){ try{ return new Date(d).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }catch(e){return d;} }
function toast(msg,type=''){
  const host=$('#toastHost');
  const t=document.createElement('div');
  t.className='toast '+type;
  t.textContent=msg;
  host.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300);},2800);
}
function downloadCSV(filename, rows){
  const csv = rows.map(r=>r.map(c=>{
    c = (c===undefined||c===null)?'':String(c);
    if(c.includes(',')||c.includes('"')||c.includes('\n')) c = '"'+c.replace(/"/g,'""')+'"';
    return c;
  }).join(',')).join('\n');
  const blob = new Blob([csv],{type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function parseCSV(text){
  // Proper RFC4180-style parser: scans character-by-character so that
  // newlines and commas INSIDE a quoted field (e.g. a multi-paragraph
  // explanation) do not get mistaken for a new row/column.
  const rows = [];
  let row = [];
  let cur = '';
  let inQ = false;
  const src = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  for(let i=0;i<src.length;i++){
    const c = src[i];
    if(inQ){
      if(c === '"'){
        if(src[i+1] === '"'){ cur += '"'; i++; }
        else { inQ = false; }
      } else {
        cur += c;
      }
    } else {
      if(c === '"'){ inQ = true; }
      else if(c === ','){ row.push(cur); cur=''; }
      else if(c === '\n'){ row.push(cur); cur=''; rows.push(row); row=[]; }
      else { cur += c; }
    }
  }
  if(cur.length || row.length){ row.push(cur); rows.push(row); }
  const nonEmpty = rows.filter(r => r.some(cell => cell.trim().length));
  if(!nonEmpty.length) return {headers:[],rows:[]};
  const headers = nonEmpty[0].map(h=>h.trim().toLowerCase().replace(/\s+/g,'_'));
  const dataRows = nonEmpty.slice(1).map(cells=>{
    const obj={};
    headers.forEach((h,i)=>obj[h]=(cells[i]??'').trim());
    return obj;
  });
  return {headers, rows: dataRows};
}

// ---------- persistent storage-backed "DB" ----------
const DB = {
  cache:{},
  async get(key, fallback, shared=true){
    if(this.cache[key]!==undefined) return this.cache[key];
    try{
      const r = await window.storage.get(key, shared);
      const v = r ? JSON.parse(r.value) : fallback;
      this.cache[key]=v;
      return v;
    }catch(e){
      this.cache[key]=fallback;
      return fallback;
    }
  },
  async set(key, value, shared=true){
    this.cache[key]=value;
    try{ await window.storage.set(key, JSON.stringify(value), shared); }catch(e){ console.warn('storage set failed',key,e); }
    return value;
  }
};

function buildSeedQuestions(){
  return SAMPLE_QUESTIONS.map((r,i)=>{
    const [text,a,b,c,d,correct,expl,subject,topic,diff] = r;
    return {
      id:'Q'+String(1000+i),
      text, options:{A:a,B:b,C:c,D:d},
      correct, explanation:expl, subject, topic,
      difficulty:diff, tags:[subject.slice(0,3).toUpperCase()],
      marks:1, negMarks:0.25, type:'Single Correct',
      image:null, createdAt: Date.now() - i*86400000,
    };
  });
}
function buildSeedTest(questions){
  // 6 sections of 6 questions each (represents 50Q/50min in production)
  const secNames = [
    ['A','Part A — Section A'],['A','Part A — Section B'],['A','Part A — Section C'],
    ['B','Part B — Section A'],['B','Part B — Section B'],['B','Part B — Section C'],
  ];
  const sections = secNames.map((s,i)=>({
    id:'SEC'+(i+1),
    part:s[0],
    name:s[1],
    order:i,
    durationSec:50*60,
    questionIds: questions.slice(i*6,i*6+6).map(q=>q.id),
  }));
  return {
    id:'TEST1',
    name:'FMGE National Mock Test 01',
    description:'Full-length national mock exam replicating the actual FMGE CBT pattern — 6 timed sections, 36 questions (demo scale of the real 300-question, 5-hour exam).',
    date: new Date(Date.now()+1000*60*60*24*0).toISOString().slice(0,10),
    startTime:'10:00',
    status:'live',
    negativeMarking:0.25,
    sections,
    settings:{
      shuffleQuestions:false, shuffleOptions:false,
      resultVisibility:'immediately', showCorrectAnswers:true,
      showExplanations:true, showRank:true, showPercentile:true, showReview:true,
      fullscreen:true, disableCopyPaste:true, disableRightClick:true,
      tabSwitchLimit:3,
    }
  };
}

function randNormal(mean,sd){
  let u=0,v=0; while(u===0)u=Math.random(); while(v===0)v=Math.random();
  return mean + sd*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
}
function buildFakeAttempts(test, questions, count=64){
  // Generate plausible national-level fake attempts so ranking/analytics have real substance.
  const names = ["Priya Sharma","Aman Verma","Sneha Iyer","Karan Malhotra","Divya Nair","Rohit Kapoor","Isha Bansal","Vikram Singh","Neha Gupta","Arjun Reddy","Simran Kaur","Yash Patel","Ritu Chawla","Aditya Joshi","Meera Pillai","Sahil Khanna","Tanvi Desai","Nikhil Rao","Pooja Menon","Harsh Agarwal"];
  const totalQ = test.sections.reduce((a,s)=>a+s.questionIds.length,0);
  const out=[];
  for(let i=0;i<count;i++){
    const name = names[i%names.length]+(i>=names.length? ' '+(Math.floor(i/names.length)+1):'');
    const skill = Math.min(0.97,Math.max(0.15, randNormal(0.62,0.16)));
    let correct=0, incorrect=0, unattempted=0;
    const subjPerf={}; SUBJECTS.forEach(s=>subjPerf[s]={correct:0,total:0});
    questions.forEach(q=>{
      subjPerf[q.subject].total++;
      const roll = Math.random();
      if(roll < 0.06){ unattempted++; }
      else if(roll < 0.06+skill*0.94){ correct++; subjPerf[q.subject].correct++; }
      else { incorrect++; }
    });
    const score = +(correct*test.sections.length ? (correct*1 - incorrect*0.25) : 0).toFixed(2);
    const accuracy = (correct+incorrect)>0? +((correct/(correct+incorrect))*100).toFixed(1) : 0;
    const timeUsed = Math.round((totalQ*50 + randNormal(0,300)));
    out.push({
      id:uid('ATT'), testId:test.id, studentName:name, studentId:'FMGS-'+(20000+i),
      score, accuracy, correct, incorrect, unattempted, timeUsed,
      subjPerf, submittedAt: Date.now()-Math.floor(Math.random()*1000*60*60*40),
      fake:true,
    });
  }
  return out;
}

async function boot(){
  const seeded = await DB.get('seeded_v1', false, true);
  if(!seeded){
    const questions = buildSeedQuestions();
    const test = buildSeedTest(questions);
    const users = buildSeedUsers();
    const fakeAttempts = buildFakeAttempts(test, questions);
    await DB.set('questions', questions, true);
    await DB.set('tests', [test], true);
    await DB.set('users', users, true);
    await DB.set('attempts', fakeAttempts, true); // real attempts appended here on submit
    await DB.set('auditLog', [], true);
    await DB.set('settings', {
      demoSpeed: 20, // speeds section timers up 20x for demo/testing; set 1 for real 50-minute sections
      globalShuffle:false,
      tabSwitchLimit:3,
      fullscreenRequired:true,
      disableCopyPaste:true,
    }, true);
    await DB.set('seeded_v1', true, true);
  }

  // ---- Restore an existing session on page load/refresh, so a student
  // (or admin) is never unexpectedly dumped back to the login screen. ----
  try{
    const saved = localStorage.getItem('fmge_student_session');
    if(saved){
      const info = JSON.parse(saved);
      const { data, error } = await sb.rpc('student_get_dashboard', {p_token: info.token});
      if(!error && data){
        S.role = 'student';
        S.studentToken = info.token;
        S.currentUser = { id: info.id, studentId: info.studentId, name: info.name, status:'Active', examTarget: info.examTarget||'FMGE' };
        S.view = 'student'; S.studentPage = 'dashboard';
      } else if(error && /session expired|attempt not found|invalid/i.test(error.message||'')){
        // This is a genuine "the token itself is no longer valid" signal
        // (e.g. the student logged in on another device, which invalidates
        // this one) — safe and correct to clear it and show the login page.
        localStorage.removeItem('fmge_student_session');
      }
      // Any OTHER error here (network hiccup, temporary Supabase outage,
      // DNS blip on page load, etc.) is NOT treated as an invalid session —
      // we deliberately do NOT clear localStorage in that case, so the very
      // next page load/refresh (once connectivity returns) can still log
      // the student back in automatically instead of forcing a manual
      // re-login for what was only ever a temporary network issue.
    }
  }catch(e){
    // A thrown exception here almost always means the request never even
    // reached the server (offline, DNS failure, etc.) — a pure
    // connectivity problem, not an invalid session. Leave the saved
    // session alone so the next attempt can still succeed.
  }

  if(!S.role){
    try{
      const { data: { session } } = await sb.auth.getSession();
      if(session?.user && (session.user.email||'').toLowerCase() === ADMIN_EMAIL.toLowerCase()){
        S.role = 'admin';
        S.currentUser = { id:session.user.id, name:'System Administrator', email:session.user.email, status:'Active' };
        S.view='admin'; S.adminSection='dashboard';
      }
    }catch(e){ /* no valid admin session — fine, show login */ }
  }

  // Support/helpline number shown on the login screen — admin-editable
  // from Settings. Falls back to the original hardcoded number if the
  // app_settings table/RPC doesn't exist yet (e.g. this SQL hasn't been
  // run yet), so nothing breaks on an older database.
  S.appSettings = { support_phone: '+91 98182 79059', support_label: 'Need help? Contact support —' };
  try{
    const { data: appCfg, error: appCfgErr } = await sb.rpc('app_get_settings');
    if(!appCfgErr && appCfg){
      S.appSettings.support_phone = appCfg.support_phone || S.appSettings.support_phone;
      S.appSettings.support_label = appCfg.support_label || S.appSettings.support_label;
    }
  }catch(e){ /* app_settings not set up yet — keep the fallback above */ }

  S.booted = true;
}

// ---------- AUTH ----------
async function doLogin(role, username, password){
  if(role==='admin'){
    // Real Supabase Auth login. Only the one admin account created in
    // Supabase (Authentication -> Users) can ever succeed here.
    const { data, error } = await sb.auth.signInWithPassword({ email: username.trim(), password });
    if(error || !data?.user){ toast('Invalid admin email or password','err'); return false; }
    if((data.user.email||'').toLowerCase() !== ADMIN_EMAIL.toLowerCase()){
      await sb.auth.signOut();
      toast('This account is not authorized as admin','err'); return false;
    }
    S.role = 'admin';
    S.currentUser = { id:data.user.id, name:'System Administrator', email:data.user.email, status:'Active' };
    await logAudit('Login','Admin logged in');
    S.view='admin'; S.adminSection='dashboard';
    render();
    return true;
  } else {
    // Student login goes through our secure database function
    // (student_login) — it checks the password hash server-side and never
    // exposes any password. It also hands back a session token used for
    // future secure actions (exam start/save/submit) in later steps.
    const { data, error } = await sb.rpc('student_login', { p_student_id: username.trim(), p_password: password });
    const row = Array.isArray(data) ? data[0] : data;
    if(error || !row){ toast('Invalid Student ID or password','err'); return false; }
    S.role = 'student';
    S.studentToken = row.token;
    S.currentUser = { id: row.id, studentId: row.student_id, name: row.name, status:'Active', examTarget: row.exam_target||'FMGE' };
    localStorage.setItem('fmge_student_session', JSON.stringify({ token: row.token, id: row.id, studentId: row.student_id, name: row.name, examTarget: row.exam_target||'FMGE' }));
    S.view='student'; S.studentPage='dashboard';
    render();
    return true;
  }
}
async function doLogout(){
  if(S.examTimerHandle) clearInterval(S.examTimerHandle);
  if(S.role==='admin'){ await sb.auth.signOut(); }
  localStorage.removeItem('fmge_student_session');
  S.role=null; S.currentUser=null; S.studentToken=null; S.view='login'; S.activeAttempt=null;
  render();
}

// ---------- small svg bar chart helper ----------
function svgBarChart(data, {width=560,height=200,color='#155EEF',max=null}={}){
  // data: [{label,value}]
  const m = max ?? Math.max(1,...data.map(d=>d.value));
  const barW = (width-40)/data.length - 10;
  let bars='', labels='';
  data.forEach((d,i)=>{
    const h = Math.max(2,(d.value/m)*(height-46));
    const x = 30 + i*((width-40)/data.length);
    const y = height-30-h;
    bars += `<rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="5" fill="${d.color||color}"></rect>
      <text x="${x+barW/2}" y="${y-6}" font-size="11" fill="#101828" text-anchor="middle" font-weight="700">${d.value}</text>`;
    labels += `<text x="${x+barW/2}" y="${height-12}" font-size="10.5" fill="#667085" text-anchor="middle">${esc(d.label)}</text>`;
  });
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" style="max-width:${width}px">
    <line x1="30" y1="${height-30}" x2="${width-10}" y2="${height-30}" stroke="#E4E7EC"/>
    ${bars}${labels}
  </svg>`;
}
// Horizontal bar chart — used wherever there can be MANY categories (e.g.
// 15-20+ subjects). A vertical bar chart squeezes labels into a narrow
// column each, causing them to overlap once there are more than ~8 bars;
// a horizontal layout gives every label its own full-width row instead,
// so it stays readable no matter how many subjects there are.
function svgHorizontalBarChart(data, {width=560,rowHeight=26,labelWidth=120,color='#155EEF',max=null}={}){
  const m = max ?? Math.max(1,...data.map(d=>d.value));
  const chartW = width - labelWidth - 50; // space left for the bar itself after the label + value columns
  const height = data.length*rowHeight + 10;
  let rows='';
  data.forEach((d,i)=>{
    const y = 10 + i*rowHeight;
    const barW = Math.max(2, (d.value/m)*chartW);
    rows += `<text x="${labelWidth-8}" y="${y+rowHeight*0.65}" font-size="12" fill="#344054" text-anchor="end">${esc(d.label)}</text>
      <rect x="${labelWidth}" y="${y+4}" width="${barW}" height="${rowHeight-10}" rx="4" fill="${d.color||color}"></rect>
      <text x="${labelWidth+barW+8}" y="${y+rowHeight*0.65}" font-size="11.5" fill="#101828" font-weight="700">${d.value}${d.suffix||''}</text>`;
  });
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" style="max-width:${width}px;display:block;">${rows}</svg>`;
}
function svgDonutChart(segments,{size=160,thickness=22,centerLabel='',centerSub=''}={}){
  // segments: [{label, value, color}]
  const total = segments.reduce((a,s)=>a+s.value,0) || 1;
  const r = (size-thickness)/2;
  const cx=size/2, cy=size/2;
  const circumference = 2*Math.PI*r;
  let offset = 0;
  const arcs = segments.filter(s=>s.value>0).map(s=>{
    const frac = s.value/total;
    const dash = frac*circumference;
    const el = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${thickness}"
      stroke-dasharray="${dash} ${circumference-dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})" stroke-linecap="butt"/>`;
    offset += dash;
    return el;
  }).join('');
  return `<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap;">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="${thickness}"/>
      ${arcs}
      <text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="20" font-weight="800" fill="var(--text)" font-family="Manrope">${esc(centerLabel)}</text>
      <text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="10.5" fill="var(--text2)">${esc(centerSub)}</text>
    </svg>
    <div style="display:flex;flex-direction:column;gap:8px;">
      ${segments.map(s=>`<div style="display:flex;align-items:center;gap:7px;font-size:12.5px;"><span style="width:10px;height:10px;border-radius:3px;background:${s.color};flex-shrink:0;"></span><span style="color:var(--text2);">${esc(s.label)}</span><b style="margin-left:auto;">${s.value}</b></div>`).join('')}
    </div>
  </div>`;
}
function svgLineChart(points,{width=560,height=200,color='#155EEF',suffix=''}={}){
  const max = Math.max(1,...points.map(p=>p.y));
  const stepX = (width-40)/(points.length-1||1);
  const coords = points.map((p,i)=>{
    const x=30+i*stepX; const y = height-40-(p.y/max)*(height-70);
    return [x,y];
  });
  const path = coords.map((c,i)=> (i===0?'M':'L')+c[0].toFixed(1)+' '+c[1].toFixed(1)).join(' ');
  const area = path + ` L${coords[coords.length-1][0]},${height-30} L${coords[0][0]},${height-30} Z`;
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" style="max-width:${width}px">
    <defs><linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity="0.22"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <line x1="30" y1="${height-30}" x2="${width-10}" y2="${height-30}" stroke="#E4E7EC"/>
    <path d="${area}" fill="url(#lg1)"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${coords.map((c,i)=>`<circle cx="${c[0]}" cy="${c[1]}" r="4" fill="#fff" stroke="${color}" stroke-width="2.5"/>`).join('')}
    ${coords.map((c,i)=> i===coords.length-1? `<text x="${c[0]}" y="${c[1]-12}" font-size="12" font-weight="800" fill="${color}" text-anchor="middle">${points[i].y}${suffix}</text>` : '').join('')}
    ${points.map((p,i)=>`<text x="${coords[i][0]}" y="${height-12}" font-size="10" fill="#667085" text-anchor="middle">${esc(p.x)}</text>`).join('')}
  </svg>`;
}

// Permanently removes a student — different from Disable (blocks access
// but keeps them + their history) and different from batch-unassign
// (only removes them from a batch). If a student already has exam
// attempts on record, admin_delete_student refuses and asks the admin
// to Disable instead, so real exam data is never silently orphaned.
window.deleteStudent = async(id, name)=>{
  confirmModal(`Permanently delete "${name}"? This removes the student account entirely — this cannot be undone. If they've already attempted an exam, deletion will be blocked automatically (use Disable instead in that case).`, async()=>{
    const { error } = await sb.rpc('admin_delete_student', {p_student_uuid: id});
    if(error){ toast('Could not delete: '+error.message,'err'); return; }
    await logAudit('Delete Student', `${name} (${id})`);
    S.stuSelected.delete(id);
    toast('Student deleted','ok');
    renderAdminSection($('#adminMain'));
  }, {okLabel:'Delete permanently'});
};
async function bulkDeleteStudents(){
  const ids = Array.from(S.stuSelected);
  if(!ids.length) return;
  confirmModal(`Permanently delete ${ids.length} selected student(s)? This cannot be undone. Any student who has already attempted an exam will be skipped automatically (their account stays — use Disable for those instead).`, async()=>{
    let ok=0, fail=0;
    for(let i=0;i<ids.length;i++){
      const { error } = await sb.rpc('admin_delete_student', {p_student_uuid: ids[i]});
      if(error) fail++; else ok++;
    }
    await logAudit('Bulk Delete Students', `${ok} deleted, ${fail} skipped (had exam attempts or other error)`);
    toast(`${ok} student(s) deleted${fail?`, ${fail} skipped (already have exam attempts)`:''}`, fail? 'err':'ok');
    S.stuSelected.clear();
    renderAdminSection($('#adminMain'));
  }, {okLabel:'Delete permanently'});
}

window.toggleStudentStatus = async(id, currentStatus)=>{

  if(error){ toast('Could not update: '+error.message,'err'); return; }
  await logAudit('Toggle Student Access', `${id} -> ${newStatus}`);
  toast('Student access updated','ok'); renderAdminSection($('#adminMain'));
};

function openStudentModal(id=null){
  (async()=>{
    let student = null;
    if(id){
      const { data } = await sb.rpc('admin_list_students');
      student = (data||[]).find(s=>s.id===id);
    }
    const { data: batches } = await sb.rpc('admin_list_batches');
    openModal(student?'Edit Student':'Add Student', `
      <div class="row">
        <div class="field"><label>Student Name</label><input id="f_name" value="${esc(student?.name||'')}"></div>
        <div class="field"><label>Student ID (login)</label><input id="f_sid" value="${esc(student?.student_id||'')}" ${student?'disabled':''}></div>
      </div>
      <div class="row">
        <div class="field"><label>Email</label><input id="f_email" value="${esc(student?.email||'')}"></div>
        <div class="field"><label>Mobile Number</label><input id="f_mobile" value="${esc(student?.mobile||'')}"></div>
      </div>
      <div class="row">
        <div class="field"><label>${student?'New Password (leave blank to keep current)':'Password'}</label>
          <div style="display:flex;gap:6px;"><input id="f_pass" type="password"><button type="button" class="btn btn-ghost btn-sm" id="togglePwView">👁</button></div></div>
        <div class="field"><label>Exam Target</label>
          <select id="f_target"><option ${(!student||student.exam_target==='FMGE')?'selected':''}>FMGE</option><option ${student?.exam_target==='NEET PG'?'selected':''}>NEET PG</option><option ${student?.exam_target==='INI-CET'?'selected':''}>INI-CET</option></select></div>
      </div>
      <div class="row">
        <div class="field"><label>Status</label>
          <select id="f_status"><option ${(!student||student.status==='Active')?'selected':''}>Active</option><option ${student?.status==='Inactive'?'selected':''}>Inactive</option><option ${student?.status==='Blocked'?'selected':''}>Blocked</option></select></div>
        <div class="field"><label>Batch</label>
          <select id="f_batch"><option value="">— No batch —</option>${(batches||[]).map(b=>`<option value="${b.id}" ${student?.batch_id===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select></div>
      </div>
      <button class="btn btn-primary btn-block" id="saveStuBtn" style="margin-top:8px;">Save Student</button>
    `);
    $('#togglePwView').onclick=()=>{ const inp=$('#f_pass'); inp.type = inp.type==='password'?'text':'password'; };
    $('#saveStuBtn').onclick=async()=>{
      const val = sel=>$(sel).value.trim();
      if(!val('#f_name')||(!student && !val('#f_sid'))){ toast('Name and Student ID are required','err'); return; }
      if(!student && !val('#f_pass')){ toast('Password is required for a new student','err'); return; }
      const btn = $('#saveStuBtn'); btn.disabled=true; btn.textContent='Saving…';
      const batchVal = val('#f_batch');

      if(student){
        const { error } = await sb.rpc('admin_update_student', {
          p_student_uuid: student.id, p_name: val('#f_name'), p_email: val('#f_email')||null,
          p_mobile: val('#f_mobile')||null, p_exam_target: val('#f_target'), p_status: val('#f_status'),
          p_new_password: val('#f_pass')||null,
          p_batch_id: batchVal||null, p_clear_batch: !batchVal,
        });
        if(error){ toast('Could not save: '+error.message,'err'); btn.disabled=false; btn.textContent='Save Student'; return; }
        await logAudit('Edit Student', student.student_id);
      } else {
        const batchName = batchVal? (batches||[]).find(b=>b.id===batchVal)?.name : null;
        const { error } = await sb.rpc('admin_add_student', {
          p_student_id: val('#f_sid'), p_name: val('#f_name'), p_password: val('#f_pass'),
          p_email: val('#f_email')||null, p_mobile: val('#f_mobile')||null,
          p_exam_target: val('#f_target'), p_status: val('#f_status'), p_batch_name: batchName||null,
        });
        if(error){ toast('Could not save: '+error.message,'err'); btn.disabled=false; btn.textContent='Save Student'; return; }
        await logAudit('Add Student', val('#f_sid'));
      }
      closeModal(); toast('Student saved','ok'); renderAdminSection($('#adminMain'));
    };
  })();
}
function openBulkStudentModal(){
  openModal('Bulk Student Upload', `
    <p style="font-size:13px;color:var(--text2);margin-bottom:12px;">CSV columns: <code>student_id, name, password, email, mobile, exam_target, status, batch</code><br>The <code>batch</code> column is optional — if the batch name doesn't exist yet, it's created automatically.</p>
    <button class="btn btn-outline btn-sm" id="dlTemplateStu" style="margin-bottom:14px;">Download CSV Template</button>
    <input type="file" id="stuCsvFile" accept=".csv"><div id="stuUploadResult" style="margin-top:14px;"></div>
  `);
  $('#dlTemplateStu').onclick=()=>downloadCSV('student_upload_template.csv',[
    ['student_id','name','password','email','mobile','exam_target','status','batch'],
    ['ABC123','Sample Student Name','XYZ456','sample@example.com','9999999999','FMGE','Active','Batch A']]);
  $('#stuCsvFile').onchange=async(e)=>{
    const file = e.target.files[0]; if(!file) return;
    const text = await file.text();
    const {rows} = parseCSV(text);
    let ok=0, fail=0, dup=0, missing=0;
    const errors=[];
    $('#stuUploadResult').innerHTML = `<div class="empty-state">Importing ${rows.length} rows, please wait…</div>`;
    for(let i=0;i<rows.length;i++){
      const r = rows[i];
      try{
        if(!r.student_id || !r.name || !r.password){ missing++; fail++; errors.push(`Row ${i+2}: missing student_id, name or password`); continue; }
        const { error } = await sb.rpc('admin_add_student', {
          p_student_id: r.student_id, p_name: r.name, p_password: r.password,
          p_email: r.email||null, p_mobile: r.mobile||null,
          p_exam_target: r.exam_target||'FMGE', p_status: ['Active','Inactive','Blocked'].includes(r.status)? r.status:'Active',
          p_batch_name: r.batch||null,
        });
        if(error){
          if(error.message.includes('duplicate') || error.code==='23505'){ dup++; } else { fail++; errors.push(`Row ${i+2}: ${error.message}`); }
          continue;
        }
        ok++;
      }catch(rowErr){
        fail++; errors.push(`Row ${i+2}: ${rowErr.message||String(rowErr)}`);
      }
      // Keep the progress banner updating as we go, in case a large file takes a while.
      $('#stuUploadResult').innerHTML = `<div class="empty-state"><span class="spinner"></span> Processed ${i+1} of ${rows.length} rows… (${ok} imported so far)</div>`;
    }
    await logAudit('Bulk Student Upload', `${ok} imported, ${fail} failed, ${dup} duplicate`);
    $('#stuUploadResult').innerHTML = `<div class="lock-banner" style="background:var(--success-bg);border-color:#A9E6C4;color:#0B6B39;">
      Total records: ${rows.length} · <b>Successfully imported: ${ok}</b> · Duplicate IDs: ${dup} · Missing fields: ${missing}</div>
      ${errors.length? `<div style="margin-top:10px;font-size:12.5px;color:var(--error)">${errors.slice(0,8).map(e=>`<div>${esc(e)}</div>`).join('')}</div>`:''}`;
    toast(`${ok} students imported`,'ok');
    renderAdminSection($('#adminMain'));
  };
}


// ---------- ADMIN: Question Bank (real Supabase-backed) ----------
function diffBadge(d){ const c = d==='Easy'?'success':d==='Hard'?'error':'warning'; return `<span class="badge badge-${c}">${d}</span>`; }
function statusBadge(status){
  const map={draft:'grey',scheduled:'warning',live:'success',closed:'navy', Active:'success', Inactive:'grey', Blocked:'error'};
  const cls = map[status]||'grey';
  return `<span class="badge badge-${cls}">${status}</span>`;
}
async function adminQuestionBank(root){
  const f = S.qbFilters;
  if(!f.examCode) f.examCode = 'FMGE';
  if(!S.qbSelected) S.qbSelected = new Set();
  root.innerHTML = `<div class="empty-state">Loading question bank…</div>`;
  const { data: list, error } = await sb.rpc('admin_list_questions', {
    p_exam_code: f.examCode || null,
    p_subject: f.subject || null,
    p_difficulty: f.difficulty || null,
    p_search: f.q || null,
    p_limit: 50, p_offset: 0,
  });
  if(error){ root.innerHTML = `<div class="empty-state">Could not load question bank: ${esc(error.message)}</div>`; return; }

  const selCount = S.qbSelected.size;
  root.innerHTML = `
    <div class="table-toolbar">
      <div class="search-box"><input id="qbSearch" placeholder="Search question text" value="${esc(f.q||'')}"></div>
      <div class="filter-row">
        <select id="fExam"><option value="FMGE" ${f.examCode==='FMGE'?'selected':''}>FMGE</option><option value="NEET_PG" ${f.examCode==='NEET_PG'?'selected':''}>NEET PG</option></select>
        <input id="fSubject" placeholder="Subject" value="${esc(f.subject||'')}" style="width:auto;min-width:110px;padding:8px 10px;font-size:12.5px;">
        <select id="fDiff"><option value="">All Difficulty</option>${['Easy','Medium','Hard'].map(s=>`<option ${f.difficulty===s?'selected':''}>${s}</option>`).join('')}</select>
        <button class="btn btn-outline btn-sm" id="uploadQBtn">⬆ Bulk Upload</button>
        <button class="btn btn-primary btn-sm" id="addQBtn">+ Add Question</button>
      </div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
      <p style="font-size:12.5px;color:var(--text2);margin:0;">Showing ${list.length} question(s) — first 50 matches</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-outline btn-sm" id="selectAllMatchBtn">Select ALL matching current filters</button>
        ${selCount? `<button class="btn btn-danger btn-sm" id="deleteSelectedBtn">🗑 Delete Selected (${selCount})</button>
        <button class="btn btn-ghost btn-sm" id="clearSelBtn">Clear selection</button>` : ''}
      </div>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th style="width:36px;"><input type="checkbox" id="selAllVisible" ${list.length && list.every(q=>S.qbSelected.has(q.id))?'checked':''}></th><th>Question</th><th>Subject / Topic</th><th>Difficulty</th><th>PYQ</th><th>Marks</th><th></th></tr></thead>
      <tbody>
      ${list.length? list.map(q=>`
        <tr><td><input type="checkbox" class="qbRowChk" data-id="${q.id}" ${S.qbSelected.has(q.id)?'checked':''}></td>
        <td style="max-width:340px;"><span style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">${esc(q.text)}</span>${q.image_url?' 🖼️':''}</td>
        <td>${esc(q.subject)}<br><span style="color:var(--text2);font-size:12px">${esc(q.topic||'—')}</span></td>
        <td>${diffBadge(q.difficulty)}</td>
        <td>${q.is_pyq? '<span class="badge badge-warning">PYQ</span>':'—'}</td>
        <td>${q.marks}</td>
        <td><div style="display:flex;gap:6px;flex-wrap:wrap;">
          <button class="btn btn-sm btn-outline" onclick="previewQuestion('${q.id}')">Preview</button>
          <button class="btn btn-sm btn-danger" onclick="deleteQuestion('${q.id}')">Delete</button>
        </div></td></tr>`).join('') : `<tr><td colspan="7"><div class="empty-state">No questions match these filters yet — add one or bulk upload a CSV.</div></td></tr>`}
      </tbody>
    </table></div>
  `;
  $('#qbSearch').oninput=(e)=>{f.q=e.target.value; renderAdminSection($('#adminMain'));};
  $('#fExam').onchange=(e)=>{f.examCode=e.target.value; renderAdminSection($('#adminMain'));};
  $('#fSubject').onchange=(e)=>{f.subject=e.target.value; renderAdminSection($('#adminMain'));};
  $('#fDiff').onchange=(e)=>{f.difficulty=e.target.value; renderAdminSection($('#adminMain'));};
  $('#addQBtn').onclick=()=>openQuestionModal();
  $('#uploadQBtn').onclick=()=>openBulkQuestionModal();
  $('#selAllVisible').onchange=(e)=>{
    list.forEach(q=> e.target.checked? S.qbSelected.add(q.id) : S.qbSelected.delete(q.id));
    renderAdminSection($('#adminMain'));
  };
  $$('.qbRowChk').forEach(chk=>{
    chk.onchange=()=>{ chk.checked? S.qbSelected.add(chk.dataset.id) : S.qbSelected.delete(chk.dataset.id); renderAdminSection($('#adminMain')); };
  });
  $('#selectAllMatchBtn').onclick=async()=>{
    const btn = $('#selectAllMatchBtn'); btn.disabled=true; btn.textContent='Loading all matches…';
    const { data: all, error: allErr } = await sb.rpc('admin_list_questions', {
      p_exam_code: f.examCode || null, p_subject: f.subject || null,
      p_difficulty: f.difficulty || null, p_search: f.q || null,
      p_limit: 5000, p_offset: 0,
    });
    if(allErr){ toast('Could not load: '+allErr.message,'err'); return; }
    all.forEach(q=>S.qbSelected.add(q.id));
    toast(`${all.length} questions selected`,'ok');
    renderAdminSection($('#adminMain'));
  };
  const clearBtn = $('#clearSelBtn'); if(clearBtn) clearBtn.onclick=()=>{ S.qbSelected.clear(); renderAdminSection($('#adminMain')); };
  const delBtn = $('#deleteSelectedBtn'); if(delBtn) delBtn.onclick=async()=>{
    const ids = Array.from(S.qbSelected);
    if(!confirm(`Delete ${ids.length} selected question(s) permanently? This cannot be undone.`)) return;
    delBtn.disabled=true;
    let ok=0, fail=0;
    for(let i=0;i<ids.length;i++){
      const { error: delErr } = await sb.rpc('admin_delete_question', { p_question_id: ids[i] });
      if(delErr) fail++; else ok++;
      delBtn.textContent = `Deleting… ${i+1}/${ids.length}`;
    }
    await logAudit('Bulk Delete Questions', `${ok} deleted, ${fail} failed`);
    S.qbSelected.clear();
    toast(`${ok} questions deleted${fail?`, ${fail} failed`:''}`, fail? 'err':'ok');
    renderAdminSection($('#adminMain'));
  };
}
window.previewQuestion = async(id)=>{
  const { data, error } = await sb.rpc('admin_get_question', { p_question_id: id });
  if(error || !data || !data.length){ toast('Could not load this question: '+(error?.message||'not found'),'err'); return; }
  const q = data[0];
  openModal('Question Preview', `
    <div class="qmeta"><span class="badge badge-blue">${esc(q.subject)}</span><span class="badge badge-grey">${esc(q.topic||'—')}</span>${diffBadge(q.difficulty)}<span class="badge badge-navy">${q.marks} mark / -${q.negative_marks}</span></div>
    <div class="qbox" style="box-shadow:none;padding:18px;">
      <div class="qtext">${esc(q.text)}</div>
      ${q.image_url? `<img class="qimg" src="${esc(q.image_url)}">`:''}
      ${['a','b','c','d'].filter(k=>q['option_'+k]).map(k=>`<div class="opt-row ${q.correct===k.toUpperCase()?'correct':''}">${q.correct===k.toUpperCase()?'✅':'○'} <b>${k.toUpperCase()}.</b> ${esc(q['option_'+k])}</div>`).join('')}
    </div>
    <div style="margin-top:12px;padding:12px;background:#F9FAFB;border-radius:10px;font-size:13px;"><b>Explanation:</b> ${esc(q.explanation||'—')}</div>
  `);
};
window.deleteQuestion = async(id)=>{
  if(!confirm('Delete this question permanently? (If it is already used in a published test, that test keeps its own snapshot and is not affected.)')) return;
  const { error } = await sb.rpc('admin_delete_question', { p_question_id: id });
  if(error){ toast('Delete failed: '+error.message,'err'); return; }
  await logAudit('Delete Question', id);
  toast('Question deleted','ok'); renderAdminSection($('#adminMain'));
};

      if(error.message.includes('DUPLICATE_QUESTION')) toast('This exact question already exists in the bank','err');
      else toast('Could not save: '+error.message,'err');
      return;
    }
    await logAudit('Add Question', data);
    closeModal(); toast('Question saved','ok'); renderAdminSection($('#adminMain'));
  };
}

    <p id="qFileChosen" style="font-size:12.5px;color:var(--text2);margin-top:8px;"></p>
    <button class="btn btn-primary btn-block" id="qStartUploadBtn" style="margin-top:12px;" disabled>Choose a file first</button>
    <div id="qUploadResult" style="margin-top:14px;"></div>
  `);
  $('#dlTemplateQ').onclick=()=>downloadCSV('question_upload_template.csv',
    [['question','option_a','option_b','option_c','option_d','correct_answer','explanation','subject','topic','difficulty','pyq_tag','pyq_year','marks','negative_marks','tags','image_url','reference','key_learning_point','clinical_case'],
     ['Sample question text?','Option A','Option B','Option C','Option D','A','Because...','Medicine','Cardiology','Medium','N','','1','0.25','','','','','N']]);

  (async()=>{
    const { data: sets, error: setsErr } = await sb.rpc('admin_get_question_sets', {p_exam_code: $('#bq_exam').value});
    const existing = $('#bq_existing_sets'), list = $('#bq_set_list');
    if(setsErr){ existing.textContent = 'Could not load existing sets: '+setsErr.message; return; }
    if(!sets || !sets.length){ existing.textContent = 'No sets exist yet for this exam — whatever you type here will create a new one.'; return; }
    list.innerHTML = sets.map(s=>`<option value="${esc(s.question_set)}">`).join('');
    existing.innerHTML = 'Existing sets: ' + sets.map(s=>`<b>${esc(s.question_set)}</b> (${s.total_count})`).join(', ') + ' — pick one from the suggestions to add more to it, or type a brand-new name.';
  })();

  let selectedFile = null;
  $('#qCsvFile').onchange=(e)=>{
    selectedFile = e.target.files[0] || null;
    const btn = $('#qStartUploadBtn');
    if(selectedFile){
      $('#qFileChosen').textContent = `Selected: ${selectedFile.name}`;
      btn.disabled = false; btn.textContent = 'Upload Now';
    } else {
      $('#qFileChosen').textContent = '';
      btn.disabled = true; btn.textContent = 'Choose a file first';
    }
  };

  $('#qStartUploadBtn').onclick=async()=>{
    if(!selectedFile) return;
    const btn = $('#qStartUploadBtn');
    btn.disabled = true;
    const text = await selectedFile.text();
    const {rows} = parseCSV(text);
    const examCode = $('#bq_exam').value, partNumber = parseInt($('#bq_part').value)||1;
    const setName = $('#bq_set').value.trim() || null;
    let ok=0, fail=0, dup=0;
    const errors=[];
    $('#qUploadResult').innerHTML = `<div class="empty-state"><span class="spinner"></span> Importing ${rows.length} rows, please wait…</div>`;
    for(let i=0;i<rows.length;i++){
      const r = rows[i];
      if(!r.question || !r.option_a || !r.option_b || !r.correct_answer){ fail++; errors.push(`Row ${i+2}: missing required field`); continue; }
      try{
        const { error } = await sb.rpc('admin_add_question', {
          p_exam_code: examCode, p_part_number: partNumber,
          p_subject: r.subject||'General', p_topic: r.topic||null,
          p_text: r.question, p_option_a: r.option_a, p_option_b: r.option_b,
          p_option_c: r.option_c||null, p_option_d: r.option_d||null,
          p_correct: (r.correct_answer||'A').toUpperCase(), p_explanation: r.explanation||null,
          p_difficulty: ['Easy','Medium','Hard'].includes(r.difficulty)? r.difficulty:'Medium',
          p_is_pyq: truthy(r.pyq_tag), p_pyq_year: r.pyq_year? parseInt(r.pyq_year):null,
          p_marks: r.marks? parseFloat(r.marks):1, p_negative_marks: r.negative_marks? parseFloat(r.negative_marks):0.25,
          p_tags: r.tags||null, p_image_url: r.image_url||null,
          p_reference: r.reference||null, p_key_learning_point: r.key_learning_point||null,
          p_is_clinical_case: truthy(r.clinical_case),
          p_question_set: setName, p_set_order: setName? (i+1) : null,
        });
        if(error){
          if(error.message.includes('DUPLICATE_QUESTION')) dup++;
          else { fail++; errors.push(`Row ${i+2}: ${error.message}`); }
        } else ok++;
      }catch(rowErr){
        fail++; errors.push(`Row ${i+2}: ${rowErr.message||String(rowErr)}`);
      }
      $('#qUploadResult').innerHTML = `<div class="empty-state"><span class="spinner"></span> Processed ${i+1} of ${rows.length} rows… (${ok} imported so far)</div>`;
    }
    await logAudit('Bulk Question Upload', `exam=${examCode} part=${partNumber} set=${setName||'—'} imported=${ok} dup=${dup} failed=${fail}`);
    $('#qUploadResult').innerHTML = `
      <div class="lock-banner" style="background:var(--success-bg);border-color:#A9E6C4;color:#0B6B39;">
        Total records: ${rows.length} · <b>Successfully imported: ${ok}</b> · Duplicates skipped: ${dup} · Errors: ${fail}
        ${setName? ` · Saved under Question Set: <b>${esc(setName)}</b>` : ''}</div>
      ${errors.length? `<div style="margin-top:10px;font-size:12.5px;color:var(--error)">${errors.slice(0,8).map(e=>`<div>${esc(e)}</div>`).join('')}</div>`:''}
    `;
    btn.textContent = 'Upload Complete'; 
    toast(`${ok} questions imported`,'ok');
    renderAdminSection($('#adminMain'));
  };
}

// Quick, standalone toggle for "Results visible to students" and "National
// ranking enabled" — reachable for a test in ANY status (draft, scheduled,
// live, or closed), unlike the full wizard which only reopens for drafts.
// This is exactly the workflow real exams need: keep ranking OFF while the
// test is still live (so an early finisher can't see a leaderboard that's
// still filling up / could still change), then flip it ON once every
// student is done, without touching anything else about the test.
window.openResultSettingsModal = async(testId, testName)=>{
  const [{ data: test, error: tErr }, { data: settings, error: sErr }] = await Promise.all([
    sb.rpc('admin_get_test', {p_test_id: testId}),
    sb.rpc('admin_get_test_settings', {p_test_id: testId}),
  ]);
  if(tErr || sErr){ toast('Could not load test settings: '+(tErr||sErr).message,'err'); return; }
  const sAt = settings?.start_at? new Date(settings.start_at) : null;
  const eAt = settings?.end_at? new Date(settings.end_at) : null;
  const rs = {
    resultsVisible: settings?.results_visible ?? true,
    rankingEnabled: settings?.ranking_enabled ?? true,
  };
  // Everything else is carried through UNCHANGED from the current live
  // settings — this modal only ever touches the two toggles above.
  const unchanged = {
    name: test.name, description: test.description||null, instructions: test.instructions||null,
    startAt: sAt? sAt.toISOString() : null, endAt: eAt? eAt.toISOString() : null,
    maxAttempts: settings?.max_attempts ?? 1, marksPerQuestion: settings?.marks_per_question ?? 1,
    negativeMarking: settings?.negative_marking ?? 0.25, tabSwitchLimit: settings?.tab_switch_limit ?? 3,
    fullscreenRequired: settings?.fullscreen_required ?? true, disableCopyPaste: settings?.disable_copy_paste ?? true,
    showCorrectAnswers: settings?.show_correct_answers ?? true, showExplanations: settings?.show_explanations ?? true,
    allowReview: settings?.allow_review ?? true, aiMentorEnabled: settings?.ai_mentor_enabled ?? true,
  };
  openModal(`Result &amp; Ranking — ${esc(testName)}`, `
    <p style="font-size:13px;color:var(--text2);margin-bottom:16px;">Common workflow: keep ranking <b>Off</b> while the test is still live, then switch it <b>On</b> once everyone has finished — so students only see the leaderboard after the exam is truly over, not a leaderboard that's still changing.</p>
    <div style="display:flex;flex-direction:column;gap:14px;">
      <div class="field">${toggleHTML2('rs_results', rs.resultsVisible, 'Results visible to students')}</div>
      <div class="field">${toggleHTML2('rs_rank', rs.rankingEnabled, 'National ranking enabled')}</div>
    </div>
    <button class="btn btn-primary btn-block" id="saveResultSettingsBtn" style="margin-top:18px;">Save</button>
  `, 560);
  bindToggle2('rs_results', rs, 'resultsVisible');
  bindToggle2('rs_rank', rs, 'rankingEnabled');
  $('#saveResultSettingsBtn').onclick=async()=>{
    const { error } = await sb.rpc('admin_update_test_settings', {
      p_test_id: testId, p_name: unchanged.name, p_description: unchanged.description, p_instructions: unchanged.instructions,
      p_start_at: unchanged.startAt, p_end_at: unchanged.endAt,
      p_max_attempts: unchanged.maxAttempts, p_marks_per_question: unchanged.marksPerQuestion, p_negative_marking: unchanged.negativeMarking,
      p_tab_switch_limit: unchanged.tabSwitchLimit, p_fullscreen_required: unchanged.fullscreenRequired, p_disable_copy_paste: unchanged.disableCopyPaste,
      p_results_visible: rs.resultsVisible, p_ranking_enabled: rs.rankingEnabled,
      p_show_correct_answers: unchanged.showCorrectAnswers, p_show_explanations: unchanged.showExplanations, p_allow_review: unchanged.allowReview,
      p_ai_mentor_enabled: unchanged.aiMentorEnabled,
    });
    if(error){ toast('Could not save: '+error.message,'err'); return; }
    await logAudit('Update Result & Ranking Visibility', `${testName} — results:${rs.resultsVisible} ranking:${rs.rankingEnabled}`);
    toast('Saved','ok');
    closeModal();
  };
};

const REASON_LABEL = {
  manual: 'Submitted by student', auto_timeout: '⏱ Auto-submitted (time expired)',
  auto_tab_switch: '⚠️ Auto-submitted (tab-switch limit)',
};
function partStatusSummary(part){
  const secs = part.sections||[];
  const total = secs.length;
  const completed = secs.filter(s=>s.status==='completed').length;
  const liveNow = secs.some(s=>s.is_live_now);
  const lastTouched = [...secs].reverse().find(s=>s.status!=='not_started');
  let label, cls;
  if(completed>=total && total>0){ label='✅ Completed'; cls='badge-success'; }
  else if(liveNow){ label='🟢 Live now'; cls='badge-success'; }
  else if(lastTouched){ label=`⏸ Paused (${completed}/${total})`; cls='badge-warning'; }
  else { label='Not started'; cls='badge-grey'; }
  const reasonNote = (lastTouched && lastTouched.status==='completed' && lastTouched.submit_reason && lastTouched.submit_reason!=='manual')
    ? REASON_LABEL[lastTouched.submit_reason] || lastTouched.submit_reason : null;
  return {label, cls, completed, total, liveNow, reasonNote};
}
function fmtDuration(sec){
  if(sec==null || sec<=0) return '—';
  const h = Math.floor(sec/3600), m = Math.round((sec%3600)/60);
  if(h>0) return `${h}h ${m}m`;
  return `${m}m`;
}
function fmtTimeOfDay(iso){
  if(!iso) return '—';
  return new Date(iso).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
}

      }).join('') : `<tr><td colspan="9"><div class="empty-state">No active students found.</div></td></tr>`}

  $('#attSearch').oninput=(e)=>{ S.attemptsFilter=e.target.value; renderManageAttemptsModal(testId, testName, rows); };

window.setPartStatusInline = async(partId, status, testId)=>{

window.continueTestWizard = async(testId)=>{
  const { data, error } = await sb.rpc('admin_get_test', {p_test_id:testId});
  if(error){ toast('Could not load test: '+error.message,'err'); return; }
  const { data: settings } = await sb.rpc('admin_get_test_settings', {p_test_id:testId});
  const sAt = settings?.start_at? new Date(settings.start_at) : null;
  const eAt = settings?.end_at? new Date(settings.end_at) : null;
  const pad = n=>String(n).padStart(2,'0');
  S.wizard = {
    testId, step:2, examCode:data.exam_code, name:data.name, description:data.description||'',
    instructions:data.instructions||'',
    startDate: sAt? `${sAt.getFullYear()}-${pad(sAt.getMonth()+1)}-${pad(sAt.getDate())}` : '',
    startTime: sAt? `${pad(sAt.getHours())}:${pad(sAt.getMinutes())}` : '09:00',
    endDate: eAt? `${eAt.getFullYear()}-${pad(eAt.getMonth()+1)}-${pad(eAt.getDate())}` : '',
    endTime: eAt? `${pad(eAt.getHours())}:${pad(eAt.getMinutes())}` : '18:00',
    maxAttempts: settings?.max_attempts ?? 1,
    marksPerQuestion: settings?.marks_per_question ?? 1, negativeMarking: settings?.negative_marking ?? 0.25,
    tabSwitchLimit: settings?.tab_switch_limit ?? 3, fullscreenRequired: settings?.fullscreen_required ?? true,
    disableCopyPaste: settings?.disable_copy_paste ?? true,
    resultsVisible: settings?.results_visible ?? true, rankingEnabled: settings?.ranking_enabled ?? true,
    showCorrectAnswers: settings?.show_correct_answers ?? true, showExplanations: settings?.show_explanations ?? true,
    allowReview: settings?.allow_review ?? true, aiMentorEnabled: settings?.ai_mentor_enabled ?? true,
    requiredTotal: data.required_total ?? '',
    parts: (data.parts||[]).map(p=>({
      id:p.id, partNumber:p.part_number, name:p.name, questionCount:p.question_count,
      selectedIds:new Set(),
      sections: (p.sections||[]).map(s=>({ id:s.id, name:s.name, questionCount:s.question_count, durationMin:s.duration_min, selectedIds:new Set() })),
    })),
  };
  openWizardModal();
  await loadPartSelections();
};
async function loadPartSelections(){
  const w = S.wizard;
  for(const part of w.parts){
    if(!part.id) continue;
    if(part.sections && part.sections.length){
      for(const sec of part.sections){
        const { data } = await sb.rpc('admin_get_section_questions', {p_section_id: sec.id});
        sec.selectedIds = new Set((data||[]).map(r=>r.question_id));
      }
    } else {
      const { data } = await sb.rpc('admin_get_part_questions', {p_test_part_id: part.id});
      part.selectedIds = new Set((data||[]).map(r=>r.question_id));
    }
  }
  renderWizardStep();
}

function openWizardModal(){
  const w = S.wizard;
  const steps = ['Test Details','Define Parts','Sections & Questions','Publish'];
  openModal(w.testId? 'Continue Test Setup' : 'Create Test', `
    <div class="wizard-steps">${steps.map((s,i)=>`<div class="wstep ${w.step===i+1?'active':w.step>i+1?'done':''}">${i+1}. ${s}</div>`).join('')}</div>
    <div id="wizardBody"></div>

      <button class="btn btn-ghost" id="wizBack" ${w.step===1?'disabled':''}>Back</button>
      <button class="btn btn-primary" id="wizNext">${w.step===4?'Finish':'Next'}</button>
    </div>
  `, 940);
  renderWizardStep();
  $('#wizBack').onclick=()=>{ if(w.step>1){w.step--; renderWizardStep(); refreshWizardChrome();} };
  $('#wizNext').onclick=()=>handleWizardNext();
}
function refreshWizardChrome(){
  const steps = ['Test Details','Define Parts','Sections & Questions','Publish'];
  const w = S.wizard;
  $('.modal-box .wizard-steps').outerHTML = `<div class="wizard-steps">${steps.map((s,i)=>`<div class="wstep ${w.step===i+1?'active':w.step>i+1?'done':''}">${i+1}. ${s}</div>`).join('')}</div>`;
  $('#wizBack').disabled = w.step===1;

async function handleWizardNext(){
  const w = S.wizard;
  if(w.step===1){
    if(!w.name.trim()){ toast('Give the test a name first','err'); return; }
    if(!w.testId){
      const { data, error } = await sb.rpc('admin_create_test', {
        p_exam_code: w.examCode, p_name: w.name, p_description: w.description||null,
        p_start_at: w.startDate? new Date(w.startDate+'T'+(w.startTime||'00:00')).toISOString() : null,
        p_end_at: w.endDate? new Date(w.endDate+'T'+(w.endTime||'00:00')).toISOString() : null,
        p_max_attempts: w.maxAttempts, p_marks_per_question: w.marksPerQuestion, p_negative_marking: w.negativeMarking,
        p_instructions: w.instructions||null, p_results_visible: w.resultsVisible, p_ranking_enabled: w.rankingEnabled,
        p_show_correct_answers: w.showCorrectAnswers, p_show_explanations: w.showExplanations, p_allow_review: w.allowReview,
        p_required_total: w.requiredTotal? parseInt(w.requiredTotal) : null,
      });
      if(error){ toast('Could not create test: '+error.message,'err'); return; }
      w.testId = data;
      await logAudit('Create Test', w.name);
    } else {
      const { error } = await sb.rpc('admin_update_test_settings', {
        p_test_id: w.testId, p_name: w.name, p_description: w.description||null, p_instructions: w.instructions||null,
        p_start_at: w.startDate? new Date(w.startDate+'T'+(w.startTime||'00:00')).toISOString() : null,
        p_end_at: w.endDate? new Date(w.endDate+'T'+(w.endTime||'00:00')).toISOString() : null,
        p_max_attempts: w.maxAttempts, p_marks_per_question: w.marksPerQuestion, p_negative_marking: w.negativeMarking,
        p_tab_switch_limit: w.tabSwitchLimit, p_fullscreen_required: w.fullscreenRequired, p_disable_copy_paste: w.disableCopyPaste,
        p_results_visible: w.resultsVisible, p_ranking_enabled: w.rankingEnabled,
        p_show_correct_answers: w.showCorrectAnswers, p_show_explanations: w.showExplanations, p_allow_review: w.allowReview,
        p_ai_mentor_enabled: w.aiMentorEnabled,
      });
      if(error){ toast('Could not save settings: '+error.message,'err'); return; }
      if(w.requiredTotal){
        const { error: rtErr } = await sb.rpc('admin_set_required_total', {p_test_id: w.testId, p_required_total: parseInt(w.requiredTotal)});
        if(rtErr){ toast('Could not update required total: '+rtErr.message,'err'); return; }
      }
      await logAudit('Update Test Settings', w.name);
    }
    w.step=2; renderWizardStep(); refreshWizardChrome();
  } else if(w.step===2){
    if(!w.parts.length){ toast('Add at least one part','err'); return; }
    const payload = w.parts.map(p=>({id:p.id||null, partNumber:p.partNumber, name:p.name, questionCount:p.questionCount, durationMin:p.durationMin||60}));
    const { error } = await sb.rpc('admin_define_test_parts', {p_test_id:w.testId, p_parts: payload});
    if(error){ toast('Could not save parts: '+error.message,'err'); return; }
    const { data: test } = await sb.rpc('admin_get_test', {p_test_id:w.testId});
    w.parts = (test.parts||[]).map(p=>({
      id:p.id, partNumber:p.part_number, name:p.name, questionCount:p.question_count, selectedIds:new Set(),
      sections: (p.sections||[]).map(s=>({ id:s.id, name:s.name, questionCount:s.question_count, durationMin:s.duration_min, selectedIds:new Set() })),
    }));
    await loadPartSelections();
    w.step=3; renderWizardStep(); refreshWizardChrome();
  } else if(w.step===3){
    w.step=4; renderWizardStep(); refreshWizardChrome();
  } else {
    closeModal(); toast('Test setup saved as Draft — publish it from the Tests list when ready','ok');
    renderAdminSection($('#adminMain'));
  }
}

function toggleHTML2(id,on,label){
  // A real checkbox input wrapped in a label tag: native, always
  // clickable/tappable anywhere in the row, and keyboard-accessible,
  // styled as a pill switch via the toggle-switch CSS above. The old
  // version used a plain empty div with a "toggle" class that had no
  // matching CSS rule anywhere in the stylesheet, so it rendered with
  // zero visible/clickable area — this replaces that everywhere it's used.
  return `<label style="display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;">
    <span class="toggle-switch"><input type="checkbox" id="${id}" ${on?'checked':''}><span class="slider"></span></span>
    <span style="font-size:13px;font-weight:600;">${label} — <b id="${id}_lbl" style="color:${on?'var(--success)':'var(--error)'}">${on?'On':'Off'}</b></span>
  </label>`;
}
function bindToggle2(id,w,key){
  const el = $('#'+id); if(!el) return;
  el.onchange=()=>{
    w[key]=el.checked;
    const b = $('#'+id+'_lbl');
    if(b){ b.textContent = w[key]?'On':'Off'; b.style.color = w[key]?'var(--success)':'var(--error)'; }
  };
}

              ${(w.qbSets||[]).map(s=>`<option value="${esc(s.question_set)}" ${w.qsSelectedSet===s.question_set?'selected':''}>${esc(s.question_set)} (${s.total_count} questions)</option>`).join('')}
            </select>
