<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>FMGs Never Give Up — FMGE • NEET PG • INI-CET Test Series</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B1F3A;
  --blue:#155EEF;
  --blue-bright:#2563EB;
  --accent:#FFB000;
  --bg:#F7F9FC;
  --card:#FFFFFF;
  --text:#101828;
  --text2:#667085;
  --success:#12B76A;
  --success-bg:#ECFDF3;
  --error:#F04438;
  --error-bg:#FEF3F2;
  --warning:#F79009;
  --warning-bg:#FFFAEB;
  --border:#E4E7EC;
  --radius:14px;
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
  --shadow-lg:0 8px 24px rgba(11,31,58,.10);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
h1,h2,h3,h4{font-family:'Manrope',sans-serif;font-weight:800;margin:0;color:var(--navy);}
p{margin:0;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:#D6E4FF;}
a{color:var(--blue);text-decoration:none;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border-radius:10px;border:none;font-weight:700;font-size:14px;
  padding:11px 20px;transition:transform .08s ease, box-shadow .15s ease, background .15s ease;
  white-space:nowrap;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 1px 2px rgba(21,94,239,.3);}
.btn-primary:hover{background:var(--blue-bright);}
.btn-navy{background:var(--navy);color:#fff;}
.btn-navy:hover{background:#132a4d;}
.btn-accent{background:var(--accent);color:#3A2400;}
.btn-accent:hover{filter:brightness(1.05);}
.btn-outline{background:#fff;color:var(--navy);border:1.5px solid var(--border);}
.btn-outline:hover{border-color:var(--blue);color:var(--blue);}
.btn-danger{background:var(--error-bg);color:var(--error);}
.btn-danger:hover{background:#ffe1de;}
.btn-ghost{background:transparent;color:var(--text2);}
.btn-ghost:hover{background:#EEF2F6;}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);}
.pad{padding:22px;}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:100px;letter-spacing:.2px;}
.badge-success{background:var(--success-bg);color:var(--success);}
.badge-error{background:var(--error-bg);color:var(--error);}
.badge-warning{background:var(--warning-bg);color:var(--warning);}
.badge-blue{background:#EFF4FF;color:var(--blue);}
.badge-navy{background:#E9EDF5;color:var(--navy);}
.badge-grey{background:#F2F4F7;color:var(--text2);}

input[type=text],input[type=password],input[type=email],input[type=number],input[type=date],input[type=time],select,textarea{
  width:100%;padding:11px 13px;border-radius:10px;border:1.5px solid var(--border);
  font-size:14px;color:var(--text);background:#fff;outline:none;transition:border-color .15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--blue);}
label{font-size:12.5px;font-weight:600;color:var(--text2);display:block;margin-bottom:6px;}
.field{margin-bottom:16px;}
.row{display:flex;gap:14px;flex-wrap:wrap;}
.row>.field{flex:1;min-width:160px;}

#app{min-height:100vh;}
.hidden{display:none !important;}
.scrollbar-thin::-webkit-scrollbar{width:6px;height:6px;}
.scrollbar-thin::-webkit-scrollbar-thumb{background:#D0D5DD;border-radius:10px;}

/* ===== Toast ===== */
#toastHost{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);animation:slideIn .25s ease;max-width:320px;}
.toast.err{background:var(--error);}
.toast.ok{background:var(--success);}
@keyframes slideIn{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:translateX(0);}}

/* ===== Modal ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(11,31,58,.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-box{background:#fff;border-radius:16px;max-width:640px;width:100%;max-height:88vh;overflow:auto;box-shadow:var(--shadow-lg);}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:2;}
.modal-body{padding:22px;}
.modal-close{background:none;border:none;font-size:20px;color:var(--text2);}

/* ===== Login ===== */
.login-wrap{min-height:100vh;display:flex;}
.login-hero{flex:1.1;background:linear-gradient(160deg,var(--navy) 0%,#122a4d 55%,var(--blue) 130%);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:60px;position:relative;overflow:hidden;}
.login-hero::before{content:'';position:absolute;width:480px;height:480px;background:radial-gradient(circle,rgba(255,176,0,.18),transparent 70%);top:-120px;right:-120px;}
.login-hero .brand{font-size:13px;font-weight:700;letter-spacing:1.5px;color:var(--accent);margin-bottom:22px;}
.login-hero h1{color:#fff;font-size:44px;line-height:1.12;max-width:480px;}
.login-hero p.sub{color:#C6D3EE;font-size:16px;margin-top:18px;max-width:420px;line-height:1.6;}
.exam-pill{background:rgba(255,255,255,.12);border:1px solid rgba(255,176,0,.5);color:#fff;font-weight:700;font-size:14px;padding:7px 16px;border-radius:999px;letter-spacing:.3px;}
.hero-fade{opacity:0;transform:translateY(14px);animation:heroFadeIn .6s ease forwards;}
@keyframes heroFadeIn{to{opacity:1;transform:translateY(0);}}
.hero-stats{display:flex;gap:34px;margin-top:46px;}
.hero-stats div b{display:block;font-size:26px;font-family:'Manrope';font-weight:800;color:#fff;}
.hero-stats div span{font-size:12.5px;color:#9FB3D6;}
.login-panel{flex:1;display:flex;align-items:center;justify-content:center;padding:40px;background:var(--bg);}
.login-card{width:100%;max-width:380px;}
.role-tabs{display:flex;background:#EEF2F6;border-radius:11px;padding:4px;margin-bottom:26px;}
.role-tab{flex:1;text-align:center;padding:9px;border-radius:8px;font-weight:700;font-size:13.5px;color:var(--text2);cursor:pointer;transition:all .15s;}
.role-tab.active{background:#fff;color:var(--navy);box-shadow:var(--shadow);}
.demo-hint{background:#EFF4FF;border:1px solid #D6E4FF;border-radius:10px;padding:10px 13px;font-size:12px;color:var(--blue);margin-top:14px;line-height:1.6;}

/* ===== App Shell (Admin) ===== */
.shell{display:flex;min-height:100vh;}
.sidebar{width:246px;background:var(--navy);color:#fff;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
.sidebar-brand{padding:22px 22px 18px;border-bottom:1px solid rgba(255,255,255,.08);}
.sidebar-brand b{font-family:'Manrope';font-weight:800;font-size:16px;display:block;color:#fff;}
.sidebar-brand span{font-size:11px;color:var(--accent);font-weight:700;letter-spacing:.5px;}
.nav-list{list-style:none;margin:0;padding:14px 12px;flex:1;overflow-y:auto;}
.nav-item{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:10px;color:#AEC0E0;font-size:13.8px;font-weight:600;cursor:pointer;margin-bottom:2px;transition:all .12s;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:var(--blue);color:#fff;}
.nav-icon{width:18px;text-align:center;font-size:15px;}
.sidebar-foot{padding:16px 22px;border-top:1px solid rgba(255,255,255,.08);font-size:12.5px;color:#8DA1C4;}
.topbar{height:66px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:50;}
.topbar h2{font-size:19px;}
.main{flex:1;padding:26px;max-width:100%;overflow-x:hidden;}
.mobile-toggle{display:none;background:none;border:none;font-size:22px;color:var(--navy);}

.grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:24px;}
.stat-card{background:#fff;border-radius:var(--radius);border:1px solid var(--border);padding:18px 20px;box-shadow:var(--shadow);}
.stat-card .lbl{font-size:12.5px;color:var(--text2);font-weight:600;margin-bottom:8px;}
.stat-card .val{font-family:'Manrope';font-weight:800;font-size:26px;color:var(--navy);}
.stat-card .delta{font-size:11.5px;font-weight:700;margin-top:6px;}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;padding:11px 14px;background:#F9FAFB;color:var(--text2);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border);background:#fff;}
.table-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.search-box{position:relative;min-width:220px;flex:1;max-width:340px;}
.search-box input{padding-left:34px;}
.search-box::before{content:'🔍';position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:12px;opacity:.5;}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;}
.filter-row select{width:auto;min-width:120px;padding:8px 10px;font-size:12.5px;}

.tabbar{display:flex;gap:6px;border-bottom:2px solid var(--border);margin-bottom:20px;overflow-x:auto;}
.tabbtn{padding:11px 4px;margin-right:22px;font-weight:700;font-size:13.5px;color:var(--text2);border:none;background:none;border-bottom:2.5px solid transparent;margin-bottom:-2px;white-space:nowrap;}
.tabbtn.active{color:var(--blue);border-color:var(--blue);}

.progress-bar{height:8px;background:#EEF2F6;border-radius:6px;overflow:hidden;}
.progress-bar > div{height:100%;border-radius:6px;background:var(--blue);}

/* ===== Wizard ===== */
.wizard-steps{display:flex;gap:0;margin-bottom:26px;overflow-x:auto;}
.wstep{flex:1;min-width:110px;text-align:center;padding:10px 6px;border-bottom:3px solid var(--border);color:var(--text2);font-size:12px;font-weight:700;position:relative;}
.wstep.active{border-color:var(--blue);color:var(--blue);}
.wstep.done{border-color:var(--success);color:var(--success);}

/* ===== Question card ===== */
.qcard{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.opt-row{display:flex;align-items:flex-start;gap:8px;padding:6px 0;font-size:13.5px;}
.opt-row.correct{color:var(--success);font-weight:700;}

/* ===== STUDENT PORTAL ===== */
.stu-header{background:var(--navy);color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
.stu-header .brand{font-family:'Manrope';font-weight:800;font-size:16px;}
.stu-header .brand span{color:var(--accent);}
.stu-shell{max-width:1180px;margin:0 auto;padding:26px 20px 60px;}
.welcome-band{background:linear-gradient(120deg,var(--navy),#173B6E);color:#fff;border-radius:18px;padding:30px 32px;margin-bottom:24px;position:relative;overflow:hidden;}
.welcome-band::after{content:'';position:absolute;right:-60px;top:-60px;width:220px;height:220px;background:radial-gradient(circle,rgba(255,176,0,.22),transparent 70%);}
.welcome-band h2{color:#fff;font-size:24px;}
.welcome-band p{color:#C6D3EE;margin-top:6px;font-size:14px;}
.test-avail-card{background:#fff;border:1.5px solid var(--border);border-radius:var(--radius);padding:22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;box-shadow:var(--shadow);}
.test-avail-card .pill{background:#EFF4FF;color:var(--blue);font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:100px;}
.pattern-chip{background:#F9FAFB;border:1px solid var(--border);border-radius:9px;padding:9px 13px;font-size:12.5px;font-weight:600;color:var(--text2);}

/* ===== Instructions ===== */
.instr-list{list-style:none;padding:0;margin:0;}
.instr-list li{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);font-size:14px;color:var(--text);}
.instr-list li:last-child{border:none;}
.instr-num{width:26px;height:26px;border-radius:50%;background:#EFF4FF;color:var(--blue);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* ===== EXAM ENGINE ===== */
.exam-shell{height:100vh;height:100dvh;display:flex;flex-direction:column;background:#EEF1F6;}
.exam-header{background:var(--navy);color:#fff;padding:0 18px;height:60px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:20;}
.exam-header .exam-title{font-size:13px;font-weight:700;line-height:1.3;}
.exam-header .exam-title small{display:block;color:#9FB3D6;font-weight:500;font-size:11px;}
.timer-box{background:rgba(255,255,255,.08);border-radius:10px;padding:7px 16px;text-align:center;min-width:110px;}
.timer-box.warn{background:var(--warning);color:#3A2400;}
.timer-box.crit{background:var(--error);color:#fff;}
.timer-box .tval{font-family:'Manrope';font-weight:800;font-size:18px;letter-spacing:.5px;}
.timer-box .tlbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;opacity:.8;}
.stu-chip{text-align:right;font-size:11.5px;color:#C6D3EE;}
.stu-chip b{color:#fff;font-size:13px;display:block;}

.section-strip{display:flex;background:#fff;border-bottom:1px solid var(--border);padding:0 14px;overflow-x:auto;flex-shrink:0;}
.sec-pill{padding:10px 16px;font-size:12px;font-weight:700;color:var(--text2);border-bottom:3px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px;}
.sec-pill.locked{color:#B0BAC9;}
.sec-pill.active-sec{color:var(--blue);border-color:var(--blue);background:#F5F8FF;}
.sec-pill.done-sec{color:var(--success);}

.exam-body{flex:1;display:flex;overflow:hidden;}
.exam-main{flex:1;overflow-y:auto;padding:26px 30px 100px;}
.qbox{background:#fff;border-radius:16px;border:1px solid var(--border);padding:26px;max-width:760px;box-shadow:var(--shadow);}
.qbox .qnum{font-size:12px;font-weight:700;color:var(--blue);letter-spacing:.3px;margin-bottom:10px;}
.qbox .qtext{font-size:16px;line-height:1.65;font-weight:500;margin-bottom:18px;}
.qimg{max-width:100%;border-radius:10px;border:1px solid var(--border);margin-bottom:18px;cursor:zoom-in;}
.option-btn{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border:1.5px solid var(--border);border-radius:12px;margin-bottom:10px;cursor:pointer;transition:all .12s;background:#fff;}
.option-btn:hover{border-color:#AFC7FA;background:#F8FAFF;}
.option-btn.selected{border-color:var(--blue);background:#EFF4FF;}
.option-letter{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:var(--text2);flex-shrink:0;}
.option-btn.selected .option-letter{background:var(--blue);border-color:var(--blue);color:#fff;}
.option-text{font-size:14.5px;line-height:1.5;padding-top:3px;}

.exam-toolbar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--border);padding:14px 30px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
.palette-panel{width:270px;border-left:1px solid var(--border);background:#fff;padding:18px;overflow-y:auto;flex-shrink:0;}
.palette-panel h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--text2);margin-bottom:12px;}
.palette-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px;}
.pnode{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;cursor:pointer;border:1.5px solid var(--border);color:var(--text2);background:#fff;}
.pnode.answered{background:var(--success);color:#fff;border-color:var(--success);}
.pnode.notanswered{background:var(--error-bg);color:var(--error);border-color:#F9CAC4;}
.pnode.marked{background:var(--accent);color:#3A2400;border-color:var(--accent);}
.pnode.notvisited{background:#fff;color:var(--text2);}
.pnode.current{outline:2.5px solid var(--navy);outline-offset:1px;}
.legend-row{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text2);margin-bottom:7px;}
.legend-dot{width:12px;height:12px;border-radius:4px;flex-shrink:0;}
.palette-toggle{display:none;}

@media(max-width:900px){
  .sidebar{position:fixed;left:-260px;z-index:200;transition:left .2s;box-shadow:var(--shadow-lg);}
  .sidebar.open{left:0;}
  .mobile-toggle{display:block;}
  .login-hero{display:none;}
  .palette-panel{position:fixed;right:-280px;top:0;bottom:0;z-index:60;transition:right .2s;box-shadow:var(--shadow-lg);}
  .palette-panel.open{right:0;}
  .exam-main{padding:16px 14px 130px;}
  .qbox{padding:18px;}
  .exam-toolbar{padding:10px 14px;position:fixed;bottom:0;left:0;right:0;}
  .exam-body{padding-bottom:70px;}
}
@media(max-width:600px){
  .hero-stats{display:none;}
  .grid-cards{grid-template-columns:repeat(2,1fr);}
  .main{padding:16px;}
  .row>.field{min-width:100%;}
}

.fab-palette-btn{display:none;}
@media(max-width:900px){
  .fab-palette-btn{display:flex;position:fixed;bottom:78px;right:16px;z-index:55;background:var(--navy);color:#fff;border-radius:100px;padding:11px 18px;font-weight:700;font-size:12.5px;align-items:center;gap:6px;box-shadow:var(--shadow-lg);border:none;}
}

.result-score{font-family:'Manrope';font-weight:800;font-size:52px;color:var(--navy);}
.mini-bar{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.mini-bar .lbl{width:120px;font-size:12.5px;font-weight:600;color:var(--text2);flex-shrink:0;}
.mini-bar .track{flex:1;height:9px;background:#EEF2F6;border-radius:6px;overflow:hidden;}
.mini-bar .fill{height:100%;border-radius:6px;}
.mini-bar .pct{width:42px;text-align:right;font-size:12px;font-weight:700;color:var(--text2);}

.svg-chart-wrap{overflow-x:auto;}
.empty-state{text-align:center;padding:50px 20px;color:var(--text2);}
.empty-state .icon{font-size:38px;margin-bottom:10px;}

.kbd-note{font-size:11.5px;color:var(--text2);background:#F9FAFB;border:1px solid var(--border);border-radius:8px;padding:8px 12px;}
.lock-banner{background:var(--warning-bg);border:1px solid #FEDF89;color:#93610D;border-radius:10px;padding:12px 16px;font-size:13px;font-weight:600;margin-bottom:16px;}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(0,0,0,.15);border-top-color:var(--primary,#155EEF);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px;}
.spinner-white{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg);}}
@media print{
  .no-print, .stu-header, .admin-header, .sidebar, header, nav { display:none !important; }
  .print-header { display:block !important; margin-bottom:16px; }
  .print-header hr { border:none; border-top:2px solid #000; margin-top:10px; }
  body { background:#fff !important; }
  .qcard { break-inside:avoid; page-break-inside:avoid; border:1px solid #ccc !important; margin-bottom:14px; }
  img.qimg { max-width:220px !important; }
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toastHost"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* =========================================================================
   SUPABASE CONNECTION
   -------------------------------------------------------------------------
   Real backend connection. Login (Admin + Student) now goes through
   Supabase instead of the local window.storage demo data. Everything
   else in this file (Students list, Question Bank, Tests, exam engine)
   is still on the OLD local-only storage for now and will be migrated in
   upcoming steps — that part will not save data permanently once this

function downloadCSV(filename, rows){
  const csv = rows.map(r=>r.map(c=>{

function parseCSV(text){
  // Proper RFC4180-style parser: scans character-by-character so that
  // newlines and commas INSIDE a quoted field (e.g. a multi-paragraph
  // explanation) do not get mistaken for a new row/column.
  const rows = [];
  let row = [];
  let cur = '';
  let inQ = false;
  const src = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  for(let i=0;i<src.length;i++){
    const c = src[i];
    if(inQ){
      if(c === '"'){
        if(src[i+1] === '"'){ cur += '"'; i++; }
        else { inQ = false; }
      } else {
        cur += c;
      }
    } else {
      if(c === '"'){ inQ = true; }
      else if(c === ','){ row.push(cur); cur=''; }
      else if(c === '\n'){ row.push(cur); cur=''; rows.push(row); row=[]; }
      else { cur += c; }
    }
  }
  if(cur.length || row.length){ row.push(cur); rows.push(row); }
  const nonEmpty = rows.filter(r => r.some(cell => cell.trim().length));
  if(!nonEmpty.length) return {headers:[],rows:[]};
  const headers = nonEmpty[0].map(h=>h.trim().toLowerCase().replace(/\s+/g,'_'));
  const dataRows = nonEmpty.slice(1).map(cells=>{
    const obj={};
    headers.forEach((h,i)=>obj[h]=(cells[i]??'').trim());
    return obj;
  });
  return {headers, rows: dataRows};
}

    if(this.cache[key]!==undefined) return this.cache[key];
    try{
      const r = await window.storage.get(key, shared);
      const v = r ? JSON.parse(r.value) : fallback;
      this.cache[key]=v;
      return v;
    }catch(e){
      this.cache[key]=fallback;
      return fallback;
    }
  },
  async set(key, value, shared=true){
    this.cache[key]=value;
    try{ await window.storage.set(key, JSON.stringify(value), shared); }catch(e){ console.warn('storage set failed',key,e); }
    return value;
  }
};

function randNormal(mean,sd){
  let u=0,v=0; while(u===0)u=Math.random(); while(v===0)v=Math.random();
  return mean + sd*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
}

  const totalQ = test.sections.reduce((a,s)=>a+s.questionIds.length,0);
  const out=[];
  for(let i=0;i<count;i++){

    const skill = Math.min(0.97,Math.max(0.15, randNormal(0.62,0.16)));

    const subjPerf={}; SUBJECTS.forEach(s=>subjPerf[s]={correct:0,total:0});

      fake:true,
    });
  }
  return out;
}

async function boot(){
  const seeded = await DB.get('seeded_v1', false, true);
  if(!seeded){
    const questions = buildSeedQuestions();
    const test = buildSeedTest(questions);
    const users = buildSeedUsers();
    const fakeAttempts = buildFakeAttempts(test, questions);
    await DB.set('questions', questions, true);
    await DB.set('tests', [test], true);
    await DB.set('users', users, true);
    await DB.set('attempts', fakeAttempts, true); // real attempts appended here on submit
    await DB.set('auditLog', [], true);
    await DB.set('settings', {
      demoSpeed: 20, // speeds section timers up 20x for demo/testing; set 1 for real 50-minute sections
      globalShuffle:false,
      tabSwitchLimit:3,
      fullscreenRequired:true,
      disableCopyPaste:true,
    }, true);
    await DB.set('seeded_v1', true, true);
  }

  // ---- Restore an existing session on page load/refresh, so a student
  // (or admin) is never unexpectedly dumped back to the login screen. ----
  try{
    const saved = localStorage.getItem('fmge_student_session');
    if(saved){
      const info = JSON.parse(saved);
      const { data, error } = await sb.rpc('student_get_dashboard', {p_token: info.token});
      if(!error && data){
        S.role = 'student';
        S.studentToken = info.token;
        S.currentUser = { id: info.id, studentId: info.studentId, name: info.name, status:'Active' };
        S.view = 'student'; S.studentPage = 'dashboard';
      } else if(error && /session expired|attempt not found|invalid/i.test(error.message||'')){
        // This is a genuine "the token itself is no longer valid" signal
        // (e.g. the student logged in on another device, which invalidates
        // this one) — safe and correct to clear it and show the login page.
        localStorage.removeItem('fmge_student_session');
      }
      // Any OTHER error here (network hiccup, temporary Supabase outage,
      // DNS blip on page load, etc.) is NOT treated as an invalid session —
      // we deliberately do NOT clear localStorage in that case, so the very
      // next page load/refresh (once connectivity returns) can still log
      // the student back in automatically instead of forcing a manual
      // re-login for what was only ever a temporary network issue.
    }
  }catch(e){
    // A thrown exception here almost always means the request never even
    // reached the server (offline, DNS failure, etc.) — a pure
    // connectivity problem, not an invalid session. Leave the saved
    // session alone so the next attempt can still succeed.
  }

  if(!S.role){
    try{
      const { data: { session } } = await sb.auth.getSession();
      if(session?.user && (session.user.email||'').toLowerCase() === ADMIN_EMAIL.toLowerCase()){
        S.role = 'admin';
        S.currentUser = { id:session.user.id, name:'System Administrator', email:session.user.email, status:'Active' };
        S.view='admin'; S.adminSection='dashboard';
      }
    }catch(e){ /* no valid admin session — fine, show login */ }
  }

  S.booted = true;
}

// ---------- AUTH ----------
async function doLogin(role, username, password){
  if(role==='admin'){
    // Real Supabase Auth login. Only the one admin account created in
    // Supabase (Authentication -> Users) can ever succeed here.
    const { data, error } = await sb.auth.signInWithPassword({ email: username.trim(), password });
    if(error || !data?.user){ toast('Invalid admin email or password','err'); return false; }
    if((data.user.email||'').toLowerCase() !== ADMIN_EMAIL.toLowerCase()){
      await sb.auth.signOut();
      toast('This account is not authorized as admin','err'); return false;
    }
    S.role = 'admin';
    S.currentUser = { id:data.user.id, name:'System Administrator', email:data.user.email, status:'Active' };
    await logAudit('Login','Admin logged in');
    S.view='admin'; S.adminSection='dashboard';
    render();
    return true;
  } else {
    // Student login goes through our secure database function
    // (student_login) — it checks the password hash server-side and never
    // exposes any password. It also hands back a session token used for
    // future secure actions (exam start/save/submit) in later steps.
    const { data, error } = await sb.rpc('student_login', { p_student_id: username.trim(), p_password: password });
    const row = Array.isArray(data) ? data[0] : data;
    if(error || !row){ toast('Invalid Student ID or password','err'); return false; }
    S.role = 'student';
    S.studentToken = row.token;
    S.currentUser = { id: row.id, studentId: row.student_id, name: row.name, status:'Active' };
    localStorage.setItem('fmge_student_session', JSON.stringify({ token: row.token, id: row.id, studentId: row.student_id, name: row.name }));
    S.view='student'; S.studentPage='dashboard';
    render();
    return true;
  }
}
async function doLogout(){
  if(S.examTimerHandle) clearInterval(S.examTimerHandle);
  if(S.role==='admin'){ await sb.auth.signOut(); }
  localStorage.removeItem('fmge_student_session');
  S.role=null; S.currentUser=null; S.studentToken=null; S.view='login'; S.activeAttempt=null;
  render();
}

// ---------- small svg bar chart helper ----------
function svgBarChart(data, {width=560,height=200,color='#155EEF',max=null}={}){
  // data: [{label,value}]
  const m = max ?? Math.max(1,...data.map(d=>d.value));
  const barW = (width-40)/data.length - 10;
  let bars='', labels='';
  data.forEach((d,i)=>{
    const h = Math.max(2,(d.value/m)*(height-46));
    const x = 30 + i*((width-40)/data.length);
    const y = height-30-h;
    bars += `<rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="5" fill="${d.color||color}"></rect>
      <text x="${x+barW/2}" y="${y-6}" font-size="11" fill="#101828" text-anchor="middle" font-weight="700">${d.value}</text>`;
    labels += `<text x="${x+barW/2}" y="${height-12}" font-size="10.5" fill="#667085" text-anchor="middle">${esc(d.label)}</text>`;
  });
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" style="max-width:${width}px">
    <line x1="30" y1="${height-30}" x2="${width-10}" y2="${height-30}" stroke="#E4E7EC"/>
    ${bars}${labels}
  </svg>`;
}
function svgLineChart(points,{width=560,height=180,color='#155EEF'}={}){
  const max = Math.max(1,...points.map(p=>p.y));
  const stepX = (width-40)/(points.length-1||1);
  const coords = points.map((p,i)=>{
    const x=30+i*stepX; const y = height-30-(p.y/max)*(height-50);
    return [x,y];
  });
  const path = coords.map((c,i)=> (i===0?'M':'L')+c[0].toFixed(1)+' '+c[1].toFixed(1)).join(' ');
  const area = path + ` L${coords[coords.length-1][0]},${height-30} L${coords[0][0]},${height-30} Z`;
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" style="max-width:${width}px">
    <defs><linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity="0.25"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <line x1="30" y1="${height-30}" x2="${width-10}" y2="${height-30}" stroke="#E4E7EC"/>
    <path d="${area}" fill="url(#lg1)"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2.5"/>
    ${coords.map((c,i)=>`<circle cx="${c[0]}" cy="${c[1]}" r="3.5" fill="${color}"/>`).join('')}
    ${points.map((p,i)=>`<text x="${coords[i][0]}" y="${height-12}" font-size="10" fill="#667085" text-anchor="middle">${esc(p.x)}</text>`).join('')}
  </svg>`;
}

    </div>

  `, 480);

    const batchId = $('#bulkBatchSelect').value;
    const btn = $('#confirmBulkBatchBtn'); btn.disabled=true;
    let ok=0, fail=0;
    for(let i=0;i<ids.length;i++){
      btn.textContent = `Assigning… ${i+1}/${ids.length}`;

function openBulkStudentModal(){
  openModal('Bulk Student Upload', `
    <p style="font-size:13px;color:var(--text2);margin-bottom:12px;">CSV columns: <code>student_id, name, password, email, mobile, exam_target, status, batch</code><br>The <code>batch</code> column is optional — if the batch name doesn't exist yet, it's created automatically.</p>
    <button class="btn btn-outline btn-sm" id="dlTemplateStu" style="margin-bottom:14px;">Download CSV Template</button>
    <input type="file" id="stuCsvFile" accept=".csv"><div id="stuUploadResult" style="margin-top:14px;"></div>
  `);
  $('#dlTemplateStu').onclick=()=>downloadCSV('student_upload_template.csv',[
    ['student_id','name','password','email','mobile','exam_target','status','batch'],
    ['ABC123','Sample Student Name','XYZ456','sample@example.com','9999999999','FMGE','Active','Batch A']]);
  $('#stuCsvFile').onchange=async(e)=>{
    const file = e.target.files[0]; if(!file) return;
    const text = await file.text();
    const {rows} = parseCSV(text);
    let ok=0, fail=0, dup=0, missing=0;
    const errors=[];
    $('#stuUploadResult').innerHTML = `<div class="empty-state">Importing ${rows.length} rows, please wait…</div>`;
    for(let i=0;i<rows.length;i++){
      const r = rows[i];
      try{
        if(!r.student_id || !r.name || !r.password){ missing++; fail++; errors.push(`Row ${i+2}: missing student_id, name or password`); continue; }
        const { error } = await sb.rpc('admin_add_student', {
          p_student_id: r.student_id, p_name: r.name, p_password: r.password,
          p_email: r.email||null, p_mobile: r.mobile||null,
          p_exam_target: r.exam_target||'FMGE', p_status: ['Active','Inactive','Blocked'].includes(r.status)? r.status:'Active',
          p_batch_name: r.batch||null,
        });
        if(error){
          if(error.message.includes('duplicate') || error.code==='23505'){ dup++; } else { fail++; errors.push(`Row ${i+2}: ${error.message}`); }
          continue;
        }
        ok++;
      }catch(rowErr){
        fail++; errors.push(`Row ${i+2}: ${rowErr.message||String(rowErr)}`);
      }
      // Keep the progress banner updating as we go, in case a large file takes a while.
      $('#stuUploadResult').innerHTML = `<div class="empty-state"><span class="spinner"></span> Processed ${i+1} of ${rows.length} rows… (${ok} imported so far)</div>`;
    }
    await logAudit('Bulk Student Upload', `${ok} imported, ${fail} failed, ${dup} duplicate`);
    $('#stuUploadResult').innerHTML = `<div class="lock-banner" style="background:var(--success-bg);border-color:#A9E6C4;color:#0B6B39;">
      Total records: ${rows.length} · <b>Successfully imported: ${ok}</b> · Duplicate IDs: ${dup} · Missing fields: ${missing}</div>
      ${errors.length? `<div style="margin-top:10px;font-size:12.5px;color:var(--error)">${errors.slice(0,8).map(e=>`<div>${esc(e)}</div>`).join('')}</div>`:''}`;
    toast(`${ok} students imported`,'ok');
    renderAdminSection($('#adminMain'));
  };
}

function diffBadge(d){ const c = d==='Easy'?'success':d==='Hard'?'error':'warning'; return `<span class="badge badge-${c}">${d}</span>`; }
function statusBadge(status){
  const map={draft:'grey',scheduled:'warning',live:'success',closed:'navy', Active:'success', Inactive:'grey', Blocked:'error'};
  const cls = map[status]||'grey';
  return `<span class="badge badge-${cls}">${status}</span>`;
}

      if(!r.question || !r.option_a || !r.option_b || !r.correct_answer){ fail++; errors.push(`Row ${i+2}: missing required field`); continue; }
      try{
        const { error } = await sb.rpc('admin_add_question', {
          p_exam_code: examCode, p_part_number: partNumber,
          p_subject: r.subject||'General', p_topic: r.topic||null,
          p_text: r.question, p_option_a: r.option_a, p_option_b: r.option_b,
          p_option_c: r.option_c||null, p_option_d: r.option_d||null,
          p_correct: (r.correct_answer||'A').toUpperCase(), p_explanation: r.explanation||null,
          p_difficulty: ['Easy','Medium','Hard'].includes(r.difficulty)? r.difficulty:'Medium',
          p_is_pyq: truthy(r.pyq_tag), p_pyq_year: r.pyq_year? parseInt(r.pyq_year):null,
          p_marks: r.marks? parseFloat(r.marks):1, p_negative_marks: r.negative_marks? parseFloat(r.negative_marks):0.25,
          p_tags: r.tags||null, p_image_url: r.image_url||null,
          p_reference: r.reference||null, p_key_learning_point: r.key_learning_point||null,
          p_is_clinical_case: truthy(r.clinical_case),
          p_question_set: setName, p_set_order: setName? (i+1) : null,
        });
        if(error){
          if(error.message.includes('DUPLICATE_QUESTION')) dup++;
          else { fail++; errors.push(`Row ${i+2}: ${error.message}`); }
        } else ok++;
      }catch(rowErr){
        fail++; errors.push(`Row ${i+2}: ${rowErr.message||String(rowErr)}`);
      }
      $('#qUploadResult').innerHTML = `<div class="empty-state"><span class="spinner"></span> Processed ${i+1} of ${rows.length} rows… (${ok} imported so far)</div>`;
    }
    await logAudit('Bulk Question Upload', `exam=${examCode} part=${partNumber} set=${setName||'—'} imported=${ok} dup=${dup} failed=${fail}`);
    $('#qUploadResult').innerHTML = `
      <div class="lock-banner" style="background:var(--success-bg);border-color:#A9E6C4;color:#0B6B39;">
        Total records: ${rows.length} · <b>Successfully imported: ${ok}</b> · Duplicates skipped: ${dup} · Errors: ${fail}
        ${setName? ` · Saved under Question Set: <b>${esc(setName)}</b>` : ''}</div>
      ${errors.length? `<div style="margin-top:10px;font-size:12.5px;color:var(--error)">${errors.slice(0,8).map(e=>`<div>${esc(e)}</div>`).join('')}</div>`:''}
    `;
    btn.textContent = 'Upload Complete'; 
    toast(`${ok} questions imported`,'ok');
    renderAdminSection($('#adminMain'));
  };
}

const REASON_LABEL = {
  manual: 'Submitted by student', auto_timeout: '⏱ Auto-submitted (time expired)',
  auto_tab_switch: '⚠️ Auto-submitted (tab-switch limit)',
};
function partStatusSummary(part){
  const secs = part.sections||[];
  const total = secs.length;
  const completed = secs.filter(s=>s.status==='completed').length;
  const liveNow = secs.some(s=>s.is_live_now);
  const lastTouched = [...secs].reverse().find(s=>s.status!=='not_started');
  let label, cls;
  if(completed>=total && total>0){ label='✅ Completed'; cls='badge-success'; }
  else if(liveNow){ label='🟢 Live now'; cls='badge-success'; }
  else if(lastTouched){ label=`⏸ Paused (${completed}/${total})`; cls='badge-warning'; }
  else { label='Not started'; cls='badge-grey'; }
  const reasonNote = (lastTouched && lastTouched.status==='completed' && lastTouched.submit_reason && lastTouched.submit_reason!=='manual')
    ? REASON_LABEL[lastTouched.submit_reason] || lastTouched.submit_reason : null;
  return {label, cls, completed, total, liveNow, reasonNote};
}

  const sAt = settings?.start_at? new Date(settings.start_at) : null;
  const eAt = settings?.end_at? new Date(settings.end_at) : null;
  const pad = n=>String(n).padStart(2,'0');
  S.wizard = {
    testId, step:2, examCode:data.exam_code, name:data.name, description:data.description||'',
    instructions:data.instructions||'',

    startTime: sAt? `${pad(sAt.getHours())}:${pad(sAt.getMinutes())}` : '09:00',
    endDate: eAt? `${eAt.getFullYear()}-${pad(eAt.getMonth()+1)}-${pad(eAt.getDate())}` : '',
    endTime: eAt? `${pad(eAt.getHours())}:${pad(eAt.getMinutes())}` : '18:00',

    marksPerQuestion: settings?.marks_per_question ?? 1, negativeMarking: settings?.negative_marking ?? 0.25,
    tabSwitchLimit: settings?.tab_switch_limit ?? 3, fullscreenRequired: settings?.fullscreen_required ?? true,
    disableCopyPaste: settings?.disable_copy_paste ?? true,
    resultsVisible: settings?.results_visible ?? true, rankingEnabled: settings?.ranking_enabled ?? true,
    showCorrectAnswers: settings?.show_correct_answers ?? true, showExplanations: settings?.show_explanations ?? true,
    allowReview: settings?.allow_review ?? true,
    parts: (data.parts||[]).map(p=>({
      id:p.id, partNumber:p.part_number, name:p.name, questionCount:p.question_count,
      selectedIds:new Set(),
      sections: (p.sections||[]).map(s=>({ id:s.id, name:s.name, questionCount:s.question_count, durationMin:s.duration_min, selectedIds:new Set() })),
    })),
  };
  openWizardModal();
  await loadPartSelections();
};
async function loadPartSelections(){
  const w = S.wizard;
  for(const part of w.parts){
    if(!part.id) continue;
    if(part.sections && part.sections.length){
      for(const sec of part.sections){
        const { data } = await sb.rpc('admin_get_section_questions', {p_section_id: sec.id});
        sec.selectedIds = new Set((data||[]).map(r=>r.question_id));
      }
    } else {
      const { data } = await sb.rpc('admin_get_part_questions', {p_test_part_id: part.id});
      part.selectedIds = new Set((data||[]).map(r=>r.question_id));
    }
  }
  renderWizardStep();
}

async function handleWizardNext(){
  const w = S.wizard;
  if(w.step===1){
    if(!w.name.trim()){ toast('Give the test a name first','err'); return; }
    if(!w.testId){
      const { data, error } = await sb.rpc('admin_create_test', {
        p_exam_code: w.examCode, p_name: w.name, p_description: w.description||null,
        p_start_at: w.startDate? new Date(w.startDate+'T'+(w.startTime||'00:00')).toISOString() : null,
        p_end_at: w.endDate? new Date(w.endDate+'T'+(w.endTime||'00:00')).toISOString() : null,
        p_max_attempts: w.maxAttempts, p_marks_per_question: w.marksPerQuestion, p_negative_marking: w.negativeMarking,
        p_instructions: w.instructions||null, p_results_visible: w.resultsVisible, p_ranking_enabled: w.rankingEnabled,
        p_show_correct_answers: w.showCorrectAnswers, p_show_explanations: w.showExplanations, p_allow_review: w.allowReview,
      });
      if(error){ toast('Could not create test: '+error.message,'err'); return; }
      w.testId = data;
      await logAudit('Create Test', w.name);
    } else {
      const { error } = await sb.rpc('admin_update_test_settings', {
        p_test_id: w.testId, p_name: w.name, p_description: w.description||null, p_instructions: w.instructions||null,
        p_start_at: w.startDate? new Date(w.startDate+'T'+(w.startTime||'00:00')).toISOString() : null,
        p_end_at: w.endDate? new Date(w.endDate+'T'+(w.endTime||'00:00')).toISOString() : null,
        p_max_attempts: w.maxAttempts, p_marks_per_question: w.marksPerQuestion, p_negative_marking: w.negativeMarking,
        p_tab_switch_limit: w.tabSwitchLimit, p_fullscreen_required: w.fullscreenRequired, p_disable_copy_paste: w.disableCopyPaste,
        p_results_visible: w.resultsVisible, p_ranking_enabled: w.rankingEnabled,
        p_show_correct_answers: w.showCorrectAnswers, p_show_explanations: w.showExplanations, p_allow_review: w.allowReview,
      });
      if(error){ toast('Could not save settings: '+error.message,'err'); return; }
      await logAudit('Update Test Settings', w.name);
    }
    w.step=2; renderWizardStep(); refreshWizardChrome();
  } else if(w.step===2){
    if(!w.parts.length){ toast('Add at least one part','err'); return; }
    const payload = w.parts.map(p=>({partNumber:p.partNumber, name:p.name, questionCount:p.questionCount, durationMin:p.durationMin||60}));
    const { error } = await sb.rpc('admin_define_test_parts', {p_test_id:w.testId, p_parts: payload});
    if(error){ toast('Could not save parts: '+error.message,'err'); return; }
    const { data: test } = await sb.rpc('admin_get_test', {p_test_id:w.testId});
    w.parts = (test.parts||[]).map(p=>({
      id:p.id, partNumber:p.part_number, name:p.name, questionCount:p.question_count, selectedIds:new Set(),
      sections: (p.sections||[]).map(s=>({ id:s.id, name:s.name, questionCount:s.question_count, durationMin:s.duration_min, selectedIds:new Set() })),
    }));
    await loadPartSelections();
    w.step=3; renderWizardStep(); refreshWizardChrome();
  } else if(w.step===3){
    w.step=4; renderWizardStep(); refreshWizardChrome();
  } else {
    closeModal(); toast('Test setup saved as Draft — publish it from the Tests list when ready','ok');
    renderAdminSection($('#adminMain'));
  }
}

  else if(w.step===2){
    body.innerHTML = `

  }
  else if(w.step===3){ renderAssignQuestionsStep(body); }
  else if(w.step===4){

        <div class="row">
          <span class="badge badge-blue">${w.examCode}</span>
          <div class="pattern-chip">📄 ${totalAssigned} / ${totalRequired} Questions</div>
          <div class="pattern-chip">🔁 ${w.maxAttempts} attempt(s)</div>
        </div>

          return `<div style="padding:7px 0;border-bottom:1px solid var(--border);font-size:13px;">

          </div>`;

      </div>
      ${totalAssigned!==totalRequired? `<div class="lock-banner" style="background:var(--error-bg);border-color:#F9CAC4;color:var(--error);margin-top:14px;">This test is saved as a Draft. It cannot go Live until every part/section has its full question count — you can come back anytime via "Continue Setup" on the Tests list.</div>`
      : `<div class="empty-state"><div class="icon">✅</div><p style="font-weight:700;color:var(--navy);font-size:15px;">All parts fully assigned</p><p style="margin-top:6px;font-size:13px;">Go to the Tests list and change its status to "live" to publish it. Then use "Manage Parts" to open/close each Part whenever you like — for however many days you want.</p></div>`}
    `;

}
function toggleHTML2(id,on,label){
  return `<div class="toggle-wrap"><div class="toggle ${on?'on':''}" id="${id}"></div><span style="font-size:13px;font-weight:600;">${label} — <b style="color:${on?'var(--success)':'var(--error)'}">${on?'On':'Off'}</b></span></div>`;
}
function bindToggle2(id,w,key){
  const el = $('#'+id); if(!el) return;
  el.onclick=()=>{
    w[key]=!w[key];
    el.classList.toggle('on',w[key]);
    const b = el.nextElementSibling.querySelector('b');
    b.textContent = w[key]?'On':'Off'; b.style.color = w[key]?'var(--success)':'var(--error)';
  };
}
function renderPartsRows(){
  const w = S.wizard;
  const wrap = $('#partsRows'); if(!wrap) return;
  wrap.innerHTML = w.parts.map((p,i)=>`
    <div class="row" style="align-items:flex-end;">
      <div class="field" style="flex:2"><label>Part Name</label><input value="${esc(p.name)}" onchange="S.wizard.parts[${i}].name=this.value"></div>
      <div class="field"><label>Part #</label><input type="number" min="1" value="${p.partNumber}" onchange="S.wizard.parts[${i}].partNumber=parseInt(this.value)||1"></div>
      <div class="field"><label># Questions</label><input type="number" min="1" value="${p.questionCount}" onchange="S.wizard.parts[${i}].questionCount=parseInt(this.value)||1; renderWizardStep();"></div>
      <div class="field"><label>Duration (min)</label><input type="number" min="1" value="${p.durationMin||60}" onchange="S.wizard.parts[${i}].durationMin=parseInt(this.value)||60;"></div>
      <div class="field"><button class="btn btn-danger btn-sm" onclick="S.wizard.parts.splice(${i},1); renderWizardStep();">Remove</button></div>
    </div>`).join('');
}
function renderAssignQuestionsStep(body){
  const w = S.wizard;
  if(!w.activePartIdx) w.activePartIdx = 0;
  body.innerHTML = `<div id="assignWrap"></div>`;
  renderAssignInner();
  async function renderAssignInner(){
    const part = w.parts[w.activePartIdx];
    if(!part){ $('#assignWrap').innerHTML = `<div class="empty-state">Define parts in the previous step first.</div>`; return; }
    const hasSections = part.sections && part.sections.length > 0;
    const totalSectionQ = hasSections? part.sections.reduce((a,s)=>a+s.questionCount,0) : 0;

    let sectionsEditorHTML = '';
    if(w.editingSections){
      sectionsEditorHTML = `
        <div class="card pad" style="margin-bottom:14px;">
          <h4 style="font-size:13.5px;margin-bottom:10px;">Sections in ${esc(part.name)}</h4>
          <div id="sectionRows"></div>
          <div style="display:flex;gap:8px;margin-top:8px;">
            <button class="btn btn-outline btn-sm" id="addSectionBtn">+ Add Section</button>
            <button class="btn btn-primary btn-sm" id="saveSectionsBtn">Save Sections</button>
            <button class="btn btn-ghost btn-sm" id="cancelSectionsBtn">Cancel</button>
          </div>
          <p class="kbd-note" style="margin-top:8px;">Sections total: <b>${(w.tempSections||part.sections).reduce((a,s)=>a+(s.questionCount||0),0)}</b> — should equal this Part's ${part.questionCount} questions.</p>
        </div>`;
    }

    let quickSetupHTML = '';
    if(w.showQuickSetup){
      if(!w.qsSections || !w.qsSections.length) w.qsSections = [{name:'Section 1', questionCount:50, durationMin:50}];
      const qsTotal = w.qsSections.reduce((a,s)=>a+(s.questionCount||0),0);
      const setInfo = (w.qbSets||[]).find(s=>s.question_set===w.qsSelectedSet);
      quickSetupHTML = `
        <div class="card pad" style="margin-bottom:14px;border:2px solid var(--primary);">
          <h4 style="font-size:14px;margin-bottom:4px;">⚡ Quick Setup — Auto-fill from a Question Set</h4>
          <p style="font-size:12.5px;color:var(--text2);margin-bottom:10px;">Pick a Set uploaded via Bulk Upload, tell it how many Sections to split into, and every question gets assigned automatically — no manual picking.</p>
          <div class="field" style="margin-bottom:10px;">
            <label>Question Set</label>
            <select id="qsSetSelect">
              <option value="">— choose a set —</option>
              ${(w.qbSets||[]).map(s=>`<option value="${esc(s.question_set)}" ${w.qsSelectedSet===s.question_set?'selected':''}>${esc(s.question_set)} (${s.total_count} questions)</option>`).join('')}
            </select>
          </div>
          <div id="qsSectionRows">${w.qsSections.map((s,i)=>`
            <div class="row" style="align-items:flex-end;">
              <div class="field" style="flex:2"><label>Section Name</label><input value="${esc(s.name)}" onchange="S.wizard.qsSections[${i}].name=this.value"></div>
              <div class="field"><label># Questions</label><input type="number" min="1" value="${s.questionCount}" onchange="S.wizard.qsSections[${i}].questionCount=parseInt(this.value)||1; renderWizardStep();"></div>
              <div class="field"><label>Duration (min)</label><input type="number" min="1" value="${s.durationMin}" onchange="S.wizard.qsSections[${i}].durationMin=parseInt(this.value)||1;"></div>
              <div class="field"><button class="btn btn-danger btn-sm" onclick="S.wizard.qsSections.splice(${i},1); renderWizardStep();">Remove</button></div>
            </div>`).join('')}</div>
          <div style="display:flex;gap:8px;align-items:center;margin:10px 0;flex-wrap:wrap;">
            <button class="btn btn-outline btn-sm" id="qsAddSectionBtn">+ Add Section</button>
            <label style="display:flex;align-items:center;gap:6px;font-size:13px;"><input type="checkbox" id="qsRandomize" style="width:auto;" ${w.qsRandomize?'checked':''}> Shuffle question order</label>
          </div>
          <p class="kbd-note" style="margin-bottom:10px;">Sections total: <b style="color:${setInfo && qsTotal===Number(setInfo.total_count)?'var(--success)':'var(--error)'}">${qsTotal}</b>${setInfo? ` — must equal the set's ${setInfo.total_count} questions` : ' — pick a set above first'}</p>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-primary btn-sm" id="qsDistributeBtn">Auto-Distribute Now</button>
            <button class="btn btn-ghost btn-sm" id="qsCancelBtn">Cancel</button>
          </div>
        </div>`;
    }

    $('#assignWrap').innerHTML = `
      <div class="tabbar">${w.parts.map((p,i)=>`<button class="tabbtn ${i===w.activePartIdx?'active':''}" data-idx="${i}">${esc(p.name)} (${p.sections?.length? p.sections.reduce((b,s)=>b+s.selectedIds.size,0) : p.selectedIds.size}/${p.questionCount})</button>`).join('')}</div>
      ${!w.showQuickSetup? `<button class="btn btn-outline btn-sm" style="margin-bottom:14px;" id="openQuickSetupBtn">⚡ Quick Setup: Auto-fill from a Question Set</button>` : ''}
      ${quickSetupHTML}
      ${sectionsEditorHTML}
      ${!w.editingSections && !w.showQuickSetup? `<div style="margin-bottom:12px;display:flex;gap:8px;">
        <button class="btn btn-outline btn-sm" id="editSectionsBtn">${hasSections? 'Edit Sections':'+ Break this Part into Sections'}</button>
      </div>`:''}
      ${!w.editingSections && !w.showQuickSetup && hasSections? renderSectionTabsAndList(part) : ''}
      ${!w.editingSections && !w.showQuickSetup && !hasSections? renderDirectPartList(part) : ''}
    `;

    if(!w.showQuickSetup){
      const openBtn = $('#openQuickSetupBtn');
      if(openBtn) openBtn.onclick=async()=>{
        if(!w.qbSets){
          const { data, error: setsErr } = await sb.rpc('admin_get_question_sets', {p_exam_code: w.examCode});
          if(setsErr){ toast('Could not load question sets: '+setsErr.message,'err'); return; }
          w.qbSets = data||[];
          if(!w.qbSets.length){ toast('No question sets found for '+w.examCode+' — make sure questions were uploaded with a Set Name','err'); }
        }
        w.showQuickSetup = true; renderAssignInner();
      };
    }
    if(w.showQuickSetup){
      $('#qsSetSelect').onchange=(e)=>{ w.qsSelectedSet = e.target.value; renderAssignInner(); };
      $('#qsAddSectionBtn').onclick=()=>{ w.qsSections.push({name:'Section '+(w.qsSections.length+1), questionCount:50, durationMin:50}); renderAssignInner(); };
      $('#qsRandomize').onchange=(e)=>{ w.qsRandomize = e.target.checked; };
      $('#qsCancelBtn').onclick=()=>{ w.showQuickSetup=false; renderAssignInner(); };
      $('#qsDistributeBtn').onclick=async()=>{
        if(!w.qsSelectedSet){ toast('Choose a Question Set first','err'); return; }
        const setInfo = (w.qbSets||[]).find(s=>s.question_set===w.qsSelectedSet);
        const qsTotal = w.qsSections.reduce((a,s)=>a+(s.questionCount||0),0);
        if(!setInfo || qsTotal !== Number(setInfo.total_count)){ toast(`Section distribution must equal total question count: ${setInfo?setInfo.total_count:'?'}`,'err'); return; }
        if(!confirm(`This will replace any existing sections/questions in "${part.name}" with ${qsTotal} questions from "${w.qsSelectedSet}". Continue?`)) return;
        const btn = $('#qsDistributeBtn'); btn.disabled=true; btn.textContent='Distributing…';
        const payload = w.qsSections.map((s,i)=>({name:s.name, question_count:s.questionCount, duration_min:s.durationMin, order_index:i}));
        const { error } = await sb.rpc('admin_auto_distribute_set', {p_test_part_id: part.id, p_question_set: w.qsSelectedSet, p_sections: payload, p_randomize: !!w.qsRandomize});
        if(error){ toast('Could not distribute: '+error.message,'err'); btn.disabled=false; btn.textContent='Auto-Distribute Now'; return; }
        await logAudit('Auto-Distribute Question Set', `part=${part.name} set=${w.qsSelectedSet} sections=${w.qsSections.length}`);
        const { data: test } = await sb.rpc('admin_get_test', {p_test_id:w.testId});
        const freshPart = test.parts.find(p=>p.id===part.id);
        part.sections = (freshPart.sections||[]).map(s=>({ id:s.id, name:s.name, questionCount:s.question_count, durationMin:s.duration_min, selectedIds:new Set(Array.from({length:s.question_count}, (_,idx)=>'auto-'+idx)) }));
        w.showQuickSetup = false; w.qsSections = null; w.qsSelectedSet = null;
        toast('Questions auto-distributed successfully!','ok');
        renderAssignInner();
      };
      return;
    }

    $$('.tabbtn').forEach(btn=>btn.onclick=()=>{ w.activePartIdx=parseInt(btn.dataset.idx); w.editingSections=false; w.showQuickSetup=false; renderAssignInner(); });

    if(w.editingSections){
      if(!w.tempSections) w.tempSections = hasSections? part.sections.map(s=>({...s})) : [];
      renderSectionRows();
      $('#addSectionBtn').onclick=()=>{ w.tempSections.push({name:'Section '+String.fromCharCode(65+w.tempSections.length), questionCount:50, durationMin:50}); renderSectionRows(); };
      $('#cancelSectionsBtn').onclick=()=>{ w.editingSections=false; w.tempSections=null; renderAssignInner(); };
      $('#saveSectionsBtn').onclick=async()=>{
        const payload = w.tempSections.map(s=>({name:s.name, questionCount:s.questionCount, durationMin:s.durationMin}));
        const { error } = await sb.rpc('admin_define_part_sections', {p_test_part_id: part.id, p_sections: payload});
        if(error){ toast('Could not save sections: '+error.message,'err'); return; }
        const { data: test } = await sb.rpc('admin_get_test', {p_test_id:w.testId});
        const freshPart = test.parts.find(p=>p.id===part.id);
        part.sections = (freshPart.sections||[]).map(s=>({ id:s.id, name:s.name, questionCount:s.question_count, durationMin:s.duration_min, selectedIds:new Set() }));
        part.selectedIds = new Set();
        w.editingSections=false; w.tempSections=null;
        toast('Sections saved','ok');
        renderAssignInner();
      };
      return;
    }

    if(hasSections){
      if(w.activeSectionIdx==null || w.activeSectionIdx>=part.sections.length) w.activeSectionIdx=0;
      $$('.sectiontab').forEach(btn=>btn.onclick=()=>{ w.activeSectionIdx=parseInt(btn.dataset.idx); renderAssignInner(); });
      const sec = part.sections[w.activeSectionIdx];
      await bindQuestionListEvents(sec, ()=>renderAssignInner(), w.examCode);
      const saveBtn = $('#aq_save'); if(saveBtn) saveBtn.onclick=async()=>{
        if(sec.selectedIds.size !== sec.questionCount){ toast(`Select exactly ${sec.questionCount} questions before saving (currently ${sec.selectedIds.size})`,'err'); return; }
        const { error } = await sb.rpc('admin_assign_section_questions', {p_section_id: sec.id, p_question_ids: [...sec.selectedIds]});
        if(error){ toast('Could not save: '+error.message,'err'); return; }
        toast(`${sec.name} saved`,'ok');
      };
    } else {
      await bindQuestionListEvents(part, ()=>renderAssignInner(), w.examCode);
      const saveBtn = $('#aq_save'); if(saveBtn) saveBtn.onclick=async()=>{
        if(part.selectedIds.size !== part.questionCount){ toast(`Select exactly ${part.questionCount} questions before saving (currently ${part.selectedIds.size})`,'err'); return; }
        const { error } = await sb.rpc('admin_assign_part_questions', {p_test_part_id: part.id, p_question_ids: [...part.selectedIds]});
        if(error){ toast('Could not save: '+error.message,'err'); return; }
        toast(`${part.name} saved`,'ok');
      };
    }

    const editBtn = $('#editSectionsBtn'); if(editBtn) editBtn.onclick=()=>{ w.editingSections=true; w.tempSections=null; renderAssignInner(); };

    function renderSectionRows(){
      const wrap = $('#sectionRows'); if(!wrap) return;

async function bindQuestionListEvents(target, onChange, examCode){
  if(!target.qFilters) target.qFilters = {q:'',subject:'',difficulty:''};
  const f = target.qFilters;
  const { data: list } = await sb.rpc('admin_list_questions', {
    p_exam_code: examCode, p_subject: f.subject||null, p_difficulty: f.difficulty||null, p_search: f.q||null,
    p_limit: 100, p_offset: 0,
  });
  const full = target.selectedIds.size >= target.questionCount;
  const wrap = $('#qlistWrap');
  if(!wrap) return;
  wrap.innerHTML = `
    <div class="qsel-toolbar">
      <div class="qsel-counter ${full?'full':''}">Selected: ${target.selectedIds.size} / ${target.questionCount}</div>
      <input id="aq_search" placeholder="Search question text" style="max-width:200px;" value="${esc(f.q)}">
      <input id="aq_subject" placeholder="Subject" style="max-width:130px;" value="${esc(f.subject)}">
      <select id="aq_diff"><option value="">All Difficulty</option>${['Easy','Medium','Hard'].map(d=>`<option ${f.difficulty===d?'selected':''}>${d}</option>`).join('')}</select>
      <button class="btn btn-outline btn-sm" id="aq_selectAll">Select All Below</button>
      <button class="btn btn-ghost btn-sm" id="aq_clearAll">Clear Selection</button>
      <button class="btn btn-primary btn-sm" id="aq_save">Save These Questions</button>
    </div>
    <div class="qsel-list">
      ${list.length? list.map(q=>`
        <div class="qsel-row ${target.selectedIds.has(q.id)?'picked':''}" data-qid="${q.id}">
          <input type="checkbox" ${target.selectedIds.has(q.id)?'checked':''} style="width:auto;flex-shrink:0;">
          <span class="qsel-text">${esc(q.text)}</span>
          <span class="badge badge-blue" style="flex-shrink:0;">${esc(q.subject)}</span>
          ${diffBadge(q.difficulty)}
        </div>`).join('') : `<div class="empty-state">No questions match — add more to the Question Bank first.</div>`}
    </div>
    <p style="font-size:11.5px;color:var(--text2);margin-top:6px;">Showing up to 100 matches for this exam — narrow filters if you have more.</p>
  `;
  $('#aq_search').oninput=(e)=>{f.q=e.target.value; onChange();};
  $('#aq_subject').oninput=(e)=>{f.subject=e.target.value; onChange();};
  $('#aq_diff').onchange=(e)=>{f.difficulty=e.target.value; onChange();};
  $('#aq_selectAll').onclick=()=>{
    let added=0, skippedDup=0;
    for(const q of list){
      if(target.selectedIds.size>=target.questionCount) break;
      if(target.selectedIds.has(q.id)){ skippedDup++; continue; }
      target.selectedIds.add(q.id); added++;
    }
    if(target.selectedIds.size>=target.questionCount && (added+skippedDup)<list.length){
      toast(`Added ${added} — section is now full (${target.questionCount}/${target.questionCount}), some matches below were not needed`,'ok');
    } else {
      toast(`Added ${added} question(s) from this filtered list`,'ok');
    }
    onChange();
  };
  $('#aq_clearAll').onclick=()=>{
    if(!confirm('Clear all selected questions for this section/part?')) return;
    target.selectedIds.clear(); onChange();
  };
  $$('.qsel-row').forEach(row=>row.onclick=()=>{
    const qid = row.dataset.qid;
    if(target.selectedIds.has(qid)) target.selectedIds.delete(qid);
    else {
      if(target.selectedIds.size>=target.questionCount){ toast(`Already has its full ${target.questionCount} questions — remove one before adding another`,'err'); return; }
      target.selectedIds.add(qid);
    }
    onChange();
  });
}

async function adminAnalytics(root){
  root.innerHTML = `<div class="empty-state">Loading…</div>`;
  const { data: tests, error: testsErr } = await sb.rpc('admin_list_tests');
  if(testsErr){ root.innerHTML = `<div class="empty-state">Could not load tests: ${esc(testsErr.message)}</div>`; return; }
  if(!S.resultsTestFilter && tests.length) S.resultsTestFilter = tests[0].id;
  const sel = S.resultsTestFilter;
  const [{ data: results }, { data: qstats, error: qErr }] = await Promise.all([
    sel? sb.rpc('admin_list_results', {p_test_id: sel}) : {data:[]},
    sel? sb.rpc('admin_question_analytics', {p_test_id: sel}) : {data:[]},
  ]);

  const scores = (results||[]).map(a=>Number(a.score));
  const avg = scores.length? (scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(2):'0';
  const high = scores.length? Math.max(...scores).toFixed(2):'0';
  const low = scores.length? Math.min(...scores).toFixed(2):'0';

  const subjAgg = {};
  (qstats||[]).forEach(q=>{
    if(!subjAgg[q.subject]) subjAgg[q.subject] = {correct:0,attempted:0};
    subjAgg[q.subject].correct += q.correct;
    subjAgg[q.subject].attempted += q.attempted;
  });
  const subjData = Object.entries(subjAgg).map(([s,v])=>({label:s.slice(0,6), value: v.attempted? Math.round(v.correct/v.attempted*100):0}));

  const list = qstats||[];
  const withAttempts = list.filter(q=>q.attempted>0);
  const mostWrong = [...withAttempts].sort((a,b)=>(a.correct/Math.max(a.attempted,1))-(b.correct/Math.max(b.attempted,1))).slice(0,10);
  const mostSkipped = [...list].sort((a,b)=>b.skipped-a.skipped).slice(0,10);

  root.innerHTML = `
    <div class="table-toolbar">
      <select id="anaTestSel" style="max-width:320px;">${tests.map(x=>`<option value="${x.id}" ${sel===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
    </div>
    <div class="grid-cards">
      <div class="stat-card"><div class="lbl">Total Attempts</div><div class="val">${scores.length}</div></div>
      <div class="stat-card"><div class="lbl">Average Score</div><div class="val">${avg}</div></div>
      <div class="stat-card"><div class="lbl">Highest Score</div><div class="val" style="color:var(--success)">${high}</div></div>
      <div class="stat-card"><div class="lbl">Lowest Score</div><div class="val" style="color:var(--error)">${low}</div></div>
    </div>
    ${subjData.length? `<div class="card pad" style="margin-bottom:16px;">
      <h4 style="font-size:15px;margin-bottom:10px;">Subject-wise performance</h4>
      <div class="svg-chart-wrap">${svgBarChart(subjData,{color:'#155EEF',max:100})}</div>
    </div>` : ''}
    <div class="row">
      <div class="card pad" style="flex:1;min-width:320px;">
        <h4 style="font-size:15px;margin-bottom:10px;">🔻 Most incorrectly answered questions</h4>
        <div class="table-wrap"><table><thead><tr><th>Subject</th><th>Accuracy</th><th>Avg time</th></tr></thead>
        <tbody>${mostWrong.length? mostWrong.map(q=>`<tr><td>${esc(q.subject)}</td><td><span class="badge badge-error">${Math.round(q.correct/Math.max(q.attempted,1)*100)}%</span></td><td>${q.avg_time_sec?q.avg_time_sec+'s':'—'}</td></tr>`).join('') : `<tr><td colspan="3"><div class="empty-state">No attempts yet.</div></td></tr>`}</tbody></table></div>
      </div>
      <div class="card pad" style="flex:1;min-width:320px;">
        <h4 style="font-size:15px;margin-bottom:10px;">⏭ Most skipped questions</h4>
        <div class="table-wrap"><table><thead><tr><th>Subject</th><th>Skipped</th></tr></thead>
        <tbody>${mostSkipped.length? mostSkipped.map(q=>`<tr><td>${esc(q.subject)}</td><td>${q.skipped}</td></tr>`).join('') : `<tr><td colspan="2"><div class="empty-state">No attempts yet.</div></td></tr>`}</tbody></table></div>
      </div>
    </div>
  `;
  $('#anaTestSel').onchange=(e)=>{S.resultsTestFilter=e.target.value; renderAdminSection($('#adminMain'));};
}

function sectionStartable(sections, idx){
  const sec = sections[idx];
  if(sec.my_status==='completed') return {startable:false, state:'completed'};
  if(sec.my_status==='active') return {startable:true, state:'resume'};
  if(idx===0) return {startable:true, state:'start'};
  return sections[idx-1].my_status==='completed'? {startable:true,state:'start'} : {startable:false, state:'locked'};
}

window.startSection = async(sectionId)=>{
  if(S.startingSection) return; // guard against double-click firing this twice before the first request returns
  S.startingSection = true;
  const { data, error } = await sb.rpc('student_start_section', {p_token: S.studentToken, p_section_id: sectionId});
  S.startingSection = false;
  if(error){
    // A near-simultaneous double-click can occasionally lose a race to the
    // database's own duplicate-prevention constraint; treat that specific
    // case as harmless (the other click already got the student in).
    if(error.message && error.message.includes('duplicate key value')){
      toast('Already starting this section…','');
      return;
    }
    toast(error.message,'err'); render(); return;
  }
  S.activeSection = {
    attemptId: data.attempt_id, attemptSectionId: data.attempt_section_id,
    sectionName: data.section_name, serverEndAt: data.server_end_at,
    fullscreenRequired: !!data.fullscreen_required, disableCopyPaste: !!data.disable_copy_paste,
    tabSwitchLimit: data.tab_switch_limit || 3, tabSwitchCount: 0,
    questions: data.questions, currentIndex: 0,
    responses: {}, questionShownAt: Date.now(),
  };
  data.questions.forEach((q,i)=>{
    S.activeSection.responses[q.question_id] = { selected: q.selected_option, marked: !!q.is_marked, visited: i===0 };
  });
  S.pendingSection = null;
  S.navBusy = false;
  S.submittingSection = false;
  S.studentPage='exam';
  render();
};
