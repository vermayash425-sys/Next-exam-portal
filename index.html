// ---------- Sidebar "LIVE" heartbeat badge ----------
// A lightweight poll (every 15s — much cheaper than the 3s Live Monitor
// poll, since this only needs to know a plain yes/no) that shows/hides
// the pulsing LIVE badge next to "Live Exams" in the sidebar, so it
// reflects whether a test is actually live right now rather than being
// a static decoration.
let _liveBadgeInterval = null;
async function refreshLiveBadge(){
  try{
    const { data, error } = await sb.rpc('admin_dashboard_stats');
    if(!error && data){ S.hasLiveExam = !!(Number(data.tests_live)>0); S.adminStatsCache = data; }
  }catch(e){ /* ignore — badges just stay as they were */ }
  try{
    // Separate, additive RPC (doesn't touch admin_dashboard_stats) so this
    // new badge can't break anything the dashboard stats already power.
    const { data: cnt, error: cntErr } = await sb.rpc('admin_count_open_question_reports');
    if(!cntErr) S.openReportsCount = Number(cnt)||0;
  }catch(e){ /* ignore — this feature may not be set up on the server yet */ }
  admUpdateSidebarBadges();
}
function startLiveBadgePolling(){
  if(_liveBadgeInterval) return;
  refreshLiveBadge();
  _liveBadgeInterval = setInterval(refreshLiveBadge, 15000);
}

// ---------- small svg bar chart helper ----------
// Kept landscape (delegates to the horizontal layout below) — no chart in
// the portal should render as a tall vertical column chart.
function svgBarChart(data, opts={}){
  return svgHorizontalBarChart(data, opts);
}
// Horizontal bar chart — used wherever there can be MANY categories (e.g.
// 15-20+ subjects). A vertical bar chart squeezes labels into a narrow
// column each, causing them to overlap once there are more than ~8 bars;
// a horizontal layout gives every label its own full-width row instead,
// so it stays readable no matter how many subjects there are. This is
// also the portal's required "landscape" orientation for analysis charts.
// Every bar animates in (grows from 0 → full width) with a short stagger
// per row, and its value label fades up right after — no chart renders
// as a flat, static image.
function svgHorizontalBarChart(data, {width=560,rowHeight=26,labelWidth=120,color='#155EEF',max=null}={}){
  const m = max ?? Math.max(1,...data.map(d=>d.value));
  const chartW = width - labelWidth - 50; // space left for the bar itself after the label + value columns
  const height = data.length*rowHeight + 10;
  let rows='';
  data.forEach((d,i)=>{
    const y = 10 + i*rowHeight;
    const barW = Math.max(2, (d.value/m)*chartW);
    const delay = (i*0.06).toFixed(2);
    rows += `<text class="chart-axis-label" style="animation-delay:${delay}s" x="${labelWidth-8}" y="${y+rowHeight*0.65}" font-size="12" fill="#344054" text-anchor="end">${esc(d.label)}</text>
      <rect class="chart-bar-h" style="animation-delay:${delay}s" x="${labelWidth}" y="${y+4}" width="${barW}" height="${rowHeight-10}" rx="4" fill="${d.color||color}"></rect>
      <text class="chart-val-label" style="animation-delay:${(i*0.06+0.5).toFixed(2)}s" x="${labelWidth+barW+8}" y="${y+rowHeight*0.65}" font-size="11.5" fill="#101828" font-weight="700">${d.value}${d.suffix||''}</text>`;
  });
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" style="max-width:${width}px;display:block;overflow:visible;">${rows}</svg>`;
}
// Donut/pie chart — the ring "draws itself" segment by segment (classic
// stroke-dashoffset reveal) instead of just appearing fully filled, and
// the legend rows fade up one after another right after.
function svgDonutChart(segments,{size=160,thickness=22,centerLabel='',centerSub=''}={}){
  // segments: [{label, value, color}]
  const total = segments.reduce((a,s)=>a+s.value,0) || 1;
  const r = (size-thickness)/2;
  const cx=size/2, cy=size/2;
  const circumference = 2*Math.PI*r;
  let offset = 0;
  const arcs = segments.filter(s=>s.value>0).map((s,i)=>{
    const frac = s.value/total;
    const dash = frac*circumference;
    const finalOffset = -offset;
    const el = `<circle class="chart-donut-arc" style="--circ:${circumference.toFixed(2)};--offdest:${finalOffset.toFixed(2)};animation-delay:${(i*0.18).toFixed(2)}s" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${thickness}"
      stroke-dasharray="${dash} ${circumference-dash}" transform="rotate(-90 ${cx} ${cy})" stroke-linecap="butt"/>`;
    offset += dash;
    return el;
  }).join('');
  return `<div class="chart-donut-wrap" style="display:flex;align-items:center;gap:18px;flex-wrap:wrap;">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="${thickness}"/>
      ${arcs}
      <text class="chart-donut-center" x="${cx}" y="${cy-2}" text-anchor="middle" font-size="20" font-weight="800" fill="var(--text)" font-family="Manrope">${esc(centerLabel)}</text>
      <text class="chart-donut-center" x="${cx}" y="${cy+16}" text-anchor="middle" font-size="10.5" fill="var(--text2)">${esc(centerSub)}</text>
    </svg>
    <div style="display:flex;flex-direction:column;gap:8px;">
      ${segments.map((s,i)=>`<div class="chart-legend-row" style="animation-delay:${(0.6+i*0.08).toFixed(2)}s;display:flex;align-items:center;gap:7px;font-size:12.5px;"><span style="width:10px;height:10px;border-radius:3px;background:${s.color};flex-shrink:0;"></span><span style="color:var(--text2);">${esc(s.label)}</span><b style="margin-left:auto;">${s.value}</b></div>`).join('')}
    </div>
  </div>`;
}
// Line chart — always wide/landscape (width > height by design). The
// line "draws" left-to-right and each point pops in once the line
// reaches it, instead of appearing as a static finished line.
function svgLineChart(points,{width=560,height=200,color='#155EEF',suffix=''}={}){
  const max = Math.max(1,...points.map(p=>p.y));
  const stepX = (width-40)/(points.length-1||1);
  const coords = points.map((p,i)=>{
    const x=30+i*stepX; const y = height-40-(p.y/max)*(height-70);
    return [x,y];
  });
  const path = coords.map((c,i)=> (i===0?'M':'L')+c[0].toFixed(1)+' '+c[1].toFixed(1)).join(' ');
  const area = path + ` L${coords[coords.length-1][0]},${height-30} L${coords[0][0]},${height-30} Z`;
  // Approximate path length (straight segments) so the CSS "draw" animation
  // (stroke-dashoffset from full length → 0) starts fully hidden.
  let lineLen = 0;
  for(let i=1;i<coords.length;i++){ lineLen += Math.hypot(coords[i][0]-coords[i-1][0], coords[i][1]-coords[i-1][1]); }
  lineLen = Math.max(1, lineLen);
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" style="max-width:${width}px;overflow:visible;">
    <defs><linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity="0.22"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <line x1="30" y1="${height-30}" x2="${width-10}" y2="${height-30}" stroke="#E4E7EC"/>
    <path d="${area}" fill="url(#lg1)" class="chart-fade-in" style="animation:chartFadeIn 1s ease .8s both;"/>
    <path class="chart-line-path" style="--linelen:${lineLen.toFixed(1)};stroke-dasharray:${lineLen.toFixed(1)};" d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${coords.map((c,i)=>`<circle class="chart-line-dot" style="animation-delay:${(0.15+i*(1.0/coords.length)).toFixed(2)}s" cx="${c[0]}" cy="${c[1]}" r="4" fill="#fff" stroke="${color}" stroke-width="2.5"/>`).join('')}
    ${coords.map((c,i)=> i===coords.length-1? `<text class="chart-val-label" style="animation-delay:1.1s" x="${c[0]}" y="${c[1]-12}" font-size="12" font-weight="800" fill="${color}" text-anchor="middle">${points[i].y}${suffix}</text>` : '').join('')}
    ${points.map((p,i)=>`<text class="chart-axis-label" style="animation-delay:${(i*0.05).toFixed(2)}s" x="${coords[i][0]}" y="${height-12}" font-size="10" fill="#667085" text-anchor="middle">${esc(p.x)}</text>`).join('')}
  </svg>`;
}

// Analytics-page donut chart — three real, dynamically-sized arcs (never
// hardcoded), reusing the portal's existing draw-in arc animation.
function svgAnalyticsDonut(correct, wrong, dnp, centerLabel, centerSub){
  const total = (correct+wrong+dnp) || 1;
  const size = 170, thickness = 22, r = (size-thickness)/2, cx=size/2, cy=size/2;
  const circumference = 2*Math.PI*r;
  let offset = 0;
  const segs = [{value:correct, color:'var(--gld-success)'}, {value:wrong, color:'var(--gld-danger)'}, {value:dnp, color:'#94a3b8'}];
  const arcs = segs.filter(s=>s.value>0).map((s,i)=>{
    const frac = s.value/total;
    const dash = frac*circumference;
    const finalOffset = -offset;
    const el = `<circle class="chart-donut-arc" style="--circ:${circumference.toFixed(2)};--offdest:${finalOffset.toFixed(2)};animation-delay:${(i*0.2).toFixed(2)}s" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${thickness}" stroke-dasharray="${dash} ${circumference-dash}" transform="rotate(-90 ${cx} ${cy})" stroke-linecap="butt"/>`;
    offset += dash;
    return el;
  }).join('');
  return `<div class="gla-donut-visual">
    <svg viewBox="0 0 ${size} ${size}">

// Fixed 0–100% landscape column chart: gridlines, rotated subject labels,
// a value label above each bar, an animated grow-in per bar (staggered),
// and any subject under 15% correct picked out in red so it stands out
// at a glance — exactly the "leveling" (scale + gridlines + labelling)
// the reference design calls for.
function svgAnalyticsColumnChart(data, {width=900, height=340}={}){
  if(!data.length) return `<div class="empty-state">No data for this filter.</div>`;
  const leftPad=42, rightPad=16, topPad=20, bottomPad=92;
  const chartW = width-leftPad-rightPad, chartH = height-topPad-bottomPad;
  const n = data.length, slot = chartW/n, barW = Math.min(52, slot*0.5);
  const gridLines = [0,20,40,60,80,100].map(v=>{
    const y = topPad + chartH - (v/100)*chartH;
    return `<line x1="${leftPad}" y1="${y.toFixed(1)}" x2="${width-rightPad}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-dasharray="3 4"/>
      <text x="${leftPad-8}" y="${(y+4).toFixed(1)}" font-size="10.5" fill="var(--text3)" text-anchor="end">${v}%</text>`;
  }).join('');
  const bars = data.map((d,i)=>{
    const cx = leftPad + slot*i + slot/2;
    const h = Math.max(2,(Math.min(100,d.value)/100)*chartH);
    const y = topPad+chartH-h;
    const critical = d.value < 15;
    const color = critical? 'var(--error)' : (d.color||'#155EEF');
    const delay = (i*0.05).toFixed(2);
    const labelY = topPad+chartH+18;
    return `<rect class="chart-bar-v" style="animation-delay:${delay}s" x="${(cx-barW/2).toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="6" fill="${color}"></rect>
      <text class="chart-val-label" style="animation-delay:${(parseFloat(delay)+0.45).toFixed(2)}s" x="${cx.toFixed(1)}" y="${(y-8).toFixed(1)}" font-size="11.5" font-weight="800" fill="${color}" text-anchor="middle">${d.value}%</text>
      <text class="chart-axis-label" style="animation-delay:${delay}s" x="${cx.toFixed(1)}" y="${labelY.toFixed(1)}" font-size="11" fill="var(--text2)" text-anchor="end" transform="rotate(-35 ${cx.toFixed(1)} ${labelY.toFixed(1)})">${esc(d.label)}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" style="max-width:100%;display:block;overflow:visible;" data-analytics-svg="1">
    ${gridLines}
    <line x1="${leftPad}" y1="${(topPad+chartH).toFixed(1)}" x2="${width-rightPad}" y2="${(topPad+chartH).toFixed(1)}" stroke="var(--border)"/>
    ${bars}
  </svg>`;
}
// Same fixed 0–100% landscape scale as the column chart, but drawn as a

    ${coords.map((c,i)=>`<circle class="chart-line-dot" style="animation-delay:${(0.15+i*(1.0/coords.length)).toFixed(2)}s" cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="4" fill="#fff" stroke="${data[i].value<15?'var(--error)':color}" stroke-width="2.5"/>`).join('')}
    ${data.map((d,i)=>`<text class="chart-val-label" style="animation-delay:${(0.9+i*0.03).toFixed(2)}s" x="${coords[i][0].toFixed(1)}" y="${(coords[i][1]-10).toFixed(1)}" font-size="11" font-weight="800" fill="${d.value<15?'var(--error)':color}" text-anchor="middle">${d.value}%</text>`).join('')}
    ${data.map((d,i)=>`<text class="chart-axis-label" style="animation-delay:${(i*0.04).toFixed(2)}s" x="${coords[i][0].toFixed(1)}" y="${labelY.toFixed(1)}" font-size="11" fill="var(--text2)" text-anchor="end" transform="rotate(-35 ${coords[i][0].toFixed(1)} ${labelY.toFixed(1)})">${esc(d.label)}</text>`).join('')}
  </svg>`;
}
// Exports whichever chart <svg> is currently shown as a downloadable PNG.
// CSS custom properties (var(--border) etc.) don't resolve inside a
// standalone serialized SVG image, so their current computed values are
// substituted in literally before rendering to canvas.
function exportSvgAsPng(svgEl, filename){
  try{
    const rootStyles = getComputedStyle(document.documentElement);
    let svgStr = new XMLSerializer().serializeToString(svgEl);
    svgStr = svgStr.replace(/var\(--([a-zA-Z0-9-]+)\)/g, (m,name)=> (rootStyles.getPropertyValue('--'+name).trim() || '#333'));
    if(!svgStr.match(/^<svg[^>]+xmlns=/)) svgStr = svgStr.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');
    const svgBlob = new Blob([svgStr], {type:'image/svg+xml;charset=utf-8'});
    const url = URL.createObjectURL(svgBlob);
    const img = new Image();
    img.onload = ()=>{
      const vb = svgEl.viewBox.baseVal;
      const scale = 2;
      const w = (vb && vb.width) || svgEl.clientWidth || 900;
      const h = (vb && vb.height) || svgEl.clientHeight || 340;
      const canvas = document.createElement('canvas');
      canvas.width = w*scale; canvas.height = h*scale;
      const ctx = canvas.getContext('2d');
      ctx.scale(scale,scale);
      ctx.fillStyle = rootStyles.getPropertyValue('--card').trim() || '#fff';
      ctx.fillRect(0,0,w,h);
      ctx.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      canvas.toBlob(blob=>{
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        a.click();
        toast('Chart exported as PNG','ok');
      });
    };
    img.onerror = ()=>toast('Could not export chart','err');
    img.src = url;
  }catch(e){ toast('Could not export chart: '+e.message,'err'); }
}

async function openBulkAssignBatchModal(){
  const { data: batches, error } = await sb.rpc('admin_list_batches');
  if(error){ toast('Could not load batches: '+error.message,'err'); return; }
  const ids = Array.from(S.stuSelected);
  openModal(`Assign ${ids.length} Student(s) to a Batch`, `
    <div class="field" style="margin-bottom:16px;">
      <label>Batch</label>
      <select id="bulkBatchSelect">
        <option value="">— Remove from batch (unassign) —</option>
        ${batches.map(b=>`<option value="${b.id}">${esc(b.name)} (${b.student_count})</option>`).join('')}
      </select>
    </div>
    <button class="btn btn-primary btn-block" id="confirmBulkBatchBtn">Assign</button>
  `, 480);
  $('#confirmBulkBatchBtn').onclick=async()=>{
    const batchId = $('#bulkBatchSelect').value;
    const btn = $('#confirmBulkBatchBtn'); btn.disabled=true;
    let ok=0, fail=0;
    for(let i=0;i<ids.length;i++){
      btn.textContent = `Assigning… ${i+1}/${ids.length}`;

        p_student_uuid: ids[i], p_batch_id: batchId||null, p_clear_batch: !batchId,

    closeModal();
    renderAdminSection($('#adminMain'));
  };
}
// Permanently removes a student — different from Disable (blocks access
// but keeps them + their history) and different from batch-unassign
// (only removes them from a batch). If a student already has exam
// attempts on record, admin_delete_student refuses and asks the admin
// to Disable instead, so real exam data is never silently orphaned.
window.deleteStudent = async(id, name)=>{
  confirmModal(`Permanently delete "${name}"? This removes the student account entirely — this cannot be undone. If they've already attempted an exam, deletion will be blocked automatically (use Disable instead in that case).`, async()=>{
    const { error } = await sb.rpc('admin_delete_student', {p_student_uuid: id});
    if(error){ toast('Could not delete: '+error.message,'err'); return; }
    await logAudit('Delete Student', `${name} (${id})`);
    S.stuSelected.delete(id);
    toast('Student deleted','ok');
    renderAdminSection($('#adminMain'));
  }, {okLabel:'Delete permanently'});
};
async function bulkDeleteStudents(){
  const ids = Array.from(S.stuSelected);
  if(!ids.length) return;
  confirmModal(`Permanently delete ${ids.length} selected student(s)? This cannot be undone. Any student who has already attempted an exam will be skipped automatically (their account stays — use Disable for those instead).`, async()=>{
    let ok=0, fail=0;
    for(let i=0;i<ids.length;i++){
      const { error } = await sb.rpc('admin_delete_student', {p_student_uuid: ids[i]});
      if(error) fail++; else ok++;
    }
    await logAudit('Bulk Delete Students', `${ok} deleted, ${fail} skipped (had exam attempts or other error)`);
    toast(`${ok} student(s) deleted${fail?`, ${fail} skipped (already have exam attempts)`:''}`, fail? 'err':'ok');
    S.stuSelected.clear();
    renderAdminSection($('#adminMain'));
  }, {okLabel:'Delete permanently'});
}

function openBulkStudentModal(){
  openModal('Bulk Student Upload', `
    <p style="font-size:13px;color:var(--text2);margin-bottom:12px;">CSV columns: <code>student_id, name, password, email, mobile, exam_target, status, batch</code><br>The <code>batch</code> column is optional — if the batch name doesn't exist yet, it's created automatically.</p>
    <button class="btn btn-outline btn-sm" id="dlTemplateStu" style="margin-bottom:14px;">Download CSV Template</button>
    <input type="file" id="stuCsvFile" accept=".csv"><div id="stuUploadResult" style="margin-top:14px;"></div>
  `);
  $('#dlTemplateStu').onclick=()=>downloadCSV('student_upload_template.csv',[
    ['student_id','name','password','email','mobile','exam_target','status','batch'],
    ['ABC123','Sample Student Name','XYZ456','sample@example.com','9999999999','FMGE','Active','Batch A']]);
  $('#stuCsvFile').onchange=async(e)=>{
    const file = e.target.files[0]; if(!file) return;
    const text = await file.text();
    const {rows} = parseCSV(text);
    let ok=0, fail=0, dup=0, missing=0;
    const errors=[];
    $('#stuUploadResult').innerHTML = `<div class="empty-state">Importing ${rows.length} rows, please wait…</div>`;
    for(let i=0;i<rows.length;i++){
      const r = rows[i];
      try{
        if(!r.student_id || !r.name || !r.password){ missing++; fail++; errors.push(`Row ${i+2}: missing student_id, name or password`); continue; }
        const { error } = await sb.rpc('admin_add_student', {
          p_student_id: r.student_id, p_name: r.name, p_password: r.password,
          p_email: r.email||null, p_mobile: r.mobile||null,
          p_exam_target: r.exam_target||'FMGE', p_status: ['Active','Inactive','Blocked'].includes(r.status)? r.status:'Active',
          p_batch_name: r.batch||null,
        });
        if(error){
          if(error.message.includes('duplicate') || error.code==='23505'){ dup++; } else { fail++; errors.push(`Row ${i+2}: ${error.message}`); }
          continue;
        }
        ok++;
      }catch(rowErr){
        fail++; errors.push(`Row ${i+2}: ${rowErr.message||String(rowErr)}`);
      }
      // Keep the progress banner updating as we go, in case a large file takes a while.
      $('#stuUploadResult').innerHTML = `<div class="empty-state"><span class="spinner"></span> Processed ${i+1} of ${rows.length} rows… (${ok} imported so far)</div>`;
    }
    await logAudit('Bulk Student Upload', `${ok} imported, ${fail} failed, ${dup} duplicate`);
    $('#stuUploadResult').innerHTML = `<div class="lock-banner" style="background:var(--success-bg);border-color:#A9E6C4;color:#0B6B39;">
      Total records: ${rows.length} · <b>Successfully imported: ${ok}</b> · Duplicate IDs: ${dup} · Missing fields: ${missing}</div>
      ${errors.length? `<div style="margin-top:10px;font-size:12.5px;color:var(--error)">${errors.slice(0,8).map(e=>`<div>${esc(e)}</div>`).join('')}</div>`:''}`;
    toast(`${ok} students imported`,'ok');
    renderAdminSection($('#adminMain'));
  };
}

function diffBadge(d){ const c = d==='Easy'?'success':d==='Hard'?'error':'warning'; return `<span class="badge badge-${c}">${d}</span>`; }
function statusBadge(status){
  const map={draft:'grey',scheduled:'warning',live:'success',closed:'navy', Active:'success', Inactive:'grey', Blocked:'error'};
  const cls = map[status]||'grey';
  return `<span class="badge badge-${cls}">${status}</span>`;
}
async function adminQuestionBank(root){
  const f = S.qbFilters;

  root.innerHTML = `<div class="empty-state">Loading question bank…</div>`;

    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
      <p style="font-size:12.5px;color:var(--text2);margin:0;">Showing ${list.length} question(s) — first 50 matches</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">

      <tbody>
      ${list.length? list.map(q=>`
        <tr><td><input type="checkbox" class="qbRowChk" data-id="${q.id}" ${S.qbSelected.has(q.id)?'checked':''}></td>
        <td style="max-width:340px;"><span style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">${esc(q.text)}</span>${q.image_url?' 🖼️':''}</td>
        <td>${esc(q.subject)}<br><span style="color:var(--text2);font-size:12px">${esc(q.topic||'—')}</span></td>
        <td>${diffBadge(q.difficulty)}</td>

        </div></td></tr>`).join('') : `<tr><td colspan="7"><div class="empty-state">No questions match these filters yet — add one or bulk upload a CSV.</div></td></tr>`}
      </tbody>
    </table></div>
  `;
  $('#qbSearch').oninput=debounce((e)=>{f.q=e.target.value; renderAdminSection($('#adminMain'));});
  $('#fExam').onchange=(e)=>{f.examCode=e.target.value; renderAdminSection($('#adminMain'));};
  $('#fSubject').onchange=(e)=>{f.subject=e.target.value; renderAdminSection($('#adminMain'));};
  $('#fDiff').onchange=(e)=>{f.difficulty=e.target.value; renderAdminSection($('#adminMain'));};
  $('#addQBtn').onclick=()=>openQuestionModal();
  $('#uploadQBtn').onclick=()=>openBulkQuestionModal();
  $('#selAllVisible').onchange=(e)=>{
    list.forEach(q=> e.target.checked? S.qbSelected.add(q.id) : S.qbSelected.delete(q.id));
    renderAdminSection($('#adminMain'));
  };
  $$('.qbRowChk').forEach(chk=>{
    chk.onchange=()=>{ chk.checked? S.qbSelected.add(chk.dataset.id) : S.qbSelected.delete(chk.dataset.id); renderAdminSection($('#adminMain')); };

  $('#selectAllMatchBtn').onclick=async()=>{

      p_exam_code: f.examCode || null, p_subject: f.subject || null,
      p_difficulty: f.difficulty || null, p_search: f.q || null,
      p_limit: 5000, p_offset: 0,
    });

    all.forEach(q=>S.qbSelected.add(q.id));
    toast(`${all.length} questions selected`,'ok');
    renderAdminSection($('#adminMain'));
  };
  const clearBtn = $('#clearSelBtn'); if(clearBtn) clearBtn.onclick=()=>{ S.qbSelected.clear(); renderAdminSection($('#adminMain')); };
  const delBtn = $('#deleteSelectedBtn'); if(delBtn) delBtn.onclick=async()=>{
    const ids = Array.from(S.qbSelected);
    if(!confirm(`Delete ${ids.length} selected question(s) permanently? This cannot be undone.`)) return;
    delBtn.disabled=true;
    let ok=0, fail=0;
    for(let i=0;i<ids.length;i++){
      const { error: delErr } = await sb.rpc('admin_delete_question', { p_question_id: ids[i] });
      if(delErr) fail++; else ok++;
      delBtn.textContent = `Deleting… ${i+1}/${ids.length}`;
    }
    await logAudit('Bulk Delete Questions', `${ok} deleted, ${fail} failed`);
    S.qbSelected.clear();
    toast(`${ok} questions deleted${fail?`, ${fail} failed`:''}`, fail? 'err':'ok');
    renderAdminSection($('#adminMain'));
  };
}

    });
    if(error){
      btn.disabled=false; btn.textContent='SAVE QUESTION';
      // Matches both the named error code and Postgres's own unique-violation
      // code (23505) as a fallback, so this keeps working even if the RPC's
      // error wording ever changes — not solely dependent on exact text.
      if(error.message.includes('DUPLICATE_QUESTION') || error.code==='23505' || /duplicate/i.test(error.message||'')) toast('This exact question already exists in the bank','err');

    <button class="btn btn-primary btn-block" id="qStartUploadBtn" style="margin-top:12px;" disabled>Choose a file first</button>
    <div id="qUploadResult" style="margin-top:14px;"></div>
  `);
  $('#dlTemplateQ').onclick=()=>downloadCSV('question_upload_template.csv',
    [['question','option_a','option_b','option_c','option_d','correct_answer','explanation','subject','topic','difficulty','pyq_tag','pyq_year','marks','negative_marks','tags','image_url','reference','key_learning_point','clinical_case'],
     ['Sample question text?','Option A','Option B','Option C','Option D','A','Because...','Medicine','Cardiology','Medium','N','','1','0.25','','','','','N']]);

  (async()=>{
    const { data: sets, error: setsErr } = await sb.rpc('admin_get_question_sets', {p_exam_code: $('#bq_exam').value});
    const existing = $('#bq_existing_sets'), list = $('#bq_set_list');
    if(setsErr){ existing.textContent = 'Could not load existing sets: '+setsErr.message; return; }
    if(!sets || !sets.length){ existing.textContent = 'No sets exist yet for this exam — whatever you type here will create a new one.'; return; }
    list.innerHTML = sets.map(s=>`<option value="${esc(s.question_set)}">`).join('');
    existing.innerHTML = 'Existing sets: ' + sets.map(s=>`<b>${esc(s.question_set)}</b> (${s.total_count})`).join(', ') + ' — pick one from the suggestions to add more to it, or type a brand-new name.';
  })();

  let selectedFile = null;
  $('#qCsvFile').onchange=(e)=>{
    selectedFile = e.target.files[0] || null;
    const btn = $('#qStartUploadBtn');
    if(selectedFile){
      $('#qFileChosen').textContent = `Selected: ${selectedFile.name}`;
      btn.disabled = false; btn.textContent = 'Upload Now';
    } else {
      $('#qFileChosen').textContent = '';
      btn.disabled = true; btn.textContent = 'Choose a file first';
    }
  };

  $('#qStartUploadBtn').onclick=async()=>{
    if(!selectedFile) return;
    const btn = $('#qStartUploadBtn');
    btn.disabled = true;
    const text = await selectedFile.text();
    const {rows} = parseCSV(text);
    const examCode = $('#bq_exam').value, partNumber = parseInt($('#bq_part').value)||1;
    const setName = $('#bq_set').value.trim() || null;
    let ok=0, fail=0, dup=0;
    const errors=[];
    $('#qUploadResult').innerHTML = `<div class="empty-state"><span class="spinner"></span> Importing ${rows.length} rows, please wait…</div>`;
    for(let i=0;i<rows.length;i++){
      const r = rows[i];
      if(!r.question || !r.option_a || !r.option_b || !r.correct_answer){ fail++; errors.push(`Row ${i+2}: missing required field`); continue; }
      const correctLetter = (r.correct_answer||'').trim().toUpperCase();
      const correctOptionVal = {A:r.option_a, B:r.option_b, C:r.option_c, D:r.option_d}[correctLetter];
      if(!['A','B','C','D'].includes(correctLetter) || !correctOptionVal){
        fail++; errors.push(`Row ${i+2}: correct_answer "${r.correct_answer}" does not match a filled-in option`); continue;
      }
      try{
        const { error } = await sb.rpc('admin_add_question', {
          p_exam_code: examCode, p_part_number: partNumber,
          p_subject: r.subject||'General', p_topic: r.topic||null,
          p_text: r.question, p_option_a: r.option_a, p_option_b: r.option_b,
          p_option_c: r.option_c||null, p_option_d: r.option_d||null,
          p_correct: correctLetter, p_explanation: r.explanation||null,
          p_difficulty: ['Easy','Medium','Hard'].includes(r.difficulty)? r.difficulty:'Medium',
          p_is_pyq: truthy(r.pyq_tag), p_pyq_year: r.pyq_year? parseInt(r.pyq_year):null,
          p_marks: r.marks? parseFloat(r.marks):1, p_negative_marks: r.negative_marks? parseFloat(r.negative_marks):0.25,
          p_tags: r.tags||null, p_image_url: r.image_url||null,
          p_reference: r.reference||null, p_key_learning_point: r.key_learning_point||null,
          p_is_clinical_case: truthy(r.clinical_case),
          p_question_set: setName, p_set_order: setName? (i+1) : null,
        });
        if(error){
          if(error.message.includes('DUPLICATE_QUESTION') || error.code==='23505' || /duplicate/i.test(error.message||'')) dup++;
          else { fail++; errors.push(`Row ${i+2}: ${error.message}`); }
        } else ok++;
      }catch(rowErr){
        fail++; errors.push(`Row ${i+2}: ${rowErr.message||String(rowErr)}`);
      }
      $('#qUploadResult').innerHTML = `<div class="empty-state"><span class="spinner"></span> Processed ${i+1} of ${rows.length} rows… (${ok} imported so far)</div>`;
    }
    await logAudit('Bulk Question Upload', `exam=${examCode} part=${partNumber} set=${setName||'—'} imported=${ok} dup=${dup} failed=${fail}`);
    $('#qUploadResult').innerHTML = `
      <div class="lock-banner" style="background:var(--success-bg);border-color:#A9E6C4;color:#0B6B39;">
        Total records: ${rows.length} · <b>Successfully imported: ${ok}</b> · Duplicates skipped: ${dup} · Errors: ${fail}
        ${setName? ` · Saved under Question Set: <b>${esc(setName)}</b>` : ''}</div>
      ${errors.length? `<div style="margin-top:10px;font-size:12.5px;color:var(--error)">${errors.slice(0,8).map(e=>`<div>${esc(e)}</div>`).join('')}</div>`:''}
    `;
    btn.textContent = 'Upload Complete'; 
    toast(`${ok} questions imported`,'ok');
    renderAdminSection($('#adminMain'));
  };
}

// One-click Live Ranking on/off, right on the Tests row — same underlying
// admin_update_test_settings RPC and p_ranking_enabled field as the fuller
// "Result & Ranking Settings" modal below, just without opening a modal
// first. Fetches the test's OWN current settings fresh each time and only
// flips ranking_enabled, so nothing else about that specific test changes.
window.quickToggleRanking = async(testId, testName)=>{
  const [{ data: test, error: tErr }, { data: settings, error: sErr }] = await Promise.all([
    sb.rpc('admin_get_test', {p_test_id: testId}),
    sb.rpc('admin_get_test_settings', {p_test_id: testId}),
  ]);
  if(tErr || sErr){ toast('Could not load test settings: '+(tErr||sErr).message,'err'); return; }
  const newRankingEnabled = !(settings?.ranking_enabled ?? true);
  const sAt = settings?.start_at? new Date(settings.start_at) : null;
  const eAt = settings?.end_at? new Date(settings.end_at) : null;
  const { error } = await sb.rpc('admin_update_test_settings', {
    p_test_id: testId, p_name: test.name, p_description: test.description||null, p_instructions: test.instructions||null,
    p_start_at: sAt? sAt.toISOString() : null, p_end_at: eAt? eAt.toISOString() : null,
    p_max_attempts: settings?.max_attempts ?? 1, p_marks_per_question: settings?.marks_per_question ?? 1,
    p_negative_marking: settings?.negative_marking ?? 0.25, p_tab_switch_limit: settings?.tab_switch_limit ?? 3,
    p_fullscreen_required: settings?.fullscreen_required ?? true, p_disable_copy_paste: settings?.disable_copy_paste ?? true,
    p_results_visible: settings?.results_visible ?? true, p_ranking_enabled: newRankingEnabled,
    p_show_correct_answers: settings?.show_correct_answers ?? true, p_show_explanations: settings?.show_explanations ?? true,
    p_allow_review: settings?.allow_review ?? true, p_ai_mentor_enabled: settings?.ai_mentor_enabled ?? true,
  });
  if(error){ toast('Could not update Live Ranking: '+error.message,'err'); return; }
  await logAudit('Toggle Live Ranking', `${testName} -> ${newRankingEnabled?'ON':'OFF'}`);
  toast(`Live Ranking is now ${newRankingEnabled?'ON':'OFF'} for ${testName}`,'ok');
  renderAdminSection($('#adminMain'));
};

// Quick, standalone toggle for "Results visible to students" and "National
// ranking enabled" — reachable for a test in ANY status (draft, scheduled,
// live, or closed), unlike the full wizard which only reopens for drafts.
// This is exactly the workflow real exams need: keep ranking OFF while the
// test is still live (so an early finisher can't see a leaderboard that's
// still filling up / could still change), then flip it ON once every
// student is done, without touching anything else about the test.
window.openResultSettingsModal = async(testId, testName)=>{
  const [{ data: test, error: tErr }, { data: settings, error: sErr }] = await Promise.all([
    sb.rpc('admin_get_test', {p_test_id: testId}),
    sb.rpc('admin_get_test_settings', {p_test_id: testId}),

  const eAt = settings?.end_at? new Date(settings.end_at) : null;
  const rs = {
    resultsVisible: settings?.results_visible ?? true,
    rankingEnabled: settings?.ranking_enabled ?? true,
  };
  // Everything else is carried through UNCHANGED from the current live
  // settings — this modal only ever touches the two toggles above.
  const unchanged = {
    name: test.name, description: test.description||null, instructions: test.instructions||null,
    startAt: sAt? sAt.toISOString() : null, endAt: eAt? eAt.toISOString() : null,
    maxAttempts: settings?.max_attempts ?? 1, marksPerQuestion: settings?.marks_per_question ?? 1,
    negativeMarking: settings?.negative_marking ?? 0.25, tabSwitchLimit: settings?.tab_switch_limit ?? 3,
    fullscreenRequired: settings?.fullscreen_required ?? true, disableCopyPaste: settings?.disable_copy_paste ?? true,
    showCorrectAnswers: settings?.show_correct_answers ?? true, showExplanations: settings?.show_explanations ?? true,
    allowReview: settings?.allow_review ?? true, aiMentorEnabled: settings?.ai_mentor_enabled ?? true,
  };
  openModal(`Result &amp; Ranking — ${esc(testName)}`, `
    <p style="font-size:13px;color:var(--text2);margin-bottom:16px;">Common workflow: keep ranking <b>Off</b> while the test is still live, then switch it <b>On</b> once everyone has finished — so students only see the leaderboard after the exam is truly over, not a leaderboard that's still changing.</p>
    <div style="display:flex;flex-direction:column;gap:14px;">
      <div class="field">${toggleHTML2('rs_results', rs.resultsVisible, 'Results visible to students')}</div>
      <div class="field">${toggleHTML2('rs_rank', rs.rankingEnabled, 'National ranking enabled')}</div>
    </div>
    <button class="btn btn-primary btn-block" id="saveResultSettingsBtn" style="margin-top:18px;">Save</button>
  `, 560);
  bindToggle2('rs_results', rs, 'resultsVisible');
  bindToggle2('rs_rank', rs, 'rankingEnabled');
  $('#saveResultSettingsBtn').onclick=async()=>{
    const { error } = await sb.rpc('admin_update_test_settings', {
      p_test_id: testId, p_name: unchanged.name, p_description: unchanged.description, p_instructions: unchanged.instructions,
      p_start_at: unchanged.startAt, p_end_at: unchanged.endAt,
      p_max_attempts: unchanged.maxAttempts, p_marks_per_question: unchanged.marksPerQuestion, p_negative_marking: unchanged.negativeMarking,
      p_tab_switch_limit: unchanged.tabSwitchLimit, p_fullscreen_required: unchanged.fullscreenRequired, p_disable_copy_paste: unchanged.disableCopyPaste,
      p_results_visible: rs.resultsVisible, p_ranking_enabled: rs.rankingEnabled,
      p_show_correct_answers: unchanged.showCorrectAnswers, p_show_explanations: unchanged.showExplanations, p_allow_review: unchanged.allowReview,
      p_ai_mentor_enabled: unchanged.aiMentorEnabled,
    });
    if(error){ toast('Could not save: '+error.message,'err'); return; }
    await logAudit('Update Result & Ranking Visibility', `${testName} — results:${rs.resultsVisible} ranking:${rs.rankingEnabled}`);
    toast('Saved','ok');
    closeModal();
  };
};

const REASON_LABEL = {
  manual: 'Submitted by student', auto_timeout: '⏱ Auto-submitted (time expired)',
  auto_tab_switch: '⚠️ Auto-submitted (tab-switch limit)',
};
function partStatusSummary(part){
  const secs = part.sections||[];
  const total = secs.length;
  const completed = secs.filter(s=>s.status==='completed').length;
  const liveNow = secs.some(s=>s.is_live_now);
  const lastTouched = [...secs].reverse().find(s=>s.status!=='not_started');
  let label, cls;
  if(completed>=total && total>0){ label='✅ Completed'; cls='badge-success'; }
  else if(liveNow){ label='🟢 Live now'; cls='badge-success'; }
  else if(lastTouched){ label=`⏸ Paused (${completed}/${total})`; cls='badge-warning'; }
  else { label='Not started'; cls='badge-grey'; }
  const reasonNote = (lastTouched && lastTouched.status==='completed' && lastTouched.submit_reason && lastTouched.submit_reason!=='manual')
    ? REASON_LABEL[lastTouched.submit_reason] || lastTouched.submit_reason : null;
  return {label, cls, completed, total, liveNow, reasonNote};
}
function fmtDuration(sec){
  if(sec==null || sec<=0) return '—';
  const h = Math.floor(sec/3600), m = Math.round((sec%3600)/60);
  if(h>0) return `${h}h ${m}m`;
  return `${m}m`;
}
function fmtTimeOfDay(iso){
  if(!iso) return '—';
  return new Date(iso).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
}

window.continueTestWizard = async(testId)=>{
  const { data, error } = await sb.rpc('admin_get_test', {p_test_id:testId});
  if(error){ toast('Could not load test: '+error.message,'err'); return; }
  // Hard guard, not just a hidden button: the wizard is only for setting up a
  // Draft test. Once a test is scheduled/live/closed, students may already
  // have attempts against its current parts/sections/questions/timing/marking
  // — reopening the setup wizard on it (even via a direct call, e.g. from a
  // console, bypassing the UI's "Continue Setup" button which is already
  // draft-only) could resave those structures out from under an in-progress
  // exam and corrupt attempt data. Refuse here regardless of how this was
  // invoked. (True enforcement must also exist server-side in the RPCs this
  // wizard calls — this client-side check is defense-in-depth, not a
  // substitute for that.)
  if(data.status && data.status!=='draft'){
    toast(`"${data.name}" is ${data.status} — its structure/timing can no longer be edited to protect any in-progress or completed attempts.`,'err');
    return;
  }
  const { data: settings } = await sb.rpc('admin_get_test_settings', {p_test_id:testId});
  const sAt = settings?.start_at? new Date(settings.start_at) : null;
  const eAt = settings?.end_at? new Date(settings.end_at) : null;
  const pad = n=>String(n).padStart(2,'0');
  S.wizard = {
    testId, step:2, examCode:data.exam_code, name:data.name, description:data.description||'',
    instructions:data.instructions||'',
    startDate: sAt? `${sAt.getFullYear()}-${pad(sAt.getMonth()+1)}-${pad(sAt.getDate())}` : '',
    startTime: sAt? `${pad(sAt.getHours())}:${pad(sAt.getMinutes())}` : '09:00',
    endDate: eAt? `${eAt.getFullYear()}-${pad(eAt.getMonth()+1)}-${pad(eAt.getDate())}` : '',
    endTime: eAt? `${pad(eAt.getHours())}:${pad(eAt.getMinutes())}` : '18:00',
    maxAttempts: settings?.max_attempts ?? 1,
    marksPerQuestion: settings?.marks_per_question ?? 1, negativeMarking: settings?.negative_marking ?? 0.25,
    tabSwitchLimit: settings?.tab_switch_limit ?? 3, fullscreenRequired: settings?.fullscreen_required ?? true,
    disableCopyPaste: settings?.disable_copy_paste ?? true,
    resultsVisible: settings?.results_visible ?? true, rankingEnabled: settings?.ranking_enabled ?? true,
    showCorrectAnswers: settings?.show_correct_answers ?? true, showExplanations: settings?.show_explanations ?? true,
    allowReview: settings?.allow_review ?? true, aiMentorEnabled: settings?.ai_mentor_enabled ?? true,
    requiredTotal: data.required_total ?? '',
    parts: (data.parts||[]).map(p=>({
      id:p.id, partNumber:p.part_number, name:p.name, questionCount:p.question_count,
      selectedIds:new Set(),
      sections: (p.sections||[]).map(s=>({ id:s.id, name:s.name, questionCount:s.question_count, durationMin:s.duration_min, selectedIds:new Set() })),
    })),
  };
  openWizardModal();
  await loadPartSelections();
};
async function loadPartSelections(){
  const w = S.wizard;
  for(const part of w.parts){
    if(!part.id) continue;
    if(part.sections && part.sections.length){
      for(const sec of part.sections){
        const { data } = await sb.rpc('admin_get_section_questions', {p_section_id: sec.id});
        sec.selectedIds = new Set((data||[]).map(r=>r.question_id));
      }
    } else {
      const { data } = await sb.rpc('admin_get_part_questions', {p_test_part_id: part.id});
      part.selectedIds = new Set((data||[]).map(r=>r.question_id));
    }
  }
  renderWizardStep();
}

async function handleWizardNext(){
  const w = S.wizard;
  if(w.step===1){
    if(!w.name.trim()){ toast('Give the test a name first','err'); return; }
    if(!w.testId){
      const { data, error } = await sb.rpc('admin_create_test', {
        p_exam_code: w.examCode, p_name: w.name, p_description: w.description||null,
        p_start_at: w.startDate? new Date(w.startDate+'T'+(w.startTime||'00:00')).toISOString() : null,
        p_end_at: w.endDate? new Date(w.endDate+'T'+(w.endTime||'00:00')).toISOString() : null,
        p_max_attempts: w.maxAttempts, p_marks_per_question: w.marksPerQuestion, p_negative_marking: w.negativeMarking,
        p_instructions: w.instructions||null, p_results_visible: w.resultsVisible, p_ranking_enabled: w.rankingEnabled,
        p_show_correct_answers: w.showCorrectAnswers, p_show_explanations: w.showExplanations, p_allow_review: w.allowReview,
        p_required_total: w.requiredTotal? parseInt(w.requiredTotal) : null,
      });
      if(error){ toast('Could not create test: '+error.message,'err'); return; }
      w.testId = data;
      await logAudit('Create Test', w.name);
    } else {
      const { error } = await sb.rpc('admin_update_test_settings', {
        p_test_id: w.testId, p_name: w.name, p_description: w.description||null, p_instructions: w.instructions||null,
        p_start_at: w.startDate? new Date(w.startDate+'T'+(w.startTime||'00:00')).toISOString() : null,
        p_end_at: w.endDate? new Date(w.endDate+'T'+(w.endTime||'00:00')).toISOString() : null,
        p_max_attempts: w.maxAttempts, p_marks_per_question: w.marksPerQuestion, p_negative_marking: w.negativeMarking,
        p_tab_switch_limit: w.tabSwitchLimit, p_fullscreen_required: w.fullscreenRequired, p_disable_copy_paste: w.disableCopyPaste,
        p_results_visible: w.resultsVisible, p_ranking_enabled: w.rankingEnabled,
        p_show_correct_answers: w.showCorrectAnswers, p_show_explanations: w.showExplanations, p_allow_review: w.allowReview,
        p_ai_mentor_enabled: w.aiMentorEnabled,
      });
      if(error){ toast('Could not save settings: '+error.message,'err'); return; }
      if(w.requiredTotal){
        const { error: rtErr } = await sb.rpc('admin_set_required_total', {p_test_id: w.testId, p_required_total: parseInt(w.requiredTotal)});
        if(rtErr){ toast('Could not update required total: '+rtErr.message,'err'); return; }
      }
      await logAudit('Update Test Settings', w.name);
    }
    w.step=2; renderWizardStep(); refreshWizardChrome();
  } else if(w.step===2){
    if(!w.parts.length){ toast('Add at least one part','err'); return; }
    const payload = w.parts.map(p=>({id:p.id||null, partNumber:p.partNumber, name:p.name, questionCount:p.questionCount, durationMin:p.durationMin||60}));
    const { error } = await sb.rpc('admin_define_test_parts', {p_test_id:w.testId, p_parts: payload});
    if(error){ toast('Could not save parts: '+error.message,'err'); return; }
    const { data: test } = await sb.rpc('admin_get_test', {p_test_id:w.testId});
    w.parts = (test.parts||[]).map(p=>({
      id:p.id, partNumber:p.part_number, name:p.name, questionCount:p.question_count, selectedIds:new Set(),
      sections: (p.sections||[]).map(s=>({ id:s.id, name:s.name, questionCount:s.question_count, durationMin:s.duration_min, selectedIds:new Set() })),
    }));
    await loadPartSelections();
    w.step=3; renderWizardStep(); refreshWizardChrome();
  } else if(w.step===3){
    w.step=4; renderWizardStep(); refreshWizardChrome();
  } else {
    closeModal(); toast('Test setup saved as Draft — publish it from the Tests list when ready','ok');
    renderAdminSection($('#adminMain'));
  }
}

function toggleHTML2(id,on,label){
  // A real checkbox input wrapped in a label tag: native, always
  // clickable/tappable anywhere in the row, and keyboard-accessible,
  // styled as a pill switch via the toggle-switch CSS above. The old
  // version used a plain empty div with a "toggle" class that had no
  // matching CSS rule anywhere in the stylesheet, so it rendered with
  // zero visible/clickable area — this replaces that everywhere it's used.
  return `<label style="display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;">
    <span class="toggle-switch"><input type="checkbox" id="${id}" ${on?'checked':''}><span class="slider"></span></span>
    <span style="font-size:13px;font-weight:600;">${label} — <b id="${id}_lbl" style="color:${on?'var(--success)':'var(--error)'}">${on?'On':'Off'}</b></span>
  </label>`;
}
function bindToggle2(id,w,key){
  const el = $('#'+id); if(!el) return;
  el.onchange=()=>{

}

      <div class="field"><label># Questions</label><input type="number" min="1" value="${p.questionCount}" onchange="S.wizard.parts[${i}].questionCount=parseInt(this.value)||1; renderWizardStep();"></div>
      <div class="field"><label>Duration (min)</label><input type="number" min="1" value="${p.durationMin||60}" onchange="S.wizard.parts[${i}].durationMin=parseInt(this.value)||60;"></div>

}
function renderAssignQuestionsStep(body){
  const w = S.wizard;
  if(!w.activePartIdx) w.activePartIdx = 0;
  body.innerHTML = `<div id="assignWrap"></div>`;
  renderAssignInner();
  async function renderAssignInner(){
    const part = w.parts[w.activePartIdx];
    if(!part){ $('#assignWrap').innerHTML = `<div class="empty-state">Define parts in the previous step first.</div>`; return; }
    const hasSections = part.sections && part.sections.length > 0;
    const totalSectionQ = hasSections? part.sections.reduce((a,s)=>a+s.questionCount,0) : 0;

    let sectionsEditorHTML = '';
    if(w.editingSections){
      sectionsEditorHTML = `
        <div class="card pad" style="margin-bottom:14px;">
          <h4 style="font-size:13.5px;margin-bottom:10px;">Sections in ${esc(part.name)}</h4>
          <div id="sectionRows"></div>
          <div style="display:flex;gap:8px;margin-top:8px;">
            <button class="btn btn-outline btn-sm" id="addSectionBtn">+ Add Section</button>
            <button class="btn btn-primary btn-sm" id="saveSectionsBtn">Save Sections</button>
            <button class="btn btn-ghost btn-sm" id="cancelSectionsBtn">Cancel</button>
          </div>
          <p class="kbd-note" style="margin-top:8px;">Sections total: <b>${(w.tempSections||part.sections).reduce((a,s)=>a+(s.questionCount||0),0)}</b> — should equal this Part's ${part.questionCount} questions.</p>
        </div>`;
    }

    let quickSetupHTML = '';
    if(w.showQuickSetup){
      if(!w.qsSections || !w.qsSections.length) w.qsSections = [{name:'Section 1', questionCount:50, durationMin:50}];
      const qsTotal = w.qsSections.reduce((a,s)=>a+(s.questionCount||0),0);
      const setInfo = (w.qbSets||[]).find(s=>s.question_set===w.qsSelectedSet);
      quickSetupHTML = `
        <div class="card pad" style="margin-bottom:14px;border:2px solid var(--primary);">
          <h4 style="font-size:14px;margin-bottom:4px;">⚡ Quick Setup — Auto-fill from a Question Set</h4>
          <p style="font-size:12.5px;color:var(--text2);margin-bottom:10px;">Pick a Set uploaded via Bulk Upload, tell it how many Sections to split into, and every question gets assigned automatically — no manual picking.</p>
          <div class="field" style="margin-bottom:10px;">
            <label>Question Set</label>
            <select id="qsSetSelect">
              <option value="">— choose a set —</option>
              ${(w.qbSets||[]).map(s=>`<option value="${esc(s.question_set)}" ${w.qsSelectedSet===s.question_set?'selected':''}>${esc(s.question_set)} (${s.total_count} questions)</option>`).join('')}
            </select>
          </div>
          <div id="qsSectionRows">${w.qsSections.map((s,i)=>`
            <div class="row" style="align-items:flex-end;">
              <div class="field" style="flex:2"><label>Section Name</label><input value="${esc(s.name)}" onchange="S.wizard.qsSections[${i}].name=this.value"></div>
              <div class="field"><label># Questions</label><input type="number" min="1" value="${s.questionCount}" onchange="S.wizard.qsSections[${i}].questionCount=parseInt(this.value)||1; renderWizardStep();"></div>
              <div class="field"><label>Duration (min)</label><input type="number" min="1" value="${s.durationMin}" onchange="S.wizard.qsSections[${i}].durationMin=parseInt(this.value)||1;"></div>
              <div class="field"><button class="btn btn-danger btn-sm" onclick="S.wizard.qsSections.splice(${i},1); renderWizardStep();">Remove</button></div>
            </div>`).join('')}</div>
          <div style="display:flex;gap:8px;align-items:center;margin:10px 0;flex-wrap:wrap;">
            <button class="btn btn-outline btn-sm" id="qsAddSectionBtn">+ Add Section</button>
            <label style="display:flex;align-items:center;gap:6px;font-size:13px;"><input type="checkbox" id="qsRandomize" style="width:auto;" ${w.qsRandomize?'checked':''}> Shuffle question order</label>
          </div>
          <p class="kbd-note" style="margin-bottom:10px;">Sections total: <b style="color:${setInfo && qsTotal===Number(setInfo.total_count)?'var(--success)':'var(--error)'}">${qsTotal}</b>${setInfo? ` — must equal the set's ${setInfo.total_count} questions` : ' — pick a set above first'}</p>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-primary btn-sm" id="qsDistributeBtn">Auto-Distribute Now</button>
            <button class="btn btn-ghost btn-sm" id="qsCancelBtn">Cancel</button>
          </div>
        </div>`;
    }

    $('#assignWrap').innerHTML = `
      <div class="tabbar">${w.parts.map((p,i)=>`<button class="tabbtn ${i===w.activePartIdx?'active':''}" data-idx="${i}">${esc(p.name)} (${p.sections?.length? p.sections.reduce((b,s)=>b+s.selectedIds.size,0) : p.selectedIds.size}/${p.questionCount})</button>`).join('')}</div>
      ${!w.showQuickSetup? `<button class="btn btn-outline btn-sm" style="margin-bottom:14px;" id="openQuickSetupBtn">⚡ Quick Setup: Auto-fill from a Question Set</button>` : ''}
      ${quickSetupHTML}
      ${sectionsEditorHTML}
      ${!w.editingSections && !w.showQuickSetup? `<div style="margin-bottom:12px;display:flex;gap:8px;">
        <button class="btn btn-outline btn-sm" id="editSectionsBtn">${hasSections? 'Edit Sections':'+ Break this Part into Sections'}</button>
      </div>`:''}
      ${!w.editingSections && !w.showQuickSetup && hasSections? renderSectionTabsAndList(part) : ''}
      ${!w.editingSections && !w.showQuickSetup && !hasSections? renderDirectPartList(part) : ''}
    `;

    if(!w.showQuickSetup){
      const openBtn = $('#openQuickSetupBtn');
      if(openBtn) openBtn.onclick=async()=>{
        if(!w.qbSets){
          const { data, error: setsErr } = await sb.rpc('admin_get_question_sets', {p_exam_code: w.examCode});
          if(setsErr){ toast('Could not load question sets: '+setsErr.message,'err'); return; }
          w.qbSets = data||[];
          if(!w.qbSets.length){ toast('No question sets found for '+w.examCode+' — make sure questions were uploaded with a Set Name','err'); }
        }
        w.showQuickSetup = true; renderAssignInner();
      };
    }
    if(w.showQuickSetup){
      $('#qsSetSelect').onchange=(e)=>{ w.qsSelectedSet = e.target.value; renderAssignInner(); };
      $('#qsAddSectionBtn').onclick=()=>{ w.qsSections.push({name:'Section '+(w.qsSections.length+1), questionCount:50, durationMin:50}); renderAssignInner(); };
      $('#qsRandomize').onchange=(e)=>{ w.qsRandomize = e.target.checked; };
      $('#qsCancelBtn').onclick=()=>{ w.showQuickSetup=false; renderAssignInner(); };
      $('#qsDistributeBtn').onclick=async()=>{
        if(!w.qsSelectedSet){ toast('Choose a Question Set first','err'); return; }
        const setInfo = (w.qbSets||[]).find(s=>s.question_set===w.qsSelectedSet);
        const qsTotal = w.qsSections.reduce((a,s)=>a+(s.questionCount||0),0);
        if(!setInfo || qsTotal !== Number(setInfo.total_count)){ toast(`Section distribution must equal total question count: ${setInfo?setInfo.total_count:'?'}`,'err'); return; }
        if(!confirm(`This will replace any existing sections/questions in "${part.name}" with ${qsTotal} questions from "${w.qsSelectedSet}". Continue?`)) return;
        const btn = $('#qsDistributeBtn'); btn.disabled=true; btn.textContent='Distributing…';
        const payload = w.qsSections.map((s,i)=>({name:s.name, question_count:s.questionCount, duration_min:s.durationMin, order_index:i}));
        const { error } = await sb.rpc('admin_auto_distribute_set', {p_test_part_id: part.id, p_question_set: w.qsSelectedSet, p_sections: payload, p_randomize: !!w.qsRandomize});
        if(error){ toast('Could not distribute: '+error.message,'err'); btn.disabled=false; btn.textContent='Auto-Distribute Now'; return; }
        await logAudit('Auto-Distribute Question Set', `part=${part.name} set=${w.qsSelectedSet} sections=${w.qsSections.length}`);
        const { data: test } = await sb.rpc('admin_get_test', {p_test_id:w.testId});
        const freshPart = test.parts.find(p=>p.id===part.id);
        part.sections = (freshPart.sections||[]).map(s=>({ id:s.id, name:s.name, questionCount:s.question_count, durationMin:s.duration_min, selectedIds:new Set(Array.from({length:s.question_count}, (_,idx)=>'auto-'+idx)) }));
        w.showQuickSetup = false; w.qsSections = null; w.qsSelectedSet = null;
        toast('Questions auto-distributed successfully!','ok');
        renderAssignInner();
      };
      return;
    }

    $$('.tabbtn').forEach(btn=>btn.onclick=()=>{ w.activePartIdx=parseInt(btn.dataset.idx); w.editingSections=false; w.showQuickSetup=false; renderAssignInner(); });

    if(w.editingSections){
      if(!w.tempSections) w.tempSections = hasSections? part.sections.map(s=>({...s})) : [];
      renderSectionRows();
      $('#addSectionBtn').onclick=()=>{ w.tempSections.push({name:'Section '+String.fromCharCode(65+w.tempSections.length), questionCount:50, durationMin:50}); renderSectionRows(); };
      $('#cancelSectionsBtn').onclick=()=>{ w.editingSections=false; w.tempSections=null; renderAssignInner(); };
      $('#saveSectionsBtn').onclick=async()=>{
        const payload = w.tempSections.map(s=>({name:s.name, questionCount:s.questionCount, durationMin:s.durationMin}));
        const { error } = await sb.rpc('admin_define_part_sections', {p_test_part_id: part.id, p_sections: payload});
        if(error){ toast('Could not save sections: '+error.message,'err'); return; }
        const { data: test } = await sb.rpc('admin_get_test', {p_test_id:w.testId});
        const freshPart = test.parts.find(p=>p.id===part.id);
        part.sections = (freshPart.sections||[]).map(s=>({ id:s.id, name:s.name, questionCount:s.question_count, durationMin:s.duration_min, selectedIds:new Set() }));
        part.selectedIds = new Set();
        w.editingSections=false; w.tempSections=null;
        toast('Sections saved','ok');
        renderAssignInner();
      };
      return;
    }

    if(hasSections){
      if(w.activeSectionIdx==null || w.activeSectionIdx>=part.sections.length) w.activeSectionIdx=0;
      $$('.sectiontab').forEach(btn=>btn.onclick=()=>{ w.activeSectionIdx=parseInt(btn.dataset.idx); renderAssignInner(); });
      const sec = part.sections[w.activeSectionIdx];
      await bindQuestionListEvents(sec, ()=>renderAssignInner(), w.examCode);
      const saveBtn = $('#aq_save'); if(saveBtn) saveBtn.onclick=async()=>{
        if(sec.selectedIds.size !== sec.questionCount){ toast(`Select exactly ${sec.questionCount} questions before saving (currently ${sec.selectedIds.size})`,'err'); return; }
        const { error } = await sb.rpc('admin_assign_section_questions', {p_section_id: sec.id, p_question_ids: [...sec.selectedIds]});
        if(error){ toast('Could not save: '+error.message,'err'); return; }
        toast(`${sec.name} saved`,'ok');
      };
    } else {
      await bindQuestionListEvents(part, ()=>renderAssignInner(), w.examCode);
      const saveBtn = $('#aq_save'); if(saveBtn) saveBtn.onclick=async()=>{
        if(part.selectedIds.size !== part.questionCount){ toast(`Select exactly ${part.questionCount} questions before saving (currently ${part.selectedIds.size})`,'err'); return; }
        const { error } = await sb.rpc('admin_assign_part_questions', {p_test_part_id: part.id, p_question_ids: [...part.selectedIds]});
        if(error){ toast('Could not save: '+error.message,'err'); return; }
        toast(`${part.name} saved`,'ok');
      };
    }

    const editBtn = $('#editSectionsBtn'); if(editBtn) editBtn.onclick=()=>{ w.editingSections=true; w.tempSections=null; renderAssignInner(); };

    function renderSectionRows(){
      const wrap = $('#sectionRows'); if(!wrap) return;
      wrap.innerHTML = w.tempSections.map((s,i)=>`
        <div class="row" style="align-items:flex-end;">
          <div class="field" style="flex:2"><label>Section Name</label><input value="${esc(s.name)}" onchange="S.wizard.tempSections[${i}].name=this.value"></div>
          <div class="field"><label># Questions</label><input type="number" min="1" value="${s.questionCount}" onchange="S.wizard.tempSections[${i}].questionCount=parseInt(this.value)||1; renderWizardStep();"></div>
          <div class="field"><label>Duration (min)</label><input type="number" min="1" value="${s.durationMin}" onchange="S.wizard.tempSections[${i}].durationMin=parseInt(this.value)||50;"></div>
          <div class="field"><button class="btn btn-danger btn-sm" onclick="S.wizard.tempSections.splice(${i},1); renderWizardStep();">Remove</button></div>
        </div>`).join('');
    }
  }
}
function renderSectionTabsAndList(part){
  return `<div class="tabbar" style="margin-bottom:10px;">${part.sections.map((s,i)=>`<button class="tabbtn sectiontab ${i===(S.wizard.activeSectionIdx||0)?'active':''}" data-idx="${i}">${esc(s.name)} (${s.selectedIds.size}/${s.questionCount})</button>`).join('')}</div><div id="qlistWrap"></div>`;
}
function renderDirectPartList(part){
  return `<div id="qlistWrap"></div>`;
}
async function bindQuestionListEvents(target, onChange, examCode){
  if(!target.qFilters) target.qFilters = {q:'',subject:'',difficulty:''};
  const f = target.qFilters;
  const { data: list } = await sb.rpc('admin_list_questions', {
    p_exam_code: examCode, p_subject: f.subject||null, p_difficulty: f.difficulty||null, p_search: f.q||null,
    p_limit: 100, p_offset: 0,
  });
  const full = target.selectedIds.size >= target.questionCount;
  const wrap = $('#qlistWrap');
  if(!wrap) return;
  wrap.innerHTML = `
    <div class="qsel-toolbar">
      <div class="qsel-counter ${full?'full':''}">Selected: ${target.selectedIds.size} / ${target.questionCount}</div>
      <input id="aq_search" placeholder="Search question text" style="max-width:200px;" value="${esc(f.q)}">
      <input id="aq_subject" placeholder="Subject" style="max-width:130px;" value="${esc(f.subject)}">
      <select id="aq_diff"><option value="">All Difficulty</option>${['Easy','Medium','Hard'].map(d=>`<option ${f.difficulty===d?'selected':''}>${d}</option>`).join('')}</select>
      <button class="btn btn-outline btn-sm" id="aq_selectAll">Select All Below</button>
      <button class="btn btn-ghost btn-sm" id="aq_clearAll">Clear Selection</button>
      <button class="btn btn-primary btn-sm" id="aq_save">Save These Questions</button>
    </div>
    <div class="qsel-list">
      ${list.length? list.map(q=>`
        <div class="qsel-row ${target.selectedIds.has(q.id)?'picked':''}" data-qid="${q.id}">
          <input type="checkbox" ${target.selectedIds.has(q.id)?'checked':''} style="width:auto;flex-shrink:0;">
          <span class="qsel-text">${esc(q.text)}</span>
          <span class="badge badge-blue" style="flex-shrink:0;">${esc(q.subject)}</span>
          ${diffBadge(q.difficulty)}
        </div>`).join('') : `<div class="empty-state">No questions match — add more to the Question Bank first.</div>`}
    </div>
    <p style="font-size:11.5px;color:var(--text2);margin-top:6px;">Showing up to 100 matches for this exam — narrow filters if you have more.</p>
  `;
  $('#aq_search').oninput=debounce((e)=>{f.q=e.target.value; onChange();});
  $('#aq_subject').oninput=debounce((e)=>{f.subject=e.target.value; onChange();});
  $('#aq_diff').onchange=(e)=>{f.difficulty=e.target.value; onChange();};
  $('#aq_selectAll').onclick=()=>{
    let added=0, skippedDup=0;
    for(const q of list){
      if(target.selectedIds.size>=target.questionCount) break;
      if(target.selectedIds.has(q.id)){ skippedDup++; continue; }
      target.selectedIds.add(q.id); added++;
    }
    if(target.selectedIds.size>=target.questionCount && (added+skippedDup)<list.length){
      toast(`Added ${added} — section is now full (${target.questionCount}/${target.questionCount}), some matches below were not needed`,'ok');
    } else {
      toast(`Added ${added} question(s) from this filtered list`,'ok');
    }
    onChange();
  };
  $('#aq_clearAll').onclick=()=>{
    if(!confirm('Clear all selected questions for this section/part?')) return;
    target.selectedIds.clear(); onChange();
  };
  $$('.qsel-row').forEach(row=>row.onclick=()=>{
    const qid = row.dataset.qid;
    if(target.selectedIds.has(qid)) target.selectedIds.delete(qid);
    else {
      if(target.selectedIds.size>=target.questionCount){ toast(`Already has its full ${target.questionCount} questions — remove one before adding another`,'err'); return; }
      target.selectedIds.add(qid);
    }
    onChange();
  });
}


// ---------- ADMIN: Live Exams (real Supabase-backed, no fake data) ----------
async function adminLive(root){
  root.innerHTML = `<div class="empty-state">Loading…</div>`;
  const { data: tests, error } = await sb.rpc('admin_list_tests');
  if(error){ root.innerHTML = `<div class="empty-state">Could not load tests: ${esc(error.message)}</div>`; return; }
  const liveTests = tests.filter(t=>t.status==='live');
  if(!S.liveTestSel && liveTests.length) S.liveTestSel = liveTests[0].id;

  if(!liveTests.length){
    root.innerHTML = `<div class="empty-state" style="width:100%;">No tests are currently live. Set a test's status to "live" from the Tests tab.</div>`;
    return;
  }

  root.innerHTML = `
    <div class="table-toolbar">
      <select id="liveTestSel" style="max-width:320px;">${liveTests.map(t=>`<option value="${t.id}" ${S.liveTestSel===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select>
      <span class="badge badge-success">● LIVE</span>
      <span id="liveRefreshIndicator" style="font-size:11.5px;color:var(--text2);">Auto-updates every 3s</span>
    </div>
    <div class="card pad">
      <h4 style="font-size:15px;margin-bottom:12px;">Live participant monitor</h4>
      <p style="font-size:12px;color:var(--text2);margin-bottom:12px;">Shows students who currently have an active (in-progress) section timer running for this test — refreshes automatically, no need to reload the page.</p>
      <div class="table-wrap"><table>
        <thead><tr><th>Student</th><th>Part / Section</th><th>Progress</th><th>Time Remaining</th><th>Status</th></tr></thead>
        <tbody id="liveMonitorBody"><tr><td colspan="5"><div class="empty-state">Loading…</div></td></tr></tbody>
      </table></div>
    </div>
  `;
  $('#liveTestSel').onchange=(e)=>{ S.liveTestSel=e.target.value; renderAdminSection($('#adminMain')); };

  await refreshLiveMonitorTable();
  // Self-terminating auto-refresh: keeps polling every 5s only while the
  // admin is actually still looking at this Live Exams tab. As soon as
  // they switch to a different admin section, this loop notices and stops
  // itself — no manual refresh needed while it's open, no wasted requests
  // once they leave.
  if(S.liveMonitorTimer) clearInterval(S.liveMonitorTimer);
  S.liveMonitorTimer = setInterval(async()=>{
    if(S.adminSection !== 'live' || !document.getElementById('liveMonitorBody')){
      clearInterval(S.liveMonitorTimer); S.liveMonitorTimer = null; return;
    }
    await refreshLiveMonitorTable();
  }, 3000);
}
async function refreshLiveMonitorTable(){
  const tbody = $('#liveMonitorBody');
  if(!tbody) return;
  const { data: rows, error: monErr } = await sb.rpc('admin_get_live_monitor', {p_test_id: S.liveTestSel});
  tbody.innerHTML = monErr? `<tr><td colspan="5"><div class="empty-state">Could not load: ${esc(monErr.message)}</div></td></tr>` :
    (rows&&rows.length)? rows.map(r=>`<tr><td><b>${esc(r.student_name)}</b><br><span style="font-size:12px;color:var(--text2)">${esc(r.student_id)}</span></td>
      <td>${esc(r.part_name)} — ${esc(r.section_name)}</td>
      <td><div class="progress-bar" style="width:120px;"><div style="width:${Math.round(r.answered/Math.max(r.total,1)*100)}%"></div></div> ${r.answered}/${r.total}</td>
      <td>${fmtClock(r.time_remaining_sec)}</td>
      <td><span class="badge badge-success">Active</span></td></tr>`).join('')
    : `<tr><td colspan="5"><div class="empty-state">No students are currently in an active section for this test.</div></td></tr>`;
}

          <button class="btn btn-sm btn-outline" onclick="viewAttemptDeviceLog('${a.attempt_id}')">🛡 Device/IP Log</button>
        </td></tr>
        <tr id="psrow-${a.attempt_id}" style="display:none;"><td colspan="8"><div id="psbody-${a.attempt_id}"></div></td></tr>`).join('')
        : `<tr><td colspan="8"><div class="empty-state">${q? 'No matching students found.' : 'No submitted attempts for this test yet.'}</div></td></tr>`}
      </tbody>
    </table></div>
  `;
  $('#resTestSel').onchange=(e)=>{S.resultsTestFilter=e.target.value; S.resultsSearchQ=''; renderAdminSection($('#adminMain'));};
  $('#resSearch').oninput=debounce((e)=>{S.resultsSearchQ=e.target.value; renderAdminSection($('#adminMain'));});
  $('#exportResultsBtn').onclick=async()=>{
    if(!results.length){ toast('No results to export','err'); return; }
    const btn = $('#exportResultsBtn');
    btn.disabled = true; const origLabel = btn.textContent; btn.textContent = 'Preparing export…';
    try{
      if(!S._psCache) S._psCache = {};
      // Fetch part/section breakdown for every student in this test (uses
      // the same per-attempt cache the "📊 Part/Section-wise" row uses, so
      // rows already expanded on screen aren't re-fetched).
      const detailByAttempt = {};
      await Promise.all(results.map(async a=>{
        if(S._psDetailCache && S._psDetailCache[a.attempt_id]){ detailByAttempt[a.attempt_id] = S._psDetailCache[a.attempt_id]; return; }
        const { data, error } = await sb.rpc('admin_get_attempt_detail', {p_attempt_id: a.attempt_id});
        detailByAttempt[a.attempt_id] = error? [] : (data.detail||[]);
      }));
      S._psDetailCache = { ...(S._psDetailCache||{}), ...detailByAttempt };

      // Build one ordered list of Part → Section columns from whichever
      // attempt has the most sections, so the header matches the exam
      // pattern the admin actually created for this test.
      let sectionKeys = [];
      let bestLen = -1;
      Object.values(detailByAttempt).forEach(detail=>{
        const seen = new Map();
        detail.forEach(d=>{
          const key = `${d.part_name||'Part'} — ${d.section_name||'Section'}`;
          if(!seen.has(key)) seen.set(key, true);
        });
        if(seen.size > bestLen){ bestLen = seen.size; sectionKeys = Array.from(seen.keys()); }
      });

      const header = ['Student','StudentID','Score','Accuracy','Correct','Incorrect','Unattempted','TimeMin',
        ...sectionKeys.flatMap(k=>[`${k} Correct`,`${k} Wrong`,`${k} Not Attempted`])];
      const rows = results.map(a=>{
        const detail = detailByAttempt[a.attempt_id]||[];
        const bySection = {};
        detail.forEach(d=>{
          const key = `${d.part_name||'Part'} — ${d.section_name||'Section'}`;
          if(!bySection[key]) bySection[key] = {correct:0,wrong:0,unattempted:0};
          if(d.is_correct===true) bySection[key].correct++;
          else if(d.is_correct===false) bySection[key].wrong++;
          else bySection[key].unattempted++;
        });
        return [a.student_name,a.student_id,a.score,a.accuracy,a.correct_count,a.incorrect_count,a.unattempted_count,Math.round(a.time_used_sec/60),
          ...sectionKeys.flatMap(k=>{ const v=bySection[k]||{correct:0,wrong:0,unattempted:0}; return [v.correct,v.wrong,v.unattempted]; })];
      });
      downloadCSV('results_export.csv',[header, ...rows]);
      logAudit('Export Results','CSV (Part/Section-wise)');
    }catch(e){
      toast('Export failed: '+e.message,'err');
    }finally{
      btn.disabled=false; btn.textContent = origLabel;
    }
  };
}
// Builds the Part-wise / Section-wise summary table HTML from an
// admin_get_attempt_detail() response's `detail` array (each question
// already carries part_name/section_name). Shared by the inline
// expandable row in the Results tab and the "View Responses" modal.
function partSectionSummaryHTML(detail){
  const partMap = new Map();
  (detail||[]).forEach(d=>{
    const partKey = d.part_name || 'Part';
    if(!partMap.has(partKey)) partMap.set(partKey, new Map());
    const secMap = partMap.get(partKey);
    const secKey = d.section_name || 'Section';
    if(!secMap.has(secKey)) secMap.set(secKey, {correct:0,wrong:0,unattempted:0,total:0});
    const agg = secMap.get(secKey);
    agg.total++;
    if(d.is_correct === true) agg.correct++;
    else if(d.is_correct === false) agg.wrong++;
    else agg.unattempted++;
  });
  if(!partMap.size) return '<div class="empty-state">No part/section data for this attempt.</div>';
  return `<div style="margin-bottom:4px;">
    ${Array.from(partMap.entries()).map(([partName, secMap])=>`
      <div style="margin-bottom:10px;">
        <div style="font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:4px;">${esc(partName)}</div>
        <div class="table-wrap"><table>
          <thead><tr><th>Section</th><th>Total</th><th>Correct</th><th>Wrong</th><th>Not Attempted</th></tr></thead>
          <tbody>${Array.from(secMap.entries()).map(([secName,v])=>`<tr>
            <td>${esc(secName)}</td><td>${v.total}</td>
            <td style="color:var(--success)">${v.correct}</td>
            <td style="color:var(--error)">${v.wrong}</td>
            <td style="color:var(--text2)">${v.unattempted}</td>
          </tr>`).join('')}</tbody>
        </table></div>
      </div>`).join('')}
  </div>`;
}
window.togglePartSectionRow = async(attemptId)=>{

  if(!row || !body) return;
  if(row.style.display!=='none'){ row.style.display='none'; return; }

  if(S._psCache[attemptId]){ body.innerHTML = S._psCache[attemptId]; return; }
  body.innerHTML = `<div class="empty-state">Loading…</div>`;

  if(error){ body.innerHTML = `<div class="empty-state">Could not load: ${esc(error.message)}</div>`; return; }
  if(!S._psDetailCache) S._psDetailCache = {};

  const html = partSectionSummaryHTML(data.detail||[]);

  body.innerHTML = html;
};
